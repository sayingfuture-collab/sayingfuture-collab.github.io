<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>중2 영어 연습장</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --sub:#67727f; --line:#dfe5ec;
    --blue:#2563c9; --blue-l:#eaf1fc; --green:#1f8a4c; --green-l:#e8f6ee;
    --red:#c9382e; --red-l:#fdeceb; --amber:#b7791f; --amber-l:#fdf4e3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-size:17px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 14px 40px;}
  header{padding:18px 0 10px; text-align:center;}
  header h1{margin:0; font-size:20px; letter-spacing:-.3px;}
  header p{margin:4px 0 0; font-size:13.5px; color:var(--sub);}

  /* 모드 탭 */
  .tabs{display:flex; gap:6px; margin:14px 0 16px;}
  .tabs button{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
    border-radius:11px; padding:9px 4px; font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:inherit; line-height:1.35;
  }
  .tabs button.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .tabs button:disabled{opacity:.45;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px;}
  .card h2{margin:0 0 8px; font-size:16.5px;}
  .muted{color:var(--sub); font-size:14px;}

  /* 세트 고르기 */
  .sets{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px;}
  .setbtn{border:1px solid var(--line); background:var(--card); border-radius:11px;
    padding:10px 6px; text-align:center; cursor:pointer; font-family:inherit;}
  .setbtn b{display:block; font-size:15px;}
  .setbtn small{display:block; color:var(--sub); font-size:11.5px; margin-top:2px;}
  .setbtn.done{background:var(--green-l); border-color:#b7dfc7;}
  .setbtn.done small{color:var(--green); font-weight:700;}

  /* 진행 막대 */
  .bar{height:8px; background:#e8edf3; border-radius:99px; overflow:hidden; margin:10px 0 4px;}
  .bar i{display:block; height:100%; background:var(--green); width:0; transition:width .25s;}

  /* 카드 학습 */
  .flash{text-align:center; padding:22px 10px 16px;}
  .flash .base{font-size:34px; font-weight:800; letter-spacing:-.5px;
    font-family:Georgia,"Times New Roman",serif;}
  .flash .ko{font-size:16px; color:var(--sub); margin-top:2px;}
  .forms{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .form{background:var(--blue-l); border-radius:11px; padding:9px 14px; min-width:104px;}
  .form em{display:block; font-style:normal; font-size:11.5px; color:var(--blue); font-weight:700;}
  .form b{display:block; font-size:20px; font-family:Georgia,serif; margin-top:1px;}
  .form.hide b{color:transparent; background:#dbe6f6; border-radius:6px;}

  /* 문제 */
  .qbase{text-align:center; font-size:30px; font-weight:800; font-family:Georgia,serif;}
  .qko{text-align:center; color:var(--sub); font-size:15px; margin-top:2px;}
  .ask{text-align:center; margin:12px 0 4px; font-size:15px; color:var(--blue); font-weight:700;}
  .opts{display:grid; gap:8px; margin-top:10px;}
  .opt{border:1.5px solid var(--line); background:var(--card); border-radius:12px;
    padding:13px; font-size:20px; font-family:Georgia,serif; cursor:pointer;
    text-align:center;}
  .opt:active{transform:scale(.99);}
  .opt.ok{background:var(--green-l); border-color:var(--green); color:var(--green); font-weight:700;}
  .opt.no{background:var(--red-l); border-color:var(--red); color:var(--red);}
  .typewrap{display:flex; gap:8px; margin-top:12px;}
  .typewrap input{flex:1; border:1.5px solid var(--line); border-radius:12px; padding:12px;
    font-size:21px; font-family:Georgia,serif; text-align:center; min-width:0;}
  .typewrap input:focus{outline:none; border-color:var(--blue);}

  .btn{display:block; width:100%; border:none; border-radius:12px; padding:14px;
    font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; margin-top:10px;}
  .btn.pri{background:var(--blue); color:#fff;}
  .btn.sub{background:#e9eef5; color:var(--ink);}
  .btn.gh{background:transparent; color:var(--sub); font-weight:600; font-size:14px; padding:9px;}
  .row{display:flex; gap:8px;} .row .btn{margin-top:10px;}

  .spk{border:none; background:var(--blue-l); color:var(--blue); border-radius:99px;
    width:42px; height:42px; font-size:19px; cursor:pointer; line-height:1;}
  .center{text-align:center;}

  .fb{border-radius:12px; padding:12px 14px; margin-top:12px; font-size:15.5px;}
  .fb.ok{background:var(--green-l); color:var(--green);}
  .fb.no{background:var(--red-l); color:var(--red);}
  .fb b{font-family:Georgia,serif; font-size:18px;}

  .tip{background:var(--amber-l); border-left:4px solid var(--amber); border-radius:8px;
    padding:10px 12px; font-size:14.5px; margin-top:10px;}
  .tip b{color:var(--amber);}
  .seenmark{display:inline-block; background:var(--blue-l); color:var(--blue); font-size:11px;
    font-weight:700; border-radius:5px; padding:1px 6px; margin-left:6px; vertical-align:middle;}
  .result{text-align:center; padding:10px 0 4px;}
  .result .big{font-size:40px; font-weight:800; color:var(--green);}
  .wrongli{background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 12px;
    margin-top:6px; font-size:15px;}
  .wrongli b{font-family:Georgia,serif;}

  /* ── 본문 빈칸 ───────────────────────────────────── */
  .sent{font-family:Georgia,"Times New Roman",serif; font-size:19.5px; line-height:1.95;
    margin:6px 0 4px;}
  .sentko{color:var(--sub); font-size:14.5px; line-height:1.55; margin-top:6px;}
  .bk{display:inline-block; min-width:66px; text-align:center;
    border-bottom:2px solid var(--line); color:transparent;}
  .bk.on{border-bottom-color:var(--blue); color:var(--blue); font-weight:800;}
  .bk.sol{border-bottom-color:var(--green); color:var(--green); font-weight:800;}
  /* 조각(글자·낱말) 맞추기 */
  .tray{min-height:52px; border:1.5px dashed var(--line); border-radius:12px; padding:8px;
    margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    justify-content:center;}
  .tray:empty::after{content:"아래에서 눌러 순서대로 놓아 보세요"; color:var(--sub); font-size:13.5px;}
  .pool{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; justify-content:center;}
  .chip{border:1.5px solid var(--line); background:var(--card); border-radius:9px;
    padding:8px 12px; font-size:19px; font-family:Georgia,serif; cursor:pointer; line-height:1.1;}
  .chip.used{opacity:.28; pointer-events:none;}
  .chip.inTray{border-color:var(--blue); background:var(--blue-l); color:var(--blue);}
  .lvtag{display:inline-block; background:var(--amber-l); color:var(--amber); font-size:12px;
    font-weight:700; border-radius:6px; padding:2px 8px; margin-left:6px;}
  .nb{white-space:nowrap; margin-left:6px;}   /* 「남은 5개」가 반으로 쪼개지지 않게 */
  /* 대화문 장면 */
  .dlg{margin:8px 0 4px; position:relative; max-height:44vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;}   /* 10줄짜리 장면 때문에 확인 버튼이 밀리지 않게 */
  .dl{display:flex; gap:8px; align-items:flex-start; padding:3px 0;
    font-family:Georgia,"Times New Roman",serif; font-size:17px; line-height:1.8;}
  .dl b{flex:0 0 18px; color:var(--sub); font-size:12.5px; font-weight:800;
    font-family:inherit; padding-top:5px;}
  .dl.act{background:var(--blue-l); border-radius:9px; padding:6px 8px; margin:2px -8px;}
  .dl.act b{color:var(--blue);}
  /* 본문 읽기 */
  .rl{padding:10px 0; border-top:1px solid var(--line);}
  .rl:first-of-type{border-top:none; padding-top:2px;}
  /* 번호는 내어쓰기 — 줄이 넘어가도 글이 번호 아래로 안 들어가게 */
  .ren{font-family:Georgia,"Times New Roman",serif; font-size:18px; line-height:1.72;
    padding-left:26px; text-indent:-26px;}
  .rno{display:inline-block; width:26px; text-indent:0; color:#b6bfc9; font-size:12.5px;
    font-weight:800; font-family:-apple-system,sans-serif; vertical-align:1px;}
  .rko{color:var(--sub); font-size:14.5px; line-height:1.5; margin-top:3px; padding-left:24px;}
  .rtag{display:inline-block; margin:5px 0 0 24px; background:var(--blue-l); color:var(--blue);
    font-size:11.5px; font-weight:700; border-radius:6px; padding:2px 8px; line-height:1.5;}
  .rtag.warn{background:var(--amber-l); color:var(--amber);}
  .mini{border:none; background:transparent; color:var(--blue); cursor:pointer;
    font-size:14px; padding:0 3px; vertical-align:2px;}
  .hideko .rko{color:transparent; background:#eef1f5; border-radius:6px; cursor:pointer;}
  .hideko .rko.show{color:var(--sub); background:transparent;}
  .sharebox{width:100%; min-height:150px; border:1px solid var(--line); border-radius:10px;
    padding:10px; font-size:13.5px; font-family:inherit; line-height:1.5; margin-top:6px;}

  /* 자주 틀린 것 */
  .missli{border-top:1px solid var(--line); padding:9px 0;}
  .missli:first-child{border-top:none; padding-top:0;}
  .missrow{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .missrow b{font-family:Georgia,serif; font-size:18px;}
  .misscnt{flex:0 0 auto; color:var(--red); font-size:12.5px; font-weight:700;}
  .missko{color:var(--sub); font-size:14px; line-height:1.45; margin-top:1px;}
  .misssrc{color:#9aa4b0; font-size:11.5px; margin-top:2px;}
  .unitpick{display:flex; gap:8px; margin-bottom:10px;}
  .unitpick button{flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
    border-radius:10px; padding:8px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:inherit;}
  .unitpick button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  @media (max-width:400px){
    .flash .base{font-size:30px;} .qbase{font-size:26px;}
    .sent{font-size:18px;} .chip{font-size:17px; padding:7px 10px;}
  }
</style>

const PPER = 5;                                 // 빈칸도 한 세트 5개

/* ── 저장 ─────────────────────────────────────────────── */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
let ST = load();
if(!ST.verb) ST.verb = {};                       // {세트번호: {done:true, best:점수}}
if(!ST.pass) ST.pass = {};                       // {"pass5-0": {done:true, best:점수}}
if(!ST.dlg)  ST.dlg  = {};                       // 대화문도 같은 모양으로
if(!ST.miss) ST.miss = {};                       // 자주 틀린 것 — 폰 안에만 쌓인다

/* ── 소리 ─────────────────────────────────────────────── */
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .85;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ── 도우미 ───────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function setOf(n){ return VERBS.slice(n*PER, n*PER+PER); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ── 화면 1 · 세트 고르기 ─────────────────────────────── */
function screenSets(){
  const doneCount = Object.values(ST.verb).filter(v=>v && v.done).length;
  let html = `
   <div class="card">
     <h2>동사 3단 변화</h2>
     <p class="muted">현재완료에는 <b>과거분사(p.p.)</b>가 꼭 필요해요.
     이걸 알면 문법 문제가 갑자기 쉬워져요.</p>
     <div class="bar"><i style="width:${Math.round(doneCount/SETS*100)}%"></i></div>
     <p class="muted">${doneCount} / ${SETS} 세트 완료</p>
   </div>
   <div class="card">
     <h2>어느 세트부터 할까요?</h2>
     <p class="muted">한 세트는 5개예요. 순서대로 해도 되고, 아무거나 해도 돼요.</p>
     <div class="sets">`;
  for(let i=0;i<SETS;i++){
    const st = ST.verb[i] || {};
    const v = setOf(i);
    html += `<button class="setbtn ${st.done?'done':''}" data-set="${i}">
      <b>${i+1}세트</b><small>${st.done ? '완료 '+(st.best||'')+'/'+(v.length*2) : v[0][0]+' ~ '+v[v.length-1][0]}</small></button>`;
  }
  html += `</div></div>
   <div class="card">
     <h2>규칙 동사는 이렇게</h2>
     <p class="muted">아래 46개는 <b>불규칙</b>이라 외워야 하지만, 나머지는 규칙이 있어요.</p>
     <div class="tip">
       <b>대부분</b> 뒤에 <b>-ed</b> — walk → walked → walked<br>
       <b>e로 끝나면</b> <b>-d</b>만 — like → liked → liked<br>
       <b>자음+y</b>면 y를 i로 — study → studied → studied<br>
       <b>짧은 모음+자음</b>이면 자음 하나 더 — stop → stopped → stopped
     </div>

  app.innerHTML = html;

    b.onclick = () => screenLearn(+b.dataset.set, 0));
}

/* ── 화면 2 · 카드로 외우기 ───────────────────────────── */
function screenLearn(setNo, idx){
  const list = setOf(setNo);
  if(idx >= list.length) return screenQuiz(setNo);
  const [b, past, pp, ko, seen] = list[idx];
  app.innerHTML = `
   <div class="card">
     <p class="muted">${setNo+1}세트 · 외우기 ${idx+1}/${list.length}</p>
     <div class="bar"><i style="width:${Math.round((idx)/list.length*100)}%"></i></div>
     <div class="flash">
       <div class="base">${b}${seen?'<span class="seenmark">교과서</span>':''}</div>
       <div class="ko">${esc(ko)}</div>
       <div class="forms">
         <div class="form"><em>원형</em><b>${b}</b></div>
         <div class="form"><em>과거</em><b>${past}</b></div>
         <div class="form"><em>과거분사 p.p.</em><b>${pp}</b></div>
       </div>
       <div style="margin-top:14px"><button class="spk" id="spk">🔊</button></div>
     </div>
     <button class="btn pri" id="next">다음 ▶</button>
     <button class="btn gh" id="back">← 세트 고르기</button>
   </div>`;
  $("#spk").onclick = () => speak(b + ", " + past.replace("/", " or ") + ", " + pp.replace(/\(.*\)/,""));
  $("#next").onclick = () => screenLearn(setNo, idx+1);
  $("#back").onclick = screenSets;
  speak(b + ", " + past.replace("/", " or ") + ", " + pp.replace(/\(.*\)/,""));
}

/* ── 화면 3 · 시험 (고르기 → 틀린 것만 다시) ──────────── */
function screenQuiz(setNo, queue, wrong, score, total, round){
  const list = setOf(setNo);
  if(!queue){                                   // 처음 — 과거 5문항 + p.p. 5문항
    queue = [];
    list.forEach(v => { queue.push([v,"past"]); queue.push([v,"pp"]); });
    queue = shuffle(queue); wrong = []; score = 0; total = queue.length; round = 1;
  }
  if(queue.length === 0){
    // 틀린 것은 다 맞힐 때까지 반복하되, **점수는 첫 바퀴 것만** 센다(정직하게).
    if(wrong.length && round < 3){ return screenQuiz(setNo, shuffle(wrong), [], score, total, round+1); }
    if(wrong.length){ return screenStuck(setNo, wrong, score, total); }
    return screenDone(setNo, score, total, round);
  }
  const [v, which] = queue[0];
  const [b, past, pp, ko] = v;
  const answer = which === "past" ? past : pp;
  const pool = VERBS.filter(x => x[0] !== b).map(x => which==="past" ? x[1] : x[2]);
  const opts = shuffle([answer, ...shuffle(pool).filter(x=>x!==answer).slice(0,2)]);

  app.innerHTML = `
   <div class="card">
     <p class="muted">${setNo+1}세트 · ${round===1 ? "시험" : "틀린 것 다시 "+(round-1)+"번째"} &nbsp; 남은 문제 ${queue.length}개</p>
     <div class="bar"><i style="width:${Math.round((total-queue.length)/total*100)}%"></i></div>
     <div class="qbase">${b}</div>
     <div class="qko">${esc(ko)}</div>
     <div class="ask">${which==="past" ? "과거형은?" : "과거분사(p.p.)는?"}</div>
     <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${o}</button>`).join("")}</div>
     <div id="fb"></div>
     <button class="btn gh" id="back">← 그만하고 세트 고르기</button>
   </div>`;
  $("#back").onclick = screenSets;
  app.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    const picked = btn.dataset.v, ok = picked === answer;
    app.querySelectorAll(".opt").forEach(x => {
      x.onclick = null;
      if(x.dataset.v === answer) x.classList.add("ok");
      else if(x === btn) x.classList.add("no");
    });
    if(ok){ if(round === 1) score++; } else wrong.push([v, which]);
    if(round === 1) noteVerb(v, which, ok);      // 동사 오답도 「자주 틀린 것」에 모은다
    $("#fb").innerHTML = ok
      ? `<div class="fb ok">잘했어요! &nbsp; <b>${b} - ${past} - ${pp}</b></div>`
      : `<div class="fb no">아쉬워요. 정답은 <b>${answer}</b><br>
         <span style="font-size:14px">${b} - ${past} - ${pp} &nbsp;(${esc(ko)})</span></div>`;
    speak(b + ", " + past.replace("/"," or ") + ", " + pp.replace(/\(.*\)/,""));
    const nx = document.createElement("button");
    nx.className = "btn pri"; nx.textContent = "다음 ▶";
    nx.onclick = () => screenQuiz(setNo, queue.slice(1), wrong, score, total, round);
    $("#fb").appendChild(nx);
  });
}

/* ── 화면 3-B · 아직 안 외워진 것 (세 바퀴 넘게 틀림) ─── */
function screenStuck(setNo, wrong, score, total){
  const uniq = [];
  wrong.forEach(([v]) => { if(!uniq.some(x => x[0] === v[0])) uniq.push(v); });
  app.innerHTML = `
   <div class="card">
     <div class="result">
       <div class="big" style="color:var(--amber)">${score} / ${total}</div>
       <p class="muted">여기까지 잘했어요. <b>아래 ${uniq.length}개만</b> 아직 안 외워졌어요.<br>
       한 번에 다 외우는 사람은 없어요 — 카드로 다시 보고 오면 돼요.</p>
     </div>
     <div class="tip"><b>다시 볼 동사</b><br>
       ${uniq.map(v=>`${v[0]} - ${v[1]} - ${v[2]} &nbsp;<span style="color:var(--sub)">${esc(v[3])}</span>`).join("<br>")}
     </div>
     <button class="btn pri" id="relearn">이것만 카드로 다시 보기 ▶</button>
     <button class="btn sub" id="retry">시험 다시</button>
     <button class="btn gh" id="back">← 세트 고르기</button>
   </div>`;
  $("#relearn").onclick = () => screenLearnList(setNo, uniq, 0);
  $("#retry").onclick = () => screenQuiz(setNo);
  $("#back").onclick = screenSets;
}

       <div class="forms">

         <div class="form"><em>과거</em><b>${past}</b></div>
         <div class="form"><em>과거분사 p.p.</em><b>${pp}</b></div>
       </div>
       <div style="margin-top:14px"><button class="spk" id="spk">🔊</button></div>
     </div>
     <button class="btn pri" id="next">다음 ▶</button>
     <button class="btn gh" id="back">← 세트 고르기</button>
   </div>`;
  const say = b + ", " + past.replace("/", " or ") + ", " + pp.replace(/\(.*\)/,"");
  $("#spk").onclick = () => speak(say);
  $("#next").onclick = () => screenLearnList(setNo, list, idx+1);
  $("#back").onclick = screenSets;
  speak(say);
}

/* ── 화면 4 · 결과 ────────────────────────────────────── */
function screenDone(setNo, score, total, round){
  ST.verb[setNo] = { done:true, best: Math.max(score, (ST.verb[setNo]||{}).best||0) };
  save(ST);
  const list = setOf(setNo);
  const perfect = score === total;
  app.innerHTML = `
   <div class="card">
     <div class="result">
       <div class="big">${score} / ${total}</div>
       <p class="muted">${setNo+1}세트 끝! 처음에 맞힌 개수예요.<br>
       ${perfect ? "한 번에 전부 맞았어요 👏"
                 : "틀린 " + (total-score) + "개도 다시 풀어서 <b>결국 다 맞혔어요</b> 👍"}</p>
     </div>
     <div class="tip"><b>이 세트에서 외운 것</b><br>
       ${list.map(v=>`${v[0]} - ${v[1]} - ${v[2]}`).join("<br>")}
     </div>
     <div class="row">
       <button class="btn sub" id="again">한 번 더</button>
       <button class="btn pri" id="next">다음 세트 ▶</button>
     </div>
     <button class="btn gh" id="back">← 세트 고르기</button>
   </div>`;
  $("#again").onclick = () => screenQuiz(setNo);   // 다시 하면 점수도 처음부터
  $("#next").onclick = () => setNo+1 < SETS ? screenLearn(setNo+1, 0) : screenSets();
  $("#back").onclick = screenSets;
}

/* ══ 빈칸 연습 (본문 · 대화문) ═══════════════════════════
   한 문항 = 한 빈칸. 문장에 빈칸이 둘이면 두 문항이 된다.
   1단 직접 쓰기 → 틀리면 2단 조각 맞추기 → 또 틀리면 3단 3지선다.
   **점수는 1단·첫 바퀴에서 맞힌 것만** 센다. 계단을 내려가 맞힌 걸 만점으로 세면 거짓말이 된다.
   본문과 대화문은 자료 모양만 다르고 화면·채점은 같은 코드를 쓴다. */

const DECKS = {
  pass: { items: PASSAGE, store: "pass", label: "본문",
          intro: "자습서 「본문 꼼꼼 학습」 빈칸을 그대로 옮겼어요. 여기 나오는 말이 <b>시험에 그대로</b> 나와요.",
          units: [[5,"5단원 · 춘천"],[6,"6단원 · 스케이트보드"]],
          tip: "<b>이 빈칸들, 거의 다 「덩어리」예요</b><br>reminded me of · fell down · cheering for · got dirty · looks like · strong ties …<br>단어 하나씩 외우면 안 되고 <b>통째로</b> 외워야 하는 것들이에요. 채우다 보면 저절로 외워져요." },
  dlg:  { items: DIALOG, store: "dlg", label: "대화문",
          intro: "자습서 「대화문 꼼꼼 학습」 빈칸이에요. 듣기·대화 문제가 여기서 나와요. <b>한 꼭지가 한 세트</b>라 대화 하나를 통째로 익히게 돼요.",
          units: [[5,"5단원 · 경험 묻기"],[6,"6단원 · 방법 묻기"]],
          tip: "<b>여러 낱말이 묶여 한 뜻이 되는 것들</b><br>sign up for(신청하다) · turn off(끄다) · pay for(결제하다) · Let me teach(가르쳐 줄게)<br>그리고 <b>take</b> 는 여기서 「(수업을) 듣다」예요. 한국말로 바로 안 떠오르는 것들이라 소리 내어 읽어 보면 좋아요." }
};

/* 빈칸 단위로 펼치기 — [{d:덱, i:항목번호, b:빈칸번호}, ...] */
function blanksOf(deck){
  const out = [];
  DECKS[deck].items.forEach((it, i) => it.a.forEach((_, b) => out.push({d:deck, i:i, b:b})));
  return out;
}

/* 세트 나누기.
   본문은 5개씩 기계적으로 자르고, 대화문은 **자습서 꼭지 그대로** 한 세트로 둔다
   (대화는 앞뒤가 이어져야 뜻이 통해서 쪼개면 오히려 어렵다). */
function setsOf(deck, u){
  const items = DECKS[deck].items;
  const mine = blanksOf(deck).filter(x => items[x.i].u === u);
  if(deck === "pass"){
    const out = [];
    for(let k=0; k<Math.ceil(mine.length/PPER); k++)
      out.push({ d:deck, u:u, k:k, key:deck+u+"-"+k, name:(k+1)+"세트",
                 items: mine.slice(k*PPER, (k+1)*PPER) });
    return out;
  }
  const secs = [];
  items.forEach(it => { if(it.u === u && !secs.some(s => s.s === it.s)) secs.push({s:it.s, sec:it.sec}); });
  secs.sort((a,b) => a.s - b.s);
  return secs.map(g => ({
    d:deck, u:u, k:g.s, key:deck+u+"-"+g.s, name:g.sec,
    items: mine.filter(x => items[x.i].s === g.s)
  }));
}
function allSets(deck){ return DECKS[deck].units.reduce((a,[u]) => a.concat(setsOf(deck,u)), []); }
function findSet(deck, key){
  if(key === "miss") return MISS_SET;        // 「모아 풀기」는 그때그때 만든 가상 세트다
  return allSets(deck).find(s => s.key === key);
}

/* ── 문항 그리기 ──────────────────────────────────────
   본문은 문장 한 줄, 대화문은 장면 전체(앞뒤 말이 있어야 답이 나온다). */
function nBlanks(t){ return (t.match(/\{\}/g) || []).length; }

/* text 안의 빈칸을 HTML 로. from 번 빈칸부터 센다. */
function fillHtml(text, it, active, solved, from){
  let k = from - 1;
  return text.replace(/\{\}/g, () => {
    k++;
    if(solved && solved[k]) return '<span class="bk sol">' + esc(it.a[k]) + '</span>';
    if(k === active)        return '<span class="bk on">?</span>';
    return '<span class="bk">____</span>';
  });
}
/* 빈칸을 정답으로 도로 메운다 (🔊 와 정답 보여 주기에 쓴다) */
function fillPlain(text, it, from){ let k = from - 1; return text.replace(/\{\}/g, () => it.a[++k]); }

/* 대화문에서 b번 빈칸이 몇 번째 대사에 있나 */
function lineOf(it, b){
  let k = -1;
  for(let j=0; j<it.l.length; j++){
    k += nBlanks(it.l[j][1]);
    if(b <= k) return j;
  }
  return it.l.length - 1;
}
/* j번째 대사가 몇 번 빈칸부터 시작하나 */
function lineFrom(it, j){
  let k = 0;
  for(let x=0; x<j; x++) k += nBlanks(it.l[x][1]);
  return k;
}

function itemHtml(it, active, solved){
  if(it.en) return '<div class="sent">' + fillHtml(it.en, it, active, solved, 0) + '</div>';
  const act = active >= 0 ? lineOf(it, active) : -1;
  return '<div class="dlg">' + it.l.map(([sp, en], j) =>
    '<div class="dl' + (j === act ? ' act' : '') + '"><b>' + sp + '</b>' +
    '<span>' + fillHtml(en, it, active, solved, lineFrom(it, j)) + '</span></div>').join("") + '</div>';
}
/* 화면 아래 우리말 힌트 — 대화문은 **지금 묻는 대사의 뜻만** 보여 준다 */
function itemKo(it, active){
  if(it.en) return it.ko;
  return it.l[lineOf(it, active)][2];
}
/* 🔊 가 읽어 줄 것 — 대화문은 장면 전체가 아니라 그 대사만 (길면 안 듣는다) */
function itemSay(it, active){
  if(it.en) return fillPlain(it.en, it, 0);
  const j = lineOf(it, active);
  return fillPlain(it.l[j][1], it, lineFrom(it, j)).replace(/\(pause\)/g, "");
}

/* 채점 — 대소문자·앞뒤 공백·문장부호는 무시한다 */
const norm = s => String(s).trim().toLowerCase().replace(/[.,!?"']/g,"").replace(/\s+/g," ");

/* 조각 맞추기 — 두 낱말 이상이면 낱말로, 한 낱말이면 글자로 쪼갠다 */
function pieces(ans){
  const w = ans.split(" ");
  return w.length > 1 ? w : ans.split("");
}

/* 장면이 길면 지금 묻는 대사가 스크롤 밖에 있을 수 있다. 가운데로 끌어온다. */
function focusScene(root){
  const box = root.querySelector(".dlg"); if(!box) return;
  const sol = box.querySelector(".bk.sol");
  const t = box.querySelector(".dl.act") || (sol && sol.closest(".dl"));
  if(t) box.scrollTop = Math.max(0, t.offsetTop - box.clientHeight/2 + t.offsetHeight/2);
}

/* ── 화면 1 · 세트 고르기 ────────────────────────────── */
function screenBlankSets(deck, unit){
  const D = DECKS[deck];
  const u = unit || D.units[0][0];
  const sets = setsOf(deck, u);
  const all = allSets(deck);
  const store = ST[D.store];
  const doneCount = all.filter(s => (store[s.key]||{}).done).length;
  let html = `
   <div class="card">
     <h2>${D.label} 빈칸</h2>
     <p class="muted">${D.intro}</p>
     <div class="bar"><i style="width:${Math.round(doneCount/all.length*100)}%"></i></div>
     <p class="muted">${doneCount} / ${all.length} 세트 완료</p>
     ${missList().length ? `<p class="muted" style="margin-bottom:0">
       처음에 못 쓴 것 <b>${missList().length}개</b>가 모였어요 —
       위 <b>「자주 틀린 것」</b> 탭에서 볼 수 있어요.</p>` : ""}
   </div>
   <div class="card">
     <div class="unitpick">
       ${D.units.map(([n,label]) =>
         `<button class="${u===n?'on':''}" data-u="${n}">${label}</button>`).join("")}
     </div>
     <p class="muted">안 써져도 괜찮아요 — 틀리면 <b>글자·낱말을 섞어서</b> 다시 물어보고,
     그래도 어려우면 <b>셋 중에 고르기</b>로 바뀌어요.</p>
     ${deck === "pass" ? `<button class="btn sub" id="toread"
       style="margin-bottom:10px">📖 본문 먼저 읽기 (전문) ▶</button>` : ""}
     <div class="sets">`;
  sets.forEach(s => {
    const st = store[s.key] || {};
    html += `<button class="setbtn ${st.done?'done':''}" data-key="${s.key}">
      <b>${esc(s.name)}</b><small>${st.done ? '완료 '+(st.best||0)+'/'+s.items.length
                                            : '빈칸 '+s.items.length+'개'}</small></button>`;
  });
  html += `</div></div>
   <div class="card"><div class="tip">${D.tip}</div></div>`;
  app.innerHTML = html;
  app.querySelectorAll(".unitpick button").forEach(b =>
    b.onclick = () => screenBlankSets(deck, +b.dataset.u));
  app.querySelectorAll(".setbtn").forEach(b =>
    b.onclick = () => screenBlankQ(deck, b.dataset.key));
  if($("#toread")) $("#toread").onclick = () => screenRead(u);
}

/* ── 화면 2 · 문제 ───────────────────────────────────── */
function screenBlankQ(deck, key, queue, wrong, score, total, round){
  const set = findSet(deck, key);
  if(!queue){
    queue = shuffle(set.items).map(x => Object.assign({}, x, {lv:1}));
    wrong = []; score = 0; total = queue.length; round = 1;
  }
  if(queue.length === 0){
    if(wrong.length && round < 3)
      return screenBlankQ(deck, key, shuffle(wrong).map(x => Object.assign({}, x, {lv:1})),
                          [], score, total, round+1);
    if(wrong.length) return screenBlankStuck(deck, key, wrong, score, total);
    return screenBlankDone(deck, key, score, total);
  }

  const cur = queue[0];
  const it  = DECKS[cur.d].items[cur.i];   // 「모아 풀기」는 덱이 섞여 있어 칸마다 본다
  const ans = it.a[cur.b];
  // 2단 이름은 조각이 낱말인지 글자인지에 따라 — 화면에 보이는 것과 말이 맞아야 한다
  const lvName = cur.lv === 1 ? "직접 쓰기"
               : cur.lv === 2 ? (ans.indexOf(" ") >= 0 ? "낱말 맞추기" : "글자 맞추기")
               : "셋 중에 고르기";

  const head = `
     <p class="muted">${set.virtual ? esc(set.name) : it.u + "단원 " + esc(set.name)} ·
        ${round===1 ? "빈칸 채우기" : "틀린 것 다시 "+(round-1)+"번째"}
        <span class="lvtag">${lvName}</span> <span class="nb">남은 ${queue.length}개</span></p>
     <div class="bar"><i style="width:${Math.round((total-queue.length)/total*100)}%"></i></div>
     ${itemHtml(it, cur.b)}
     <div class="sentko">${esc(itemKo(it, cur.b))}</div>
     <div class="center" style="margin-top:12px">
       <button class="spk" id="spk">🔊</button>
       <div class="muted" style="font-size:12.5px; margin-top:3px">
         ${it.en ? "문장" : "이 대사"} 듣기 · 답이 들려요</div>
     </div>`;

  let body = "";
  if(cur.lv === 1){
    body = `<div class="typewrap"><input id="ta" type="text" autocomplete="off"
              autocapitalize="off" autocorrect="off" spellcheck="false"
              placeholder="여기에 써 보세요"></div>
            <button class="btn pri" id="chk">확인</button>`;
  }else if(cur.lv === 2){
    const ps = pieces(ans);
    body = `<div class="tray" id="tray"></div>
            <div class="pool" id="pool">${shuffle(ps.map((p,i)=>[p,i]))
              .map(([p,i]) => `<button class="chip" data-i="${i}" data-p="${esc(p)}">${esc(p)}</button>`)
              .join("")}</div>
            <button class="btn gh" id="undo">← 하나 지우기</button>`;
  }else{
    const opts = shuffle([ans].concat(it.w[cur.b]));
    body = `<div class="opts">${opts.map(o =>
              `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }

  app.innerHTML = `<div class="card">${head}${body}<div id="fb"></div>
     <button class="btn gh" id="back">← 그만하고 세트 고르기</button></div>`;

  focusScene(app);
  $("#spk").onclick = () => speak(itemSay(it, cur.b));
  $("#back").onclick = () => set.virtual ? screenMiss() : screenBlankSets(deck, it.u);

  /* 한 빈칸은 「틀린 것 다시」에 한 번만 넣는다.
     1단·2단·3단에서 각각 넣으면 같은 문제가 한 바퀴에 세 번 나온다. */
  function mark(){
    if(!wrong.some(w => w.d === cur.d && w.i === cur.i && w.b === cur.b))
      wrong.push({d:cur.d, i:cur.i, b:cur.b});
  }

  /* 판정 — ok면 넘어가고, 아니면 한 단 내려간다 */
  function judge(ok){
    // 기록은 **첫 바퀴 1단에서만**. 도움받아 맞힌 건 맞힌 게 아니고,
    // 같은 바퀴를 두 번 세면 숫자가 부푼다.
    if(round === 1 && cur.lv === 1) noteBlank(cur, ok);
    const solved = {}; solved[cur.b] = 1;
    if(ok){
      if(cur.lv === 1 && round === 1) score++;      // 점수는 1단·첫 바퀴만
      if(cur.lv !== 1) mark();                      // 도움받아 맞힌 건 다시 만난다
      $("#fb").innerHTML = `<div class="fb ok">${cur.lv===1 ? "정확해요! 👏" : "맞았어요! 이제 외워졌어요."}
        <br><b>${esc(ans)}</b></div>`;
    }else{
      if(cur.lv < 3){
        mark();
        $("#fb").innerHTML = `<div class="fb no">아쉬워요. ${
          (ans.indexOf(" ") >= 0 ? "낱말을" : "글자를") + " 섞어서 다시 물어볼게요."}</div>`;
        if(cur.lv === 2)
          $("#fb").innerHTML = `<div class="fb no">아쉬워요. 이번엔 셋 중에서 골라 보세요.</div>`;
        const again = document.createElement("button");
        again.className = "btn pri"; again.textContent = "다시 해 보기 ▶";
        again.onclick = () => {
          const q = queue.slice();
          q[0] = Object.assign({}, cur, {lv: cur.lv + 1});
          screenBlankQ(deck, key, q, wrong, score, total, round);
        };
        $("#fb").appendChild(again);
        return;                                     // 다음으로 넘기지 않는다
      }
      mark();
      $("#fb").innerHTML = `<div class="fb no">정답은 <b>${esc(ans)}</b></div>`;
    }
    // 답을 채운 문장을 다시 보여 준다 — 눈으로 한 번 더 읽고 넘어가게
    const shown = document.createElement("div");
    shown.style.marginTop = "10px";
    shown.innerHTML = itemHtml(it, -1, solved);
    $("#fb").appendChild(shown);
    focusScene(shown);
    speak(itemSay(it, cur.b));
    const nx = document.createElement("button");
    nx.className = "btn pri"; nx.textContent = "다음 ▶";
    nx.onclick = () => screenBlankQ(deck, key, queue.slice(1), wrong, score, total, round);
    $("#fb").appendChild(nx);
  }

  if(cur.lv === 1){
    const inp = $("#ta");
    const send = () => { if(!inp.value.trim()) return;
                         inp.disabled = true; $("#chk").disabled = true;
                         judge(norm(inp.value) === norm(ans)); };
    $("#chk").onclick = send;
    inp.onkeydown = e => { if(e.key === "Enter") send(); };
    inp.focus();
  }else if(cur.lv === 2){
    const ps = pieces(ans), joiner = ans.indexOf(" ") >= 0 ? " " : "";
    const picked = [];
    const tray = $("#tray");
    const draw = () => {
      tray.innerHTML = picked.map(p => `<span class="chip inTray">${esc(p)}</span>`).join("");
      if(picked.length === ps.length){
        app.querySelectorAll("#pool .chip").forEach(c => c.classList.add("used"));
        judge(picked.join(joiner) === ans);
      }
    };
    app.querySelectorAll("#pool .chip").forEach(c => c.onclick = () => {
      c.classList.add("used"); picked.push(c.dataset.p); draw();
    });
    $("#undo").onclick = () => {
      if(!picked.length) return;
      picked.pop();
      const used = app.querySelectorAll("#pool .chip.used");
      if(used.length) used[used.length-1].classList.remove("used");
      draw();
    };
  }else{
    app.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
      const ok = btn.dataset.v === ans;
      app.querySelectorAll(".opt").forEach(x => {
        x.onclick = null;
        if(x.dataset.v === ans) x.classList.add("ok");
        else if(x === btn) x.classList.add("no");
      });
      judge(ok);
    });
  }
}

/* ── 화면 3 · 아직 안 외워진 것 ──────────────────────── */
function screenBlankStuck(deck, key, wrong, score, total){
  const set = findSet(deck, key);
  const uniq = [];
  wrong.forEach(w => { if(!uniq.some(x => x.i===w.i && x.b===w.b)) uniq.push(w); });
  app.innerHTML = `
   <div class="card">
     <div class="result">
       <div class="big" style="color:var(--amber)">${score} / ${total}</div>
       <p class="muted">여기까지 잘했어요. <b>아래 ${uniq.length}개만</b> 아직 손에 안 붙었어요.<br>
       한 번에 다 외우는 사람은 없어요.</p>
     </div>
     <div class="tip"><b>다시 볼 표현</b><br>
       ${uniq.map(w => `<b>${esc(DECKS[w.d].items[w.i].a[w.b])}</b>
         &nbsp;<span style="color:var(--sub)">${esc(itemKo(DECKS[w.d].items[w.i], w.b))}</span>`).join("<br>")}
     </div>
     <button class="btn pri" id="retry">이 세트 다시 ▶</button>
     <button class="btn gh" id="back">← 세트 고르기</button>
   </div>`;
  $("#retry").onclick = () => screenBlankQ(deck, key);
  $("#back").onclick = () => set.virtual ? screenMiss() : screenBlankSets(deck, set.u);
}

/* ── 화면 4 · 결과 ───────────────────────────────────── */
function screenBlankDone(deck, key, score, total){
  const set = findSet(deck, key);
  // 「모아 풀기」는 진짜 세트가 아니라서 초록불(진행 저장)을 건드리지 않는다
  if(!set.virtual){
    const D = DECKS[deck];
    ST[D.store][key] = { done:true, best: Math.max(score, (ST[D.store][key]||{}).best||0) };
    save(ST);
  }
  const sets = set.virtual ? [] : setsOf(deck, set.u);
  const at = sets.findIndex(s => s.key === key);
  const perfect = score === total;
  app.innerHTML = `
   <div class="card">
     <div class="result">
       <div class="big">${score} / ${total}</div>
       <p class="muted">${set.virtual ? esc(set.name) : set.u + "단원 " + esc(set.name)} 끝!
       <b>처음에 바로 쓴 개수</b>예요.<br>
       ${perfect ? "한 번에 전부 썼어요 👏"
                 : "나머지 " + (total-score) + "개도 <b>결국 다 맞혔어요</b> 👍"}</p>
     </div>
     <div class="tip"><b>이 세트에서 나온 표현</b><br>
       ${set.items.map(x => `<b>${esc(DECKS[x.d].items[x.i].a[x.b])}</b>
         &nbsp;<span style="color:var(--sub)">${esc(itemKo(DECKS[x.d].items[x.i], x.b))}</span>`).join("<br>")}
     </div>
     <div class="row">
       <button class="btn sub" id="again">한 번 더</button>
       <button class="btn pri" id="next">${set.virtual ? "남은 것 더 풀기 ▶" : "다음 세트 ▶"}</button>
     </div>
     <button class="btn gh" id="back">${set.virtual ? "← 자주 틀린 것" : "← 세트 고르기"}</button>
   </div>`;
  $("#again").onclick = () => screenBlankQ(deck, key);
  $("#next").onclick  = () => set.virtual ? startMissDrill()
      : at+1 < sets.length ? screenBlankQ(deck, sets[at+1].key) : screenBlankSets(deck, set.u);
  $("#back").onclick  = () => set.virtual ? screenMiss() : screenBlankSets(deck, set.u);
}

/* ══ 본문 읽기 ═══════════════════════════════════════════
   빈칸만 풀면 문장을 따로따로 만나게 된다. 내신은 흐름·순서도 묻고,
   시험 전날엔 「소리 내어 한 번 읽기」가 필요하다. 그래서 **전문**을 그대로 둔다.
   ⚠ 영어 문장은 `build_reading.py` 가 `_본문대장.md` 에서 뽑아 넣는다 — 손으로 고치지 말 것. */

function speakAll(lines){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    lines.forEach(s => {
      const u = new SpeechSynthesisUtterance(s);
      u.lang = "en-US"; u.rate = .85;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

function screenRead(u){
  const parts = READING.filter(b => b.u === u);
  const all = parts.reduce((a, b) => a.concat(b.l.map(x => x[0])), []);
  const hide = !!ST.readHide;
  let no = 0;

  app.innerHTML = `
   <div class="card">
     <h2>본문 읽기</h2>
     <p class="muted">교과서 본문 <b>전문</b>이에요. 빈칸을 풀기 전에 한 번,
     시험 전날 소리 내어 한 번 읽으면 돼요.</p>
     <div class="unitpick">
       ${READING.reduce((a,b)=> a.some(x=>x[0]===b.u) ? a : a.concat([[b.u, b.u+"단원"]]), [])
         .map(([n,label]) => `<button class="${u===n?'on':''}" data-u="${n}">${label}</button>`).join("")}
     </div>
     <div class="row">
       <button class="btn sub" id="ko">${hide ? "우리말 보이기" : "우리말 가리기"}</button>
       <button class="btn pri" id="play">🔊 전체 듣기</button>
     </div>
     <button class="btn gh" id="stop">■ 소리 멈추기</button>
   </div>
   ${parts.map(b => `
   <div class="card${hide ? " hideko" : ""}">
     <h2>${esc(b.t)} <span class="lvtag">${esc(b.p)}</span></h2>
     ${b.l.map(([en, ko, tag]) => {
       no++;
       return `<div class="rl">
         <div class="ren"><span class="rno">${no}</span>${esc(en)}
           <button class="mini" data-say="${esc(en)}">🔊</button></div>
         <div class="rko">${esc(ko)}</div>
         ${tag ? `<div class="rtag${tag.indexOf("⚠")===0 ? " warn" : ""}">${esc(tag)}</div>` : ""}
       </div>`;
     }).join("")}
   </div>`).join("")}
   <div class="card">
     <div class="tip"><b>이렇게 쓰면 좋아요</b><br>
       ① 우리말을 <b>가리고</b> 영어만 읽어 보기<br>
       ② 막히는 문장은 🔊 로 들어 보기<br>
       ③ 파란 표시는 <b>시험에 나오는 문법</b>, 노란 ⚠ 는 <b>닮았는데 다른 것</b>이에요
     </div>
     <button class="btn pri" id="toblank">본문 빈칸 풀러 가기 ▶</button>
   </div>`;

  app.querySelectorAll(".unitpick button").forEach(b => b.onclick = () => screenRead(+b.dataset.u));
  app.querySelectorAll(".mini").forEach(b => b.onclick = () => speak(b.dataset.say));
  $("#play").onclick = () => speakAll(all);
  $("#stop").onclick = () => { try{ speechSynthesis.cancel(); }catch(e){} };
  $("#ko").onclick = () => { ST.readHide = !ST.readHide; save(ST); screenRead(u); };
  $("#toblank").onclick = () => screenBlankSets("pass", u);
  // 가려 둔 우리말은 눌러서 하나씩 확인할 수 있게 (전부 다시 켜지 않아도 되게)
  app.querySelectorAll(".hideko .rko").forEach(e =>
    e.onclick = () => e.classList.toggle("show"));
}

/* ══ 선생님께 보내기 ═════════════════════════════════════
   기록은 폰 안에만 있으므로, 밖으로 나가는 유일한 길은 **소민이가 직접 보내는 것**이다.
   공유 창(카톡 등) → 안 되면 복사 → 그것도 안 되면 화면에 띄워 직접 복사하게 한다. */
function missText(){
  const d = new Date();
  const list = missList();
  return "소민 · 자주 틀린 것 (" + (d.getMonth()+1) + "/" + d.getDate() + ")\n"
       + list.map((r, i) => (i+1) + ". " + r.ans + " — " + r.w + "번 틀림"
                            + (r.c ? ", " + r.c + "번 맞힘" : "") + " (" + r.src + ")").join("\n")
       + "\n\n(연습장에서 자동으로 모은 목록이에요)";
}

function shareMiss(btn){
  const text = missText();
  const done = msg => { btn.textContent = msg; setTimeout(() => {
    btn.textContent = "선생님께 보내기"; }, 2500); };
  try{
    if(navigator.share){ navigator.share({ text: text }).then(()=>done("보냈어요 ✓"), ()=>{}); return; }
  }catch(e){}
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done("복사했어요 — 붙여넣기 하면 돼요 ✓"),
                                               ()=>showMissText(text));
      return;
    }
  }catch(e){}
  showMissText(text);
}

/* 공유도 복사도 막힌 기기 — 텍스트를 띄워 직접 복사하게 한다 */
function showMissText(text){
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `<p class="muted">아래 글을 길게 눌러 복사한 뒤 보내면 돼요.</p>
    <textarea class="sharebox" readonly>${esc(text)}</textarea>`;
  app.appendChild(box);
  const ta = box.querySelector("textarea");
  ta.focus(); ta.select();
  ta.scrollIntoView({ block: "center" });
}

/* ══ 자주 틀린 것 ═══════════════════════════════════════
   **폰 안에만** 쌓인다(localStorage). 서버로 보내지 않는다 — 학생 한 명의 답안이라
   폰 밖으로 내보낼 이유가 없다. 과외 때 소민이가 이 화면을 열어 보여 주면 그게 기록이다.

   한 칸 = {w:틀린 횟수, c:맞힌 횟수, s:연속으로 맞힌 횟수, t:마지막 시각}
   기록은 **첫 바퀴 1단(직접 쓰기)에서만** 남긴다. 도움받아 맞힌 건 「맞혔다」가 아니고,
   같은 바퀴를 두 번 세면 숫자가 부풀기 때문이다.
   **두 번 연속 맞히면 목록에서 빠진다** — 한 번은 우연일 수 있다. */
const MISS_OUT = 2;                              // 연속 몇 번 맞히면 졸업인가

function missKey(d, u, n, b){ return d + ":" + u + ":" + n + ":" + b; }

function noteResult(key, ok){
  const m = ST.miss[key] || {w:0, c:0, s:0};
  if(ok){ m.c++; m.s = (m.s || 0) + 1; } else { m.w++; m.s = 0; }
  m.t = Date.now();
  ST.miss[key] = m;
  save(ST);
}
/* 빈칸(본문·대화문) */
function noteBlank(cur, ok){
  const it = DECKS[cur.d].items[cur.i];
  noteResult(missKey(cur.d, it.u, it.n, cur.b), ok);
}
/* 동사 3단 변화 — 여기 오답도 같이 봐야 과외에서 판단이 된다 */
function noteVerb(v, which, ok){
  noteResult(missKey("verb", 0, VERBS.indexOf(v), which === "past" ? 0 : 1), ok);
}

/* 저장된 칸을 지금 자료에 도로 붙여 목록을 만든다.
   자료가 바뀌어 못 붙는 옛 칸은 조용히 버린다(오류로 화면을 깨뜨리지 않는다). */
function missList(){
  const out = [];
  Object.keys(ST.miss || {}).forEach(k => {
    const p = k.split(":"), d = p[0], u = +p[1], n = +p[2], b = +p[3];
    const m = ST.miss[k];
    if(!m || !m.w) return;                       // 틀린 적 없으면 목록에 없다
    if((m.s || 0) >= MISS_OUT) return;           // 연속으로 맞혔으면 졸업
    const rec = {key:k, w:m.w, c:m.c || 0, s:m.s || 0, t:m.t || 0};

    if(d === "verb"){
      const v = VERBS[n];
      if(!v) return;
      rec.kind = "verb";
      rec.ans  = b === 0 ? v[1] : v[2];
      rec.head = v[0];
      rec.ko   = v[3] + " · " + (b === 0 ? "과거형" : "과거분사");
      rec.full = v[0] + " - " + v[1] + " - " + v[2];
      rec.src  = "동사 3단 변화";
    }else{
      const D = DECKS[d]; if(!D) return;
      const i = D.items.findIndex(x => x.u === u && x.n === n);
      if(i < 0 || b >= D.items[i].a.length) return;
      rec.kind = "blank"; rec.d = d; rec.i = i; rec.b = b;
      rec.ans  = D.items[i].a[b];
      rec.ko   = itemKo(D.items[i], b);
      rec.src  = u + "단원 " + (d === "pass" ? "본문" : D.items[i].sec);
    }
    out.push(rec);
  });
  out.sort((a, b) => b.w - a.w || b.t - a.t);     // 많이 틀린 것부터
  return out;
}

/* 「모아 풀기」용 가상 세트 — 진짜 세트가 아니라 그때그때 만든다.
   초록불(진행 저장)은 건드리지 않는다. 목록은 풀면서 저절로 줄어든다. */
let MISS_SET = null;
function startMissDrill(){
  const picked = missList().filter(r => r.kind === "blank").slice(0, 10);
  if(!picked.length) return screenMiss();
  MISS_SET = { key:"miss", name:"틀린 것 모아 풀기", u:0, virtual:true,
               items: picked.map(r => ({d:r.d, i:r.i, b:r.b})) };
  screenBlankQ(picked[0].d, "miss");
}

function screenMiss(){
  const list = missList();
  const drillable = list.filter(r => r.kind === "blank").length;
  const 날짜 = t => { const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate(); };

  if(!list.length){
    app.innerHTML = `
     <div class="card">
       <h2>자주 틀린 것</h2>
       <p class="muted">아직 모인 게 없어요. 다른 탭에서 몇 세트 풀고 오면
       <b>처음에 못 쓴 것</b>만 여기에 모여요.</p>
       <div class="tip"><b>어떻게 쌓이나요</b><br>
         「직접 쓰기」에서 처음에 못 쓴 것만 셉니다. 도움받아 맞힌 건 맞힌 걸로 안 쳐요.<br>
         <b>두 번 연속 맞히면</b> 목록에서 빠져요.<br>
         이 기록은 <b>이 폰 안에만</b> 있어요. 아무 데도 보내지 않아요.
       </div>
     </div>`;
    return;
  }

  app.innerHTML = `
   <div class="card">
     <h2>자주 틀린 것 <span class="lvtag">${list.length}개</span></h2>
     <p class="muted">「직접 쓰기」에서 <b>처음에 못 쓴 것</b>만 모았어요.
     두 번 연속 맞히면 목록에서 빠져요.</p>
     ${drillable ? `<button class="btn pri" id="drill">이것만 모아 풀기
       (${Math.min(drillable,10)}개) ▶</button>` : ""}
     <p class="muted" style="font-size:12.5px; margin-bottom:0">
       시험 전날에는 새 문제 말고 <b>이 목록만</b> 보면 돼요.</p>
   </div>
   <div class="card">
     ${list.map(r => `
       <div class="missli">
         <div class="missrow">
           <b>${esc(r.ans)}</b>
           <span class="misscnt">${r.w}번 틀림${r.c ? " · " + r.c + "번 맞힘" : ""}</span>
         </div>
         <div class="missko">${esc(r.ko)}</div>
         <div class="misssrc">${esc(r.src)}${r.full ? " · " + esc(r.full) : ""}
           ${r.t ? " · 마지막 " + 날짜(r.t) : ""}</div>
       </div>`).join("")}
   </div>
   <div class="card">
     <p class="muted" style="margin:0">이 기록은 <b>이 폰 안에만</b> 있어요.
     아무 데도 보내지 않아요.</p>
     <button class="btn pri" id="share">선생님께 보내기</button>
     <button class="btn gh" id="clear">목록 비우기</button>
   </div>`;
  if(drillable) $("#drill").onclick = startMissDrill;
  $("#share").onclick = () => shareMiss($("#share"));
  $("#clear").onclick = () => {
    app.querySelector("#clear").outerHTML = `
      <div class="fb no" style="margin-top:10px">정말 비울까요? 지우면 되돌릴 수 없어요.
        <button class="btn sub" id="no">아니요</button>
        <button class="btn pri" id="yes">네, 비웁니다</button></div>`;
    $("#no").onclick = screenMiss;
    $("#yes").onclick = () => { ST.miss = {}; save(ST); screenMiss(); };
  };
}

/* ── 시작 ─────────────────────────────────────────────── */
function go(mode){
  document.querySelectorAll(".tabs button")
    .forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  if(mode === "verb") screenSets();
  else if(mode === "miss") screenMiss();
  else screenBlankSets(mode);                   // "pass" 또는 "dlg"
}
document.querySelectorAll(".tabs button").forEach(b => {
  if(b.dataset.mode && b.dataset.mode !== "soon") b.onclick = () => go(b.dataset.mode);
});
go("verb");
</script>
</body>
