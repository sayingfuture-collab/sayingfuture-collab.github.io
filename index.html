<meta property="og:image:width" content="1200">

<link rel="apple-touch-icon" href="./assets/logo.png">

<body>

<noscript>
  <div class="noscript-banner">
    이 페이지는 자바스크립트가 있어야 카드 목록이 표시돼요. 브라우저에서 자바스크립트를 켜주세요.
    그동안은 여기서 바로 플레이할 수 있어요 →
    <a href="https://nye-jun.itch.io/shrubdown" target="_blank" rel="noopener">Shrubdown 플레이하기</a>
  </div>
</noscript>

<div class="wrap">

  <header class="site-header">
    <div class="site-header__row">
      <a class="brand" href="./index.html" aria-label="NYEJUN 홈으로">
        <span class="brand__mark" aria-hidden="true">
          <img src="./assets/logo.png" alt="" class="brand__mark-img">
        </span>
        <span class="brand__name">NYEJUN</span>
      </a>
    </div>
    <p class="brand__tagline">제가 만든 게임과 학습지가 모이는 기지예요</p>
  </header>

  <section class="hero">
    <span class="hero__eyebrow">예준 · 개인 개발 기지</span>
    <h1 class="hero__title">제가 만들고 있는 것들의<br><em>기지</em>예요</h1>
    <p class="hero__desc">혼자 기획하고 만드는 게임과 학습지를 이곳에 모아둡니다. 완성된 것도, 아직 만드는 중인 것도 함께 있어요.</p>
    <div class="hero__stats">
      <span class="stat-chip"><strong id="stat-games">0</strong><span>개 게임 공개</span></span>
      <span class="stat-chip"><strong id="stat-worksheets">0</strong><span>개 학습지 공개</span></span>
    </div>
  </section>

  <section class="section section--game" aria-labelledby="game-heading">
    <div class="section__head">
      <h2 class="section__title" id="game-heading">🎮 게임</h2>
      <span class="section__count" id="game-count">0개</span>
    </div>
    <ul class="card-grid" id="game-grid" role="list"></ul>
  </section>

  <section class="section section--worksheet" aria-labelledby="worksheet-heading">
    <div class="section__head">
      <h2 class="section__title" id="worksheet-heading">📚 학습지</h2>
      <span class="section__count" id="worksheet-count">0개</span>
    </div>
    <ul class="card-grid" id="worksheet-grid" role="list"></ul>
  </section>

  <footer class="site-footer">
    <p>© 2026 NYEJUN</p>
    <p>하나씩, 꾸준히 만들어가고 있어요</p>
  </footer>

<script src="./data/services.js"></script>
<script src="./js/site.js"></script>
