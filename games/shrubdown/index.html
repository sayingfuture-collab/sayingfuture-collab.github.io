/* ======================= 액션 ======================= */
function canBuyIntoTeam(plant){
  if(state.gold < plant.cost) return false;
  return hasOpenMainSlot() || openBenchSlotIndex()!==-1;
}

function placeNewUnit(plant, atkBonus){
  // atkBonus: 민들레가 이 상점 슬롯에 걸어둔 공격력 보너스 — bonusAtk 필드로 전달해
  // 합성(레벨 재계산)을 거쳐도 사라지지 않게 한다 (PLANTS 원본은 여전히 건드리지 않음)
  if(hasOpenMainSlot()){
    const inst = freshInstance(plant, 1, atkBonus || 0, 0);
    state.team.push(inst);
    return inst;
  }
  const benchIdx = openBenchSlotIndex();
  if(benchIdx !== -1){
    const inst = freshInstance(plant, 1, atkBonus || 0, 0);
    state.bench[benchIdx] = inst;
    return inst;
  }
  return null;
}

function buyPlant(idx){
  const plant = state.shop[idx];
  if(!plant || !canBuyIntoTeam(plant)) return;
  SFX.buy();
  state.gold -= plant.cost;
  state.shop[idx] = null;
  if(state.shopFrozen) state.shopFrozen[idx] = false; // 사면 찜 해제
  const bonus = state.shopBonus[idx] || 0;
  state.shopBonus[idx] = 0;

  // 중복 여부와 무관하게 항상 새 레벨1 유닛으로 빈 자리(메인 우선, 없으면 벤치)에 배치한다.
  // 합성은 자동으로 일어나지 않고, 플레이어가 "🔗 합성" 버튼을 직접 눌러야 진행된다.
  const instance = placeNewUnit(plant, bonus);
  if(instance){
    // 구매 강화 특전(비옥한 토양/날 선 이파리) — bonusAtk/bonusHp 필드로 기록해 합성을 견디게
    if(state.buyAtkBonus || state.buyHpBonus){
      instance.bonusAtk += state.buyAtkBonus || 0;
      instance.bonusHp  += state.buyHpBonus  || 0;
      recomputeUnitStats(instance);
    }
    applyOnBuy(instance);
  }
  render();
}

function sellUnit(i){
  const unit = state.team[i];
  if(!unit) return;
  SFX.sell();
  const plant = PLANTS[unit.plantId];
  // 사본 수(2^(레벨-1)) 기준 환불이며, 합성 수수료(MERGE_FEE)는 환불에 포함되지 않는다.
  // ★3까지는 수수료가 작아 체감상 "투입 골드 대비" 비율이 맞았지만(T1 ★3: 19%),
  // ★4·★5는 수수료가 30/70으로 커져 실제 환불률이 훨씬 낮아진다(T1 ★5: 9.3%).
  const copiesInvested = Math.pow(2, unit.level-1);
  state.gold += Math.floor(plant.cost * copiesInvested * (state.sellRefundRate||BALANCE.SELL_REFUND_RATE));
  state.team.splice(i,1);
  applyOnSell(unit);
  render();
}

function sellBenchUnit(i){
  const unit = state.bench[i];
  if(!unit) return;
  SFX.sell();
  const plant = PLANTS[unit.plantId];
  // 사본 수(2^(레벨-1)) 기준 환불이며, 합성 수수료(MERGE_FEE)는 환불에 포함되지 않는다.
  // ★3까지는 수수료가 작아 체감상 "투입 골드 대비" 비율이 맞았지만(T1 ★3: 19%),
  // ★4·★5는 수수료가 30/70으로 커져 실제 환불률이 훨씬 낮아진다(T1 ★5: 9.3%).
  const copiesInvested = Math.pow(2, unit.level-1);
  state.gold += Math.floor(plant.cost * copiesInvested * (state.sellRefundRate||BALANCE.SELL_REFUND_RATE));
  state.bench[i] = null;
  applyOnSell(unit);
  render();
}

function moveUnit(i, dir){
  const j = i+dir;
  if(j<0 || j>=state.team.length) return;
  const tmp = state.team[i];
  state.team[i] = state.team[j];
  state.team[j] = tmp;
  render();
}

/* ======================= 드래그 앤 드롭 배치 ======================= */
// 정원 안 순서 이동 / 정원⇄벤치 이동·맞교환 / 벤치 안 이동.
// HTML5 DnD는 터치에서 동작하지 않으므로 기존 ◀▶⬇⬆ 버튼은 모바일용으로 유지한다.
let dragSrc = null; // {zone:'team'|'bench', idx}

function onUnitDragStart(ev, zone, idx){
  dragSrc = {zone, idx};
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', zone+':'+idx); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function onUnitDragEnd(ev){
  ev.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));
  dragSrc = null;
}
function onUnitDragOver(ev){
  if(!dragSrc) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  ev.currentTarget.classList.add('drop-hover');
}
function onUnitDragLeave(ev){
  // 자식 요소로 들어갈 때도 leave가 발생하므로, 진짜로 벗어났을 때만 하이라이트 해제
  if(ev.relatedTarget && ev.currentTarget.contains(ev.relatedTarget)) return;
  ev.currentTarget.classList.remove('drop-hover');
}
function onUnitDrop(ev, zone, idx){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drop-hover');
  if(!dragSrc) return;
  const src = dragSrc; dragSrc = null;
  applyMove(src, zone, idx);
}

// 이동 규칙 본체 — 마우스 DnD(onUnitDrop)와 터치 드래그(onUnitTouchEnd)가 공용으로 사용
function applyMove(src, zone, idx){
  if(src.zone===zone && src.idx===idx) return;

  // 상점 카드를 정원/벤치로 끌어놓으면 구매 (골드·빈자리 체크·배치는 buyPlant가 담당)
  if(src.zone==='shop'){
    if(zone==='team' || zone==='bench') buyPlant(src.idx); // buyPlant가 render() 호출
    return;
  }

  if(src.zone==='team' && zone==='team'){
    // 순서 이동: 뽑아서 목표 위치에 끼워넣기 (빈 슬롯이면 맨 뒤로)
    const u = state.team.splice(src.idx, 1)[0];
    state.team.splice(Math.min(idx, state.team.length), 0, u);
  }
  else if(src.zone==='team' && zone==='bench'){
    if(!state.benchUnlocked[idx]) return;
    const tu = state.team[src.idx];
    if(state.bench[idx]){
      // 벤치 유닛과 맞교환
      const bu = state.bench[idx];
      state.bench[idx] = tu;
      state.team[src.idx] = bu;
    } else {
      state.bench[idx] = tu;
      state.team.splice(src.idx, 1);
    }
  }
  else if(src.zone==='bench' && zone==='team'){
    const bu = state.bench[src.idx];
    if(!bu) return;
    if(state.team.length < BALANCE.TEAM_SIZE){
      state.bench[src.idx] = null;
      state.team.splice(Math.min(idx, state.team.length), 0, bu);
    } else if(state.team[idx]){
      // 정원이 꽉 찼으면 해당 자리 유닛과 맞교환
      state.bench[src.idx] = state.team[idx];
      state.team[idx] = bu;
    } else return;
  }
  else if(src.zone==='bench' && zone==='bench'){
    if(!state.benchUnlocked[idx]) return;
    const tmp = state.bench[idx];
    state.bench[idx] = state.bench[src.idx];
    state.bench[src.idx] = tmp;
  }
  render();
}

/* --- 터치 드래그 (모바일) — HTML5 DnD는 터치에서 안 되므로 별도 경로.
   좌표→슬롯 판별만 담당하고 이동 규칙은 applyMove를 그대로 사용한다.
   ⚠️ "꾹 눌러(160ms) 드래그" 방식: 카드가 화면 대부분을 덮는 모바일에서
   즉시 드래그 판정하면 페이지 스크롤이 전부 먹혀버림(전투 시작 버튼까지 못 내려감). --- */
let touchDrag = null; // {zone, idx, startX, startY, active, armed, timer, el}
const TOUCH_DRAG_HOLD_MS = 160; // 이보다 짧게 쓸면 스크롤, 길게 누르면 드래그

function onUnitTouchStart(ev, zone, idx){
  if(ev.target.closest('button')) return; // 카드 안 버튼(◀▶✕📌 등) 탭은 드래그 시작 금지
  const t = ev.touches[0];
  touchDrag = {zone, idx, startX: t.clientX, startY: t.clientY, active: false, armed: false, el: ev.currentTarget, timer: null};
  touchDrag.timer = setTimeout(()=>{
    if(!touchDrag) return;
    touchDrag.armed = true; // 이제부터 움직이면 드래그 (스크롤 아님)
    if(touchDrag.el) touchDrag.el.classList.add('drag-armed');
  }, TOUCH_DRAG_HOLD_MS);
}
function onUnitTouchMove(ev){
  if(!touchDrag) return;
  const t = ev.touches[0];
  const dist = Math.hypot(t.clientX - touchDrag.startX, t.clientY - touchDrag.startY);
  if(!touchDrag.armed){
    // 꾹 누르기 전에 크게 움직임 = 스크롤 의도 → 드래그 포기, 페이지 스크롤에 맡김
    if(dist >= 10){ clearTimeout(touchDrag.timer); touchDrag = null; }
    return;
  }
  if(!touchDrag.active){
    if(dist < 10){ ev.preventDefault(); return; } // 집은 상태 유지(스크롤만 방지)
    touchDrag.active = true;
    if(touchDrag.el){ touchDrag.el.classList.remove('drag-armed'); touchDrag.el.classList.add('dragging','touch-dragging'); }
  }
  ev.preventDefault(); // 드래그 확정 후엔 페이지 스크롤 방지
  const under = document.elementFromPoint(t.clientX, t.clientY);
  const slot = under ? under.closest('[data-drop-zone]') : null;
  document.querySelectorAll('.drop-hover').forEach(el=>{ if(el!==slot) el.classList.remove('drop-hover'); });
  if(slot) slot.classList.add('drop-hover');
}
function onUnitTouchEnd(ev){
  if(!touchDrag) return;
  const drag = touchDrag; touchDrag = null;
  clearTimeout(drag.timer);
  if(drag.el) drag.el.classList.remove('dragging','touch-dragging','drag-armed');
  document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));
  if(!drag.active) return; // 탭이었음 — 기본 클릭 동작에 맡김
  ev.preventDefault();     // 드롭 확정: 유령 클릭 방지
  const t = ev.changedTouches[0];
  const under = document.elementFromPoint(t.clientX, t.clientY);
  const slot = under ? under.closest('[data-drop-zone]') : null;
  if(!slot) return; // 슬롯 밖에서 놓음 — 원위치
  applyMove({zone: drag.zone, idx: drag.idx}, slot.dataset.dropZone, parseInt(slot.dataset.dropIdx, 10));
}
function onUnitTouchCancel(){
  if(!touchDrag) return;
  clearTimeout(touchDrag.timer);
  if(touchDrag.el) touchDrag.el.classList.remove('dragging','touch-dragging','drag-armed');
  document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));
  touchDrag = null;
}
// preventDefault가 먹으려면 passive:false 필수 (인라인 속성은 passive가 될 수 있음)
document.addEventListener('touchmove', onUnitTouchMove, {passive:false});
document.addEventListener('touchend', onUnitTouchEnd, {passive:false});
document.addEventListener('touchcancel', onUnitTouchCancel);

function moveToBench(i){
  const unit = state.team[i];
  if(!unit) return;
  const benchIdx = openBenchSlotIndex();
  if(benchIdx===-1) return; // 빈 벤치 자리 없음
  state.bench[benchIdx] = unit;
  state.team.splice(i,1);
  render();
}

function moveToMain(i){
  const unit = state.bench[i];
  if(!unit || !hasOpenMainSlot()) return;
  state.team.push(unit);
  state.bench[i] = null;
  render();
}

function unlockBenchSlot(i){
  if(state.benchUnlocked[i]) return;
  const cost = BENCH_UNLOCK_COST[i];
  if(state.gold < cost) return;
  SFX.buy();
  state.gold -= cost;
  state.benchUnlocked[i] = true;
  render();
}

function reroll(){
  // 무료 정찰 특전: 이번 웨이브 남은 무료 리롤을 먼저 소모
  if((state.freeRerollsLeft||0) > 0){
    state.freeRerollsLeft -= 1;
    SFX.reroll(); rollShop(); render(); return;
  }
  if(state.gold < state.rerollCost) return;
  SFX.reroll();
  state.gold -= state.rerollCost;
  rollShop();
  render();
}

function startBattle(){
  if(state.phase!=='shop') return; // 이중 클릭·전환 중 클릭 차단 (상점에서만 전투 시작)
  if(!state.runSeq) state.runSeq = nextRunSeq(); // 구버전 저장 호환
  updateBestWave(); // 최고 기록을 실시간 갱신 — 판이 끝나기 전에 새 게임을 눌러도 도달 기록은 남게
  saveGhostSnapshot(); // 현재 팀을 기록에 남긴다 — "유령 기록에서 런 복구" 안전망용 (고스트전은 삭제됨)
  const enemyTeam = makeEnemyTeam(state.wave);
  state._enemyTeamPreview = enemyTeam;
  const log = [];
  const {result, reasonCode, pSynergies} = simulateBattle(state.team, enemyTeam, log);
  state.lastLog = log;
  state.lastResult = result;
  state.lastResultCode = reasonCode;
  state.lastResultReason = null; // 구버전 문장 저장은 더 이상 안 씀 (표시는 lastResultCode 기준)
  state.lastPSynergies = pSynergies || 0; // 시너지 마에스트로 업적 판정용 (로그 텍스트 검사 대체)
  checkBattleAchievements();
  logRevealCount = 0;
  state.phase = 'battling';
  render(true);
}

function claimFixed(amount){
  if(state.phase!=='reward') return; // 이중 클릭·전환 중 클릭 차단
  SFX.buy();
  state.gold += amount;
  proceedAfterReward();
}

/* ===== 보상 룰렛 (설계안-보상룰렛.md) =====
   원판 배치는 손으로 섞지 않고 규칙으로 만든다 — 남이 검증할 수 있고, 범위가 바뀌어도 따라온다.
   낮은 절반과 높은 절반을 번갈아 끼우고, 홀수 개일 때 남는 가운데값을 맨 뒤에 붙인다.
   순서대로 놓지 않는 이유: 3~9가 한 덩어리로 붙어 있으면 실제로는 균등한데도
   "낮은 쪽이 몰려 있다"는 오해를 산다. */
const WHEEL_TURNS = 3;        // 회전 바퀴 수
const WHEEL_SPIN_MS = 1200;   // 회전 시간(ms) — 연출을 조정하려면 이 둘만 만진다

function wheelLayout(min, max){
  const vals = []; for(let v=min; v<=max; v++) vals.push(v);
  const mid  = vals.length % 2 ? vals[(vals.length-1)/2] : null;
  const rest = vals.filter(v => v !== mid);
  const lo = rest.slice(0, rest.length/2), hi = rest.slice(rest.length/2);
  const out = [];
  for(let i=0; i<lo.length; i++) out.push(lo[i], hi[i]);
  if(mid !== null) out.push(mid);
  return out;
}
// 값 → 최종 회전각(도). 바늘은 12시 고정이므로 그 값의 부채꼴 중심이 위로 오게 돌린다.
// 칸 i는 12시부터 시계방향으로 [i·step, (i+1)·step) 을 차지한다.
function wheelAngleFor(layout, amount){
  const step = 360 / layout.length;
  return 360*WHEEL_TURNS - (layout.indexOf(amount) + 0.5) * step;
}
// 회전각 → 바늘 아래 값. wheelAngleFor의 역함수 — 검사가 왕복을 대조하는 데 쓴다.
function wheelValueAt(layout, rotation){
  const step = 360 / layout.length;
  return layout[Math.floor(((((-rotation) % 360) + 360) % 360) / step)];
}

// 원판 SVG. 부채꼴은 전부 같은 각도다 — 이 그림 자체가 "균등하다"는 주장의 근거이므로
// 크기를 눈대중으로 손보면 안 된다. 색은 BALANCE.REWARD_FIXED에서 갈린다(본전 이상/미만).
function lotteryWheelHTML(layout, fixedAmount){
  const n = layout.length, step = 360/n, R = 120, C = 130;
  const wedges = layout.map((v, i)=>{
    const a0 = (i*step - 90) * Math.PI/180;        // -90°: 12시에서 시작
    const a1 = ((i+1)*step - 90) * Math.PI/180;
    const tm = ((i+0.5)*step - 90) * Math.PI/180;  // 숫자를 놓을 칸 중심
    const x0 = (C + R*Math.cos(a0)).toFixed(2), y0 = (C + R*Math.sin(a0)).toFixed(2);
    const x1 = (C + R*Math.cos(a1)).toFixed(2), y1 = (C + R*Math.sin(a1)).toFixed(2);
    const tx = (C + R*0.72*Math.cos(tm)).toFixed(2), ty = (C + R*0.72*Math.sin(tm)).toFixed(2);
    const cls = v >= fixedAmount ? 'w-good' : 'w-low';
    return `<path class="${cls}" d="M ${C} ${C} L ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1} Z"/>`
         + `<text class="w-num" x="${tx}" y="${ty}">${v}</text>`;
  }).join('');
  return `
    <div class="wheel-wrap" onclick="skipWheel()">
      <div class="wheel-pin">▼</div>
      <svg class="wheel" viewBox="0 0 260 260" width="260" height="260" aria-hidden="true">
        <g id="lotWheelSpin">${wedges}</g>
        <circle class="w-hub" cx="130" cy="130" r="18"/>
      </svg>
      <div class="wheel-hint">${T('돌리는 중… (아무 데나 눌러 건너뛰기)','Spinning… (tap anywhere to skip)')}</div>
    </div>`;
}

// 복권 결과 화면 — 긁는 순간(claimLottery)과 화면을 다시 그릴 때(renderReward) 둘 다 이걸 쓴다.
function lotteryResultHTML(amount){
  return `
    <div class="scratch-result">${T(`🎉 짜잔! ${amount} 골드 당첨!`,`🎉 Ta-da! You won ${amount} gold!`)}</div>
    <div class="row-actions" style="justify-content:center;">
      <button class="btn btn-primary" onclick="finishLottery()">${T('계속하기','Continue')}</button>
    </div>
  `;
}
let wheelTimer = null;

// 하네스·구형 환경에 requestAnimationFrame이 없다. 없으면 즉시 실행한다.
function nextFrame(fn){
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(fn);
  else fn();
}
function reduceMotion(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }   // matchMedia 없는 환경에서도 죽지 않게
}

function claimLottery(){
  if(state.phase!=='reward') return;
  if(state.pendingLottery != null) return; // 이미 긁었다 — 같은 보상에서 다시 굴리지 않는다
  SFX.reroll();
  const won = state.lastResult==='win';
  // 보상 범위는 BALANCE.REWARD_LOTTERY에서 조절 (min~max 균등 분포, 평균 = (min+max)/2)
  const lot = won ? BALANCE.REWARD_LOTTERY.win : BALANCE.REWARD_LOTTERY.lose;
  // 당첨 금액을 state에 남긴다. 예전엔 DOM에만 있어서 화면을 다시 그리면(언어 전환 등)
  // 결과가 통째로 사라지고 복권을 다시 긁을 수 있었다 — 원하는 금액이 나올 때까지 반복 가능.
  state.pendingLottery = Math.floor(Math.random()*(lot.max-lot.min+1)) + lot.min;
  state.lotteryRevealed = false;   // 이번 굴림의 공개 여부 (revealLottery 중복 방지)
  saveGame();

  const area = document.getElementById('rewardArea');
  if(!area) return;
  // 원판은 이미 정해진 금액을 "보여주기만" 한다. 각도를 읽어 금액을 정하는 구조로 뒤집으면
  // 부동소수점 오차나 전환 중단에서 표시와 지급이 갈릴 수 있다.
  const fixed  = won ? BALANCE.REWARD_FIXED.win : BALANCE.REWARD_FIXED.lose;
  const layout = wheelLayout(lot.min, lot.max);
  area.innerHTML = lotteryWheelHTML(layout, fixed);

  const spin = document.getElementById('lotWheelSpin');
  if(!spin || reduceMotion()){ revealLottery(); return; }
  const angle = wheelAngleFor(layout, state.pendingLottery);
  // 같은 프레임에 각도를 넣으면 전환 없이 점프한다 — 다음 프레임에 건다.
  nextFrame(()=>{ spin.style.transform = 'rotate('+angle+'deg)'; });
  clearTimeout(wheelTimer);
  // transitionend가 아니라 타이머로 판정한다. 탭이 백그라운드로 가면 transitionend가
  // 유실될 수 있고, 유실되면 결과 화면이 영영 안 뜬다.
  wheelTimer = setTimeout(revealLottery, WHEEL_SPIN_MS);
}

// 회전 중 아무 데나 클릭. 결과는 이미 정해져 있으므로 건너뛰어도 공정성에 영향이 없다.
function skipWheel(){
  if(state.phase!=='reward' || state.pendingLottery == null) return;
  revealLottery();
}

function revealLottery(){
  clearTimeout(wheelTimer); wheelTimer = null;
  if(state.phase!=='reward' || state.pendingLottery == null) return;
  // 이미 공개했으면 다시 하지 않는다. 타이머와 막판 클릭이 같이 큐에 들어가면 당첨음이
  // 두 번 울린다 (지급은 finishLottery 한 곳뿐이라 골드는 안 겹친다).
  if(state.lotteryRevealed) return;
  state.lotteryRevealed = true;
  SFX.win();
  const area = document.getElementById('rewardArea');
  if(area) area.innerHTML = lotteryResultHTML(state.pendingLottery);
}
function finishLottery(){
  if(state.phase!=='reward') return;
  if(state.pendingLottery == null) return;
  // 금액은 state에서만 읽는다 — 인자로 받으면 콘솔에서 원하는 값을 넣을 수 있다.
  state.gold += state.pendingLottery;
  state.pendingLottery = null;
  proceedAfterReward();
}

function rerollCostForWave(wave){
  return BALANCE.REROLL_BASE + Math.floor(wave/BALANCE.REROLL_GROWTH_WAVES);
}

/* ======================= 이벤트 웨이브: 특전 선택 ======================= */
// 5의 배수 웨이브(보스 제외)를 이기면 3개 중 1개 특전을 골라 이번 런 내내 유지한다.
// 모든 특전은 실플레이 전용 함수(buyPlant/reroll/sellUnit/mergeFeeFor/proceedAfterReward/rollShopPlant)에만
// 연결돼 있어, 시뮬레이션(그 함수들을 안 거치는 직접 호출)은 특전의 영향을 받지 않는다.
const PERKS = {
  interest:  {emoji:'🪙', name:'이자 배당', nameEn:'Dividends', desc:'매 웨이브 시작 시 +1 골드', descEn:'+1 gold at the start of every wave',
    avail:()=>true, apply:()=>{ state.goldPerWave=(state.goldPerWave||0)+1; }},
  freeReroll:{emoji:'🔄', name:'무료 정찰', nameEn:'Free Scouting', desc:'매 웨이브 리롤 1회 무료', descEn:'1 free reroll every wave',
    avail:()=>true, apply:()=>{ state.freeRerollsPerWave=(state.freeRerollsPerWave||0)+1; state.freeRerollsLeft=(state.freeRerollsLeft||0)+1; }},
  fertile:   {emoji:'🌱', name:'비옥한 토양', nameEn:'Fertile Soil', desc:'앞으로 사는 유닛 +0/+2 (정원·벤치에도 즉시)', descEn:'Units you buy get +0/+2 (garden & bench too, right now)',
    avail:()=>true, apply:()=>{ state.buyHpBonus=(state.buyHpBonus||0)+2; allOwnedUnits().forEach(u=>{ u.bonusHp=(u.bonusHp||0)+2; recomputeUnitStats(u); }); }},
  sharp:     {emoji:'⚔️', name:'날 선 이파리', nameEn:'Sharpened Leaves', desc:'앞으로 사는 유닛 +1/+0 (정원·벤치에도 즉시)', descEn:'Units you buy get +1/+0 (garden & bench too, right now)',
    avail:()=>true, apply:()=>{ state.buyAtkBonus=(state.buyAtkBonus||0)+1; allOwnedUnits().forEach(u=>{ u.bonusAtk=(u.bonusAtk||0)+1; recomputeUnitStats(u); }); }},
  mergeDeal: {emoji:'🔗', name:'합성 특가', nameEn:'Merge Sale', desc:'합성 수수료 -1', descEn:'Merge fee -1',
    avail:()=>true, apply:()=>{ state.mergeDiscount=(state.mergeDiscount||0)+1; }},
  bigBench:  {emoji:'🎒', name:'넓은 벤치', nameEn:'Roomy Bench', desc:'벤치 슬롯 1칸 즉시 무료 해금', descEn:'Unlocks 1 bench slot for free, right now',
    avail:()=> state.benchUnlocked.some(x=>!x), apply:()=>{ const i=state.benchUnlocked.findIndex(x=>!x); if(i!==-1) state.benchUnlocked[i]=true; }},
  thrifty:   {emoji:'💰', name:'알뜰 판매', nameEn:'Full Refund', desc:'판매 환불 100%', descEn:'Selling refunds 100%',
    avail:()=> (state.sellRefundRate||BALANCE.SELL_REFUND_RATE) < 1, apply:()=>{ state.sellRefundRate=1; }},
  bigspender:{emoji:'🏪', name:'큰손', nameEn:'Big Spender', desc:'상점에 더 좋은 티어가 빨리 등장', descEn:'Higher tiers show up in the shop sooner',
    avail:()=> (state.shopTierBoost||0) < 4 && (state.wave + 1) < BALANCE.FLAT_SHOP_FROM, apply:()=>{ state.shopTierBoost=(state.shopTierBoost||0)+2; }},
};
function isEventWave(wave){ return wave>=5 && wave%5===0 && !isBossWave(wave); }
function pickPerkChoices(n){
  const pool = Object.keys(PERKS).filter(id => PERKS[id].avail());
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0, n);
}
function pickPerk(id){
  if(state.phase!=='event') return; // 이중 클릭·전환 중 클릭 차단
  // 실제로 제시된 3장 안에서만 고를 수 있다 — 콘솔에서 임의 특전을 집어넣는 경로도 막힌다.
  if(!Array.isArray(state.perkChoices) || state.perkChoices.indexOf(id)===-1) return;
  const p = PERKS[id];
  if(!p) return;
  p.apply();
  state.perks = state.perks || [];
  state.perks.push(id);
  state.perkChoices = null;
  SFX.merge();
  proceedAfterReward();
}
function perkStripHTML(){
  if(!state.perks || !state.perks.length) return '';
  // 이모지만으론 의미 전달이 안 됨(모바일은 title 툴팁도 못 봄) → 이름 텍스트 표시 + 탭하면 효과 설명 토스트
  const chips = state.perks.map(id=>{ const p=PERKS[id]; return p?`<span class="perk-chip" onclick="showPerkInfo('${id}')" style="cursor:pointer;">${p.emoji} ${L(p,'name')}</span>`:''; }).join('');
  return `<div class="perk-strip">${T('🎁 특전:','🎁 Perks:')} ${chips}</div>`;
}
function renderEvent(){
  // 3택은 continueToReward에서 이미 뽑아 state에 담아뒀다 — 여기서 뽑으면 화면을 다시
  // 그릴 때마다(언어 전환 등) 선택지가 새로 섞여 원하는 특전이 나올 때까지 돌릴 수 있다.
  // 아래는 event 단계에서 저장된 구버전 세이브를 불러온 경우의 폴백.
  if(!Array.isArray(state.perkChoices) || !state.perkChoices.length){
    state.perkChoices = pickPerkChoices(3);
  }
  const picks = state.perkChoices.filter(id => PERKS[id]);
  app.innerHTML = `
    <div class="screen">
    <div class="panel">
      <h2>${T('🎁 특별 이벤트! 하나를 선택하세요','🎁 Special event! Pick one')}</h2>
      <p class="sub">${T(`웨이브 ${state.wave} 돌파 보너스 — 이 선택은 이번 판 내내 유지됩니다.`,`Wave ${state.wave} bonus — your pick lasts for the rest of this run.`)}</p>
      <div class="reward-choices">
        ${picks.map(id=>{ const p=PERKS[id]; return `
          <div class="reward-card perk-card" onclick="pickPerk('${id}')">
            <div class="big">${p.emoji}</div>
            <div class="label">${L(p,'name')}</div>
            <div class="sub">${L(p,'desc')}</div>
          </div>`; }).join('')}
      </div>
    </div>
    </div>`;
}

function proceedAfterReward(){
  // 보상/특전 화면에서만 진행한다. 이 가드가 없으면 전환 중(170ms) 보상 버튼을 두 번 눌러
  // 웨이브가 2칸 전진했다 — 웨이브 19에서 하면 보스 20을 통째로 건너뛴다.
  if(state.phase!=='reward' && state.phase!=='event') return;
  if(state.lastResult==='lose' || state.lastResult==='draw'){
    state.lives -= 1;
    // 안전망: 마지막 목숨 패배는 continueToReward에서 이미 게임오버로 빠지지만, 만약을 대비
    if(state.lives<=0){
      recordRunEnd(false);
      state.phase='gameover';
      render(true);
      return;
    }
    // 패배/무승부는 웨이브를 넘기지 않는다 — 같은 웨이브를 다시 준비해서 재도전
  } else {
    state.wave += 1;
    if(state.goldPerWave) state.gold += state.goldPerWave; // 이자 배당 특전
    if(state.cleared && state.wave >= 30) unlockAch('endless30');
  }
  state.freeRerollsLeft = state.freeRerollsPerWave || 0; // 무료 리롤은 매 웨이브 충전
  state.rerollCost = rerollCostForWave(state.wave);
  rollShop();
  state.phase='shop';
  render(true);
}

// 새 게임(런 포기)은 기록실(📊) 안에서만 — 상점 액션 줄의 오탭으로 런이 날아가는 사고 방지.
// window.confirm은 샌드박스 iframe에서 조용히 false를 반환할 수 있어 인라인 2단 확인으로 대체.
function statsRestartRowHTML(){
  const prev = loadPrevRun();
  // 유령 복구 버튼: 고스트 기록의 최고 웨이브가 "현재 판"과 "백업 슬롯" 둘 다보다 높을 때만.
  // (백업이 있다고 무조건 숨기면, 저웨이브 백업이 고웨이브 고스트 복구를 가리는 문제가 생김)
  const ghost = bestGhostForRecovery();
  const canGhostRecover = ghost && ghost.wave > (state.wave || 1) && ghost.wave > (prev ? prev.wave : 0);
  return `
    <button class="sheet-btn" onclick="statsAskRestart()">${T('🔁 새 게임 (지난 판 복구로 되돌리기 가능)','🔁 New game (last run stays restorable)')}</button>
    ${prev ? `<button class="sheet-btn" onclick="restorePrevRun()">${T(`↩️ 지난 판 복구 — 웨이브 ${prev.wave}${prev.cleared ? ' · 무한 모드' : ''} (현재 판과 맞교환)`,`↩️ Restore last run — Wave ${prev.wave}${prev.cleared ? ' · Endless' : ''} (swaps with current run)`)}</button>` : ''}
    ${canGhostRecover ? `<button class="sheet-btn" onclick="recoverFromGhosts()">${T(`🚑 유령 기록에서 런 복구 — 웨이브 ${ghost.wave} 팀 (골드·특전은 복원 불가)`,`🚑 Recover run from ghost records — Wave ${ghost.wave} team (gold/perks not restored)`)}</button>` : ''}`;
}

/* ======================= 저장/불러오기 (localStorage) ======================= */
const SAVE_KEY = 'plantFightSave_v1';

// 구버전 저장 호환: 이후 패치에서 추가된 필드를 로드 시점에 보정한다.
// 부팅 로드와 restorePrevRun(백업 맞교환) 둘 다 이 함수를 거친다.
// (고스트 복구는 freshInstance로 상태를 새로 만들므로 여기를 안 거쳐도 된다)
function migrateState(s){
  if(!s) return s;
  // 벤치 확장(3→5칸, 2026-08): 구버전 저장의 배열을 현재 크기로 패딩 — 새 칸은 잠김 상태
  // 배열 자체가 없는(undefined) 경우도 복구해야 한다 — 이 함수는 로드 시점 복구가 유일한 임무이므로
  // 방치하면 renderShop의 state.bench.map이 그대로 터진다.
  if(!Array.isArray(s.bench)) s.bench = new Array(BALANCE.BENCH_SIZE).fill(null);
  if(!Array.isArray(s.benchUnlocked)) s.benchUnlocked = new Array(BALANCE.BENCH_SIZE).fill(false);
  while(s.bench.length < BALANCE.BENCH_SIZE) s.bench.push(null);
  while(s.benchUnlocked.length < BALANCE.BENCH_SIZE) s.benchUnlocked.push(false);
  // bonusAtk/bonusHp 도입(2026-08) 전 저장: 현재 스탯 - 기본 스탯으로 역산해 채운다.
  // 특전·민들레 보너스가 생 atk에 녹아 있던 시절의 진행 중 런을 살려주기 위함.
  function migrateUnitBonus(u){
    if(!u || !PLANTS[u.plantId]) return;
    // OR로 묶어 둘 중 하나만 없어도 둘 다 재계산한다 — freshInstance/recomputeUnitStats/이 함수
    // 자신까지 모든 작성 지점이 항상 두 필드를 함께 세팅한다는 전제 하에 안전하다.
    // 훗날 한쪽 필드만 단독으로 쓰는 코드가 생기면 이 가정이 조용히 깨지니 주의.
    if(u.bonusAtk === undefined || u.bonusHp === undefined){
      const base = computeLeveledStats(PLANTS[u.plantId], u.level || 1);
      u.bonusAtk = Math.max(0, (u.atk   !== undefined ? u.atk   : base.atk) - base.atk);
      u.bonusHp  = Math.max(0, (u.maxHp !== undefined ? u.maxHp : base.hp ) - base.hp );
    }
  }
  if(Array.isArray(s.team)) s.team.forEach(migrateUnitBonus);
  if(Array.isArray(s.bench)) s.bench.forEach(migrateUnitBonus);

  /* ---- 정화 ----
     localStorage는 사용자가 직접 고칠 수 있고, 식물 id가 바뀐 패치도 있었다.
     여기서 걸러내지 않으면 렌더나 전투가 그대로 터져 흰 화면이 된다. */
  function clampInt(v, lo, hi, dflt){
    const n = Math.floor(Number(v));
    if(!Number.isFinite(n)) return dflt;
    return Math.min(hi, Math.max(lo, n));
  }
  const known = u => !!(u && PLANTS[u.plantId]);
  if(!Array.isArray(s.team)) s.team = [];
  s.team = s.team.filter(known).slice(0, BALANCE.TEAM_SIZE);
  s.bench = s.bench.map(u => known(u) ? u : null); // 벤치는 칸 번호가 의미를 가지므로 null로 비운다
  s.benchUnlocked = s.benchUnlocked.map(x => !!x);
  // 레벨·보너스를 정상 범위로 조인 뒤 스탯을 다시 계산한다. 위 migrateUnitBonus가 끝난 뒤라
  // 정상 저장에서는 결과가 그대로고, 조작된 저장만 제자리로 돌아온다.
  s.team.concat(s.bench.filter(Boolean)).forEach(u=>{
    u.level    = clampInt(u.level,    1, BALANCE.MAX_LEVEL, 1);
    u.bonusAtk = clampInt(u.bonusAtk, 0, 9999, 0);
    u.bonusHp  = clampInt(u.bonusHp,  0, 9999, 0);
    recomputeUnitStats(u);
  });
  s.gold  = clampInt(s.gold,  0, 999999, BALANCE.START_GOLD);
  s.wave  = clampInt(s.wave,  1, 999999, 1);
  s.lives = clampInt(s.lives, 0, BALANCE.START_LIVES, BALANCE.START_LIVES);
  // 긁어놓고 아직 안 받은 복권 당첨금. 손상된 저장이 999나 문자열을 넣으면 그대로 지급되거나
  // gold의 타입을 깨뜨린다 — 실제 당첨 범위(승/패 양쪽을 합친 최소~최대) 밖이면 버린다.
  if(s.pendingLottery != null){
    const W = BALANCE.REWARD_LOTTERY.win, L = BALANCE.REWARD_LOTTERY.lose;
    const lo = Math.min(W.min, L.min), hi = Math.max(W.max, L.max);
    const v = Math.floor(Number(s.pendingLottery));
    s.pendingLottery = (Number.isFinite(v) && v >= lo && v <= hi) ? v : null;
  }
  if(!Array.isArray(s.shop))       s.shop       = [];
  if(!Array.isArray(s.shopBonus))  s.shopBonus  = new Array(BALANCE.SHOP_SIZE).fill(0);
  if(!Array.isArray(s.shopFrozen)) s.shopFrozen = new Array(BALANCE.SHOP_SIZE).fill(false);
  s.perks = Array.isArray(s.perks) ? s.perks.filter(id => PERKS[id]) : [];
  if(s.perkChoices != null && !Array.isArray(s.perkChoices)) s.perkChoices = null;
  // 전투 중 저장인데 적 팀이 없으면 재생할 수가 없다 — 상점으로 되돌린다
  if(s.phase==='battling' && !Array.isArray(s._enemyTeamPreview)) s.phase = 'shop';
  if(!Array.isArray(s.lastLog)) s.lastLog = [];
  return s;
}
function loadGame(){

    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }

/* ===== 지난 판 백업/복구 ===== */
// 새 게임(restart)이 진행 중 런을 덮어쓰기 전에 스냅샷을 남긴다. 복구는 "맞교환(swap)" —
// 복구해도 현재 런이 백업 슬롯으로 들어가므로 어느 쪽도 사라지지 않는다.
const PREV_RUN_KEY = 'plantFightPrevRun_v1';
function hasRunProgress(s){ return !!(s && (s.wave > 1 || (s.team && s.team.length) || s.cleared)); }
function backupCurrentRun(){
  // 이미 끝난 런(게임오버 화면)은 백업해도 이어갈 수 없으니 제외
  if(!hasRunProgress(state) || state.phase === 'gameover') return;
  try{ localStorage.setItem(PREV_RUN_KEY, JSON.stringify(state)); }catch(e){}
}
function loadPrevRun(){
  try{
    const raw = localStorage.getItem(PREV_RUN_KEY);
    const s = raw ? JSON.parse(raw) : null;
    return hasRunProgress(s) ? s : null;
  }catch(e){ return null; }
}
function restorePrevRun(){
  const prev = loadPrevRun();
  if(!prev) return;
  const cur = state;
  state = migrateState(prev);
  try{
    if(hasRunProgress(cur) && cur.phase !== 'gameover') localStorage.setItem(PREV_RUN_KEY, JSON.stringify(cur));
    else localStorage.removeItem(PREV_RUN_KEY);
  }catch(e){}
  titleNewConfirm = false;
  onTitleScreen = false;
  closeStats();
  render(true);
}
// 응급 복구: 백업이 없던 시절에 날린 런을 고스트 스냅샷(전투마다 저장되는 과거 팀)에서 재구성.
// 팀·웨이브·런 번호는 정확하고, 골드·목숨·특전은 스냅샷에 없어 근사치로 채운다.
function bestGhostForRecovery(){
  // 자기 런(seq 동일)의 스냅샷도 후보에 포함한다 — 같은 런의 "더 나중 시점"으로 점프하는 것도
  // 정당한 복구다. (예: 웨이브 20 시점으로 복구한 뒤, 같은 런의 웨이브 41 기록으로 다시 점프)
  // 쓸모 판단(현재 웨이브보다 높은가)은 버튼 노출 조건에서 한다.
  const pool = loadGhosts().filter(g => g.units && g.units.length);
  if(!pool.length) return null;
  pool.sort((a,b)=> (b.wave - a.wave) || (b.seq - a.seq));
  return pool[0];
}
function recoverFromGhosts(){
  const g = bestGhostForRecovery();
  if(!g) return;
  backupCurrentRun(); // 현재 런도 잃지 않게 백업 슬롯으로
  const team = g.units.map(u => { const def = getPlantDef(u.p); return def ? freshInstance(def, u.l) : null; }).filter(Boolean);
  if(!team.length) return;
  state = {
    gold: 15, wave: g.wave, lives: 2,
    team,
    bench: new Array(BALANCE.BENCH_SIZE).fill(null),
    benchUnlocked: new Array(BALANCE.BENCH_SIZE).fill(false),
    shop: [], shopBonus: new Array(BALANCE.SHOP_SIZE).fill(0),
    shopFrozen: new Array(BALANCE.SHOP_SIZE).fill(false),
    rerollCost: rerollCostForWave(g.wave),
    phase: 'shop', lastLog: [], lastResult: null,
    lastResultReason: null, lastResultCode: null, _enemyTeamPreview: null,
    runSeq: g.seq, // 그 런의 "재개" — 자기 자신의 고스트와 안 붙도록 원래 런 번호 유지
    cleared: g.wave > BALANCE.CLEAR_WAVE,
    perks: [], goldPerWave: 0, freeRerollsPerWave: 0, freeRerollsLeft: 0,
    buyAtkBonus: 0, buyHpBonus: 0, mergeDiscount: 0, sellRefundRate: null, shopTierBoost: 0,
  };
  rollShop();
  titleNewConfirm = false;
  onTitleScreen = false;
  closeStats();
  render(true);
}

// 밸런스 조정 논의 때 "체감"이 아니라 실제 판 데이터를 근거로 쓰기 위한 장치.

/* ======================= 사운드 (Web Audio 합성, 외부 파일 없음) ======================= */
// 오디오는 브라우저 정책상 사용자 입력 후에만 시작 가능 — 첫 클릭에서 컨텍스트를 깨운다.
const SFX = (function(){
  let ctx = null;
  let muted = false;
  try{ muted = localStorage.getItem('plantFightMuted') === '1'; }catch(e){}
  function ac(){
    if(!ctx){
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(ctx && ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  // 단일 톤: freq(Hz)에서 시작해 slide(옵션)로 미끄러지며 dur(초) 동안 감쇠
  function tone(freq, dur, type, vol, delay, slide){
    const c = ac(); if(!c || muted) return;
    const t0 = c.currentTime + (delay||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol||0.15, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }
  // 타격감용 짧은 노이즈 (로우패스로 둔탁하게)
  function thud(dur, vol, delay){
    const c = ac(); if(!c || muted) return;
    const t0 = c.currentTime + (delay||0);
    const len = Math.max(1, Math.floor(c.sampleRate*dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len);
    const s = c.createBufferSource(); s.buffer = buf;
    const g = c.createGain();
    g.gain.setValueAtTime(vol||0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t0);
  }
  return {
    unlock(){ ac(); },
    buy(){ tone(660,0.08,'triangle',0.12); tone(880,0.1,'triangle',0.12,0.06); },
    sell(){ tone(520,0.09,'triangle',0.1); tone(330,0.12,'triangle',0.1,0.07); },
    reroll(){ thud(0.12,0.06); tone(440,0.06,'square',0.05,0.02,520); },
    merge(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.12,'triangle',0.12,i*0.07)); },
    hit(){ thud(0.09,0.14); tone(180,0.09,'square',0.08,0,120); },
    faint(){ tone(392,0.18,'sine',0.1,0,196); },
    win(){ [523,659,784].forEach((f,i)=>tone(f,0.15,'triangle',0.13,i*0.1)); tone(1047,0.35,'triangle',0.13,0.3); },
    lose(){ tone(392,0.2,'sine',0.11); tone(311,0.25,'sine',0.11,0.18); tone(233,0.4,'sine',0.11,0.38); },
    clear(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,'triangle',0.14,i*0.09)); tone(1568,0.5,'triangle',0.12,0.5); },
    toggleMute(){ muted=!muted; try{ localStorage.setItem('plantFightMuted', muted?'1':'0'); }catch(e){} return muted; },
    isMuted(){ return muted; }
  };
})();
document.addEventListener('pointerdown', ()=>{ SFX.unlock(); }, {once:true, capture:true});

function toggleMute(){
  const m = SFX.toggleMute();
  const b = document.getElementById('muteBtn');
  if(b) b.textContent = m ? '🔇' : '🔊';
}

/* ======================= 기록실 (런 기록 통계 오버레이) ======================= */
function statsOverlayHTML(){
  const log = loadRunLog();
  const rec = loadRecord();
  if(log.length === 0){
    return `<div class="stats-body"><p class="sub">${T('아직 기록이 없어요. 한 판이 끝나면(클리어든 패배든) 자동으로 쌓입니다.','No records yet. They pile up automatically when a run ends (clear or defeat).')}</p>${achievementsHTML()}</div>`;
  }
  const clears = log.filter(r=>r.cleared).length;
  const avgWave = Math.round(log.reduce((s,r)=>s+r.wave,0)/log.length*10)/10;
  // 사망 웨이브 분포 (클리어 제외)
  const deaths = log.filter(r=>!r.cleared);
  const buckets = {'1~5':0,'6~10':0,'11~15':0,'16~20':0,'21+':0};
  deaths.forEach(r=>{
    if(r.wave<=5) buckets['1~5']++;
    else if(r.wave<=10) buckets['6~10']++;
    else if(r.wave<=15) buckets['11~15']++;
    else if(r.wave<=20) buckets['16~20']++;
    else buckets['21+']++;
  });
  const maxBucket = Math.max(1, ...Object.values(buckets));
  const histRows = Object.entries(buckets).map(([label, n])=>{
    const barW = Math.round(n/maxBucket*100);
    return `<div class="st-hist-row"><span class="st-hist-label">${label}</span><span class="st-hist-bar"><span style="width:${barW}%"></span></span><span class="st-hist-n">${n}</span></div>`;
  }).join('');
  const recent = log.slice(-10).reverse().map(r=>
    `<div class="rl-row">${r.cleared?'🏆':'🥀'}${DIFFICULTY[r.diff] ? ' '+DIFFICULTY[r.diff].emoji : ''} ${T('웨이브','Wave')} ${r.wave} <span class="rl-team">${r.team}</span></div>`
  ).join('');
  return `<div class="stats-body">
    <div class="st-grid">
      <div class="st-item"><div class="st-num">${log.length}</div><div class="st-label">${T('플레이한 판','Runs played')}</div></div>
      <div class="st-item"><div class="st-num">${clears}</div><div class="st-label">${T('클리어','Clears')} (${Math.round(clears/log.length*100)}%)</div></div>
      <div class="st-item"><div class="st-num">${avgWave}</div><div class="st-label">${T('평균 도달 웨이브','Avg wave reached')}</div></div>
      <div class="st-item"><div class="st-num">${rec.bestWave}</div><div class="st-label">${T('최고 웨이브','Best wave')}</div></div>
    </div>
    ${deaths.length ? `<div class="st-section-title">${T('💀 어느 웨이브에서 졌나','💀 Where runs ended')}</div>${histRows}` : ''}
    ${achievementsHTML()}
    <div class="st-section-title">${T('📜 최근 10판','📜 Last 10 runs')}</div>
    ${recent}
  </div>`;
}
function openStats(){
  closeStats();
  const el = document.createElement('div');
  el.className = 'stats-overlay';
  el.id = 'statsOverlay';
  el.innerHTML = `
    <div class="stats-card">
      <div class="stats-head">
        <h2>${T('📊 기록실','📊 Records')}</h2>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="copyRunLog(this)">${T('📋 데이터 복사','📋 Copy data')}</button>
          <button class="btn btn-ghost btn-sm" onclick="closeStats()">${T('✕ 닫기','✕ Close')}</button>
        </div>
      </div>
      ${statsOverlayHTML()}
      <div id="statsRestartRow">${statsRestartRowHTML()}</div>
    </div>`;
  el.addEventListener('click', (e)=>{ if(e.target===el) closeStats(); });
  document.body.appendChild(el);
}
function closeStats(){
  const el = document.getElementById('statsOverlay');
  if(el) el.remove();
}

/* ======================= 업적 ======================= */
const ACH_KEY = 'plantFightAchievements_v1';
const ACHIEVEMENTS = {
  firstClear:    {emoji:'🏆', name:'첫 클리어',        nameEn:'First Clear',      desc:'웨이브 20 보스를 처음으로 격파', descEn:'Defeat the wave-20 boss for the first time'},
  flawless:      {emoji:'💎', name:'무결점 정원사',    nameEn:'Flawless Gardener', desc:'목숨을 하나도 잃지 않고 클리어', descEn:'Clear without losing a single life'},
  phoenix:       {emoji:'🔥', name:'불사조',           nameEn:'Phoenix',          desc:'목숨 1개만 남은 채로 클리어', descEn:'Clear with only 1 life left'},
  tripleStar3:   {emoji:'🌟', name:'별이 세 개',       nameEn:'Three Stars',      desc:'★3 유닛 3마리를 동시에 보유', descEn:'Own three ★3 units at the same time'},
  synergyMaster: {emoji:'⚜️', name:'시너지 마에스트로', nameEn:'Synergy Maestro',  desc:'한 전투에서 시너지 2종 동시 발동', descEn:'Trigger 2 synergies in a single battle'}, // 시너지당 2마리 필요 → 5칸에서 3종(6마리)은 불가능. 달성 가능한 최대치인 2종으로.
  guardianWall:  {emoji:'🛡️', name:'푸른 성벽',        nameEn:'Verdant Rampart',  desc:'수호자 3마리를 데리고 전투 승리', descEn:'Win a battle with 3 Guardians on the team'},
  judgeWin:      {emoji:'⚖️', name:'판정승',           nameEn:'Won on Points',    desc:'40라운드 시간 초과 판정으로 승리', descEn:'Win by the 40-round time-out ruling'},
  endless30:     {emoji:'🌌', name:'심연의 정원',      nameEn:'Abyssal Garden',   desc:'무한 모드에서 웨이브 30 도달', descEn:'Reach wave 30 in Endless mode'},
  // ghostBuster('과거 극복')는 고스트전과 함께 2026-08 삭제 — 달성 경로가 사라져 남겨두면 영구 미달성 칸이 된다.
};
function loadAch(){
  try{ return JSON.parse(localStorage.getItem(ACH_KEY)) || {}; }catch(e){ return {}; }
}
function unlockAch(id){
  const ach = ACHIEVEMENTS[id];
  if(!ach) return;
  const got = loadAch();
  if(got[id]) return; // 이미 달성
  got[id] = Date.now();
  try{ localStorage.setItem(ACH_KEY, JSON.stringify(got)); }catch(e){}
  SFX.merge();
  const el = document.createElement('div');
  el.className = 'merge-toast';
  el.textContent = T(`🏅 업적 달성! ${ach.emoji} ${ach.name}`,`🏅 Achievement unlocked! ${ach.emoji} ${L(ach,'name')}`);
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('merge-toast-out'); }, 1800);
  setTimeout(()=>{ el.remove(); }, 2200);
}
// 전투 결과가 확정된 시점(startBattle 직후)에 판정 가능한 업적만 여기서 처리한다.
// 승리 조건부 업적(judgeWin/guardianWall)은 결과가 스포일러되지 않도록
// 전투 재생이 끝나는 scheduleBattleEnd()에서 checkBattleWinAchievements()로 판정한다.
function checkBattleAchievements(){
  if(state.team.filter(u=>(u.level||1)>=3).length >= 3) unlockAch('tripleStar3');
  if((state.lastPSynergies||0) >= 2) unlockAch('synergyMaster'); // 5칸 정원에서 동시 발동 가능한 최대치 = 2종
}
function checkBattleWinAchievements(){
  if(state.lastResult==='win'){
    if(countRoles(state.team)['수호자'] >= 3) unlockAch('guardianWall');
    if(state.lastResultCode ? state.lastResultCode.t==='timeout' : (state.lastResultReason && state.lastResultReason.includes('시간 초과'))) unlockAch('judgeWin');
  }
}
function achievementsHTML(){
  const got = loadAch();
  return `<div class="st-section-title">${T('🏅 업적','🏅 Achievements')} (${Object.keys(got).length}/${Object.keys(ACHIEVEMENTS).length})</div>` +
    Object.entries(ACHIEVEMENTS).map(([id, a])=>{
      const on = !!got[id];
      return `<div class="ach-row ${on?'on':''}">${on ? a.emoji : '🔒'} <b>${L(a,'name')}</b> <span class="ach-desc">${L(a,'desc')}</span></div>`;
    }).join('');
}

// 런 기록 전체를 클립보드로 — 밸런스 분석을 위해 기록을 공유할 때 사용
function copyRunLog(btn){
  // 진단용으로 고스트 풀 요약(런번호·웨이브)과 백업 슬롯 상태도 함께 담는다 — 복구 문제를 원격으로 파악 가능하게
  const ghosts = loadGhosts().map(g=>({seq:g.seq, wave:g.wave}));
  const prev = loadPrevRun();
  const data = JSON.stringify({
    record: loadRecord(),
    current: state ? {wave: state.wave, seq: state.runSeq, cleared: !!state.cleared} : null,
    prevRun: prev ? {wave: prev.wave, cleared: !!prev.cleared} : null,
    ghosts,
    runs: loadRunLog(),
  });
  const done = ()=>{
    if(btn){ btn.textContent = T('✅ 복사됨!','✅ Copied!'); setTimeout(()=>{ btn.textContent = T('📋 데이터 복사','📋 Copy data'); }, 1500); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(done).catch(()=>{ prompt(T('아래 내용을 직접 복사하세요:','Copy the text below manually:'), data); });
  } else {
    prompt(T('아래 내용을 직접 복사하세요:','Copy the text below manually:'), data);
  }
}

/* ======================= 시작 ======================= */
try{ document.documentElement.lang = LANG; }catch(e){}
updateLangButton();
updateTopbarLabels();
updateDifficultyButton();
if(SFX.isMuted()){
  const mb = document.getElementById('muteBtn');
  if(mb) mb.textContent = '🔇';
}
const savedState = loadGame();
if(savedState){
  // 저장 복원이 실패하면 render까지 못 가서 화면이 통째로 빈 채 아무것도 못 하게 된다.
  // 그럴 바엔 저장을 버리고 타이틀에서 새로 시작하는 편이 낫다.
  try{
    state = migrateState(savedState);
    // 상점 슬롯은 저장 당시의 "식물 정의 사본"이라 이후 추가된 필드(nameEn 등)가 없다.
    // 살아있는 PLANTS 정의로 재연결해 도감/번역/밸런스 수정이 저장을 거쳐도 항상 최신이 되게 한다.
    if(Array.isArray(state.shop)) state.shop = state.shop.map(p => p ? (PLANTS[p.id] || p) : p);
    render();
  }catch(e){
    console.error('저장 복원 실패 — 저장을 버리고 타이틀로 돌아갑니다', e);
    try{ localStorage.removeItem(SAVE_KEY); }catch(_){}
    // restart()가 부르는 backupCurrentRun이 손상된 state를 "지난 판" 슬롯에 밀어넣지 않도록
    // 먼저 진행 없는 상태로 바꿔둔다 (hasRunProgress가 false가 되는 최소 형태).
    state = { wave: 1, team: [], phase: 'shop' };
    restart(); // onTitleScreen이 아직 true라 render()가 타이틀을 그린다
  }
} else {
  rollShop();
  render();
}
// 처음 온 사람에게만 도움말 1회 자동 표시 (닫으면 다시 안 뜸, ❓ 버튼으로 재열람 가능)
// localStorage를 못 읽는 샌드박스 환경이면 처음 온 사람일 가능성이 높으니 도움말을 보여주는 쪽으로 폴백.
let __seenGuide = false;
try{ __seenGuide = !!localStorage.getItem(HELP_SEEN_KEY); }catch(e){}
if(!__seenGuide){ openHelp(); }
