/* ======================= 상태 ======================= */
// 실제 값은 맨 위 BALANCE 조절판에서 수정한다 (아래는 기존 코드가 쓰는 별칭)
const BENCH_SIZE = BALANCE.BENCH_SIZE;
const BENCH_UNLOCK_COST = BALANCE.BENCH_UNLOCK_COST;
const MERGE_FEE = BALANCE.MERGE_FEE;

let state = {
  gold: BALANCE.START_GOLD,
  wave: 1,
  lives: BALANCE.START_LIVES,
  team: [],        // {plantId, atk, hp, maxHp}
  bench: new Array(BALANCE.BENCH_SIZE).fill(null),       // 전투에 참여하지 않는 예비 슬롯
  benchUnlocked: new Array(BALANCE.BENCH_SIZE).fill(false),
  shop: [],
  shopBonus: new Array(BALANCE.SHOP_SIZE).fill(0), // 민들레가 판매 시 상점 슬롯에 걸어주는 공격력 보너스 (슬롯별, 리롤하면 초기화)
  rerollCost: rerollCostForWave(1),
  phase: 'shop',   // shop | battling | reward | gameover
  lastLog: [],
  lastResult: null,
};

// 적 팀 구성용 풀. 상점은 이 함수를 쓰지 않는다(rollShopPlant가 PLANT_LIST를 직접 본다) —
// 그래서 playerOnly 필터를 여기 한 곳에만 걸면 "상점엔 나오고 적 팀엔 안 나온다"가 성립한다.
function poolForWave(wave){
  // 웨이브가 오를수록 높은 티어 등장
  const maxTier = Math.min(5, 1 + Math.floor(wave/BALANCE.TIER_UNLOCK_WAVES));
  return PLANT_LIST.filter(p=>p.tier<=maxTier && !p.playerOnly);
}

// 웨이브에 해당하는 티어 가중치 행을 찾는다 (BALANCE.TIER_ODDS)
function tierWeightsForWave(wave){
  const row = BALANCE.TIER_ODDS.find(r=>wave<=r.until);
  return row ? row.w : BALANCE.TIER_ODDS[BALANCE.TIER_ODDS.length-1].w;
}

// 상점 카드 1장 굴리기: 가중치로 티어를 정하고, 그 티어 안에서 균등 선택
function rollShopPlant(wave){
  // 웨이브 11+: 티어 무시, 전체 식물 균등 (BALANCE.FLAT_SHOP_FROM) — 큰손 보정 없는 실제 웨이브 기준
  if(wave >= BALANCE.FLAT_SHOP_FROM){
    return PLANT_LIST[Math.floor(Math.random() * PLANT_LIST.length)];
  }
  const weights = tierWeightsForWave(wave + (state.shopTierBoost||0)); // 큰손 특전: 더 좋은 티어 조기 등장
  let total = 0;
  weights.forEach(w=>{ total += w; });
  let r = Math.random() * total;
  let tier = 1;
  for(let t=1; t<=5; t++){
    r -= weights[t-1];
    if(r < 0){ tier = t; break; }
  }
  const cands = PLANT_LIST.filter(p=>p.tier===tier);
  return cands[Math.floor(Math.random()*cands.length)];
}

function rollShop(){
  if(!state.shopFrozen) state.shopFrozen = new Array(BALANCE.SHOP_SIZE).fill(false);
  const picks = [];
  const bonus = [];
  for(let i=0;i<BALANCE.SHOP_SIZE;i++){
    // 📌 찜한 슬롯은 카드(민들레 보너스 포함)를 그대로 유지 — 리롤·웨이브 전환 모두에서
    if(state.shopFrozen[i] && state.shop && state.shop[i]){
      picks.push(state.shop[i]);
      bonus.push((state.shopBonus && state.shopBonus[i]) || 0);
    } else {
      picks.push(rollShopPlant(state.wave));
      bonus.push(0);
      state.shopFrozen[i] = false;
    }
  }
  state.shop = picks;
  state.shopBonus = bonus;
}

function toggleFreeze(i){
  if(!state.shop[i]) return; // 매진 슬롯은 찜 불가
  if(!state.shopFrozen) state.shopFrozen = new Array(BALANCE.SHOP_SIZE).fill(false);
  state.shopFrozen[i] = !state.shopFrozen[i];
  SFX.reroll();
  render();
}

function freshInstance(plant, level, bonusAtk, bonusHp){
  level = level || 1;
  bonusAtk = bonusAtk || 0;
  bonusHp = bonusHp || 0;
  const stats = computeLeveledStats(plant, level);
  return {plantId: plant.id, level, atk: stats.atk + bonusAtk, hp: stats.hp + bonusHp, maxHp: stats.hp + bonusHp, bonusAtk, bonusHp};
}

// 기본 스탯(식물 원본 × 레벨 배율)을 다시 계산하되, 특전·상점 보너스(bonusAtk/bonusHp)는
// 보존해서 더한다. 합성·특전 적용 등 "스탯을 다시 만드는" 모든 지점은 이 함수를 거쳐야
// 보너스가 사라지지 않는다 (직접 stats를 대입하면 예전의 특전 증발 버그가 재발한다).
function recomputeUnitStats(unit){
  const stats = computeLeveledStats(PLANTS[unit.plantId], unit.level || 1);
  unit.bonusAtk = unit.bonusAtk || 0;
  unit.bonusHp  = unit.bonusHp  || 0;
  unit.atk   = stats.atk + unit.bonusAtk;
  unit.maxHp = stats.hp  + unit.bonusHp;
  unit.hp    = unit.maxHp; // 합성 시 풀회복 — 기존 동작 유지
  return unit;
}

// 정원 + 벤치의 모든 보유 유닛 (특전처럼 "내 전체 유닛"에 적용할 때 사용 — 벤치 누락 금지)
function allOwnedUnits(){
  return state.team.concat(state.bench.filter(Boolean));
}

function mergeFeeFor(nextLevel){
  return Math.max(0, (MERGE_FEE[nextLevel] || 0) - (state.mergeDiscount||0)); // 합성 특가 특전
}

function hasOpenMainSlot(){
  return state.team.length < BALANCE.TEAM_SIZE;
}

function openBenchSlotIndex(){
  return state.bench.findIndex((u,i)=> state.benchUnlocked[i] && !u);
}

// 메인 라인업 + 벤치를 통틀어, 지정한 유닛(excludeArr/excludeIndex)과 같은 식물+같은 레벨인
// "다른" 유닛을 찾는다. 합성은 플레이어가 버튼을 눌러야만 일어나므로 여기선 후보만 찾아준다.
function findMergePartner(plantId, level, excludeArr, excludeIndex){
  if(level>=MAX_LEVEL) return null;
  let idx = state.team.findIndex((u,i)=> u.plantId===plantId && u.level===level && !(excludeArr==='team' && i===excludeIndex));
  if(idx!==-1) return {arr:'team', index: idx};
  idx = state.bench.findIndex((u,i)=> u && u.plantId===plantId && u.level===level && !(excludeArr==='bench' && i===excludeIndex));
  if(idx!==-1) return {arr:'bench', index: idx};
  return null;
}

function showMergeToast(plant, fee, level){
  const el = document.createElement('div');
  el.className = 'merge-toast';
  el.textContent = T(`🔗 합성! (-${fee}골드) ${plant.emoji}${plant.name} Lv.${level} 완성`, `🔗 Merged! (-${fee} gold) ${plant.emoji}${L(plant,'name')} Lv.${level} complete`);
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('merge-toast-out'); }, 1300);
  setTimeout(()=>{ el.remove(); }, 1700);
}

// 플레이어가 "🔗 합성" 버튼을 눌렀을 때 실행된다. 클릭한 유닛(arr/index)이 파트너를 찾아
// 그 자리에서 레벨업하고, 파트너 쪽은 제거되어 빈 슬롯이 된다. 연쇄 합성은 자동으로 일어나지
// 않으며, 다음 합성 후보가 생기면 그것도 버튼으로 표시되어 다시 플레이어가 눌러야 한다.
function mergeUnitAt(arr, index){
  const unit = arr==='team' ? state.team[index] : state.bench[index];
  if(!unit) return;
  const partner = findMergePartner(unit.plantId, unit.level, arr, index);
  if(!partner) return;
  const nextLevel = unit.level + 1;
  const fee = mergeFeeFor(nextLevel);
  if(state.gold < fee) return;

  state.gold -= fee;
  SFX.merge();
  // 보너스 합산은 파트너를 제거하기 "전"에 읽어야 한다
  const partnerUnit = partner.arr==='team' ? state.team[partner.index] : state.bench[partner.index];
  unit.level = nextLevel;
  unit.bonusAtk = (unit.bonusAtk||0) + ((partnerUnit && partnerUnit.bonusAtk)||0);
  unit.bonusHp  = (unit.bonusHp ||0) + ((partnerUnit && partnerUnit.bonusHp )||0);
  const plant = PLANTS[unit.plantId];
  recomputeUnitStats(unit); // 특전·상점 보너스가 합성으로 사라지던 버그의 수리 지점

  if(partner.arr==='bench') state.bench[partner.index] = null;
  else state.team.splice(partner.index, 1);

  showMergeToast(plant, fee, nextLevel);
  render();
}

function clamp01(x){
  return Math.max(0, Math.min(1, x));
}

// 플레이어는 합성으로 레벨2/3까지 올라가는데 적이 영원히 레벨1이면 격차가 무한히 벌어지므로,
// 적도 웨이브가 오르면 레벨(★)이 함께 오르게 한다.
// 팀 전체가 한 웨이브에 동시에 레벨업하면 급격한 절벽이 생기므로,
// 유닛 하나하나가 독립적으로 확률을 굴려서 레벨2/3이 점진적으로 섞여 들어오게 한다.
function rollEnemyLevel(wave){
  const p2 = clamp01((wave-BALANCE.ENEMY_LV2_START)/BALANCE.ENEMY_LV2_RAMP);   // 웨이브6~12: 레벨2가 서서히 섞임
  const p3 = clamp01((wave-BALANCE.ENEMY_LV3_START)/BALANCE.ENEMY_LV3_RAMP);  // 웨이브14~20: 레벨3이 서서히 섞임
  const p4 = clamp01((wave-BALANCE.ENEMY_LV4_START)/BALANCE.ENEMY_LV4_RAMP);  // 무한모드: ★4 (웨이브26~)
  const p5 = clamp01((wave-BALANCE.ENEMY_LV5_START)/BALANCE.ENEMY_LV5_RAMP);  // 무한모드: ★5 (웨이브42~)
  const r = Math.random();
  if(r < p5) return 5;
  if(r < p4) return 4;
  if(r < p3) return 3;
  if(r < p2) return 2;
  return 1;
}

function shuffledCopy(arr){
  const out = arr.slice();
  for(let i=out.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function makeBossTeam(wave){
  // 보스 웨이브: 카운터 전용 유닛들을 한 팀에 배치.
  // 대열 순서는 매번 무작위로 섞는다 — 순서가 고정되면 어떤 유닛이 몇 번째로 나올지
  // 항상 똑같아서 매치업 자체가 완전히 결정론적이 되어버린다(승/패가 팀 조합만으로 매번 똑같이 갈림).
  // 첫 보스(클리어 목표)만 BALANCE.FIRST_BOSS로 완화한다 — 5종 풀구성+★3은 시뮬레이션 결과
  // 도달한 팀조차 승률 ~7%인 사실상 못 이기는 벽이었음 (밸런스리포트.md 참고). 이후 보스(30, 40…)는 풀구성.
  const isFirstBoss = wave === BALANCE.BOSS_START_WAVE;
  const list = shuffledCopy(ENEMY_ONLY_LIST);
  // 느긋하게(😌)에서는 첫 보스가 카운터 5종 중 랜덤 4종만 데려온다.
  // 5종 고정이면 무반격형이 매판 반드시 등장해 반사(창술가) 빌드가 보스전에서 항상 저격당함 —
  // 실데이터에서 12연패 중 10판이 선인장+장미 코어였음. 랜덤 4종이면 판마다 빠지는 카운터가 달라
  // 어떤 빌드든 "이번 보스는 해볼 만하다"가 20%씩 섞인다. 보통/어렵게는 5종 풀구성 유지.
  let counterN = isFirstBoss ? BALANCE.FIRST_BOSS.counters : list.length;
  const softened = isFirstBoss && difficultyMult() < 1;
  // 느긋하게 첫 보스는 아래에서 지원 유닛 2종(단풍·해바라기)을 추가로 붙인다.
  // 전투 슬롯은 TEAM_SIZE(5)뿐이므로 카운터는 3종까지만 — 3 카운터 + 2 지원 = 5로 맞춰
  // 6번째 유닛이 보드에 안 그려진 채 전투엔 참가하는 "유령 유닛" 버그를 막는다.
  if(softened) counterN = Math.min(counterN, BALANCE.TEAM_SIZE - (BALANCE.FIRST_BOSS.relaxedSupport ? BALANCE.FIRST_BOSS.relaxedSupport.length : 0));
  const picks = isFirstBoss ? list.slice(0, counterN) : list;
  const team = picks.map(plant => makeCounterInstance(plant, wave, true, isFirstBoss ? BALANCE.FIRST_BOSS.levelCap : undefined));
  // 첫 보스 밸런스 튜닝(시뮬레이션 기준): 카운터를 레벨2로 낮춘 뒤 스탯을 statMult배 되돌려
  // "레벨3=사실상 클리어 불가 / 레벨2=너무 쉬움"의 중간을 맞춘다. 지원 유닛은 제외.
  if(isFirstBoss && BALANCE.FIRST_BOSS.statMult){
    const sm = BALANCE.FIRST_BOSS.statMult;
    team.forEach(u=>{ u.atk = Math.max(1, Math.round(u.atk*sm)); u.hp = Math.round(u.hp*sm); u.maxHp = u.hp; });
  }
  // 느긋하게에서 카운터를 4종으로 줄인 보스는 몸집이 빈약해 웨이브 19보다 쉬워지는 역전이 생겼음
  // (실플레이 피드백). 마법사 지원 한 쌍을 붙여 "진짜 보스 팀"의 위압감을 주되, 무반격형은 여전히
  // 빠질 수 있어 창술가 배려는 유지된다. 지원 유닛에도 후반 스탯 램프를 적용(카운터와 동일 기준).
  if(softened && BALANCE.FIRST_BOSS.relaxedSupport){
    const ramp = enemyRampMult(wave);
    BALANCE.FIRST_BOSS.relaxedSupport.forEach(([id, lv])=>{
      const u = freshInstance(PLANTS[id], lv);
      u.atk = Math.round(u.atk * ramp); u.hp = Math.round(u.hp * ramp); u.maxHp = u.hp;
      team.push(u);
    });
    return shuffledCopy(team);
  }
  return team;
}

/* ======================= 난이도 설정 ======================= */
// 세션 내내 "쉽다↔어렵다"를 오가며 개별 수치를 흔드는 대신, 플레이어가 직접 고른다.
// 적 전체 스탯에 곱해지는 단일 배율 — 튜닝된 개별 수치는 그대로 두고 위에 얇게 얹는다.
const DIFFICULTY = {
  relaxed: {emoji:'😌', name:'느긋하게', nameEn:'Relaxed', mult:1.05}, // 1.06→1.05 (2026-08-10): 운빨 식물 2종이 상점 풀을 희석해 18.1%→15.2%로 내려간 것을 되돌림. 1.05와 1.04 사이가 반올림 절벽이다(합산 16.6% vs 21.2%, +4.5pp) — 1.04도 밴드(15~23) 안이지만 상단에 붙어서 1.05를 골랐다. 이력은 밸런스리포트 13·15·16·18절
  normal:  {emoji:'⚔️', name:'보통',     nameEn:'Normal',  mult:1.16}, // 유지 (2026-08-10 재확인): 운빨 식물로 8.7%→6.6%로 내려갔지만 이 구간은 손잡이가 평평하다 — 1.15/1.14/1.13 = 7.8/7.4/7.9%(n=1000)로 차이가 노이즈고, 1.15를 n=2000×2로 확정하니 6.65%로 1.16(6.4%)과 구별되지 않았다. 재현 안 되는 이동을 쫓아 값을 옮기지 않는다. 밴드(5~10) 안이다
  hard:    {emoji:'🔥', name:'어렵게',   nameEn:'Hard',    mult:1.25}, // 1.15→1.25 (2026-08): 균등화 재조정. 최신 실측 2.2%(목표 1~4%, 봇 3000판). 배율-클리어율 곡선은 적 스탯 반올림 때문에 계단형이라 미세조정이 안 먹는 구간이 있음. 아래는 이전 튜닝 메모.
                               // 5인 벽 부활안(w17)은 봇 실측에서 "보스 전 절벽+보스 김빠짐" 재현이라 기각, 배율 단독 상향이
                               // 페이싱 모양(보스=최난)을 유지: 봇 클리어 0.2%, 보스 승률 5.6%. 여전히 쉬우면 1.25, 벽 같으면 1.13
};
const DIFFICULTY_ORDER = ['relaxed','normal','hard'];
function loadDifficulty(){
  try{ const d = localStorage.getItem('plantFightDifficulty'); return DIFFICULTY[d] ? d : 'normal'; }catch(e){ return 'normal'; }
}
function difficultyMult(){ return DIFFICULTY[loadDifficulty()].mult; }
// 적 팀 전체(일반·카운터·보스 공통)의 최종 스탯에 난이도 배율을 곱한다.
function scaleTeamDifficulty(team){
  const m = difficultyMult();
  if(m === 1) return team;
  team.forEach(u=>{
    u.atk = Math.max(1, Math.round(u.atk * m));
    u.hp = Math.round(u.hp * m);
    u.maxHp = u.hp;
  });
  return team;
}
function cycleDifficulty(){
  const cur = loadDifficulty();
  const next = DIFFICULTY_ORDER[(DIFFICULTY_ORDER.indexOf(cur)+1) % DIFFICULTY_ORDER.length];
  try{ localStorage.setItem('plantFightDifficulty', next); }catch(e){}
  SFX.reroll();
  updateDifficultyButton();
}
function updateDifficultyButton(){
  const b = document.getElementById('diffBtn');
  if(b){ const d = DIFFICULTY[loadDifficulty()]; b.textContent = d.emoji; b.title = T(`난이도: ${d.name} (눌러서 변경 — 다음 전투부터 적용)`, `Difficulty: ${L(d,'name')} (tap to change — applies from the next battle)`); }
}

/* ======================= 고스트전: "과거의 나"와 싸우기 ======================= */
// 서버 없이 SAP식 미러 매치를 낸다. 전투 시작마다 현재 팀+웨이브를 스냅샷으로 저장하고,
// 다음 판(다른 런)의 비슷한 웨이브에서 일정 확률로 "과거의 내 정원"이 적으로 소환된다.
// 고스트 기록: 예전에는 "과거의 내 정원"이 적으로 나오는 고스트전에도 쓰였지만,
// 잘 큰 판이 적으로 걸리면 손쓸 도리 없이 지는 경우가 많아 2026-08 고스트전은 삭제했다.
// 지금은 "유령 기록에서 런 복구"(recoverFromGhosts) 안전망 전용 저장소다.
const GHOST_KEY = 'plantFightGhosts_v1';
function loadGhosts(){ try{ return JSON.parse(localStorage.getItem(GHOST_KEY)) || []; }catch(e){ return []; } }
function nextRunSeq(){
  let n = 0;
  try{ n = parseInt(localStorage.getItem('plantFightRunSeq')||'0',10) || 0; }catch(e){}
  n += 1;
  try{ localStorage.setItem('plantFightRunSeq', String(n)); }catch(e){}
  return n;
}
// 전투 직전 현재 팀을 고스트 풀에 기록 (최근 40개 롤링). 실제 플레이에서만 호출된다.
function saveGhostSnapshot(){
  if(!state.team || state.team.length === 0) return;
  const ghosts = loadGhosts();
  ghosts.push({ seq: state.runSeq || 0, wave: state.wave, units: state.team.map(u=>({p:u.plantId, l:u.level||1})) });
  while(ghosts.length > 40) ghosts.shift();
  try{ localStorage.setItem(GHOST_KEY, JSON.stringify(ghosts)); }catch(e){}
}
function makeEnemyTeam(wave, targetTeam){
  // targetTeam: 카운터 선택이 노릴 팀 (기본은 플레이어 팀 — 시뮬레이션에서는 봇 팀을 넘긴다)
  const scoutTarget = targetTeam || state.team;
  if(isBossWave(wave)){
    // 안전장치: 적 팀은 보드 슬롯 수(TEAM_SIZE)를 절대 넘지 않는다 — 넘으면 6번째부터
    // 화면에 안 뜨는데 전투엔 참가하는 유령 유닛이 된다.
    return scaleTeamDifficulty(makeBossTeam(wave)).slice(0, BALANCE.TEAM_SIZE);
  }
  const pool = poolForWave(wave);
  // 티어 상승(poolForWave, 2웨이브마다)보다 적 인원 증가를 더 늦춰서(6웨이브당 +1)
  // "티어 만렙 + 인원 만석"이 겹치는 절벽을 완화한다. 프리보스는 4인이 상한이고
  // 5인 만석은 엔드리스(w20+)부터다 — 상세는 BALANCE.ENEMY_COUNT_GROWTH_WAVES 주석.
  const count = Math.min(BALANCE.TEAM_SIZE, BALANCE.ENEMY_BASE_COUNT + Math.floor(Math.max(0, wave-2)/BALANCE.ENEMY_COUNT_GROWTH_WAVES));
  let team;
  if(wave >= BALANCE.ENEMY_COMP_START){
    // 후반: 아키타입 기반 "짜여진 조합" (시너지 보장 + 탱커 전방)
    team = makeArchetypeTeam(wave, count);
  } else {
    team = [];
    for(let i=0;i<count;i++){
      const p = pool[Math.floor(Math.random()*pool.length)];
      team.push(freshInstance(p, rollEnemyLevel(wave)));
    }
  }
  // era(10웨이브 단위)가 오를수록 강제로 섞이는 카운터 전용 유닛 개수가 늘어난다
  // (웨이브11~19:1개, 21~29:2개, 31~39:3개, 41~49개 이상:4개). 웨이브10 이하는 기존처럼 카운터 없음.
  // 종류는 중복 없이 무작위로 고르고, 어느 슬롯에 들어갈지도 무작위다.
  // 후반 스탯 램프: 일반 유닛에 적용 (카운터 유닛은 makeCounterInstance에서 자체 적용)
  const ramp = enemyRampMult(wave);
  if(ramp > 1){
    team.forEach(u=>{
      u.atk = Math.round(u.atk * ramp);
      u.hp = Math.round(u.hp * ramp);
      u.maxHp = u.hp;
    });
  }
  const counterCount = Math.min(guaranteedCounterCount(wave), team.length);
  if(counterCount>0){
    // 무작위 대신 "정찰": 플레이어 조합의 약점을 노리는 카운터를 가중 추첨으로 선택.
    // 아키타입 코어(_core, 시너지 담당)가 아닌 슬롯부터 교체해 조합 의도를 보존한다.
    const chosenCounters = pickCountersFor(scoutTarget, counterCount);
    const slotIdxs = shuffledCopy(team.map((_,i)=>i))
      .sort((a,b)=>(team[a]._core?1:0)-(team[b]._core?1:0))
      .slice(0, counterCount);
    chosenCounters.forEach((plant, i)=>{
      team[slotIdxs[i]] = makeCounterInstance(plant, wave, false);
    });
  }
  return scaleTeamDifficulty(team);
}

/* ======================= 트리거 로직 ======================= */
function applyOnBuy(instance){
  const plant = PLANTS[instance.plantId];
  if(plant.trigger === 'onBuy'){
    const others = state.team.filter(u=>u!==instance);
    if(others.length>0){
      const amt = Math.round(1 * levelMult(instance.level||1));
      const t = others[Math.floor(Math.random()*others.length)];
      // 스탯을 직접 더하면 recomputeUnitStats가 지운다 — bonusHp에 실어 합성·특전 재계산을 견디게 한다.
      t.bonusHp = (t.bonusHp||0) + amt;
      recomputeUnitStats(t);
    }
  }
}

function applyOnSell(instance){
  const plant = PLANTS[instance.plantId];
  if(plant.trigger === 'onSell'){
    // 상점의 실제로 채워진(매진 아닌) 무작위 슬롯에 공격력 보너스를 걸어둔다.
    // 슬롯이 팔리거나 리롤되면 사라지는 임시 버프 — PLANTS 공유 템플릿 자체는 건드리지 않는다.
    const filledSlots = state.shop.map((p,i)=>p?i:-1).filter(i=>i!==-1);
    if(filledSlots.length>0){
      const amt = Math.round(1 * levelMult(instance.level||1));
      const idx = filledSlots[Math.floor(Math.random()*filledSlots.length)];
      state.shopBonus[idx] = (state.shopBonus[idx]||0) + amt;
    }
  }
}

/* ======================= 전투 시뮬레이션 ======================= */
function cloneTeamForBattle(team){
  return team.map(u=>({...u, alive:true}));
}

function firstAlive(team){
  return team.find(u=>u.alive && u.hp>0);
}

// 카운터 유닛(반사방패)의 dmgShield를 감안한 공용 데미지 적용 함수.
// 대상에게 _dmgShield가 남아있으면 피해를 무효화하고 공격자에게 (era/보스에 비례해 미리 계산된)
// _reflectMult 배율만큼 반사한 뒤 방패를 소모한다. 그 외에는 기존과 동일하게 그냥 hp를 깎는다.
// (기존 12종 유닛은 _dmgShield/_reflectMult가 없으므로 계산 결과는 그대로 동일)
function dealDamage(target, amount, attacker, log){
  if(target._dmgShield){
    target._dmgShield = false;
    const mult = target._reflectMult || 2;
    const reflected = Math.round(amount * mult);
    const defName = pn(target);
    if(attacker){
      attacker.hp -= reflected;
      const atkName = pn(attacker);
      log.push(T(`  🪞 반사방패 발동! ${defName}이(가) 일격을 튕겨내 ${atkName}에게 ${mult}배(${reflected})로 돌려준다!`,`  🪞 Mirror shield! ${defName} deflects the blow and returns it to ${atkName} at ${mult}× (${reflected})!`));
    } else {
      log.push(T(`  🪞 반사방패가 번쩍! ${defName}이(가) 피해를 깔끔하게 흘려낸다!`,`  🪞 The mirror shield flashes! ${defName} sheds the damage clean off!`));
    }
    return;
  }
  // 갈대의 보호막(_shield): 피해를 수치만큼 흡수하고 소모된다
  if(target._shield > 0 && amount > 0){
    const absorbed = Math.min(target._shield, amount);
    target._shield -= absorbed;
    amount -= absorbed;
  }
  // 대나무의 견고(_guardStacks): 보호막처럼 받을 피해를 총량만큼 흡수하고, 막은 만큼 소모된다
  // (기존엔 "타격당 1 감소"였으나, 유닛이 한 전투에서 몇 대밖에 안 맞아 12를 쌓아도 2~3만 쓰여
  //  수호자 값을 못 했다. 총량 흡수로 바꿔 쌓은 만큼 실제로 막아내게 함 — 플레이어 직관과 일치)
  if(target._guardStacks > 0 && amount > 0){
    const absorbed = Math.min(target._guardStacks, amount);
    target._guardStacks -= absorbed;
    amount -= absorbed;
  }
  target.hp -= amount;
}

// 유닛 하나의 사망을 확정 처리하고(alive=false + 💀 로그), onFaint(버섯)/onFaintCurse(역병균)/
// onAllyFaint(다육이) 데스 트리거를 발동한다. 전투시작 페이즈의 즉사와 근접교전 사망 양쪽에서
// 공용으로 호출해서, "죽었지만 트리거가 안 발동하는" 케이스가 생기지 않게 한다.
// 역병균의 저주가 상대를 추가로 죽이면 그 유닛에 대해 재귀 호출하지만, 맨 위 가드가 유닛마다
// 딱 한 번만 처리되게 막아주므로(alive===false면 즉시 반환) 무한 루프는 구조적으로 불가능하다
// — 최대 재귀 깊이는 전체 유닛 수(최대 10)로 자연히 상한이 걸린다.
function processDeath(unit, team, opp, log){
  if(unit.alive===false || unit.hp>0) return;
  unit.alive = false;
  const plant = getPlantDef(unit.plantId);
  const uMult = levelMult(unit.level||1);
  log.push(T(`  💀 ${pn(plant)}, 힘없이 쓰러진다…`,`  💀 ${pn(plant)} crumples to the ground…`));
  if(plant.trigger==='onFaint' && plant.id==='mushroom'){
    const amt = Math.round(1*uMult);
    team.forEach(a=>{ if(a.alive && a.hp>0){ a.atk+=amt; a.hp+=amt; a.maxHp+=amt; }});
    log.push(T(`  🍄 버섯의 마지막 선물, 포자 폭발! 남은 아군 전체 공격+${amt}/체력+${amt}!`,`  🍄 Mushroom's parting gift — spore burst! Remaining allies +${amt} ATK/+${amt} HP!`));
  }
  if(plant.trigger==='onFaint' && plant.id==='pine'){
    const amt = Math.round(2*uMult);
    team.forEach(a=>{ if(a.alive && a.hp>0){ a.hp+=amt; a.maxHp+=amt; }});
    log.push(T(`  🌲 소나무가 쓰러지며 사시사철 푸른 기운을 남긴다! 남은 아군 체력+${amt}!`,`  🌲 Pine falls, leaving its evergreen spirit behind! Remaining allies +${amt} HP!`));
  }
  if(plant.trigger==='onFaintCurse' && plant.id==='plagueSpore'){
    const amt = unit._curseAmt || 1;
    opp.forEach(a=>{ if(a.alive && a.hp>0){ a.atk=Math.max(0,a.atk-amt); a.hp-=amt; } });
    log.push(T(`  ☠️ 역병균이 스러지며 저주를 흩뿌린다! 상대 팀 전체 공격-${amt}/체력-${amt}!`,`  ☠️ Plaguespore scatters its curse as it dies! Opposing team -${amt} ATK/-${amt} HP!`));
    // 저주로 죽는 유닛도 자신의 데스 트리거가 정상 발동하도록 재귀 처리
    opp.forEach(a=>{ if(a.hp<=0) processDeath(a, opp, team, log); });
  }
  team.forEach(a=>{
    const ap = getPlantDef(a.plantId);
    if(a.alive && a.hp>0 && ap.trigger==='onAllyFaint' && ap.id==='succulent'){
      const amt = Math.round(2*levelMult(a.level||1));
      a.hp+=amt; a.maxHp+=amt;
      log.push(T(`  🪴 다육이가 이를 악물고 버틴다! 체력+${amt}!`,`  🪴 Succulent grits its teeth and holds on! +${amt} HP!`));
    }
  });
}

/* ======================= 역할 시너지 ======================= */
// 팀의 역할별 마릿수를 센다. (벤치는 전투에 안 나가므로 여기 안 들어옴)
function countRoles(team){
  const counts = {};
  team.forEach(u=>{
    if(!u) return;
    const def = getPlantDef(u.plantId);
    if(def && def.role) counts[def.role] = (counts[def.role]||0)+1;
  });
  return counts;
}

// 전투 시작 시 발동하는 역할 시너지. 효과는 전투용 복사본에만 적용된다(영구 아님).
// side: 'p'(내 정원) | 'e'(적) — 발동 수를 반환해 업적 판정(텍스트 검사 대신 카운트)에 쓴다.
function applyRoleSynergies(team, log, side){
  const counts = countRoles(team);
  let fired = 0;
  Object.entries(counts).forEach(([role, n])=>{
    const syn = BALANCE.ROLE_SYNERGY[role];
    if(!syn || n < syn.need) return;
    const targets = syn.scope==='all' ? team : team.filter(u=>getPlantDef(u.plantId).role===role);
    targets.forEach(u=>{
      u.atk += syn.atk;
      u.hp += syn.hp;
      if(u.maxHp !== undefined) u.maxHp += syn.hp;
    });
    fired += 1;
    const sideName = side==='p' ? T('내 정원','My Garden') : T('야생 무리','the wild mob');
    log.push(T(`⚜️ ${sideName}에 ${role} 시너지 「${syn.name}」 발동! ${syn.desc} (${role} ×${n})`,`⚜️ ${roleName(role)} synergy "${L(syn,'name')}" triggers for ${sideName}! ${L(syn,'desc')} (${roleName(role)} ×${n})`));
  });
  return fired;
}

function simulateBattle(playerTeamRaw, enemyTeamRaw, log){
  const p = cloneTeamForBattle(playerTeamRaw);
  const e = cloneTeamForBattle(enemyTeamRaw);

  // log에 텍스트뿐 아니라 그 시점의 양 팀 상태 스냅샷도 함께 담아서,
  // 전투 재생(reveal) 시 카드에 실시간으로 데미지/사망을 반영할 수 있게 한다.
  const rawPush = Array.prototype.push.bind(log);
  // atk: 이 로그 줄에서 실제로 공격하는 쪽('p'/'e'). 교전 줄에만 넘겨 연출 방향(누가 치는지)에 쓴다.
  log.push = (text, atk) => rawPush({
    text, atk,
    p: p.map(u=>({...u})),
    e: e.map(u=>({...u})),
  });

  // 카운터 전용 유닛: 방패 충전 횟수(_shieldCharges)/반사 배율(_reflectMult)/저주량(_curseAmt)/
  // 정화량(_cleanseAmt, _cleanseCap)/역공 여부(_counterAttack)는 makeCounterInstance()가 생성 시점에
  // era·보스 여부에 맞춰 이미 계산해 인스턴스에 심어뒀다 (cloneTeamForBattle의 스프레드 복사로 그대로
  // 넘어옴). 여기서 새로 초기화할 필요 없이 아래 로직에서 바로 읽으면 된다.

  // onBattleStart 트리거 (효과 수치는 해당 유닛의 레벨에 비례해 커진다)
  function runBattleStart(team, opp){

    // 토마토/파리지옥: 몇 장을 데려오든 전투당 한 번만 발동 (장당 중첩 방지). 가장 레벨이 높은 개체 기준으로 수치 계산.
    // 생존 체크 필수: runBattleStart(p,e) 단계에서 파리지옥/단풍나무가 opp를 저격해 죽일 수 있는데,
    // 그 다음에 호출되는 runBattleStart(e,p)에서 이미 죽은 유닛이 자기 트리거를 또 발동하면 안 된다.
    const tomatoes = team.filter(u=>u.plantId==='tomato' && u.alive!==false && u.hp>0);
    if(tomatoes.length){
      const bestLevel = Math.max(...tomatoes.map(u=>u.level||1));
      // ★3은 전체 과녁이라 감소량 -3이 개막에 적 딜을 통째로 무력화(보스 지배 +10%p) → ★3만 -2로 완화(전체 타격은 유지)
      const amt = bestLevel>=3 ? 2 : Math.round(1 * levelMult(bestLevel));
      // 레벨 비례 과녁 (밸런스리포트 9~10절: 광역 오라가 가치의 전부라 지배 전략이 됨 → 레벨로 성장):
      // ★1·★2 = 가장 강한 적 1마리, ★3 = 적 전체. 밸런스감사(2026-07-10, 16,880판)에서 ★2 과녁 2마리로도
      // 보스 밴드 +20.8%p 지배가 확인돼 예약해둔 1차 후퇴(2→1) 발동 — 후반 지배력 -6%p 검증됨.
      const aliveOpp = opp.filter(o=>o.alive!==false && o.hp>0);
      const targets = bestLevel>=3 ? aliveOpp
        : aliveOpp.slice().sort((a,b)=>b.atk-a.atk).slice(0, 1);
      targets.forEach(o=>{
        if(o._shieldCharges > 0){
          o._shieldCharges--;
          const remain = o._shieldCharges===Infinity ? '∞' : o._shieldCharges;
          log.push(T(`  🛡️ ${pn(o)}이(가) 꿈쩍도 안 한다! 디버프 완벽 차단! (남은 방패 ${remain})`,`  🛡️ ${pn(o)} doesn't even flinch! Debuff fully blocked! (${remain} shield${remain===1?'':'s'} left)`));
        } else {
          o.atk = Math.max(0, o.atk-amt);
        }
      });
      const targetDesc = bestLevel>=3 ? T('적 전체','ALL enemies') : T(`가장 강한 적 ${targets.length}마리`,`the strongest enemy`);
      log.push(T(`🍅 토마토가 펑! 붉은 과즙 세례에 ${targetDesc}의 공격력이 ${amt}만큼 뚝 떨어진다!`,`🍅 Tomato goes SPLAT! A juicy red shower drops the ATK of ${targetDesc} by ${amt}!`));
    }
    // 클로버(재설계 2026-07-10): 전투 시작 시 무작위 아군 레벨수만큼 공+2/체+2.
    // 토마토와 동일하게 전투당 한 번만 발동(장당 중첩 방지, 최고 레벨 기준) — 중첩 허용 시
    // 삼중스택(★3×3)이 검사트리플+토마토를 넘는 새 필승공식이 됨(어렵게 400판 실측 96.3% vs 91.3%).
    const clovers = team.filter(u=>u.plantId==='clover' && u.alive!==false && u.hp>0);
    if(clovers.length){
      const bestLevel = Math.max(...clovers.map(u=>u.level||1));
      const cnt = Math.max(1, Math.min(5, Math.round(bestLevel)));
      const pool = team.filter(a=>a.alive!==false && a.hp>0);
      const picks = [];
      for(let k=0; k<cnt && pool.length; k++){
        picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
      }
      picks.forEach(a=>{ a.atk += 2; a.hp += 2; a.maxHp += 2; });
      if(picks.length) log.push(T(`🍀 클로버가 네잎의 행운을 나눠준다! 무작위 아군 ${picks.length}명 공격+2·체력+2!`,`🍀 Clover deals out four-leaf luck! ${picks.length} random all${picks.length===1?'y gets':'ies get'} +2 ATK/+2 HP!`));
    }
    // 민들레(재설계 2026-07-14, B안 '개막 홀씨'): 전투 시작 시 무작위 적 1마리 공격-1 (레벨 비례).
    // 토마토(최강 적 과녁·전투당 1회)와 달리 무작위 과녁에 장당 발동 — T1 스팸 유닛다운 잔펀치.
    // 면역종의 디버프 방패(_shieldCharges)는 토마토와 동일한 규칙으로 소모시킨다.
    team.filter(u=>u.plantId==='dandelion' && u.alive!==false && u.hp>0).forEach(u=>{
      const aliveOpp = opp.filter(o=>o.alive!==false && o.hp>0);
      if(!aliveOpp.length) return;
      const amt = Math.round(1 * levelMult(u.level||1));
      const t = aliveOpp[Math.floor(Math.random()*aliveOpp.length)];
      if(t._shieldCharges > 0){
        t._shieldCharges--;
        const remain = t._shieldCharges===Infinity ? '∞' : t._shieldCharges;
        log.push(T(`  🛡️ ${pn(t)}이(가) 홀씨를 툭 털어낸다! 디버프 차단! (남은 방패 ${remain})`,`  🛡️ ${pn(t)} brushes the seeds right off! Debuff blocked! (${remain} shield${remain===1?'':'s'} left)`));
      } else {
        t.atk = Math.max(0, t.atk - amt);
        log.push(T(`🌼 민들레 홀씨가 ${pn(t)}의 눈앞을 뿌옇게 가린다! 공격력 -${amt}!`,`🌼 Dandelion seeds cloud ${pn(t)}'s eyes! ATK -${amt}!`));
      }
    });
    const flytraps = team.filter(u=>u.plantId==='flytrap' && u.alive!==false && u.hp>0);
    if(flytraps.length){
      const alive = opp.filter(o=>o.alive && o.hp>0);
      if(alive.length){
        const bestLevel = Math.max(...flytraps.map(u=>u.level||1));
        const dmg = Math.round(3 * levelMult(bestLevel));
        const target = alive.reduce((a,b)=> a.hp<b.hp? a:b);
        const targetName = pn(target);
        dealDamage(target, dmg, flytraps[0], log);
        log.push(T(`🪤 철컥! 파리지옥이 ${targetName}을(를) 통째로 덮친다! ${dmg}데미지!`,`🪤 SNAP! Flytrap swallows ${targetName} whole! ${dmg} damage!`));
      }
    }
    team.forEach(u=>{
      if(u.alive===false || u.hp<=0) return; // 이미 죽은 유닛은 전투시작 트리거를 발동하지 않는다
      const plant = getPlantDef(u.plantId);
      const mult = levelMult(u.level||1);
      if(plant.trigger==='onBattleStart'){
        if(plant.id==='weed'){
          const allyCount = team.filter(x=>x!==u && x.alive!==false && x.hp>0).length;
          const amt = Math.round(allyCount * mult);
          u.atk += amt;
          log.push(T(`🌿 잡초가 든든한 아군 ${allyCount}마리를 등에 업고 기세등등! (공격력 +${amt})`,`🌿 Weed struts tall with ${allyCount} all${allyCount===1?'y':'ies'} at its back! (+${amt} ATK)`));
        } else if(plant.id==='maple'){
          const alive = opp.filter(o=>o.alive && o.hp>0);
          if(alive.length){
            const target = alive[Math.floor(Math.random()*alive.length)];
            const dmg = Math.round(2 * mult);
            const targetName = pn(target);
            dealDamage(target, dmg, u, log);
            log.push(T(`🍁 빙글빙글 날아간 단풍 씨앗, ${targetName}에게 정확히 명중! ${dmg}데미지!`,`🍁 A whirling maple seed lands square on ${targetName}! ${dmg} damage!`));
          }
        } else if(plant.id==='sunflower'){
          const amt = Math.round(1 * mult);
          // 생존자만 힐 (느티나무와 동일 가드). 가드 없으면 전투시작 반사 등으로 hp<=0이 된
          // "아직 사망 처리 전" 유닛을 힐로 되살려 데스 트리거 없이 부활하는 버그가 생긴다.
          team.forEach(a=>{ if(a.alive!==false && a.hp>0){ a.hp += amt; a.maxHp += amt; } });
          log.push(T(`🌻 해바라기의 눈부신 광합성! 따스한 햇살로 아군 전체 체력+${amt}!`,`🌻 Sunflower's dazzling photosynthesis! Warm rays give all allies +${amt} HP!`));
        } else if(plant.id==='elm'){
          const amt = Math.round(1 * mult);
          team.forEach(a=>{ if(a.alive!==false && a.hp>0){ a.hp += amt; a.maxHp += amt; } });
          log.push(T(`🌳 느티나무의 너른 그늘이 정원을 덮는다! 아군 전체 체력+${amt}!`,`🌳 Zelkova's broad shade covers the garden! All allies +${amt} HP!`));
        } else if(plant.id==='reed'){
          const front = firstAlive(team);
          if(front){
            const amt = Math.round(2 * mult);
            front._shield = (front._shield||0) + amt;
            log.push(T(`🌾 갈대가 ${pn(front)} 앞에 바람막이를 세운다! 보호막 ${amt}`,`🌾 Reed raises a windbreak in front of ${pn(front)}! Shield ${amt}`));
          }
        } else if(plant.id==='balsam'){
          // 운빨 2종: 전투마다 한 번 굴린다. 대입(=)이 아니라 누적(+=)이어야
          // 특전 보너스(bonusAtk)가 살아남는다. 꽝도 로그를 남긴다 — 도박꾼은 꽝이 곧 사건이다.
          if(Math.random() < 0.30){
            const amt = Math.round(8 * mult);
            u.atk += amt;
            log.push(T(`🌸 봉선화 꼬투리가 팡! 터졌다! (공격력 +${amt})`,`🌸 The balsam pod bursts open! (+${amt} ATK)`));
          } else {
            log.push(T(`🌸 봉선화 꼬투리를 건드렸지만… 조용하다.`,`🌸 You brush the balsam pod… nothing.`));
          }
        } else if(plant.id==='watermelon'){
          if(Math.random() < 0.50){
            const amt = Math.round(12 * mult);
            u.hp += amt; u.maxHp += amt;   // maxHp를 빼먹으면 현재체력이 최대치를 넘어 표시가 깨진다
            log.push(T(`🍉 수박을 쩍 갈랐더니 새빨간 속이 꽉! (체력 +${amt})`,`🍉 The watermelon splits open — packed and ripe! (+${amt} HP)`));
          } else {
            log.push(T(`🍉 수박을 갈라보니… 허옇게 설익었다.`,`🍉 The watermelon splits open… pale and unripe.`));
          }
        }
      }
    });
    // 사망 처리 (전투시작 효과로 죽는 경우) — processDeath로 데스 트리거/로그까지 정상 발동시킨다.
    team.forEach(u=>{ if(u.hp<=0) processDeath(u, team, opp, log); });
    opp.forEach(u=>{ if(u.hp<=0) processDeath(u, opp, team, log); });
  }

  log.push(T(`⚔️ 정원에 전운이 감돈다… 전투 개시!`,`⚔️ Storm clouds over the garden… battle begins!`));
  const pSynergies = applyRoleSynergies(p, log, 'p');
  applyRoleSynergies(e, log, 'e');
  runBattleStart(p, e);
  runBattleStart(e, p);

  // 한 유닛의 공격 한 번을 처리한다 (2026-07-17 턴제 교대). side='p'면 아군 선두가 적 선두를,
  // 'e'면 반대. 공격→수비측 반사(가시)·대나무→공격측 포도덩굴→사망까지 이 안에서 끝낸다.
  // 턴 사이에 사망을 처리하므로 "나 한 대 너 한 대"가 된다(적을 죽여도 다음 적이 곧바로 반격).
  function doTurn(side){
    const pu = firstAlive(p), eu = firstAlive(e);
    if(!pu || !eu) return;
    const A = side==='p' ? p : e;      // 공격 팀
    const D = side==='p' ? e : p;      // 수비 팀
    const au = side==='p' ? pu : eu;   // 공격 유닛(선두)
    const du = side==='p' ? eu : pu;   // 수비 유닛(선두)
    const aPlant = getPlantDef(au.plantId);
    const dPlant = getPlantDef(du.plantId);
    const pPlant = getPlantDef(pu.plantId);
    const ePlant = getPlantDef(eu.plantId);
    const aMult = levelMult(au.level||1);
    const dMult = levelMult(du.level||1);
    const defenderIsEnemy = (side==='p'); // 아군 턴이면 수비수가 적
    const burn = (aPlant.trigger==='onAttack' && aPlant.id==='chili') ? Math.round(1*aMult) : 0;
    const dmg = Math.max(1, au.atk) + burn; // 공격력 0이어도 몸싸움 최소 1
    const scuffle = (au.atk<=0) ? T(' · 🤜 공격력 0이어도 몸싸움으로 최소 1!',' · 🤜 Even at 0 ATK, scuffling deals at least 1!') : '';
    // 교전 줄: 표기는 늘 아군(좌)·적(우), atk로 이번에 치는 쪽을 넘겨 연출 방향을 정한다
    log.push(T(`${pn(pPlant)}(공${pu.atk}/체${pu.hp}) ⚔️ ${pn(ePlant)}(공${eu.atk}/체${eu.hp})${scuffle}`,`${pn(pPlant)}(A${pu.atk}/H${pu.hp}) ⚔️ ${pn(ePlant)}(A${eu.atk}/H${eu.hp})${scuffle}`), side);
    // 공격 (반사방패 dmgShield 있으면 무효화+반사로 대체됨)
    dealDamage(du, dmg, au, log);
    // 공격측 포도덩굴: 공격 시 무작위 아군에게 힘 나눔
    if(aPlant.id==='grapevine'){
      const allies = A.filter(x=>x!==au && x.alive && x.hp>0);
      if(allies.length){
        const t = allies[Math.floor(Math.random()*allies.length)];
        const amt = Math.round(1*aMult); t.atk += amt;
        log.push(side==='p'
          ? T(`  🍇 포도덩굴이 ${pn(t)}에게 힘을 나눠준다! 공격+${amt}`,`  🍇 Grapevine shares its strength with ${pn(t)}! +${amt} ATK`)
          : T(`  🍇 적 포도덩굴이 ${pn(t)}에게 힘을 나눠준다! 공격+${amt}`,`  🍇 The enemy Grapevine shares its strength with ${pn(t)}! +${amt} ATK`));
      }
    }
    // 수비측 대나무: 얻어맞으며 바로 뒤 아군에게 견고 부여
    if(dPlant.id==='bamboo' && dmg>0){
      const idx = D.indexOf(du);
      const behind = D.slice(idx+1).find(x=>x.alive && x.hp>0);
      if(behind){
        const amt = Math.round(1*dMult); behind._guardStacks = (behind._guardStacks||0) + amt;
        log.push(defenderIsEnemy
          ? T(`  🎋 적 대나무가 버텨선다! 뒤의 ${pn(behind)}에게 견고+${amt}`,`  🎋 The enemy Bamboo stands firm! ${pn(behind)} behind it gains Sturdy +${amt}`)
          : T(`  🎋 대나무가 버텨선다! 뒤의 ${pn(behind)}에게 견고+${amt}`,`  🎋 Bamboo stands firm! ${pn(behind)} behind it gains Sturdy +${amt}`));
      }
    }
    // 수비측 onHit 반사(가시). 공격자가 무반격형(ignoresReflect)이면 반격 무효(+역공 가능).
    if(dPlant.trigger==='onHit'){
      if(aPlant.trigger==='ignoresReflect'){
        log.push(T(`  🗡️ ${pn(aPlant)}의 일격은 반격을 허용하지 않는다!`,`  🗡️ ${pn(aPlant)}'s strike allows no counterattack!`));
        if(au._counterAttack){
          const counterDmg = au.atk; dealDamage(du, counterDmg, au, log);
          log.push(T(`  ⚡ 역공! 반격을 무시하고 카운터를 꽂는다! ${counterDmg}데미지!`,`  ⚡ Riposte! It ignores the thorns and lands a counter! ${counterDmg} damage!`));
        }
      } else {
        if(dPlant.id==='cactus'){
          const rdmg = Math.round(2*dMult); dealDamage(au, rdmg, du, log);
          log.push(defenderIsEnemy
            ? T(`  🌵 적 선인장이 가시를 곤두세운다! 따끔한 반격 ${rdmg}데미지!`,`  🌵 The enemy Cactus bristles its spines! A prickly ${rdmg}-damage payback!`)
            : T(`  🌵 선인장이 가시를 곤두세운다! 따끔한 반격 ${rdmg}데미지!`,`  🌵 Cactus bristles its spines! A prickly ${rdmg}-damage payback!`));
        }
        if(dPlant.id==='rose'){
          const rdmg = Math.round(1*dMult); const deb = Math.round(1*dMult);
          dealDamage(au, rdmg, du, log); au.atk = Math.max(0, au.atk-deb);
          log.push(defenderIsEnemy
            ? T(`  🌹 적 장미의 우아한 반격! 가시로 ${rdmg}데미지, 아군 공격력까지 꺾는다!`,`  🌹 The enemy Rose's elegant riposte! ${rdmg} thorn damage, and your ATK wilts too!`)
            : T(`  🌹 장미의 우아한 반격! 가시로 ${rdmg}데미지, 적 공격력까지 꺾는다!`,`  🌹 Rose's elegant riposte! ${rdmg} thorn damage, and the attacker's ATK wilts too!`));
        }
      }
    }
    // 사망 처리 (수비수 먼저, 반사로 공격수가 죽는 경우도)
    if(du.hp<=0) processDeath(du, D, A, log);
    if(au.hp<=0) processDeath(au, A, D, log);
  }

  let rounds = 0;
  while(firstAlive(p) && firstAlive(e) && rounds < BALANCE.MAX_ROUNDS){
    rounds++;

    // 쇠약초(purifier)이 "선두에서 싸우는 동안만" 매 라운드 상대 팀 전체 공격력을 서서히 벗겨낸다.
    // 예전엔 뒤에 숨어 있어도 살아만 있으면 발동했는데, 그러면 플레이어가 대응할 방법이 전혀 없어
    // (선두를 아무리 빨리 정리해도 꼼짝없이 상한까지 깎임) 선두 한정으로 변경 — 앞 유닛을 빨리
    // 뚫을수록 피해가 줄어드는 반격 여지를 만든다.
    // 감소량(_cleanseAmt)은 쇠약초의 era/보스 여부에 맞춰 커지지만, 유닛당 총 감소 상한(_cleanseCap)은
    // 고정 5다 — 상한이 era에 비례해 커지면 사실상 무제한이 되어 양쪽 공격력이 전부 0으로 깎이는
    // 지루한 대치가 발생했기 때문. "쌓인 버프를 조금 벗겨내는" 효과에 그치게 한다.
    const pFrontUnit = firstAlive(p);
    const purifierInP = (pFrontUnit && pFrontUnit.plantId==='purifier') ? pFrontUnit : null;
    if(purifierInP){
      const amt = purifierInP._cleanseAmt || 1;
      const cap = purifierInP._cleanseCap || 5;
      let cleansedAny = false;
      e.forEach(a=>{
        if(a.alive && a.hp>0){
          a._cleansed = a._cleansed || 0;
          const remaining = cap - a._cleansed;
          if(remaining > 0){
            const d = Math.min(amt, remaining); // 캡을 넘겨서 깎지 않도록 남은 예산만큼만 적용
            a.atk = Math.max(0, a.atk-d); a._cleansed += d; cleansedAny = true;
          }
        }
      });
      if(cleansedAny) log.push(T(`✨ 쇠약초의 오라가 적 전체 공격력을 서서히 씻어낸다…`,`✨ Witherweed's aura slowly washes away the enemies' ATK…`));
    }
    const eFrontUnit = firstAlive(e);
    const purifierInE = (eFrontUnit && eFrontUnit.plantId==='purifier') ? eFrontUnit : null;
    if(purifierInE){
      const amt = purifierInE._cleanseAmt || 1;
      const cap = purifierInE._cleanseCap || 5;
      let cleansedAny = false;
      p.forEach(a=>{
        if(a.alive && a.hp>0){
          a._cleansed = a._cleansed || 0;
          const remaining = cap - a._cleansed;
          if(remaining > 0){
            const d = Math.min(amt, remaining); // 캡을 넘겨서 깎지 않도록 남은 예산만큼만 적용
            a.atk = Math.max(0, a.atk-d); a._cleansed += d; cleansedAny = true;
          }
        }
      });
      if(cleansedAny) log.push(T(`✨ 쇠약초의 오라가 아군 전체 공격력을 서서히 씻어낸다…`,`✨ Witherweed's aura slowly washes away your allies' ATK…`));
    }

    // 턴제 교대(2026-07-17): 아군 선두 먼저 → 적 선두. 각 턴은 공격 한 번이고, 턴 사이에 사망을
    // 처리하므로 "나 한 대 너 한 대"가 된다(적을 죽여도 다음 적이 곧바로 반격, 공짜 연쇄 없음).
    if(firstAlive(p) && firstAlive(e)) doTurn('p');
    if(firstAlive(p) && firstAlive(e)) doTurn('e');
  }

  const pAlive = firstAlive(p);
  const eAlive = firstAlive(e);
  let result, reasonCode;
  if(pAlive && eAlive){
    // 40라운드 제한에 도달한 경우: 남은 체력 총합이 많은 쪽이 승리, 완전히 같을 때만 무승부
    const pHpSum = p.filter(u=>u.alive && u.hp>0).reduce((s,u)=>s+u.hp,0);
    const eHpSum = e.filter(u=>u.alive && u.hp>0).reduce((s,u)=>s+u.hp,0);
    if(pHpSum > eHpSum) result='win';
    else if(eHpSum > pHpSum) result='lose';
    else result='draw';
    reasonCode = {t:'timeout', p:pHpSum, e:eHpSum};
  }
  else if(pAlive && !eAlive){ result='win'; reasonCode = {t:'wipeE'}; }
  else if(!pAlive && eAlive){ result='lose'; reasonCode = {t:'wipeP'}; }
  else { result='draw'; reasonCode = {t:'wipeBoth'}; }

  log.push(reasonTextFor(reasonCode));
  log.push(result==='win' ? T('🏆 짜릿한 승리! 오늘의 정원은 우리 차지!','🏆 A thrilling win! The garden is ours today!') : result==='lose' ? T('😢 아쉬운 패배… 다음엔 꼭 설욕하자!','😢 A bitter loss… next time, revenge!') : T('🤝 팽팽한 접전 끝에 무승부!','🤝 A dead-even draw!'));
  return {result, reasonCode, pSynergies};
}

// 승패 사유는 코드(언어 무관)로 저장하고 표시 시점에 번역한다 — 언어를 바꿔도 옛 문장이 안 남게.
function reasonTextFor(c){
  if(!c) return '';
  if(c.t==='timeout') return T(`⏱️ ${BALANCE.MAX_ROUNDS}라운드 시간 초과! 남은 체력 총합으로 판정 — 내 정원 ${c.p} vs 야생 무리 ${c.e}`, `⏱️ ${BALANCE.MAX_ROUNDS}-round time-out! Judged by remaining HP — My Garden ${c.p} vs Wild Mob ${c.e}`);
  if(c.t==='wipeE') return T('💀 야생 식물 무리 전멸!','💀 The wild mob was wiped out!');
  if(c.t==='wipeP') return T('💀 내 정원 전멸…','💀 My garden was wiped out…');
  if(c.t==='wipeBoth') return T('💀 양쪽 모두 전멸!','💀 Both sides wiped out!');
  return '';
}
function resultReasonText(){
  if(state.lastResultCode) return reasonTextFor(state.lastResultCode);
  return state.lastResultReason || ''; // 구버전 저장(문장 그대로) 호환
}

function renderInner(){
  if(onTitleScreen){ renderTitle(); return; }
  if(state.phase==='gameover'){ renderGameOver(); return; }
  if(state.phase==='victory'){ renderVictory(); return; }
  if(state.phase==='shop'){ renderShop(); return; }
  if(state.phase==='battling'){ renderBattle(); return; }
  if(state.phase==='event'){ renderEvent(); return; }
  if(state.phase==='reward'){ renderReward(); return; }
}

function render(withTransition){
  document.getElementById('goldStat').textContent = state.gold;
  document.getElementById('waveStat').textContent = state.wave;
  document.getElementById('livesStat').textContent = state.lives;
  // 타이틀 화면에서는 게임 상태 표시줄을 숨긴다
  const topbar = document.querySelector('.topbar');
  if(topbar) topbar.style.display = onTitleScreen ? 'none' : '';

  if(withTransition && app.firstElementChild){
    app.firstElementChild.classList.add('screen-out');
    setTimeout(()=>{ renderInner(); }, 170);

  }
}

function renderTeamBed(team, editable, statusList, reverseDisplay){
  // reverseDisplay: 화면에 그릴 때만 순서를 뒤집는다(전투에서 적 팀 표시용).
  // 배열/조작 로직에는 영향 없음 — 5칸으로 패딩한 뒤 화면 표시 순서만 뒤집는다.
  if(!Array.isArray(team)) team = []; // 손상된 저장·전환 중 호출 대비 — 여기서 터지면 화면이 통째로 빈다
  let slots = [];
  for(let i=0;i<BALANCE.TEAM_SIZE;i++){
    slots.push({ unit: team[i] || null, status: (statusList && statusList[i]) || '', idx: i });
  }
  if(reverseDisplay) slots = slots.slice().reverse();

  let html = `<div class="bed">`;
  slots.forEach(slot=>{
    const unit = slot.unit;
    if(unit){
      const plant = getPlantDef(unit.plantId); // 적 전용 카운터 유닛도 여기서 조회될 수 있음
      const i = slot.idx;
      const status = slot.status || (unit.alive===false ? 'fainted' : '');
      const shownHp = Math.max(0, unit.hp);
      // 카드 위 미니 버튼은 모바일 오탭 사고(잘못 판매)로 제거 — 탭하면 액션 시트가 열린다.
      // 합성 가능 여부만 코너 배지(🔗)로 계속 보여준다 (발견성 유지, 배지 자체는 클릭 불가).
      const mergePartner = editable ? findMergePartner(unit.plantId, unit.level, 'team', i) : null;
      const dragAttrs = editable ? ` ondragover="onUnitDragOver(event)" ondragleave="onUnitDragLeave(event)" ondrop="onUnitDrop(event,'team',${i})" data-drop-zone="team" data-drop-idx="${i}"` : '';
      html += `<div class="slot" style="border:none; padding:0;"${dragAttrs}>
        <div class="plant-card ${status}" data-idx="${i}"${editable ? ` draggable="true" ondragstart="onUnitDragStart(event,'team',${i})" ondragend="onUnitDragEnd(event)" ontouchstart="onUnitTouchStart(event,'team',${i})" onclick="openUnitSheet('team',${i})" style="cursor:pointer;"` : ` onclick="showPlantInfo('${unit.plantId}')" style="cursor:pointer;"`}>
          ${mergePartner ? `<span class="merge-hint" title="${T('합성 가능 — 카드를 탭하세요','Merge ready — tap the card')}">🔗</span>` : ''}
          ${(() => { const g = (unit._guardStacks||0) + (unit._shield||0); return g>0 ? `<span class="guard-badge" title="${T(`견고/보호막 — 앞으로 받을 피해를 ${g}만큼 막아냄`,`Sturdy/Shield — blocks the next ${g} damage`)}">${g}</span>` : ''; })()}
          <div class="emoji">${artInner(unit.plantId, plant.emoji)}</div>
          <div class="name">${L(plant,'name')}<span class="level-star">${'★'.repeat(unit.level||1)}</span></div>
          <div class="stats"><span class="atk">⚔${unit.atk}${unit.bonusAtk?`<span class="stat-bonus">+${unit.bonusAtk}</span>`:''}</span><span class="hp">❤${shownHp}${unit.bonusHp?`<span class="stat-bonus">+${unit.bonusHp}</span>`:''}</span></div>
        </div>
      </div>`;
    } else {
      const emptyDragAttrs = editable ? ` ondragover="onUnitDragOver(event)" ondragleave="onUnitDragLeave(event)" ondrop="onUnitDrop(event,'team',${slot.idx})" data-drop-zone="team" data-drop-idx="${slot.idx}"` : '';
      html += `<div class="slot"${emptyDragAttrs}>${T('빈 자리','Empty')}</div>`;
    }
  });
  html += `</div>`;
  return html;
}

function diffBattleStatus(prevArr, currArr){
  if(!prevArr) return currArr.map(u=> u.alive===false ? 'fainted' : '');
  return currArr.map((u,i)=>{
    const prev = prevArr[i];
    if(!prev) return u.alive===false ? 'fainted' : '';
    const justFainted = prev.alive!==false && u.alive===false;
    if(justFainted) return 'hit fainted';
    if(u.alive===false) return 'fainted';
    if(u.hp < prev.hp) return 'hit';
    return '';
  });
}

// 효과 문구만 CODEX_SCALING에서 가져온다.
function codexScaleRowsHTML(p){
  const sc = CODEX_SCALING[p.id];
  const rows = [];
  for(let lv = 1; lv <= BALANCE.MAX_LEVEL; lv++){
    const s = computeLeveledStats(p, lv);
    let eff = '—';
    if(sc){ const n = sc.amt(lv); eff = T(sc.ko(n, lv), sc.en(n, lv)); }
    rows.push(`<tr>`
      + `<td class="cs-lv"><span class="level-star">${'★'.repeat(lv)}</span></td>`
      + `<td class="cs-atk">${s.atk}</td>`
      + `<td class="cs-hp">${s.hp}</td>`
      + `<td class="cs-eff">${eff}</td></tr>`);
  }
  return rows.join('');
}
function codexScaleTableHTML(p){
  // 대상 수가 정원 크기에 걸리는 두 종만 표기 기준을 밝힌다. 세는 방식이 서로 다르다:
  //  잡초  — 자기 자신은 빼고 센다 (전투 코드가 x!==u 로 거른다) → TEAM_SIZE-1
  //  클로버 — 자신도 대상 후보다 (pool 에 자신이 들어간다) → TEAM_SIZE
  let note = '';
  if(p.id === 'weed'){

  } else if(p.id === 'clover'){

  }
  return `<div class="cx-scale-wrap"><table class="cx-scale">
      <thead><tr><th>${T('★','★')}</th><th>${T('공격','ATK')}</th><th>${T('체력','HP')}</th><th>${T('효과','Effect')}</th></tr></thead>
      <tbody>${codexScaleRowsHTML(p)}</tbody>

}

      <div class="sg-note">${T('💡 전투 화면에서 카드를 탭하면 그 식물의 설명을 바로 볼 수 있어요','💡 Tap any card during battle to see what it does')}</div></div>`;

/* ======================= 유닛 액션 시트 =======================
   카드 위 미니 버튼(◀▶⬇⬆✕🔗)의 모바일 오탭 사고(잘못 판매) 대체.
   카드를 탭하면 하단 시트가 열리고, 판매는 시트 안에서 한 번 더 확인을 거친다.
   게임 로직(moveUnit/mergeUnitAt/sellUnit 등)은 그대로 사용 — UI 레이어만 교체. */
let unitSheet = null; // {zone:'team'|'bench', idx, confirmSell} — UI 전용, 저장 무관

function openUnitSheet(zone, idx){
  unitSheet = {zone, idx, confirmSell: false};
  renderUnitSheet();
}
function closeUnitSheet(){
  unitSheet = null;
  const el = document.getElementById('unitSheet');
  if(el) el.remove();
}
// 표시용 환불액 — sellUnit/sellBenchUnit의 공식과 동일해야 한다 (공식 변경 금지)
function sheetRefund(unit, plant){
  return Math.floor(plant.cost * Math.pow(2, unit.level-1) * (state.sellRefundRate||BALANCE.SELL_REFUND_RATE));
}
// 각 액션: 시트 정보를 먼저 확보하고 닫은 뒤 기존 로직 함수를 호출한다
function sheetMerge(){ if(!unitSheet) return; const {zone, idx} = unitSheet; closeUnitSheet(); mergeUnitAt(zone, idx); }
function sheetMove(dir){ if(!unitSheet) return; const {idx} = unitSheet; closeUnitSheet(); moveUnit(idx, dir); }
function sheetToBench(){ if(!unitSheet) return; const {idx} = unitSheet; closeUnitSheet(); moveToBench(idx); }
function sheetToMain(){ if(!unitSheet) return; const {idx} = unitSheet; closeUnitSheet(); moveToMain(idx); }
function sheetSellAsk(){ if(!unitSheet) return; unitSheet.confirmSell = true; renderUnitSheet(); }
function sheetSellCancel(){ if(!unitSheet) return; unitSheet.confirmSell = false; renderUnitSheet(); }
function sheetSellConfirm(){
  if(!unitSheet) return;
  const {zone, idx} = unitSheet;
  closeUnitSheet();
  if(zone==='team') sellUnit(idx); else sellBenchUnit(idx);
}
function renderUnitSheet(){
  const old = document.getElementById('unitSheet');
  if(old) old.remove();
  if(!unitSheet) return;
  const {zone, idx, confirmSell} = unitSheet;
  const unit = zone==='team' ? state.team[idx] : state.bench[idx];
  if(!unit){ unitSheet = null; return; } // 그 사이 슬롯이 비었으면 조용히 닫기
  const plant = getPlantDef(unit.plantId);
  const mergePartner = findMergePartner(unit.plantId, unit.level, zone, idx);
  const mergeFee = mergePartner ? mergeFeeFor(unit.level+1) : null;
  const refund = sheetRefund(unit, plant);
  const btns = [];
  if(mergePartner){
    const short = state.gold < mergeFee;
    btns.push(`<button class="sheet-btn sheet-merge" onclick="sheetMerge()" ${short?'disabled':''}>${T(`🔗 합성하기 (-${mergeFee}골드)${short?' — 골드 부족':''}`,`🔗 Merge (-${mergeFee} gold)${short?' — not enough gold':''}`)}</button>`);
  }
  if(zone==='team'){
    // 정원은 화면에 반전 표시(선두=오른쪽) — 라벨은 화면 기준 좌/우 (기존 ◀▶ 버튼과 동일한 이동)
    if(idx < state.team.length-1) btns.push(`<button class="sheet-btn" onclick="sheetMove(1)">${T('◀ 왼쪽으로 이동','◀ Move left')}</button>`);
    if(idx > 0) btns.push(`<button class="sheet-btn" onclick="sheetMove(-1)">${T('▶ 오른쪽으로 이동','▶ Move right')}</button>`);
    if(openBenchSlotIndex()!==-1) btns.push(`<button class="sheet-btn" onclick="sheetToBench()">${T('🎒 벤치로 보내기','🎒 Send to bench')}</button>`);
  } else {
    if(hasOpenMainSlot()) btns.push(`<button class="sheet-btn" onclick="sheetToMain()">${T('🌱 정원으로 복귀','🌱 Return to garden')}</button>`);
  }
  const sellArea = confirmSell
    ? `<div class="sheet-confirm">
        <div class="sheet-confirm-q">${T(`정말 판매할까요? (+${refund}골드)`,`Really sell? (+${refund} gold)`)}</div>
        <div class="sheet-confirm-row">
          <button class="sheet-btn sheet-danger" onclick="sheetSellConfirm()">${T('🗑 판매 확정','🗑 Confirm sale')}</button>
          <button class="sheet-btn" onclick="sheetSellCancel()">${T('↩ 취소','↩ Cancel')}</button>
        </div>
      </div>`
    : `<button class="sheet-btn sheet-sell" onclick="sheetSellAsk()">${T(`✕ 판매 (+${refund}골드 환불)`,`✕ Sell (+${refund} gold refund)`)}</button>`;
  const el = document.createElement('div');
  el.className = 'sheet-overlay';
  el.id = 'unitSheet';
  el.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <span class="sheet-emoji">${artInner(unit.plantId, plant.emoji)}</span>
        <div>
          <div class="sheet-name">${L(plant,'name')} <span class="level-star">${'★'.repeat(unit.level||1)}</span></div>
          <div class="sheet-stat">⚔${unit.atk}${unit.bonusAtk?` <span class="stat-bonus">(+${unit.bonusAtk})</span>`:''} · ❤${unit.hp}${unit.bonusHp?` <span class="stat-bonus">(+${unit.bonusHp})</span>`:''}${zone==='bench' ? T(' · 🎒 벤치 (전투 제외)',' · 🎒 Bench (sits out battles)') : ''}</div>
        </div>
      </div>
      <div class="sheet-desc">${L(plant,'desc')}${plant.flavor ? `<span class="flavor"> ${L(plant,'flavor')}</span>` : ''}</div>
      ${btns.join('')}
      ${sellArea}
      <button class="sheet-btn sheet-cancel" onclick="closeUnitSheet()">${T('닫기','Close')}</button>
    </div>`;
  el.addEventListener('click', (e)=>{ if(e.target===el) closeUnitSheet(); });
  document.body.appendChild(el);
}
// ESC로도 시트가 닫힌다
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeUnitSheet(); });

// 정원 제목 옆에 붙는 역할 시너지 칩. 발동 전이면 회색(1/2), 발동하면 금색(✓).
function synergyChipsHTML(){
  const counts = countRoles(state.team);
  return Object.entries(counts).map(([role, n])=>{
    const syn = BALANCE.ROLE_SYNERGY[role];
    if(!syn) return '';
    const active = n >= syn.need;
    return `<span class="syn-chip ${active?'on':''}" title="${T(`「${syn.name}」 ${syn.desc} — 같은 역할 ${syn.need}마리부터 발동`,`"${L(syn,'name')}" ${L(syn,'desc')} — triggers at ${syn.need} of the same role`)}">${roleName(role)} ${Math.min(n,syn.need)}/${syn.need}${active?' ✓':''}</span>`;
  }).join('');
}

        <button class="btn btn-ghost" onclick="toggleSpeed()" id="speedBtn">⏩ ×${battleSpeed}</button>
        <button class="btn btn-ghost" onclick="skipToEnd()">${T('⏭ 즉시 완료','⏭ Skip to end')}</button>
      </div>
    </div>
    </div>
  `;
  // 같은 전투를 다시 그리는 경우(언어 전환 등)인지 판별한다. 예전엔 무조건 0부터
  // 다시 재생해서, 다 본 전투가 통째로 되감겼다.
  const sameBattle = (battleRenderedLog === state.lastLog);
  if(!sameBattle){
    battleRenderedLog = state.lastLog;
    logRevealCount = 0;
    isAutoPlaying = false;
  }
  lastRenderedP = null; // innerHTML을 갈아끼웠으니 카드 상태는 처음부터 다시 칠한다
  lastRenderedE = null;
  battleTransitionScheduled = false; // 종료 버튼도 지워졌으므로 다시 세울 수 있게 푼다
  renderLogProgress();               // 이미 끝난 전투면 여기서 scheduleBattleEnd가 버튼을 복구한다
  updatePauseButtonLabel();          // 일시정지 상태로 다시 그린 경우 라벨을 맞춘다
  // 새 전투면 재생 시작. 같은 전투를 다시 그린 거라면 재생 중이었을 때만 이어서 돌린다.
  if(!sameBattle || (isAutoPlaying && logRevealCount < state.lastLog.length)) startAutoPlay();
}

let logRevealCount = 0;
let lastRenderedP = null;
let lastRenderedE = null;
let autoPlayHandle = null;
let isAutoPlaying = false;
let battleTransitionScheduled = false;
let battleRenderedLog = null; // 지금 화면에 그려져 있는 전투 로그(참조 비교용) — 재생 위치 보존에 씀

// 로그 한 줄이 "교전"(선두 유닛끼리 vs로 맞붙는) 줄인지 판별한다.
// 예: "🍅토마토(공3/체3) ⚔️ 🌵선인장(공1/체5)" / 영어: "🍅Tomato(A3/H3) ⚔️ 🌵Cactus(A1/H5)"
function isClashLine(text){
  return /\((?:공|A)\d+\/(?:체|H)\d+\)\s*⚔️\s*.+\((?:공|A)\d+\/(?:체|H)\d+\)/.test(text);
}

function findCardEl(containerId, idx){
  return document.querySelector(`#${containerId} [data-idx="${idx}"]`);
}

function spawnFloatText(cardEl, text, cls){
  if(!cardEl) return;
  const el = document.createElement('div');
  el.className = 'float-text' + (cls ? ' '+cls : '');
  el.textContent = text;
  cardEl.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 420);
}

// 연출 전용 오버레이 레이어를 arena 안에서 찾거나 만들어 항상 최상단에 유지한다.
// arena에 직접 붙이면 화단(.bed) 불투명 배경 뒤로 가려질 수 있어, 전용 레이어(z-index 90)에 얹는다.
function fxHost(arena){
  if(!arena) return null;
  let layer = arena.querySelector(':scope > .fx-layer');
  if(!layer){ layer = document.createElement('div'); layer.className = 'fx-layer'; }
  arena.appendChild(layer); // 항상 마지막 자식 = 최상단
  return layer;
}
function spawnImpactFlash(cardA, cardB){
  const arena = document.querySelector('.arena');
  if(!arena || !cardA || !cardB) return;
  const arenaRect = arena.getBoundingClientRect();
  const rectA = cardA.getBoundingClientRect();
  const rectB = cardB.getBoundingClientRect();
  const midX = ((rectA.left+rectA.right)/2 + (rectB.left+rectB.right)/2)/2 - arenaRect.left;
  const midY = ((rectA.top+rectA.bottom)/2 + (rectB.top+rectB.bottom)/2)/2 - arenaRect.top;
  const host = fxHost(arena) || arena;
  const flash = document.createElement('div');
  flash.className = 'impact-flash';
  flash.style.left = midX + 'px';
  flash.style.top = midY + 'px';
  host.appendChild(flash);
  setTimeout(()=>{ flash.remove(); }, 460);
  // 만화풍 별폭발 링을 겹쳐 타격감을 준다
  const burst = document.createElement('div');
  burst.className = 'impact-burst';
  burst.style.left = midX + 'px';
  burst.style.top = midY + 'px';
  host.appendChild(burst);
  setTimeout(()=>{ burst.remove(); }, 460);
}

// 교전 줄이 재생될 때, 맞붙는 두 선두 카드가 서로를 향해 짧게 돌진했다가 돌아오고
// 그 사이에 충돌 플래시를 띄운다.
function triggerClashAnimation(pIdx, eIdx){
  const pCard = findCardEl('bedPlayer', pIdx);
  const eCard = findCardEl('bedEnemy', eIdx);
  if(pCard) pCard.classList.add('lunge-right');
  if(eCard) eCard.classList.add('lunge-left');
  spawnImpactFlash(pCard, eCard);
}

/* ===== 만화책 타격 연출: 의성어 말풍선 + 별 파편 + 화면 흔들림 ===== */
const COMIC_WORDS = ['뻥!','퍽!','콰직!','쿵!','파바박!','휘리릭!','빠직!','텅!'];
const COMIC_WORDS_EN = ['POW!','WHAM!','CRUNCH!','THUD!','BAM!','SWISH!','CRACK!','BONK!'];
function comicWords(){ return LANG==='en' ? COMIC_WORDS_EN : COMIC_WORDS; }
function maxHpLoss(prevP, currP, prevE, currE){
  let m = 0;
  function scan(prev, curr){
    if(!prev || !curr) return;
    curr.forEach((u,i)=>{ const p=prev[i]; if(p && p.hp > u.hp) m = Math.max(m, p.hp - u.hp); });
  }
  scan(prevP, currP); scan(prevE, currE);
  return m;
}
function spawnComicFX(pCard, eCard, dmg){
  const arena = document.querySelector('.arena');
  if(!arena || !pCard || !eCard) return;
  const arenaRect = arena.getBoundingClientRect();
  const rectA = pCard.getBoundingClientRect();
  const rectB = eCard.getBoundingClientRect();
  const midX = ((rectA.left+rectA.right)/2 + (rectB.left+rectB.right)/2)/2 - arenaRect.left;
  const midY = ((rectA.top+rectA.bottom)/2 + (rectB.top+rectB.bottom)/2)/2 - arenaRect.top;
  const big = dmg >= 5;
  // 의성어 말풍선 (큰 한 방은 금색 대형)
  const bubble = document.createElement('div');
  bubble.className = 'comic-bubble' + (big ? ' big' : '');
  bubble.textContent = comicWords()[Math.floor(Math.random()*comicWords().length)];
  bubble.style.left = midX + 'px';
  bubble.style.top = (midY - 10) + 'px';
  bubble.style.setProperty('--rot', (Math.random()*24 - 12) + 'deg');
  const host = fxHost(arena) || arena;
  host.appendChild(bubble);
  setTimeout(()=>{ bubble.remove(); }, 600);
  // 별 파편
  const n = big ? 7 : 4;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'comic-star';
    s.textContent = ['⭐','✨','💥','🌟'][Math.floor(Math.random()*4)];
    const ang = Math.random()*Math.PI*2;
    const dist = 26 + Math.random()*(big ? 48 : 26);
    s.style.left = midX + 'px';
    s.style.top = midY + 'px';
    s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
    host.appendChild(s);
    setTimeout(()=>{ s.remove(); }, 650);
  }
  // 화면 흔들림 (강도는 피해량 비례)
  const panel = arena.closest('.panel');
  if(panel){
    panel.classList.remove('shake','shake-big');
    void panel.offsetWidth; // 애니메이션 재시작 트릭
    panel.classList.add(big ? 'shake-big' : 'shake');
    setTimeout(()=>{ panel.classList.remove('shake','shake-big'); }, 500);
  }
}
function spawnDizzy(cardEl){
  if(!cardEl || cardEl.querySelector('.dizzy')) return;
  const d = document.createElement('span');
  d.className = 'dizzy';
  d.textContent = '💫';
  cardEl.appendChild(d);
  setTimeout(()=>{ d.remove(); }, 1050);
}

/* ===== 캐릭터별 공격 연출 (순수 시각 효과 — 데미지/규칙과 무관) =====
   plantId별로 근접 돌진 대신 투사체를 날리거나, 피격 시 가시를 반사한다.
   ATTACK_FX에 없는 식물은 기존 근접 돌진(lunge)을 그대로 사용. */
const PROJ_MS = 460; // 투사체 비행 시간(ms) — 눈에 확 보이게 넉넉히 (배속은 spawnProjectile에서 하한 300ms 보장)
// 만화풍 연출: 이모지/도형 대신 손으로 그린 SVG 스프라이트를 날린다 — 카드 아트의 볼드 라인·톤과 통일
const ATTACK_FX = {
  tomato: {type:'projectile', art:'tomato'}, // 토마토를 던진다
  chili:  {type:'projectile', art:'chili'},  // 매운 고추를 쏜다
  cactus: {type:'thorns', count:4},          // 맞으면 가시 반사
  rose:   {type:'thorns', count:4},          // 반사 탱커
};
// 투사체 SVG 스프라이트 (viewBox 40x40, 중심 근처를 회전축으로). 볼드 외곽선 + 광택 + 그라디언트.
const PROJ_SVG = {
  tomato: `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="tmg" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#ff8f77"/><stop offset="0.55" stop-color="#e83f2c"/><stop offset="1" stop-color="#c22a1f"/></radialGradient></defs><circle cx="20" cy="23" r="14.5" fill="url(#tmg)" stroke="#2a1712" stroke-width="2.6"/><g fill="#54a642" stroke="#255021" stroke-width="1.3" stroke-linejoin="round"><path d="M20 8 L14.5 12.5 L20 15 Z"/><path d="M20 8 L25.5 12.5 L20 15 Z"/><path d="M20 8.5 L11.5 11 L17 14.5 Z"/><path d="M20 8.5 L28.5 11 L23 14.5 Z"/></g><path d="M20 5.5 V9.5" stroke="#255021" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="14.5" cy="18" rx="3.8" ry="2.5" fill="#fff" opacity="0.85" transform="rotate(-28 14.5 18)"/></svg>`,
  chili: `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="clg" x1="0.2" y1="0.1" x2="0.8" y2="0.9"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e12f14"/></linearGradient></defs><path d="M26 9 C31 15 31 26 23 32 C17 36.5 9.5 34 9.5 28.5 C13.5 31 19 28.5 21 21.5 C22.2 17 23 12 26 9 Z" fill="url(#clg)" stroke="#2a1712" stroke-width="2.5" stroke-linejoin="round"/><path d="M26 9 C26.5 5.5 24 3.8 20.5 5.2" fill="none" stroke="#4a9a34" stroke-width="2.8" stroke-linecap="round"/><path d="M23 13 C24 18 22.5 24 18.5 28" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity="0.6"/></svg>`,
};
// 가시 SVG (viewBox 20x40, 위쪽이 뾰족한 끝). 곡선 스파이크 + 광택 하이라이트.
const THORN_SVG = `<svg viewBox="0 0 20 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="thg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5cbf6e"/><stop offset="1" stop-color="#2f7a44"/></linearGradient></defs><path d="M10 1.5 C12.5 13 16 25 11.5 37.5 C10.8 39 9.2 39 8.5 37.5 C4 25 7.5 13 10 1.5 Z" fill="url(#thg)" stroke="#1c3d22" stroke-width="2"/><path d="M10 6 C11.2 16 12 26 10.6 34" fill="none" stroke="#d7f5c8" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/></svg>`;

function cardCenter(rect, arenaRect){
  return { x:(rect.left+rect.right)/2 - arenaRect.left, y:(rect.top+rect.bottom)/2 - arenaRect.top };
}
function spawnProjectile(fromCard, toCard, fx){
  const arena = document.querySelector('.arena');
  if(!arena || !fromCard || !toCard) return;
  const ar = arena.getBoundingClientRect();
  const a = cardCenter(fromCard.getBoundingClientRect(), ar);
  const b = cardCenter(toCard.getBoundingClientRect(), ar);
  const dx = b.x - a.x, dy = b.y - a.y;
  // 만화풍 SVG 스프라이트: 식물별로 그린 투사체(토마토·고추)를 회전하며 날린다
  const p = document.createElement('span');
  p.className = 'projectile-art';
  p.style.left = a.x + 'px';
  p.style.top = a.y + 'px';
  p.innerHTML = PROJ_SVG[fx.art] || PROJ_SVG.tomato;
  const dur = Math.max(300, PROJ_MS / (typeof battleSpeed==='number' ? battleSpeed : 1)); // 배속이어도 최소 300ms는 보이게
  p.style.setProperty('--dur', dur + 'ms');
  p.style.setProperty('--dx', dx + 'px');
  p.style.setProperty('--dy', dy + 'px');
  p.style.setProperty('--mx', (dx * 0.5) + 'px');
  p.style.setProperty('--my', (dy * 0.5 - 28) + 'px'); // 중간 지점을 위로 띄워 포물선
  (fxHost(arena) || arena).appendChild(p);
  setTimeout(()=>{ p.remove(); }, dur + 80);
}
function spawnThornBurst(fromCard, towardCard, count){
  const arena = document.querySelector('.arena');
  if(!arena || !fromCard || !towardCard) return;
  const ar = arena.getBoundingClientRect();
  const a = cardCenter(fromCard.getBoundingClientRect(), ar);
  const b = cardCenter(towardCard.getBoundingClientRect(), ar);
  const baseAng = Math.atan2(b.y - a.y, b.x - a.x);
  const n = count || 2;
  for(let i=0;i<n;i++){
    const ang = baseAng + (i - (n-1)/2) * 0.34;
    const dist = 72 + i * 9;
    const t = document.createElement('span');
    t.className = 'thorn-art';
    t.innerHTML = THORN_SVG;
    t.style.left = a.x + 'px';
    t.style.top = a.y + 'px';
    t.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    t.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
    t.style.setProperty('--rot', (ang*180/Math.PI + 90) + 'deg'); // 삼각형 끝을 진행 방향으로
    (fxHost(arena) || arena).appendChild(t);
    setTimeout(()=>{ t.remove(); }, 580);
  }
}
// 근접/투사체 분기 + 가시 반사. 기존 triggerClashAnimation을 대체하되 impact-flash는 유지.
function playAttackFX(pIdx, eIdx, currP, currE, atk){
  const pCard = findCardEl('bedPlayer', pIdx);
  const eCard = findCardEl('bedEnemy', eIdx);
  const pFx = currP && currP[pIdx] && ATTACK_FX[currP[pIdx].plantId];
  const eFx = currE && currE[eIdx] && ATTACK_FX[currE[eIdx].plantId];
  // 턴제(2026-07-17): 이번에 치는 쪽(atk)만 돌진/투사체를 낸다. 피격당한 쪽은 가시 반사만.
  // atk가 없으면(옛 로그) 양쪽 다 — 하위호환.
  const playerAttacks = (atk === 'p' || atk == null);
  const enemyAttacks  = (atk === 'e' || atk == null);
  if(playerAttacks){
    if(pFx && pFx.type==='projectile' && pCard && eCard) spawnProjectile(pCard, eCard, pFx);
    else if(pCard) pCard.classList.add('lunge-right');
  }
  if(enemyAttacks){
    if(eFx && eFx.type==='projectile' && eCard && pCard) spawnProjectile(eCard, pCard, eFx);
    else if(eCard) eCard.classList.add('lunge-left');
  }
  spawnImpactFlash(pCard, eCard);
  // 가시 반사: 피격당한(수비) 쪽이 상대 쪽으로 가시를 쏜다. 아군 턴이면 적이, 적 턴이면 아군이.
  if(atk === 'e' || atk == null){ if(pFx && pFx.type==='thorns' && pCard && eCard) spawnThornBurst(pCard, eCard, pFx.count); }
  if(atk === 'p' || atk == null){ if(eFx && eFx.type==='thorns' && eCard && pCard) spawnThornBurst(eCard, pCard, eFx.count); }
}

// 직전 스냅샷과 비교해서 체력/공격력이 바뀐 유닛 위에 떠오르는 숫자를 띄운다.
// 체력 변화는 데미지/회복 숫자로, 체력 변화 없이 공격력만 바뀐 경우(전체 버프/디버프 등)는
// 작은 상태 텍스트로 표시한다.
function triggerFloatTexts(containerId, prevArr, currArr){
  if(!prevArr) return;
  currArr.forEach((u,i)=>{
    const prev = prevArr[i];
    if(!prev) return;
    const hpDelta = u.hp - prev.hp;
    const atkDelta = u.atk - prev.atk;
    if(hpDelta === 0 && atkDelta === 0) return;
    const cardEl = findCardEl(containerId, i);
    if(!cardEl) return;
    if(hpDelta !== 0){
      const sign = hpDelta>0 ? '+' : '';
      spawnFloatText(cardEl, `${sign}${hpDelta}`, hpDelta>0 ? 'positive' : '');
      if(hpDelta <= -4 && u.hp > 0) spawnDizzy(cardEl); // 크게 맞고도 버티면 어질어질
    } else {
      const sign = atkDelta>0 ? '+' : '';
      spawnFloatText(cardEl, `⚔${sign}${atkDelta}`, 'status');
    }
  });
}

function renderLogProgress(){
  const box = document.getElementById('battleLogBox');
  if(!box) return; // 전투 화면이 아닐 때(전환 중 등) 호출되면 조용히 무시
  const entries = state.lastLog.slice(0, logRevealCount);
  box.innerHTML = entries.map(l=>{
    let cls='';
    if(l.text.includes('승리') || l.text.includes('thrilling win')) cls='win';
    if(l.text.includes('패배') || l.text.includes('bitter loss')) cls='lose';
    return `<div class="${cls}">${l.text}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;

  const latest = entries[entries.length-1];
  const currP = latest ? latest.p : state.team;
  const currE = latest ? latest.e : state._enemyTeamPreview;
  const statusP = diffBattleStatus(lastRenderedP, currP);
  const statusE = diffBattleStatus(lastRenderedE, currE);
  document.getElementById('bedPlayer').innerHTML = renderTeamBed(currP, false, statusP, true);
  document.getElementById('bedEnemy').innerHTML = renderTeamBed(currE, false, statusE, false);

  if(latest){
    // 교전(vs) 줄: 돌진 애니메이션 + 충돌 플래시. 그 외(전체효과/사망 등): 아래 떠오르는 숫자만.
    // 효과음은 자동 재생 중일 때만 — "즉시 완료"로 몰아서 넘길 때 소리가 겹치지 않게.
    if(isClashLine(latest.text)){
      const pIdx = currP.findIndex(u=>u.alive && u.hp>0);
      const eIdx = currE.findIndex(u=>u.alive && u.hp>0);
      if(pIdx!==-1 && eIdx!==-1){
        playAttackFX(pIdx, eIdx, currP, currE, latest.atk); // 턴제: 이번에 치는 쪽(latest.atk)만 공격 연출
        // 이번 스텝의 최대 피해량으로 연출 강도(말풍선 크기·흔들림) 결정
        const dmg = maxHpLoss(lastRenderedP, currP, lastRenderedE, currE);
        spawnComicFX(findCardEl('bedPlayer', pIdx), findCardEl('bedEnemy', eIdx), dmg);
      }
      if(isAutoPlaying) SFX.hit();
    } else if(isAutoPlaying && latest.text.includes('💀')){
      SFX.faint();
    }
    triggerFloatTexts('bedPlayer', lastRenderedP, currP);
    triggerFloatTexts('bedEnemy', lastRenderedE, currE);
  }

  lastRenderedP = currP;
  lastRenderedE = currE;

  if(logRevealCount>=state.lastLog.length){
    scheduleBattleEnd();
  }
}

// 전투 재생 배속 (×1/×2) — 게임 규칙과 무관한 재생 속도 전용, 설정은 localStorage에 유지
let battleSpeed = 1;
try{ battleSpeed = parseInt(localStorage.getItem('plantFightSpeed')||'1', 10) === 2 ? 2 : 1; }catch(e){}
function toggleSpeed(){
  battleSpeed = battleSpeed===1 ? 2 : 1;
  try{ localStorage.setItem('plantFightSpeed', String(battleSpeed)); }catch(e){}
  const b = document.getElementById('speedBtn');
  if(b) b.textContent = `⏩ ×${battleSpeed}`;
  if(isAutoPlaying) startAutoPlay(); // 새 간격으로 타이머 재시작
}

function startAutoPlay(){
  isAutoPlaying = true;
  updatePauseButtonLabel();
  clearAutoPlayTimer();
  autoPlayHandle = setInterval(()=>{
    if(logRevealCount >= state.lastLog.length){
      clearAutoPlayTimer();
      return;
    }
    logRevealCount = Math.min(state.lastLog.length, logRevealCount+1);
    renderLogProgress();
  }, BALANCE.LOG_STEP_MS / battleSpeed);
}
function clearAutoPlayTimer(){
  if(autoPlayHandle){ clearInterval(autoPlayHandle); autoPlayHandle = null; }
}
function updatePauseButtonLabel(){
  const btn = document.getElementById('pauseBtn');
  if(btn) btn.textContent = isAutoPlaying ? T('⏸ 일시정지','⏸ Pause') : T('▶ 재생','▶ Play');
}
function togglePause(){
  if(logRevealCount >= state.lastLog.length) return;
  if(isAutoPlaying){
    isAutoPlaying = false;
    clearAutoPlayTimer();
    updatePauseButtonLabel();
  } else {
    startAutoPlay();
  }
}
function skipToEnd(){
  isAutoPlaying = false;
  clearAutoPlayTimer();
  logRevealCount = state.lastLog.length;
  renderLogProgress();
}
function scheduleBattleEnd(){
  if(battleTransitionScheduled) return;
  battleTransitionScheduled = true;
  isAutoPlaying = false;
  clearAutoPlayTimer();
  if(state.lastResult==='win') SFX.win(); else SFX.lose();
  // 이긴 쪽 카드들이 시차를 두고 방방 뛴다
  const winnerBed = state.lastResult==='win' ? 'bedPlayer' : (state.lastResult==='lose' ? 'bedEnemy' : null);
  if(winnerBed){
    document.querySelectorAll(`#${winnerBed} .plant-card`).forEach((c, i)=>{
      if(c.classList.contains('fainted')) return;
      c.style.animationDelay = (i*80) + 'ms';
      c.classList.add('victory-bounce');
    });
  }
  const actions = document.getElementById('battleActions');
  if(actions){
    const isClearWin = state.lastResult==='win' && state.wave>=BALANCE.CLEAR_WAVE && !state.cleared;
    const resultLabel = isClearWin ? T('🏆 클리어! 결과 보기','🏆 Cleared! See results') : state.lastResult==='win' ? T('🎁 보상 받으러 가기','🎁 Collect reward') : T('계속하기','Continue');
    actions.innerHTML = `<button class="btn btn-primary" onclick="continueToReward()">${resultLabel}</button>`;
  }
  checkBattleWinAchievements(); // 전투 재생이 끝난 뒤에 판정 — 스포일러 방지
}
function continueToReward(){
  if(state.phase!=='battling') return; // 이중 클릭·전환 중 클릭 차단 (전투 종료 화면에서만)
  clearAutoPlayTimer();
  // 이번 보상 화면에서 쓸 1회성 상태는 여기서 초기화한다 (아래 분기에서 새로 채운다)
  state.pendingLottery = null;
  state.lotteryRevealed = false;
  state.perkChoices = null;
  // 클리어 웨이브(첫 보스)를 이기면 보상 대신 승리 화면으로. 이미 클리어한 뒤(무한 모드)에는 다시 뜨지 않는다.
  if(state.lastResult==='win' && state.wave>=BALANCE.CLEAR_WAVE && !state.cleared){
    state.cleared = true;
    const rec = loadRecord();
    rec.clearCount += 1;
    if(state.wave > rec.bestWave) rec.bestWave = state.wave;
    saveRecord(rec);
    recordRunEnd(true);
    unlockAch('firstClear');
    if(state.lives >= BALANCE.START_LIVES) unlockAch('flawless');
    if(state.lives === 1) unlockAch('phoenix');
    state.phase='victory';
    render(true);
    return;
  }
  // 마지막 목숨을 잃는 패배/무승부라면 보상 선택 없이 즉시 게임오버 — "끝나면 끝내야지"
  if((state.lastResult==='lose' || state.lastResult==='draw') && state.lives<=1){
    state.lives = 0;
    recordRunEnd(false);
    state.phase='gameover';
    render(true);
    return;
  }
  // 이벤트 웨이브(5·10·15·25…) 승리: 확정 골드를 주고 특전 선택 화면으로
  if(state.lastResult==='win' && isEventWave(state.wave)){
    state.gold += BALANCE.REWARD_FIXED.win;
    // 3택은 여기서 한 번만 뽑아 state에 넣는다. renderEvent에서 뽑으면 화면을 다시 그릴
    // 때마다(언어 전환 등) 선택지가 바뀌어, 원하는 특전이 나올 때까지 돌릴 수 있었다.
    state.perkChoices = pickPerkChoices(3);
    state.phase='event';
    render(true);
    return;
  }
  state.phase='reward';
  render(true);
}

// 클리어 후 "무한 모드 계속"을 고르면 원래 흐름(보상 선택)으로 복귀한다.
function continueEndless(){
  state.phase='reward';
  render(true);
}
