/* 도감. 시작 화면과 일시정지 화면에서 연다. 새 UI 를 만들지 않고 기존 오버레이와
   카드 틀을 쓴다 — 상점 헤더 버그(7b43340)가 이 오버레이 구조의 복잡함에서 나왔다.
   탭 전환은 showShop 이 물건을 사고 스스로를 다시 부르는 것과 같은 방식이다. */
function showCodex(tab){
  inCodex = true;
  atStartScreen = false;   // 도감을 보는 동안은 시작 화면이 아니다 (닫으면 codexOrigin 이 돌려보낸다)
  isPauseScreen = false;
  /* 위 두 줄은 "지금 보이는 화면은 도감이다" 를 상태 기계에 알리는 선언이다.
     화면을 새로 만들 때 이걸 빠뜨리면, 그 화면이 열려 있는 동안 다른 화면의
     플래그가 살아 있어 엉뚱한 분기가 먼저 걸린다. 15단계에서만 이 실수가
     세 번 나왔다(atStartScreen · onLeaving · isPauseScreen). */
  overlay.scrollTop = 0;
  overlayTitle.textContent = '도감';
  overlayStat.textContent = '';
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  rerollBtn.style.display = 'none';
  overlayBtn.style.display = 'none';
  shopBtn.style.display = 'none';
  headClose.style.display = 'block';

  var 탭들 = [{ id: 'weapon', nm: '무기' }, { id: 'passive', nm: '패시브' },
              { id: 'enemy', nm: '적' }, { id: 'me', nm: '나' }];
  for (var t = 0; t < 탭들.length; t++){
    (function(c){
      var 지금 = (c.id === tab);
      // 지금 탭은 disabled + selected 로 둔다 — appendCard 가 'card sel' 로 강조한다
      var el = appendCard('<div class="nm">' + c.nm + '</div>',
                          function(){ showCodex(c.id); }, 지금, 지금);
      el.className += ' codexTab';
    })(탭들[t]);
  }

  if (tab === 'weapon')       codexWeapons();
  else if (tab === 'passive') codexPassives();
  else if (tab === 'enemy')   codexEnemies();
  else                        codexMe();

  overlay.classList.add('on');
  paused = true;
}

function closeCodex(){
  inCodex = false;
  headClose.style.display = 'none';
  cardsEl.innerHTML = '';
  cardsEl.style.display = 'none';
  if (codexOrigin === 'pause'){ showPause(); return; }
  showStartScreen();
}

// 폭 전체를 쓰는 표 한 줄. 왼쪽에 이름, 오른쪽에 값.
// 왼쪽이 짧은 이름표인 줄은 키참 = true 로 부른다 — 오른쪽이 두 줄이어도 안 접힌다.
function codexRow(왼쪽, 오른쪽, 키참){
  var d = document.createElement('div');
  d.className = 'codexRow';
  d.innerHTML = '<span' + (키참 ? ' class="codexKey"' : '') + '>' + 왼쪽 +
                '</span><span>' + 오른쪽 + '</span>';
  cardsEl.appendChild(d);
}

function codexSection(글자){
  var d = document.createElement('div');
  d.className = 'shopSection';
  d.textContent = 글자;
  cardsEl.appendChild(d);
}

/* 그림이 붙는 절 제목. codexSection 을 안 고치고 따로 둔 이유는 저쪽이
   textContent 라서다 — 그림을 넣으려고 innerHTML 로 바꾸면, 지금은 전부
   내부 상수라 안전하지만 나중에 적 이름 같은 걸 넘기는 순간 통로가 열린다.
   그림이 필요한 자리만 이쪽을 쓴다. */
function codexSectionIco(id, 이모지, 글자){
  var d = document.createElement('div');
  d.className = 'shopSection';
  var url = (world.isEvolved(id) && WEAPON_ICON[id]) ? WEAPON_ICON[id] : BASE_ICON[id];
  if (url){
    var im = document.createElement('img');
    im.className = 'wpnIcoSm';
    im.src = url;
    im.alt = '';
    d.appendChild(im);
    d.appendChild(document.createTextNode(글자));
  } else {
    d.textContent = 이모지 + ' ' + 글자;   // 그림이 없으면 예전 모습 그대로
  }
  cardsEl.appendChild(d);
}

// 폭 전체를 쓰는 안내 한 줄. 좌우 분할이 아니라 한 덩어리다(폰에서 안 접히게).
function codexNote(글자){
  var d = document.createElement('div');
  d.className = 'codexNote';
  d.innerHTML = 글자;
  cardsEl.appendChild(d);
}

// core 의 round1 은 export 되지 않는다. shell 에서 도감·상점 표시에 쓰는 같은 반올림.
function shellRound1(x){
  return Math.round(x * 10) / 10;
}

function codexWeapons(){
  codexNote('강화·패시브를 뺀 <b>기본 수치</b>입니다. 지금 내 배수는 \u{2018}나\u{2019} 칸에서 볼 수 있습니다.');
  for (var i = 0; i < WEAPON_IDS.length; i++){
    var id = WEAPON_IDS[i];
    var c = CONFIG.weapons[id];
    var max = c.maxLevel;
    // 기본값을 쓴다 — 상점과 같은 기준이고, 판 밖에서 열려도 직전 판의 패시브가 안 샌다
    var d1 = shellRound1(world.weaponBaseDamageAt(id, 1));
    var dM = shellRound1(world.weaponBaseDamageAt(id, max));
    var f1 = world.weaponFeatureAt(id, 1);
    var fM = world.weaponFeatureAt(id, max);
    var 줄 = '공격력 ' + d1 + ' → ' + dM;
    if (f1 && fM && f1.value !== fM.value)
      줄 += '<br>' + fM.label + ' ' + f1.value + ' → ' + fM.value + fM.unit;
    else if (f1)
      줄 += '<br>' + f1.label + ' ' + f1.value + f1.unit;
    codexSectionIco(id, c.emoji, c.name);
    codexRow(c.desc, '');
    codexRow('Lv.1 → Lv.' + max, 줄, true);
    // 19단계: 5성을 찍고 보스 상자를 먹으면 무엇이 되는지. 15단계의 정신이
    // "수치를 감추지 않는다" 였으므로 진화도 미리 다 보여준다 —
    // 어느 무기를 5성까지 키울지가 곧 이 표를 보고 정하는 일이다.
    var evo = CONFIG.evolutions[id];
    if (evo){
      var 진화줄 = evo.name + ' — ' + evo.desc;
      // 수치도 같이 보여준다. 배수만 적힌 항목은 "×2", 공격력·주기는 실제 숫자다.
      // 규칙만 바뀌는 진화(실타래 폭풍·우유 바다)는 줄이 비어 설명만 남는다.
      var evRows = world.evolutionRows(id);
      if (evRows.length){
        var ev칸 = [];
        for (var e2 = 0; e2 < evRows.length; e2++)
          ev칸.push(evRows[e2].label + ' ' + evRows[e2].text);
        진화줄 += '<br>' + ev칸.join(' · ');
      }
      codexRow('5성 진화', 진화줄, true);
    }
  }
}

function codexEnemies(){
  codexNote('<b>적 체력은 1분마다 ' + Math.round(CONFIG.spawn.hpPerMin * 100) +
            '%씩 늘어납니다.</b> 보스는 예외입니다.');
  // 적 목록은 art 블록이 갖고 있다. shell 은 ART 별칭(2481줄)으로만 닿는다 —
  // 맨 ENEMY_IDS 로 쓰면 ReferenceError 다.
  for (var i = 0; i < ART.ENEMY_IDS.length; i++){
    var e = world.enemyInfo(ART.ENEMY_IDS[i]);
    // 이름이 비었거나 등장 시각이 숫자가 아니면 조용히 건너뛰지 않고 눈에 띄게 표시한다.
    // (예: 새 보스를 CONFIG.bosses 에 안 넣고 추가하면 여기서 바로 드러난다)
    var 이름 = e.name || ('(이름 없음: ' + ART.ENEMY_IDS[i] + ')');
    var 등장시각 = (typeof e.fromMin === 'number' && !isNaN(e.fromMin))
      ? e.fromMin : '?';
    codexSection(e.emoji + ' ' + 이름 + (e.boss ? ' (보스)' : ''));
    codexRow('등장', e.boss ? (등장시각 + '분에 나타난다') : (등장시각 + '분부터'));
    codexRow('체력', e.boss ? String(e.hp)
                            : e.hp + ' → ' + e.hpLate + ' (' + e.lateMin + '분)');
    codexRow('공격력', String(e.contact));
    codexRow('이동 속도', e.speed === 0 ? '0 — 안 움직인다' : String(e.speed));
  }
}

function codexMe(){
  var s = world.playerStats(Save.get().meta);
  codexSection('영구강화 결과');
  codexRow('\u{2764}\u{FE0F} 최대 체력',   s.maxHp.base + ' → ' + s.maxHp.now);
  codexRow('\u{1F4A8} 이동 속도',          s.speed.base + ' → ' + s.speed.now);
  codexRow('\u{1F43E} 공격력',             '×' + s.damage.base.toFixed(2) + ' → ×' + s.damage.now.toFixed(2));
  codexRow('\u{1F43D} 젬 줍는 범위',       s.pickup.base + ' → ' + s.pickup.now);
  codexRow('\u{1F9E0} 경험치',             '×' + s.xp.base.toFixed(2) + ' → ×' + s.xp.now.toFixed(2));

  /* 이번 판 패시브는 판 중에 열었을 때만 보여준다. 시작 화면 시점의
     world.passives 는 직전 판이 남긴 값일 수 있다 — showStartScreen 은 world 를
     초기화하지 않는다(초기화는 "시작하기" 를 눌러야 일어난다). 그걸 읽으면
     "아직 시작도 안 했는데 발톱갈이 3단계" 가 나온다. */
  if (codexOrigin !== 'pause') return;
  codexSection('이번 판 패시브');
  var 있나 = false;
  for (var id in CONFIG.passives){
    var lv = world.passives[id];
    if (!lv) continue;
    있나 = true;
    var pc = CONFIG.passives[id];
    var 단계칸 = lv + ' / ' + pc.maxLevel;
    // 공식은 core 에 한 벌뿐이다 — 여기 같은 계산이 또 있으면 한쪽만 고쳤을 때
    // 카드와 도감이 다른 숫자를 말한다(실제로 그런 상태였다).
    var 효과 = world.passiveEffectAt(id, lv);
    if (효과) 단계칸 += ' · ' + 효과.label + ' ' + 효과.text;
    codexRow(pc.emoji + ' ' + pc.name, 단계칸, true);
  }
  if (!있나) codexRow('아직 없습니다', '');
}

/* 패시브 도감. 무기 탭과 같은 모양이다 — 안 가진 것도 Lv.1 → 만렙 을 미리 다 보여준다.
   '나' 탭의 "이번 판 패시브" 와 역할이 다르다: 그건 지금 내 것, 이건 목록 전체다. */
function codexPassives(){
  codexNote('레벨업 카드로 얻습니다. 한 판에 <b>' + CONFIG.level.slotsPassive +
            '칸</b>까지 들고 갈 수 있습니다.');
  for (var i = 0; i < PASSIVE_IDS.length; i++){
    var id = PASSIVE_IDS[i];
    var pc = CONFIG.passives[id];
    if (!pc) continue;
    codexSection(pc.emoji + ' ' + pc.name);
    var e1 = world.passiveEffectAt(id, 1);
    var eM = world.passiveEffectAt(id, pc.maxLevel);
    if (e1 && eM)
      codexRow('Lv.1 → Lv.' + pc.maxLevel, e1.label + ' ' + e1.text + ' → ' + eM.text, true);
  }
  // 낮잠만 한계가 따로 있다. 안 적으면 "5단계면 ×0.70" 이 어디서 나온 값인지 알 수 없다.
  var nap = CONFIG.passives.nap;
  if (nap && typeof nap.minMult === 'number')
    codexNote('\u{1F4A4} 낮잠은 아무리 올려도 공격 주기가 원래의 <b>×' +
              nap.minMult.toFixed(2) + '</b> 아래로는 안 내려갑니다.');
}

// 강화 상점. 결과 화면에서 들어오고, 나가면 결과 화면으로 돌아간다.
function showShop(){
  atStartScreen = false;   // 상점을 보는 동안은 시작 화면이 아니다 (닫으면 shopOrigin 이 돌려보낸다)
  overlay.scrollTop = 0;   // 카드가 늘어 내용이 길다. 스크롤이 남아 있으면 제목·잔액이 화면 위로 밀려 사라진다.
  var d = Save.get();
  overlayTitle.textContent = '강화 상점';
  overlayStat.innerHTML = '\u{1FA99} 모은 코인 ' + d.coins;
  overlayStat.innerHTML += '<br><small>이름: ' + escapeHtml(Player.get().name || '이름없음') +
    ' <a href="#" id="renameLink" style="color:#8cf">바꾸기</a></small>';
  var rl = document.getElementById('renameLink');
  if (rl) rl.onclick = function(e){
    e.preventDefault();
    var v = window.prompt('새 이름 (20자까지)', Player.get().name);
    if (v !== null){ Player.setName(v); showShop(); }
    return false;
  };
  cardsEl.style.display = 'flex';
  rerollBtn.style.display = 'none';
  cardsEl.innerHTML = '';
  var keys = ['power', 'maxHp', 'speed', 'magnet', 'xpGain'];
  for (var i = 0; i < keys.length; i++){
    (function(key){
      var m = CONFIG.meta[key];
      var step = d.meta[key];
      var cost = Save.costOf(key);
      var buyable = (cost !== null && d.coins >= cost);
      // 지금 효과 → 사면 될 효과. 단계가 10까지 늘어나면 숫자만으로는
      // 얼마나 세졌는지 감이 안 온다.
      var nowText = metaEffectText(key, step);
      var effect = (cost === null)
        ? nowText + ' (최대)'
        : nowText + ' → ' + metaEffectText(key, step + 1);
      appendCard('<div class="ico">' + m.emoji + '</div>' +
                 '<div class="nm">' + m.name + '</div>' +
                 '<div class="lv">' + step + ' / ' + CONFIG.meta.maxStep + '</div>' +
                 '<div class="ds">' + m.desc + '<br>' + effect + '<br>' +
                 (cost === null ? '최대 강화' : '\u{1FA99} ' + cost) + '</div>',
                 function(){
                   if (Save.buy(key)) showShop();     // 사고 나서 화면을 다시 그린다
                 }, !buyable);
    })(keys[i]);
  }
  var 제목 = document.createElement('div');
  제목.className = 'shopSection';
  제목.textContent = '시작 무기';
  cardsEl.appendChild(제목);
  codexNote('강화·패시브를 뺀 기본 수치입니다.');
  for (var wi = 0; wi < WEAPON_IDS.length; wi++){
    (function(id){
      var wcfg = CONFIG.weapons[id];
      var cost = Save.starterCostOf(id);
      var owned = Save.isUnlocked(id);
      var equipped = (Save.starter() === id);
      var 아랫줄;
      if (equipped)   아랫줄 = '<b>장착 중</b>';
      else if (owned) 아랫줄 = '장착하기';
      else            아랫줄 = '\u{1FA99} ' + cost;
      // Lv1 기준 기본값을 보여준다(영구강화·패시브 미포함). 상점은 무기끼리
      // 비교하는 자리이고, 배수는 전부에게 똑같이 붙어서 순위를 안 바꾼다.
      var f1 = world.weaponFeatureAt(id, 1);
      var 수치 = '공격력 ' + shellRound1(world.weaponBaseDamageAt(id, 1));
      if (f1) 수치 += ' · ' + f1.label + ' ' + f1.value + f1.unit;
      appendCard('<div class="ico">' + weaponIcoHtml(id, wcfg.emoji) + '</div>' +
                 '<div class="nm">' + wcfg.name + '</div>' +
                 '<div class="ds">' + wcfg.desc + '<br>' + 수치 + '<br>' + 아랫줄 + '</div>',
                 function(){
                   if (equipped) return;
                   // 사면 바로 장착한다 — 산 걸 또 눌러야 쓰이는 건 헷갈린다.
                   if (!owned && !Save.buyStarter(id)) return;
                   Save.equipStarter(id);
                   showShop();                 // 사고 나서 화면을 다시 그린다
                 },
                 equipped || (!owned && d.coins < cost),
                 equipped);
    })(WEAPON_IDS[wi]);
  }
  // 상점만 닫기를 왼쪽 위 붙박이에 둔다. 카드가 10장 넘어서 맨 아래 닫기는
  // 폰에서 한참 내려야 닿는다. 아래 닫기는 감춰 둘이 같이 보이지 않게 한다.
  headClose.style.display = 'block';
  overlayBtn.style.display = 'none';
  shopBtn.style.display = 'none';
  overlay.classList.add('on');
  paused = true;
  inShop = true;
}

document.getElementById('pauseBtn').addEventListener('click', function(e){
  e.preventDefault();
  togglePause();
});

muteBtn.textContent = Sound.isMuted() ? '\u{1F507}' : '\u{1F50A}';
muteBtn.addEventListener('click', function(e){
  e.preventDefault();
  muteBtn.textContent = Sound.toggleMute() ? '\u{1F507}' : '\u{1F50A}';
});

window.addEventListener('keydown', function(e){
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
});

/* 폰에서 전화가 오거나 홈으로 나가면 여기가 불린다. 이 순간 저장해두지 않으면
   탭이 정리될 때 그 판이 통째로 사라진다 — 이 기능을 만든 이유가 이것이다.
   모바일에서 beforeunload 는 안 불리는 경우가 많아 쓰지 않는다. */
function onLeaving(){
  if (askingName) return;        // 이름 화면 중이면 그 화면을 그대로 둔다
  if (world.gameOver || world.cleared || inShop || inCodex) return;
  if (pendingRun) return;        // 이어할지 묻는 중이면 그 물음을 그대로 둔다
  if (atStartScreen) return;     // 시작 화면 중이면 그 화면을 그대로 둔다 (아직 시작 전이라 저장할 것도 없다)
  saveRun();
  if (!paused) showPause();
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') onLeaving();
});
window.addEventListener('pagehide', onLeaving);

shopBtn.addEventListener('click', function(){ shopOrigin = 'result'; showShop(); });   // 결과 화면의 상점 버튼

/* 상점에서 나가면 열었던 곳(결과 화면 또는 시작 화면)으로 돌아간다.
   왼쪽 위 닫기와 아래 닫기가 같은 일을 해야 하므로 함수로 뺐다. */
function closeShop(){
  inShop = false;
  headClose.style.display = 'none';   // 상점 밖에서는 이 버튼이 보이면 안 된다
  cardsEl.innerHTML = '';
  cardsEl.style.display = 'none';
  shopBtn.style.display = 'block';
  if (shopOrigin === 'start'){ showStartScreen(); return; }
  if (world.cleared) showCleared(); else showGameOver();
}

headClose.addEventListener('click', function(){
  if (inShop) closeShop();
  else if (inCodex) closeCodex();
});

overlayBtn.addEventListener('click', function(){
  if (askingName) return;               // 이름 화면 중엔 onclick 쪽 핸들러만 돈다
  if (isPauseScreen){ resumeFromPause(); return; }
  if (inShop){ closeShop(); return; }
  if (inCodex){ closeCodex(); return; }
  world.applyMeta(Save.get().meta);   // 상점에서 산 강화를 다음 판에 반영
  world.reset(Save.starter());
  syncSoundTrackers();   // 새 판은 딜량 0·보스 없음 — 이전 판 값이 남아있지 않게 동기화
  catLastX = null;   // 이전 판 좌표가 남아있으면 안 되므로 리셋할 때마다 걸음 추적을 함께 비운다
  RunSave.clear();                   // 새 판을 시작하니 옛 저장은 버린다
  isPauseScreen = false;
  runBanked = false;
  runTainted = false;
  runUid = 새판고유번호();
  overlay.classList.remove('on');
  paused = false;
  lastTime = 0;
});

// 딜량 총합·보스 유무를 지난 프레임과 비교해 타격·보스 등장 소리를 낸다.
// world.dmgBy·world.boss 는 core 상태를 읽기만 한다 — core 는 안 건드린다.
// 우유 웅덩이(field)·꼬리 회전(orbit)은 켜져 있는 동안 매 프레임 계속 딜이 들어간다.
// 이 둘을 타격음 집계에 넣으면 "때리는 순간"이 아니라 끊이지 않는 배경음이 되어버려서
// (2026-08-05 실측: 무기 여럿 갖춘 구간 분당 200회, 재생 간격 중앙값 266ms로 소리가
// 중구난방으로 들림 — 사용자 피드백), 지속딜 종류는 타격음 트리거에서 뺀다.
// 토네이도(kind는 projectile)도 같은 부류다 — hitCooldownMs로 회오리 안에 머무는 적을
// 계속 재타격하는 "재타격형" 무기라, 꼬리 회전과 똑같이 끊임없이 딜이 들어간다
// (설정 주석: "꼬리 회전이 쓰는 hitCooldownMs 패턴을 그대로 따랐다"). kind가 아니라
// hitCooldownMs 유무로 판정해야 이런 무기를 놓치지 않는다.
// nuke·'?'(이름표 누락)처럼 CONFIG.weapons에 없는 항목은 그대로 둔다 — 배제 대상이 아니다.
var CONTINUOUS_HIT_KINDS = { field: true, orbit: true };
var HIT_SOUND_IDS = DAMAGE_IDS.filter(function(id){
  var w = CONFIG.weapons[id];
  if (!w) return true;
  if (CONTINUOUS_HIT_KINDS[w.kind]) return false;
  if (w.hitCooldownMs) return false;
  return true;
});

var lastDmgTotal = 0;
var lastBossAlive = false;
var lastBoxesTaken = 0;   // 🎁 상자를 먹은 횟수 — 늘어난 프레임에 소리를 낸다
var endScreenSounded = false;   // 게임오버·클리어 소리가 이미 났는지 — 상점 갔다 와도 다시 안 나게
// 판을 새로 시작하거나 이어받는 모든 자리에서 반드시 불러야 한다. 안 부르면
// 이어받은 판의 기존 딜량·보스 상태를 "방금 일어난 일"로 착각해 엉뚱한 소리가 난다
// (다시 하기·시작 화면의 시작하기·이어하기 화면의 이어하기/새로 시작, 총 세 자리).
function syncSoundTrackers(){
  var total = 0;
  for (var i = 0; i < HIT_SOUND_IDS.length; i++) total += world.dmgBy[HIT_SOUND_IDS[i]];
  lastDmgTotal = total;
  lastBossAlive = !!(world.boss && world.boss.active);
  // 이어받은 판이 이미 상자를 먹었으면 그 값에서 이어 센다 — 안 그러면 이어하자마자
  // "상자 먹는 소리" 가 한 번 울린다(보스 등장 소리를 여기서 맞추는 것과 같은 이유).
  lastBoxesTaken = world.boxesTaken;
  endScreenSounded = false;
  // 17단계: 클리어 폭죽도 같은 자리에서 되돌린다. 여기서 안 돌리면 다음 판에서
  // 다시 클리어해도 clearCelebrateAt 이 이전 판 값(0 아님)으로 남아 연출이 안 나온다.
  clearCelebrateAt = 0;
  resetFireworks();
}
function pollSoundTriggers(now){
  var total = 0;
  for (var i = 0; i < HIT_SOUND_IDS.length; i++) total += world.dmgBy[HIT_SOUND_IDS[i]];
  if (total > lastDmgTotal) Sound.hit(now);
  lastDmgTotal = total;

  var bossAlive = !!(world.boss && world.boss.active);
  if (bossAlive && !lastBossAlive) Sound.bossAppear();
  lastBossAlive = bossAlive;

  // 🎁 상자를 먹었다. 진화 소리는 카드를 고른 뒤에 따로 난다 — 여기서 같이 내면
  // 아직 아무것도 안 고른 시점에 "진화했다" 로 들린다.
  if (world.boxesTaken > lastBoxesTaken) Sound.boxPick();
  lastBoxesTaken = world.boxesTaken;
}

/* 17단계: 클리어 폭죽 ------------------------------------------------------
   World.prototype.update 는 cleared 가 되면 곧장 반환해 판이 얼어붙는다.
   그래서 이 연출은 게임 시간이 아니라 실제 시계(frame 의 now)로 움직여야
   한다. world 를 전혀 건드리지 않는 순수 장식이므로 난수도 world.rnd 가
   아니라 Math.random() 을 쓴다 — world.rnd 는 게임의 씨드 난수라, 판이
   끝난 뒤라도 한 번 더 뽑으면 봇 재현성(같은 씨드로 같은 판을 재생하는 것)이
   깨진다.                                                                  */
var CLEAR_CELEBRATE_MS = 2500;
var clearCelebrateAt = 0;   // 0 = 연출 시작 전. syncSoundTrackers() 가 새 판마다 같이 되돌린다.

var FIREWORK_CAP = 200;                          // 상한 — 넘으면 새로 안 만든다
var FIREWORK_BURST_OFFSETS = [0, 800, 1650];     // clearCelebrateAt 로부터 몇 ms 뒤에 터질지 — 2.5초 안에 세 번
var FIREWORK_COLORS = ['#ff6b6b', '#ffd93d', '#6bff8f', '#ff9ff3', '#a29bfe', '#ffa552', '#ffffff'];
// 젬(#5ad1e8)과 헷갈리면 안 되므로 청록 계열은 일부러 뺐다.

// 미리 CAP 개만큼 만들어 두고 재사용한다 — 이 게임의 렌더 경로 규칙(매 프레임 새
// 배열·객체를 만들지 않는다)을 폭죽에도 그대로 적용한다.
var fireworks = [];
(function initFireworks(){
  for (var i = 0; i < FIREWORK_CAP; i++){
    fireworks.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, color: '#fff', size: 3 });
  }
})();
var fireworkLast = 0;     // 마지막으로 폭죽을 움직인 실제 시계 시각(now) — 델타 계산용
var fireworkBurstIdx = 0; // FIREWORK_BURST_OFFSETS 중 몇 번째까지 터뜨렸는지

// 화면 위쪽 어딘가에서 한 번 터진다. 좌표를 월드가 아니라 화면(screen) 기준으로
// 바로 잡는 이유: 연출 중엔 world.update 가 멈춰 있어 카메라(player 좌표)도
// 그대로이므로 굳이 world 좌표로 바꿨다가 다시 화면 좌표로 옮길 필요가 없다.
function spawnFirework(){
  var cx = viewW * 0.2 + Math.random() * viewW * 0.6;
  var cy = viewH * 0.25 + Math.random() * viewH * 0.3;
  var color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
  var count = 55, made = 0;
  for (var i = 0; i < fireworks.length && made < count; i++){
    var p = fireworks[i];
    if (p.active) continue;   // 상한(FIREWORK_CAP)에 걸리면 남은 개수는 그냥 못 터진다
    var ang = Math.random() * Math.PI * 2;
    var spd = 60 + Math.random() * 150;
    p.active = true;
    p.x = cx; p.y = cy;
    p.vx = Math.cos(ang) * spd;
    p.vy = Math.sin(ang) * spd - 60;   // 위쪽으로 쏘아 올린 느낌을 주려고 위 방향을 더 얹는다
    p.life = 0;
    p.maxLife = 650 + Math.random() * 500;
    p.color = color;
    p.size = 3 + (Math.random() < 0.5 ? 0 : 1);   // 3~4px — 젬(10px)보다 작게
    made++;
  }
}

// 실제 시계 델타(ms)로 입자를 옮긴다. world.elapsed 가 아니라 dtMs 를 인자로
// 직접 받는 이유는 클리어 연출 동안 world.update 가 멈춰 있어 게임 시간이
// 흐르지 않기 때문이다 — frame() 의 now 로 계산한 델타를 넘겨받는다.
function updateFireworks(dtMs){
  var dt = dtMs / 1000;
  for (var i = 0; i < fireworks.length; i++){
    var p = fireworks[i];
    if (!p.active) continue;
    p.life += dtMs;
    if (p.life >= p.maxLife){ p.active = false; continue; }
    p.vy += 260 * dt;   // 중력 — 서서히 떨어진다
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

// render() 안, 적·고양이보다 위 / HUD 보다 아래에서 부른다.
function drawFireworks(){
  for (var i = 0; i < fireworks.length; i++){
    var p = fireworks[i];
    if (!p.active) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);   // 서서히 사라진다
    ctx.fillStyle = p.color;
    // 도트 그래픽이라 동그라미 대신 작은 네모를 쓴다 — 동그라미는 겉돈다.
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// 새 판을 시작할 때 이전 판에서 터지던 폭죽이 남아있으면 안 되므로 pool 을
// 통째로 끈다. clearCelebrateAt 과 함께 syncSoundTrackers() 에서만 부른다 —
// 그 함수가 "판이 새로 시작되는 모든 자리" 를 이미 한곳에 모아 두고 있어서,
// 그 옆에 한 줄만 보태면 이 저장소가 반복해서 맞은 "여러 자리 중 하나를
// 빠뜨리는" 버그를 피할 수 있다.
function resetFireworks(){
  for (var i = 0; i < fireworks.length; i++) fireworks[i].active = false;
  fireworkBurstIdx = 0;
  fireworkLast = 0;
}

// 클리어 연출 중에 화면을 누르거나 키를 누르면 기다리지 않고 결과창으로 넘어간다.
// paused 도 같이 확인하는 이유: showCleared() 가 이미 불려 paused = true 가
// 된 뒤(결과창이 이미 떠 있는 상태)에는 다시 부를 필요가 없다.
function skipCelebrateIfActive(){
  if (world.cleared && clearCelebrateAt && !paused) showCleared();
}
window.addEventListener('keydown', skipCelebrateIfActive);
window.addEventListener('pointerdown', skipCelebrateIfActive);

var lastTime = 0;
// 지난 프레임에 render() 를 건너뛰었는가 — 정지 상태로 막 들어온 프레임엔
// (오버레이 뒤 배경을 최신 상태로 남기려) 반드시 한 번 그리고, 그 다음부터 건너뛴다.
var wasIdle = false;
function frame(now){
  if (!lastTime) lastTime = now;
  var delta = now - lastTime;
  lastTime = now;
  applyInput();
  // 이름 화면 중에는 배경 진행(레벨업·게임오버 등으로의 화면 전환)이 이름 화면을 덮으면 안 된다
  if (!paused && !askingName){
    if (world.cleared){
      // 클리어 순간 곧장 결과창을 덮지 않고 CLEAR_CELEBRATE_MS 동안 폭죽을 보여준다.
      if (!clearCelebrateAt){
        clearCelebrateAt = now;
        fireworkBurstIdx = 0;
        fireworkLast = now;
        // 팡파르는 연출을 시작하는 여기서 낸다. showCleared() 안에도 같은
        // endScreenSounded 가드가 있어, 결과창이 뜰 때는 이미 true 라 두 번 안 울린다.
        if (!endScreenSounded){ Sound.cleared(); endScreenSounded = true; }
        /* 코인·기록 적립도 결과창을 기다리지 않고 여기서 한다.
           원래 bankRun 은 showCleared() 안에서만 불렸는데, 그건 "cleared 되면
           바로 다음 프레임에 결과창이 뜬다" 는 전제 위에 있던 코드다. 연출로
           2.5초를 미루면서 그 전제가 깨졌다 — onLeaving()·saveRun() 은 둘 다
           cleared 면 그냥 빠지므로(각각 4169줄·3661줄), 그 사이에 탭을 닫거나
           폰이 페이지를 죽이면 클리어한 판의 코인과 기록이 통째로 사라진다.
           하필 제일 잃으면 안 되는 판이다.
           bankRun 은 runBanked 로 스스로 막으므로 showCleared() 가 나중에 다시
           불러도 두 번 적립되지 않는다. */
        bankRun(true);
      }
      var celebrateElapsed = now - clearCelebrateAt;
      // 밀린 터짐이 있으면 한 프레임에 다 처리한다(느린 프레임을 만나도 순서가 안 밀리게)
      while (fireworkBurstIdx < FIREWORK_BURST_OFFSETS.length &&
             celebrateElapsed >= FIREWORK_BURST_OFFSETS[fireworkBurstIdx]){
        spawnFirework();
        fireworkBurstIdx++;
      }
      updateFireworks(now - fireworkLast);
      fireworkLast = now;
      if (celebrateElapsed >= CLEAR_CELEBRATE_MS) showCleared();
    }
    else if (world.gameOver){ showGameOver(); }
    /* 진화를 레벨업보다 먼저 본다. 둘이 같은 프레임에 밀릴 수 있는데(한 프레임에
       여러 스텝이 돌아, 레벨업이 뜬 스텝 뒤의 스텝에서 상자를 밟을 수 있다),
       한 판에 두 번뿐인 쪽을 먼저 보여준다. 남은 하나는 고른 다음 프레임에 뜬다.
       ⚠️ 여기와 togglePause 두 곳이 판을 멈추는 자리다. 하나만 넣으면 카드를
       고르는 동안 쥐떼가 계속 다가온다. */
    else if (world.pendingEvolve > 0){ showEvolve(); }
    else if (world.pendingChoices > 0){ showLevelUp(); }
  }
  var steps = stepper.advance(delta);        // 정지 중에도 그대로 흘린다
  // 측정 중일 때만 계산/그리기 시간을 따로 잰다 (평소엔 시계를 읽지 않는다)
  var t0 = stressRecording ? performance.now() : 0;
  // 이름 화면 중에는 판 자체가 진행되면 안 되므로 world.update 도 건너뛴다
  for (var i = 0; i < ((paused || askingName) ? 0 : steps); i++){
    world.update(CONFIG.step.ms / 1000);
  }
  pollSoundTriggers(now);   // 딜량·보스 상태 변화를 보고 타격·보스 등장 소리를 낸다
  var t1 = stressRecording ? performance.now() : 0;
  // 일시정지·오버레이 표시 중엔 world 가 안 움직이므로 화면도 안 바뀐다.
  // backdrop-filter 블러 재계산이 특히 무거워서, 매 프레임 다시 그릴 필요가 없다.
  var idle = paused || overlay.classList.contains('on');
  gameLoopStarted = true;   // resize() 가 이제부터 안전하게 다시 그릴 수 있다
  if (!idle || !wasIdle) render();
  wasIdle = idle;
  if (stressRecording) stressTick(delta, t1 - t0, performance.now() - t1);
  requestAnimationFrame(frame);
}

/* 이어할 판이 없을 때 뜨는 시작 화면. 시작 무기를 사고 장착하는 상점이 결과 화면에서만
   닿을 수 있었다 — 새 플레이어는 한 번 죽어야만 무기를 고를 수 있었다. 여기서 상점으로도
   갈 수 있게 열어준다. "시작하기" 흐름 자체는 예전에 여기서 바로 시작하던 것과 완전히
   같아야 하므로, 이어하기 화면의 고르기(새로 시작 쪽)와 순서를 맞춰뒀다. */
function showStartScreen(){
  overlayTitle.textContent = '냥서바이버';
  overlayStat.innerHTML = '고양이 한 마리가 쥐떼를 버텨내는 게임';
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  shopBtn.style.display = 'none';
  rerollBtn.style.display = 'none';
  overlayBtn.style.display = 'none';

  appendCard('<div class="ico">\u{25B6}\u{FE0F}</div>' +
             '<div class="nm">시작하기</div>' +
             '<div class="ds">지금 바로 시작</div>',
             function(){
               // 이어하기 화면의 "새로 시작"과 같은 순서 — 시작하는 자리는 하나의
               // 틀을 따라야 runUid 가 빠지는 경로가 생기지 않는다.
               runUid = 새판고유번호();
               cardsEl.innerHTML = '';
               cardsEl.style.display = 'none';
               shopBtn.style.display = 'block';
               overlayBtn.style.display = 'block';
               overlay.classList.remove('on');
               atStartScreen = false;
               paused = false;
               lastTime = 0;
               // 이 화면에서 상점에 다녀올 수 있으므로, 방금 산 강화를 다시 계산해야 한다.
               // reset 만으로는 안 된다 — metaMult 는 applyMeta 가 갱신하고 reset 은 안 건드린다.
               // 이게 빠지면 코인은 나갔는데 그 판에는 효과가 없다("다시 하기" 쪽은 이미 이 순서다).
               world.applyMeta(Save.get().meta);
               world.reset(Save.starter());   // 상점에서 방금 장착했을 수도 있는 시작 무기를 반영한다
               syncSoundTrackers();   // 새 판은 딜량 0·보스 없음 — 이전 판 값이 남아있지 않게 동기화
               catLastX = null;   // 이전 판 좌표가 남아있으면 안 되므로 리셋할 때마다 걸음 추적을 함께 비운다
             }, false);

  appendCard('<div class="ico">\u{1FA99}</div>' +
             '<div class="nm">상점</div>' +
             '<div class="ds">강화 · 시작 무기</div>',
             function(){
               shopOrigin = 'start';   // 상점을 닫으면 결과 화면이 아니라 여기로 돌아온다
               showShop();
             }, false);

  appendCard('<div class="ico">\u{1F4D6}</div>' +
             '<div class="nm">도감</div>' +
             '<div class="ds">무기 · 적 · 내 스펙</div>',
             function(){
               codexOrigin = 'start';   // 닫으면 여기로 돌아온다
               showCodex('weapon');
             }, false);

  overlay.classList.add('on');
  paused = true;
  atStartScreen = true;
}

/* 저장된 판이 있으면 시작하자마자 물어본다. 이어하기를 고르면 그 시점부터,
   새로 시작을 고르면 저장을 버리고 처음부터.
   이름 화면(showNameAsk) 뒤에 이어지는 원래 시작 흐름이라 이름을 붙여 함수로 뺐다 —
   이름을 물을 필요가 없으면 이 함수가 바로 불린다. */
var pendingRun = RunSave.load();
function showTitleOrResume(){
  // 저장된 판이 없으면 시작 화면을 연다 — 예전엔 여기서 곧장 플레이가 시작됐지만,
  // 그러면 상점(시작 무기 장착)이 결과 화면에서만 닿을 수 있어 새 플레이어는 한 번
  // 죽어야만 무기를 고를 수 있었다.
  if (!pendingRun){ showStartScreen(); return; }
  var m = Math.floor((pendingRun.elapsed || 0) / 60);
  var s = Math.floor((pendingRun.elapsed || 0) % 60);
  var pendingLevel = (typeof pendingRun.level === 'number' && isFinite(pendingRun.level) &&
                      pendingRun.level >= 1) ? Math.floor(pendingRun.level) : 1;
  overlayTitle.textContent = '이어서 할까요?';
  overlayStat.innerHTML = m + '분 ' + (s < 10 ? '0' : '') + s + '초 · Lv.' +
    pendingLevel + ' 에서 멈췄습니다' +
    '<br><small>이어하면 화면의 쥐는 새로 몰려옵니다</small>';
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  shopBtn.style.display = 'none';
  rerollBtn.style.display = 'none';
  overlayBtn.style.display = 'none';

  function 고르기(이어할까){
    // 이어하기든 새로 시작이든, 이 브라우저 세션에서는 아직 runUid 를 만든 적이 없다
    // (여기 오는 길엔 "다시 하기" 버튼을 거치지 않는다). 여기서 만들지 않으면
    // 이어받은 판이 끝났을 때 빈 runUid 로 전송돼 서버가 판 전체를 거부한다.
    runUid = 새판고유번호();
    RunSave.clear();
    cardsEl.innerHTML = '';
    cardsEl.style.display = 'none';
    shopBtn.style.display = 'block';
    overlayBtn.style.display = 'block';
    overlay.classList.remove('on');
    paused = false;
    lastTime = 0;
    if (이어할까){
      if (!world.restore(pendingRun)) world.reset(Save.starter());   // 저장이 깨졌으면 새 판
      // 복원 직후에도 정지 상태가 이어질 수 있다(예: 레벨업 카드가 뜬 채로 저장된 판).
      // wasIdle 을 안 건드리면 "정지→정지" 로만 보여 진입 프레임의 강제 렌더가 건너뛰어지고,
      // 카드 뒤 배경·HUD 가 복원 전(새 판) 상태로 남는다.
      else wasIdle = false;
    } else {
      world.reset(Save.starter());                                   // 새로 시작
    }
    syncSoundTrackers();   // 이어받은 판의 기존 딜량·보스 상태를 "방금 일어난 일"로 착각하지 않게
    catLastX = null;   // 이전 판 좌표가 남아있으면 안 되므로 리셋할 때마다 걸음 추적을 함께 비운다
    pendingRun = null;
  }

  var 항목 = [
    { ico: '\u{25B6}️', nm: '이어하기', ds: m + '분 ' + s + '초부터', go: true },
    { ico: '\u{1F504}', nm: '새로 시작', ds: '처음부터 다시', go: false }
  ];
  for (var i = 0; i < 항목.length; i++){
    (function(c){
      appendCard('<div class="ico">' + c.ico + '</div>' +
                 '<div class="nm">' + c.nm + '</div>' +
                 '<div class="ds">' + c.ds + '</div>',
                 function(){ 고르기(c.go); }, false);
    })(항목[i]);
  }
  overlay.classList.add('on');
  paused = true;
}

// 처음 한 번은 이름부터 묻는다. 다 물었으면 곧장 원래 시작 흐름(이어하기 물음)으로.
if (Player.needsName()) showNameAsk(showTitleOrResume);
else showTitleOrResume();



requestAnimationFrame(frame);






// 프레임 루프(frame 함수)가 매 프레임 stressRecording 을 읽으므로 측정 도구를
// 걷어내도 이 선언은 남겨야 한다. 남기지 않으면 배포본이 첫 프레임에서 죽는다.
var stressRecording = false;

})();
</script>
</body>
</html>
