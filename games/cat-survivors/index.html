    achRow(at.name, at.desc, have.indexOf(a.id) >= 0);
  }

  codexSection(TF('무기 마스터리 {a} / {b}', { a: mastered.length, b: WEAPON_IDS.length }));
  for (var w = 0; w < WEAPON_IDS.length; w++){
    var wid = WEAPON_IDS[w];
    var wc = CONFIG.weapons[wid];
    // 만렙만으론 안 된다 — 5성 진화까지(2026-08-14). 조건 문구도 그렇게 말해야 한다.
    achRow(wc.name, TF('{w} 무기를 Lv.{lv} 까지 올리고 5성으로 진화시킨다',
                       { w: wc.name, lv: wc.maxLevel }),
           mastered.indexOf(wid) >= 0);
  }

  overlay.classList.add('on');
  paused = true;
}

// 도전과제 한 줄 — 달성이면 ✅ 진하게, 잠겨 있으면 🔒 회색(.codexRow.off).
// 오른쪽 칸은 항상 desc(=조건 문구) — 달성 전이든 후든 같은 문장이 조건을 말해 준다.
function achRow(name, desc, done){
  var d = document.createElement('div');
  d.className = 'codexRow' + (done ? '' : ' off');
  d.innerHTML = '<span class="codexKey">' + (done ? '\u{2705} ' : '\u{1F512} ') +
                escapeHtml(name) + '</span><span>' + escapeHtml(desc) + '</span>';
  cardsEl.appendChild(d);
}

function closeAchievements(){
  inAch = false;
  headClose.style.display = 'none';
  cardsEl.innerHTML = '';
  cardsEl.style.display = 'none';
  if (achOrigin === 'pause'){ showPause(); return; }
  showStartScreen();
}

// 폭 전체를 쓰는 표 한 줄. 왼쪽에 이름, 오른쪽에 값.
// 왼쪽이 짧은 이름표인 줄은 키참 = true 로 부른다 — 오른쪽이 두 줄이어도 안 접힌다.
function codexRow(왼쪽, 오른쪽, 키참){
  var d = document.createElement('div');
  d.className = 'codexRow';
  d.innerHTML = '<span' + (키참 ? ' class="codexKey"' : '') + '>' + 왼쪽 +
                '</span><span>' + 오른쪽 + '</span>';
  cardsEl.appendChild(d);
}

function codexSection(글자){
  var d = document.createElement('div');
  d.className = 'shopSection';
  d.textContent = 글자;
  cardsEl.appendChild(d);
}

/* 그림이 붙는 절 제목. codexSection 을 안 고치고 따로 둔 이유는 저쪽이
   textContent 라서다 — 그림을 넣으려고 innerHTML 로 바꾸면, 지금은 전부
   내부 상수라 안전하지만 나중에 적 이름 같은 걸 넘기는 순간 통로가 열린다.
   그림이 필요한 자리만 이쪽을 쓴다. */
function codexSectionIco(url, 이모지, 글자){
  var d = document.createElement('div');
  d.className = 'shopSection';
  if (url){
    var im = document.createElement('img');
    im.className = 'wpnIcoSm';
    im.src = url;
    im.alt = '';
    d.appendChild(im);
    d.appendChild(document.createTextNode(글자));
  } else {
    d.textContent = 이모지 + ' ' + 글자;   // 그림이 없으면 예전 모습 그대로
  }
  cardsEl.appendChild(d);
}

// 폭 전체를 쓰는 안내 한 줄. 좌우 분할이 아니라 한 덩어리다(폰에서 안 접히게).
function codexNote(글자){
  var d = document.createElement('div');
  d.className = 'codexNote';
  d.innerHTML = 글자;
  cardsEl.appendChild(d);
}

// core 의 round1 은 export 되지 않는다. shell 에서 도감·상점 표시에 쓰는 같은 반올림.
function shellRound1(x){
  return Math.round(x * 10) / 10;
}

function codexWeapons(){
  codexNote(T('강화·패시브를 뺀 <b>기본 수치</b>입니다. 지금 내 배수는 \u{2018}나\u{2019} 칸에서 볼 수 있습니다.'));
  for (var i = 0; i < WEAPON_IDS.length; i++){
    var id = WEAPON_IDS[i];
    var c = CONFIG.weapons[id];
    var max = c.maxLevel;
    // 기본값을 쓴다 — 상점과 같은 기준이고, 판 밖에서 열려도 직전 판의 패시브가 안 샌다
    var d1 = shellRound1(world.weaponBaseDamageAt(id, 1));
    var dM = shellRound1(world.weaponBaseDamageAt(id, max));
    var f1 = world.weaponFeatureAt(id, 1);
    var fM = world.weaponFeatureAt(id, max);
    var 줄 = TF('공격력 {a} → {b}', { a: d1, b: dM });
    if (f1 && fM && f1.value !== fM.value)
      줄 += '<br>' + fM.label + ' ' + f1.value + ' → ' + fM.value + fM.unit;
    else if (f1)
      줄 += '<br>' + f1.label + ' ' + f1.value + f1.unit;
    // 진화한 무기는 진화형 그림 — 손에 든 것과 화면에 나는 게 같아야 한다.
    codexSectionIco((world.isEvolved(id) && WEAPON_ICON[id]) ? WEAPON_ICON[id]
                                                            : BASE_ICON[id],
                    c.emoji, c.name);
    codexRow(c.desc, '');
    codexRow('Lv.1 → Lv.' + max, 줄, true);
    // 19단계: 5성을 찍고 보스 상자를 먹으면 무엇이 되는지. 15단계의 정신이
    // "수치를 감추지 않는다" 였으므로 진화도 미리 다 보여준다 —
    // 어느 무기를 5성까지 키울지가 곧 이 표를 보고 정하는 일이다.
    var evo = CONFIG.evolutions[id];
    if (evo){
      var 진화줄 = evo.name + ' — ' + evo.desc;
      // 수치도 같이 보여준다. 배수만 적힌 항목은 "×2", 공격력·주기는 실제 숫자다.
      // 규칙만 바뀌는 진화(실타래 폭풍·우유 바다)는 줄이 비어 설명만 남는다.
      var evRows = world.evolutionRows(id);
      if (evRows.length){
        var ev칸 = [];
        for (var e2 = 0; e2 < evRows.length; e2++)
          ev칸.push(evRows[e2].label + ' ' + evRows[e2].text);
        진화줄 += '<br>' + ev칸.join(' · ');
      }
      codexRow(T('5성 진화'), 진화줄, true);
    }
  }
}

function codexEnemies(){
  codexNote(TF('<b>적 체력은 1분마다 {n}%씩 늘어납니다.</b> 보스는 예외입니다.',
               { n: Math.round(CONFIG.spawn.hpPerMin * 100) }));
  // 25단계: 스테이지 2 배율을 숨기지 않는다(15단계 수치 공개 원칙). 숫자는 CONFIG 에서 읽는다.
  // 28단계: 스테이지 3 줄도 같은 모양으로 그 밑에 붙인다(stageOrder 고정 순서, 배율이 있는 스테이지만).
  for (var sti = 0; sti < CONFIG.stageOrder.length; sti++){
    var sx = CONFIG.stages[CONFIG.stageOrder[sti]];
    if (!sx || typeof sx.spawnMult !== 'number') continue;   // 스테이지 1은 배율이 없다
    // 28단계 2차: 보스별 배율(bossHpMults)이 있으면 그 값을 보스 순서대로 적는다 — 실제로 안 쓰이는
    // bossHpMult 를 띄우면 도감 숫자가 실제와 어긋난다. 코인 배율 1은 적지 않는다(카드와 같다).
    var 보스배율 = sx.bossHpMults ? sx.bossHpMults.join('/×') : sx.bossHpMult;
    var 배율값 = { name: escapeHtml(sx.name), a: sx.spawnMult, b: sx.enemyHpMult, c: sx.contactMult,
                d: 보스배율, e: sx.coinMult };
    codexNote(sx.coinMult === 1
      ? TF('<b>{name}</b>: 쥐 수 ×{a} · 체력 ×{b} · 피해 ×{c} · 보스 체력 ×{d}', 배율값)
      : TF('<b>{name}</b>: 쥐 수 ×{a} · 체력 ×{b} · 피해 ×{c} · 보스 체력 ×{d} · 코인 ×{e}', 배율값));
  }
  // 적 목록은 art 블록이 갖고 있다. shell 은 ART 별칭(2481줄)으로만 닿는다 —
  // 맨 ENEMY_IDS 로 쓰면 ReferenceError 다.
  for (var i = 0; i < ART.ENEMY_IDS.length; i++){
    var e = world.enemyInfo(ART.ENEMY_IDS[i]);
    // 이름이 비었거나 등장 시각이 숫자가 아니면 조용히 건너뛰지 않고 눈에 띄게 표시한다.
    // (예: 새 보스를 CONFIG.bosses 에 안 넣고 추가하면 여기서 바로 드러난다)
    var 이름 = e.name || TF('(이름 없음: {id})', { id: ART.ENEMY_IDS[i] });
    var 등장시각 = (typeof e.fromMin === 'number' && !isNaN(e.fromMin))
      ? e.fromMin : '?';
    codexSectionIco(ENEMY_ICON[ART.ENEMY_IDS[i]], e.emoji,
                    이름 + (e.boss ? T(' (보스)') : ''));
    // 스테이지 2부터 나오는 쥐(25단계)는 등장 줄 앞에 "스테이지 2부터" 를 붙인다.
    // 28단계 전에는 "스테이지 2에만" 이었다 — 스테이지 3에도 같은 쥐가 나오면서 틀린 말이 됐다.
    // (e.stageOnly 는 "처음 나오는 스테이지" 번호다. 아래 숫자는 그 스테이지의 값이고, 뒤 스테이지에서는 더 세다.)
    var 전용 = e.stageOnly ? TF('스테이지 {n}부터', { n: e.stageOnly }) + ' · ' : '';
    // 두목쥐는 세 번 나오므로 시각을 전부 적는다(첫 시각만 적으면 나머지를 체력표로 짐작해야 한다).
    codexRow(T('등장'), 전용 + (e.eliteMins ? TF('{n}분에 나타난다', { n: e.eliteMins.join(' · ') })
                              : e.boss ? TF('{n}분에 나타난다', { n: 등장시각 })
                                       : TF('{n}분부터', { n: 등장시각 })));
    codexRow(T('체력'), e.boss ? String(e.hp)
                       : e.eliteHps ? e.eliteHps.join(' · ')   // 두목쥐: 나올 때마다 정해진 값
                       : TF('{a} → {b} ({m}분)', { a: e.hp, b: e.hpLate, m: e.lateMin }));
    codexRow(T('공격력'), String(e.contact));
    codexRow(T('이동 속도'), e.speed === 0 ? T('0 — 안 움직인다') : String(e.speed));
    if (e.range !== null)
      codexRow(T('사거리'), TF('{r} · 열매 피해 {d}', { r: e.range, d: e.shotDamage }));
    // 💣 폭탄쥐(29단계) — 잡으면 남는 도화선. 폭발 피해는 고양이가 맞는 값이다.
    if (e.fuseSec !== null){
      codexRow(T('터지기까지'), TF('{n}초', { n: e.fuseSec }));
      codexRow(T('폭발 반경'), String(e.blastRadius));
      codexRow(T('폭발 피해'), String(e.blastPlayerDamage));
    }
    // 보석 (24단계): 색·모양 표시 · 값 · 나올 확률. 보스는 보석을 안 준다.
    var gk = e.gem && CONFIG.gem.kinds[e.gem];
    codexRow(T('보석'), gk
      ? '<span style="color:' + gk.color + '">' + GEM_KIND_GLYPH[gk.shape] + '</span> ' +
        TF('{kind} · 경험치 {xp} · {pct}%', { kind: T(GEM_KIND_NAME[e.gem] || e.gem), xp: e.xp, pct: e.dropPct })
      : T('없음'));
  }
}
// 도감 보석 줄의 이름·모양 글자. 색은 CONFIG.gem.kinds 에서 읽는다(값을 두 벌 두지 않는다).
var GEM_KIND_NAME = { blue: '파랑', green: '초록', yellow: '노랑', gold: '금색' };
var GEM_KIND_GLYPH = { square: '■', circle: '●', diamond: '◆', star: '★' };

function codexMe(){
  // 26단계: 가지·입은 장비가 반영된 값이다(상점에서 바꾼 것이 다음 판에 걸리는 값과 같다).
  var s = world.playerStats(Save.get().meta, Save.loadout());
  codexSection(T('영구강화 결과'));
  codexRow('\u{2764}\u{FE0F} ' + T('최대 체력'),   s.maxHp.base + ' → ' + shellRound1(s.maxHp.now));
  codexRow('\u{1F4A8} ' + T('이동 속도'),          s.speed.base + ' → ' + s.speed.now);
  codexRow('\u{1F43E} ' + T('공격력'),             '×' + s.damage.base.toFixed(2) + ' → ×' + s.damage.now.toFixed(2));
  codexRow('\u{1F43D} ' + T('젬 줍는 범위'),       s.pickup.base + ' → ' + s.pickup.now);
  codexRow('\u{1F9E0} ' + T('경험치'),             '×' + s.xp.base.toFixed(2) + ' → ×' + s.xp.now.toFixed(2));
  // 가지·장비가 바꾸는 값 — 기본값 그대로인 줄은 안 그린다(가진 게 없는 사람에게는 예전 화면 그대로).
  if (s.taken.now !== s.taken.base)
    codexRow('\u{1F6E1}\u{FE0F} ' + T('받는 피해'), '×' + s.taken.base.toFixed(2) + ' → ×' + s.taken.now.toFixed(2));
  if (s.regen.now !== s.regen.base)
    codexRow('\u{1F343} ' + T('초당 회복'), s.regen.base + ' → ' + shellRound1(s.regen.now));
  if (s.revives.now !== s.revives.base)
    codexRow('\u{1F4AB} ' + T('부활'), TF('{n}회', { n: s.revives.now }));
  if (s.bossDamage.now !== s.bossDamage.base)
    codexRow('\u{1F3AF} ' + T('보스 피해'), '×' + s.bossDamage.base.toFixed(2) + ' → ×' + s.bossDamage.now.toFixed(2));
  if (s.mobDamage.now !== s.mobDamage.base)   // 31단계 — 쥐떼 사냥꾼 · 상의 6단계부터
    codexRow('\u{1F400} ' + T('쥐떼 피해'), '×' + s.mobDamage.base.toFixed(2) + ' → ×' + s.mobDamage.now.toFixed(2));
  if (s.coin.now !== s.coin.base)
    codexRow('\u{1FA99} ' + T('코인'), '×' + s.coin.base.toFixed(2) + ' → ×' + s.coin.now.toFixed(2));
  if (s.reroll.now !== s.reroll.base)
    codexRow('\u{1F3B2} ' + T('다시 뽑기'), s.reroll.base + ' → ' + s.reroll.now);
  if (s.magnetSec.now !== s.magnetSec.base)
    codexRow('\u{1F9F2} ' + T('자석 간격'), TF('{a}초 → {b}초', { a: s.magnetSec.base, b: s.magnetSec.now }));
  if (s.invuln.now !== s.invuln.base)
    codexRow('\u{2728} ' + T('맞은 뒤 무적'), TF('{a}초 → {b}초', { a: s.invuln.base, b: s.invuln.now }));
  if (s.lowHpSpeed.now !== s.lowHpSpeed.base)
    codexRow('\u{1F97F} ' + TF('체력 {n}% 아래 이동 속도', { n: s.lowHpSpeed.belowPct }),
             '×' + s.lowHpSpeed.now.toFixed(2));
  // 입은 장비(26단계). 하나도 안 입었으면 줄을 안 만든다.
  var eq = Save.get().gear.equipped, 입음 = false;
  for (var si = 0; si < CONFIG.gear.slots.length; si++){
    var gid = eq[CONFIG.gear.slots[si]];
    if (!gid) continue;
    if (!입음){ codexSection(T('입은 장비')); 입음 = true; }
    var git = CONFIG.gear.items[gid];
    codexRow(gearIcoHtml(gid, 40, 20) + ' ' + git.name,
             CONFIG.gear.gradeNames[git.grade] + ' · ' + TF('{n}단계', { n: Save.get().gear.owned[gid] }), true);
  }

  /* 이번 판 패시브는 판 중에 열었을 때만 보여준다. 시작 화면 시점의
     world.passives 는 직전 판이 남긴 값일 수 있다 — showStartScreen 은 world 를
     초기화하지 않는다(초기화는 "시작하기" 를 눌러야 일어난다). 그걸 읽으면
     "아직 시작도 안 했는데 발톱갈이 3단계" 가 나온다. */
  if (codexOrigin !== 'pause') return;

  /* 이번 판 무기(23단계 보정, 사용자 요청 — "전투중에 중지 하면 자신의 무기 레벨
     상태랑 패시브 레벨 상태 알려주는 탭도 있으면 좋을 것 같고"). 새 화면을 또
     만들지 않고 이미 "이번 판 패시브" 를 보여주던 이 자리에 무기 칸만 얹었다 —
     아래 패시브 칸과 같은 게이트(codexOrigin==='pause')를 그대로 쓴다.
     WEAPON_IDS 순서로 돈다 — for...in 을 안 쓰는 이유는 core 의 그것과 같다. */
  codexSection(T('이번 판 무기'));
  var 무기있나 = false;
  for (var wi = 0; wi < WEAPON_IDS.length; wi++){
    var wid2 = WEAPON_IDS[wi];
    var wlv = world.weapons[wid2] ? world.weapons[wid2].level : 0;
    if (!wlv) continue;
    무기있나 = true;
    var wcfg = CONFIG.weapons[wid2];
    var 진화중 = world.isEvolved(wid2);
    // 카드·HUD 와 같은 규칙 — 진화했으면 진화형 그림, 아니면 기본형.
    var 무기아이콘url = (진화중 && WEAPON_ICON[wid2]) ? WEAPON_ICON[wid2] : BASE_ICON[wid2];
    var 무기아이콘html = 무기아이콘url
      ? '<img class="wpnIcoSm" src="' + 무기아이콘url + '" alt="">'
      : wcfg.emoji + ' ';
    codexRow(무기아이콘html + wcfg.name,
             'Lv.' + wlv + ' / ' + wcfg.maxLevel + (진화중 ? T(' · 5성 진화') : ''), true);
  }
  if (!무기있나) codexRow(T('아직 없습니다'), '');

  codexSection(T('이번 판 패시브'));
  var 있나 = false;
  for (var id in CONFIG.passives){
    var lv = world.passives[id];
    if (!lv) continue;
    있나 = true;
    var pc = CONFIG.passives[id];
    var 단계칸 = lv + ' / ' + pc.maxLevel;
    // 공식은 core 에 한 벌뿐이다 — 여기 같은 계산이 또 있으면 한쪽만 고쳤을 때
    // 카드와 도감이 다른 숫자를 말한다(실제로 그런 상태였다).
    var 효과 = world.passiveEffectAt(id, lv);
    if (효과) 단계칸 += ' · ' + 효과.label + ' ' + 효과.text;
    codexRow((PASSIVE_ICON[id]
                ? '<img class="wpnIcoSm" src="' + PASSIVE_ICON[id] + '" alt="">'
                : pc.emoji + ' ') + pc.name, 단계칸, true);
  }
  if (!있나) codexRow(T('아직 없습니다'), '');
}

/* 패시브 도감. 무기 탭과 같은 모양이다 — 안 가진 것도 Lv.1 → 만렙 을 미리 다 보여준다.
   '나' 탭의 "이번 판 패시브" 와 역할이 다르다: 그건 지금 내 것, 이건 목록 전체다. */
function codexPassives(){
  codexNote(TF('레벨업 카드로 얻습니다. 한 판에 <b>{n}칸</b>까지 들고 갈 수 있습니다.',
               { n: CONFIG.level.slotsPassive }));
  for (var i = 0; i < PASSIVE_IDS.length; i++){
    var id = PASSIVE_IDS[i];
    var pc = CONFIG.passives[id];
    if (!pc) continue;
    codexSectionIco(PASSIVE_ICON[id], pc.emoji, pc.name);
    var e1 = world.passiveEffectAt(id, 1);
    var eM = world.passiveEffectAt(id, pc.maxLevel);
    if (e1 && eM)
      codexRow('Lv.1 → Lv.' + pc.maxLevel, e1.label + ' ' + e1.text + ' → ' + eM.text, true);
  }
  // 낮잠만 한계가 따로 있다. 안 적으면 "5단계면 ×0.70" 이 어디서 나온 값인지 알 수 없다.
  var nap = CONFIG.passives.nap;
  if (nap && typeof nap.minMult === 'number')
    codexNote(TF('\u{1F4A4} 낮잠은 아무리 올려도 공격 주기가 원래의 <b>×{n}</b> 아래로는 안 내려갑니다.',
                 { n: nap.minMult.toFixed(2) }));
}

/* 상점. 결과 화면·시작 화면에서 들어오고, 나가면 연 곳으로 돌아간다(shopOrigin).
   26단계: 네 탭(강화 · 무기 · 장비 · 뽑기). 도감(showCodex)과 같은 틀 — 위에 탭 버튼을 두고 누를 때마다
   아래를 다시 그린다. tab 을 안 주면(사고 나서 다시 그릴 때·치트·이름 바꾸기) 보던 탭 그대로다. */
var shopTab = 'up';
var lastGacha = null;   // 방금 뽑은 결과 — 뽑기 탭이 보여 준다. 상점을 닫으면 비운다.
function showShop(tab){
  stopGearPreview();   // 27단계: 다시 그릴 때마다 먼저 — 아래에서 장비 탭일 때만 새로 건다
  closeGachaResult();  // 27단계 덧붙임: 결과창은 body 에 붙어 있어 아래 cardsEl 비우기로는 안 사라진다
  /* 보던 자리. 상점을 새로 열거나 탭을 바꿀 때는 맨 위(0)에서 시작한다 — 스크롤이 남아 있으면 제목·잔액이
     화면 위로 밀려 사라진다. **같은 탭을 다시 그릴 때**(사기 · 강화 · 입기 직후)는 보던 자리를 지킨다.
     31단계에서 장비 탭이 길어진 뒤 "강화를 누르면 맨 위로 올라가 불편하다"는 사용자 말로 고쳤다 —
     아래쪽 장비를 연달아 올리려면 누를 때마다 다시 내려가야 했다. 맨 끝에서 되돌린다(내용을 다 그린 뒤). */
  var 보던자리 = (inShop && (!tab || tab === shopTab)) ? overlay.scrollTop : 0;
  if (tab) shopTab = tab;
  atStartScreen = false;   // 상점을 보는 동안은 시작 화면이 아니다 (닫으면 shopOrigin 이 돌려보낸다)
  var d = Save.get();
  overlayTitle.textContent = T('상점');
  overlayStat.innerHTML = TF('\u{1FA99} 모은 코인 {n}', { n: d.coins });
  overlayStat.innerHTML += '<br><small>' + T('이름: ') +
    escapeHtml(Player.get().name || T('이름없음')) +
    ' <a href="#" id="renameLink" style="color:#8cf">' + T('바꾸기') + '</a></small>';
  var rl = document.getElementById('renameLink');
  if (rl) rl.onclick = function(e){
    e.preventDefault();
    var v = window.prompt(T('새 이름 (20자까지)'), Player.get().name);
    if (v !== null){ Player.setName(v); showShop(); }
    return false;
  };
  cardsEl.style.display = 'flex';
  rerollBtn.style.display = 'none';
  cardsEl.innerHTML = '';
  var 탭들 = [{ id: 'up', nm: T('강화') }, { id: 'weapon', nm: T('무기') },
              { id: 'gear', nm: T('장비') }, { id: 'gacha', nm: T('뽑기') }];
  for (var t = 0; t < 탭들.length; t++){
    (function(c){
      var 지금 = (c.id === shopTab);
      // 지금 탭은 disabled + selected — 도감 탭과 같은 강조(appendCard 의 'card sel')
      var el = appendCard('<div class="nm">' + c.nm + '</div>',
                          function(){ showShop(c.id); }, 지금, 지금);
      el.className += ' codexTab';
    })(탭들[t]);
  }
  // 탭 줄을 여기서 끊는다 — 탭 아래 첫 카드가 좁아도 탭과 같은 줄에 끼어들지 않게(.rowBreak 주석)
  var 줄끊기 = document.createElement('div');
  줄끊기.className = 'rowBreak';
  cardsEl.appendChild(줄끊기);
  if (shopTab === 'weapon')     shopWeapons(d);
  else if (shopTab === 'gear')  shopGear(d);
  else if (shopTab === 'gacha') shopGacha(d);
  else                          shopUpgrades(d);
  // 상점만 닫기를 왼쪽 위 붙박이에 둔다. 카드가 10장 넘어서 맨 아래 닫기는
  // 폰에서 한참 내려야 닿는다. 아래 닫기는 감춰 둘이 같이 보이지 않게 한다.
  headClose.style.display = 'block';
  overlayBtn.style.display = 'none';
  shopBtn.style.display = 'none';
  overlay.classList.add('on');
  paused = true;
  inShop = true;
  if (shopTab === 'gear') startGearPreview();   // 캔버스가 문서에 붙은 뒤라야 찾을 수 있다
  overlay.scrollTop = 보던자리;   // 새로 열었거나 탭을 바꿨으면 0, 같은 탭을 다시 그렸으면 보던 자리
}

/* 강화 탭 — 지금의 다섯 줄기 카드. 각 줄기 바로 밑에 그 줄기의 가지 카드가 붙는다(26단계).
   가지는 들여쓰고 왼쪽 선을 둘러 "딸린 것" 임이 보이게 한다(.card.branch). */
function shopUpgrades(d){
  var keys = ['power', 'maxHp', 'speed', 'magnet', 'xpGain'];
  for (var i = 0; i < keys.length; i++){
    (function(key){
      var m = CONFIG.meta[key];
      var step = d.meta[key];
      var cost = Save.costOf(key);
      var buyable = (cost !== null && d.coins >= cost);
      // 지금 효과 → 사면 될 효과. 단계가 10까지 늘어나면 숫자만으로는
      // 얼마나 세졌는지 감이 안 온다.
      var nowText = metaEffectText(key, step);
      var effect = (cost === null)
        ? nowText + T(' (최대)')
        : nowText + ' → ' + metaEffectText(key, step + 1);
      var 줄기카드 = appendCard('<div class="ico">' + m.emoji + '</div>' +
                 '<div class="nm">' + m.name + '</div>' +
                 '<div class="lv">' + T('줄기') + ' · ' + step + ' / ' + CONFIG.meta.maxStep + '</div>' +
                 '<div class="ds">' + m.desc + '<br>' + effect + '<br>' +
                 (cost === null ? T('최대 강화') : '\u{1FA99} ' + cost) + '</div>',
                 function(){
                   if (Save.buy(key)) showShop();     // 사고 나서 화면을 다시 그린다
                 }, !buyable);
      줄기카드.className += ' trunk';
      // 이 줄기의 가지들. tree.order 고정 순서(for...in 금지).
      // 묶음 상자: 가지가 하나라도 있으면 줄기가 상자의 머리(grp)가 되고, 마지막 가지가 바닥(last)이 된다.
      var 마지막가지 = null;
      for (var b = 0; b < CONFIG.tree.order.length; b++){
        var bid = CONFIG.tree.order[b];
        if (CONFIG.tree[bid].trunk === key) 마지막가지 = shopBranchCard(d, bid);
      }
      if (마지막가지){ 줄기카드.className += ' grp'; 마지막가지.className += ' last'; }
    })(keys[i]);
  }
}

// 가지 카드 한 장. 못 여는 가지는 여는 조건을 적고 흐리게, 열린 가지는 단계·효과·값.
function shopBranchCard(d, id){
  var b = CONFIG.tree[id], m = CONFIG.meta[b.trunk];
  var 머리 = '<div class="nm">' + b.emoji + ' ' + b.name + '</div>';
  if (d.meta[b.trunk] < b.needStep){
    var 잠긴 = appendCard(머리 + '<div class="ds">' +
               TF('\u{1F512} {name} {n}단계에서 열립니다', { name: m.name, n: b.needStep }) +
               '<br>' + b.desc + '</div>', null, true);
    잠긴.className += ' branch';
    return 잠긴;
  }
  var step = d.tree[id];
  var cost = treeCostOf(id, step);
  var now = window.CatCore.treeEffectAt(id, step);
  var 효과 = (cost === null)
    ? now.label + ' ' + now.text + T(' (최대)')
    : now.label + ' ' + now.text + ' → ' + window.CatCore.treeEffectAt(id, step + 1).text;
  var 카드 = appendCard(머리 +
             '<div class="lv">' + TF('{name}의 가지 · 단계 {a} / {b}', { name: m.name, a: step, b: b.maxStep }) + '</div>' +
             '<div class="ds">' + b.desc + '<br>' + 효과 + '<br>' +
             (cost === null ? T('최대 강화') : '\u{1FA99} ' + cost) + '</div>',
             function(){ if (Save.buyTree(id)) showShop(); },
             cost === null || d.coins < cost);
  카드.className += ' branch';
  return 카드;   // 부르는 쪽이 그 줄기의 마지막 가지에 last 를 붙여 묶음 상자의 바닥으로 삼는다
}

// 무기 탭 — 예전 상점 아래쪽의 시작 무기 목록을 그대로 옮겼다.
function shopWeapons(d){
  var 제목 = document.createElement('div');
  제목.className = 'shopSection';
  제목.textContent = T('시작 무기');
  cardsEl.appendChild(제목);
  codexNote(T('강화·패시브를 뺀 기본 수치입니다.'));
  for (var wi = 0; wi < WEAPON_IDS.length; wi++){
    (function(id){
      var wcfg = CONFIG.weapons[id];
      var cost = Save.starterCostOf(id);
      var owned = Save.isUnlocked(id);
      var equipped = (Save.starter() === id);
      var 아랫줄;
      if (equipped)   아랫줄 = '<b>' + T('장착 중') + '</b>';
      else if (owned) 아랫줄 = T('장착하기');
      else            아랫줄 = '\u{1FA99} ' + cost;
      // Lv1 기준 기본값을 보여준다(영구강화·패시브 미포함). 상점은 무기끼리
      // 비교하는 자리이고, 배수는 전부에게 똑같이 붙어서 순위를 안 바꾼다.
      var f1 = world.weaponFeatureAt(id, 1);
      var 수치 = TF('공격력 {n}', { n: shellRound1(world.weaponBaseDamageAt(id, 1)) });
      if (f1) 수치 += ' · ' + f1.label + ' ' + f1.value + f1.unit;
      appendCard('<div class="ico">' + weaponIcoHtml(id, wcfg.emoji) + '</div>' +
                 '<div class="nm">' + wcfg.name + '</div>' +
                 '<div class="ds">' + wcfg.desc + '<br>' + 수치 + '<br>' + 아랫줄 + '</div>',
                 function(){
                   if (equipped) return;
                   // 사면 바로 장착한다 — 산 걸 또 눌러야 쓰이는 건 헷갈린다.
                   if (!owned && !Save.buyStarter(id)) return;
                   Save.equipStarter(id);
                   showShop();                 // 사고 나서 화면을 다시 그린다
                 },
                 equipped || (!owned && d.coins < cost),
                 equipped);
    })(WEAPON_IDS[wi]);
  }
}

// 장비 카드의 효과 한 줄. 공식은 core 의 gearEffectRows 한 벌뿐이다(뽑기 결과·도감과 같은 숫자).
function gearEffectLine(id, lv){
  var rows = window.CatCore.gearEffectRows(id, lv), out = [];
  for (var i = 0; i < rows.length; i++) out.push(rows[i].label + ' ' + rows[i].text);
  return out.join(' · ');
}

/* 27단계: 장비 탭 미리보기 고양이 — 70ms 마다 한 칸씩(시험판 UI 와 같다). 상점은 판이 멈춘 화면이라
   여기서는 굽지 않고 매번 찍는다(26×32 칸, 판 안 render 와는 상관없다).
   gearPreviewLift 는 showShop() 재렌더를 넘어 살아 있어야 한다 — 입는 순간 화면을 다시 그리기 때문이다.
   타이머는 showShop 이 다시 그릴 때마다 먼저 지우고(stopGearPreview), 장비 탭일 때만 새로 건다.
   상점을 닫는 길이 여럿이라(닫기 · 치트 · 다른 화면이 cardsEl 을 비움) 콜백이 매번 캔버스가 아직
   문서에 붙어 있는지 보고, 없으면 스스로 멈춘다. */
var gearPreviewTimer = null, gearPreviewStep = 0, gearPreviewLift = { hat: 0, top: 0 };
function stopGearPreview(){
  if (gearPreviewTimer !== null){ clearInterval(gearPreviewTimer); gearPreviewTimer = null; }
}
// 그렸으면 true. 캔버스가 문서에 없으면(탭을 바꿨거나 상점을 닫았다) 타이머를 멈추고 false.
function paintGearPreview(){
  var cv = document.getElementById('gearPreview');
  if (!cv || !cv.getContext){ stopGearPreview(); return false; }
  var cc = ART.CAT_CANVAS, fi = Math.floor(gearPreviewStep / 4) % 4;
  var px = ART.composeCat(ART.SPRITES.cat[fi], ART.CAT_ARMS[fi], ART.CAT_SKINS.cheese,
                          Save.get().gear.equipped, gearPreviewLift);
  var g = cv.getContext('2d');
  g.clearRect(0, 0, cc.w, cc.h);
  for (var i = 0; i < px.length; i++){
    if (!px[i]) continue;
    g.fillStyle = px[i];
    g.fillRect(i % cc.w, (i / cc.w) | 0, 1, 1);
  }
  return true;
}
function startGearPreview(){
  stopGearPreview();
  if (!paintGearPreview()) return;
  gearPreviewTimer = setInterval(function(){
    gearPreviewStep++;
    if (gearPreviewLift.hat > 0) gearPreviewLift.hat--;
    if (gearPreviewLift.top > 0) gearPreviewLift.top--;
    paintGearPreview();
  }, 70);
}

/* 장비 탭 — 위에 부위 세 칸(지금 입은 것), 아래에 12종을 부위별로.
   가진 것은 단계 · 효과 · 입기(입은 것은 "입는 중" — 누르면 벗는다).
   없는 것도 이름·효과는 보이고 "뽑기에서 나옵니다" 로 흐리게 — 무엇을 노리고 뽑을지 보여야 한다.
   등급은 테두리 색(.g-normal …)과 등급 글자로 같이 적는다(색만으로는 색약에게 안 읽힌다). */
function shopGear(d){
  var gc = CONFIG.gear, si, slot, id;
  codexSection(T('입은 장비'));
  // 27단계: 미리보기 고양이. 카드(button)가 아닌 칸이라 눌리지도, 흐린 카드처럼 보이지도 않는다.
  // 움직이는 것은 showShop 끝의 startGearPreview 가 건다.
  var 미리보기 = document.createElement('div');
  미리보기.className = 'gearPreviewBox';
  미리보기.innerHTML = '<canvas id="gearPreview" width="' + ART.CAT_CANVAS.w + '" height="' + ART.CAT_CANVAS.h + '"></canvas>';
  cardsEl.appendChild(미리보기);
  for (si = 0; si < gc.slots.length; si++){
    slot = gc.slots[si];
    id = d.gear.equipped[slot];
    var it = id ? gc.items[id] : null;
    // 누를 일이 없는 칸이라 onActivate 없이 둔다(흐리게 만들지 않으려고 disabled 도 안 준다).
    appendCard('<div class="ico">' + (it ? gearIcoHtml(id, 60, 30) : gc.slotEmoji[slot]) + '</div>' +
               '<div class="nm">' + gc.slotNames[slot] + '</div>' +
               '<div class="ds">' + (it ? it.name + '<br>' + TF('{n}단계', { n: d.gear.owned[id] })
                                        : T('비어 있음')) + '</div>',
               null, false).className += ' slot' + (it ? ' g-' + it.grade : '');
  }
  for (si = 0; si < gc.slots.length; si++){
    slot = gc.slots[si];
    codexSection(gc.slotEmoji[slot] + ' ' + gc.slotNames[slot]);
    for (var gi = 0; gi < gc.order.length; gi++){
      if (gc.items[gc.order[gi]].slot !== slot) continue;
      (function(id, slot){
        var it = gc.items[id];
        var lv = d.gear.owned[id];
        var owned = typeof lv === 'number';
        var 입음 = d.gear.equipped[slot] === id;
        var 아랫줄 = !owned ? T('뽑기에서 나옵니다')
                   : 입음 ? '<b>' + T('입는 중') + '</b> · ' + T('누르면 벗기')
                          : T('입기');
        var 조각 = owned && d.gear.copies && d.gear.copies[id] > 0 ? d.gear.copies[id] : 0;   // 31단계
        var 장비카드 = appendCard('<div class="ico">' + gearIcoHtml(id, 78, 40) + '</div>' +
                   '<div class="nm">' + it.name + '</div>' +
                   '<div class="lv">' + gc.gradeNames[it.grade] +
                     (owned ? ' · ' + lv + ' / ' + gc.maxLevel : '') +
                     (조각 ? ' · ' + TF('조각 {n}', { n: 조각 }) : '') + '</div>' +
                   '<div class="ds">' + gearEffectLine(id, owned ? lv : 1) + '<br>' + 아랫줄 + '</div>',
                   function(){
                     if (입음) Save.unequipGear(slot);
                     // 입을 때만 모자·상의가 5칸 위에서 떨어져 앉는다(벗을 때·신발은 그 자리에서)
                     else if (Save.equipGear(id) && slot !== 'shoes') gearPreviewLift[slot] = 5;
                     rebakePlayerCat(Save.get().gear.equipped);
                     showShop();
                   }, !owned);
        장비카드.className += ' gear g-' + it.grade + (입음 ? ' worn' : '');
        // 묶음 상자: 강화 카드가 붙으면 장비 카드가 상자의 머리(grp)가 된다.
        if (owned && lv < gc.maxLevel && shopGearUpgradeCard(d, id, lv, 조각)) 장비카드.className += ' grp';
      })(gc.order[gi], slot);
    }
  }
}

/* 31단계 — 강화 카드. 가진 장비(최대 단계 미만) 카드 **바로 뒤의 형제 카드** 한 장.
   장비 카드와 틈 없이 붙어 한 상자가 된다(위가 장비, 아래가 강화 — .card.upg 주석). 테두리는 장비의 등급 색.
   ⚠️ class 에 gear·worn 글자를 넣지 않는다 — 기존 화면 시험이 그 글자로 장비 카드를 찾는다(장비 이름도 안 넣는다).
   내용: 다음 단계 · 조각 지금/필요 · 코인 · 효과 지금 → 다음. 모자라면 글자를 흐리게 하고 무엇이 모자란지 적는다.
   만든 카드를 돌려준다(없으면 null) — 부르는 쪽이 장비 카드를 상자의 머리(grp)로 만든다. */
function shopGearUpgradeCard(d, id, lv, 조각){
  var cost = gearUpgradeCost(id, lv);
  if (!cost) return null;
  var 조각줄 = cost.copies === 0 ? T('조각 필요 없음') : TF('조각 {a} / {b}', { a: 조각, b: cost.copies });
  var 모자람 = [];
  if (조각 < cost.copies) 모자람.push(TF('조각이 {n}개 모자랍니다', { n: cost.copies - 조각 }));
  if (d.coins < cost.coins) 모자람.push(T('코인이 모자랍니다'));
  var 카드 = appendCard('<div class="nm">\u{2B06}\u{FE0F} ' + TF('{n}단계로', { n: lv + 1 }) + '</div>' +
             '<div class="ds">' + 조각줄 + ' · \u{1FA99} ' + cost.coins.toLocaleString('en-US') +
             '<br>' + gearUpgradeEffect(id, lv) +
             (모자람.length ? '<br>' + 모자람.join(' · ') : '') + '</div>',
             function(){ if (Save.upgradeGear(id)) showShop('gear'); },
             모자람.length > 0);
  카드.className += ' upg g-' + CONFIG.gear.items[id].grade;
  return 카드;
}

// 강화 카드의 효과 줄: 바뀌는 줄만 "이름 지금 → 다음". 6단계에 처음 붙는 공격 효과는 +0% 에서 시작한다.
function gearUpgradeEffect(id, lv){
  var now = window.CatCore.gearEffectRows(id, lv), next = window.CatCore.gearEffectRows(id, lv + 1), out = [];
  for (var i = 0; i < next.length; i++){
    var before = '+0%';
    for (var j = 0; j < now.length; j++) if (now[j].label === next[i].label){ before = now[j].text; break; }
    if (before !== next[i].text) out.push(next[i].label + ' ' + before + ' → ' + next[i].text);
  }
  return out.join(' · ');
}

/* 뽑기 탭 — 잔액은 위 머리글에 있다. 1회·10회 두 카드, 지금 뽑기 레벨의 확률표 네 줄,
   다음 레벨까지 · 레전더리 확정까지 남은 횟수, 방금 뽑은 결과(15단계 수치 공개 원칙 — 감추지 않는다). */
function shopGacha(d){
  var gc = CONFIG.gacha, gr = CONFIG.gear;
  var 묶음 = [{ n: 1, price: gc.price, nm: T('1회 뽑기') }, { n: 10, price: gc.tenPrice, nm: T('10회 뽑기') }];
  for (var i = 0; i < 묶음.length; i++){
    (function(c){
      appendCard('<div class="ico">\u{1F381}</div>' +
                 '<div class="nm">' + c.nm + '</div>' +
                 '<div class="ds">\u{1FA99} ' + c.price.toLocaleString('en-US') + '</div>',
                 function(){
                   var res = Save.gachaPull(c.n);
                   if (!res) return;
                   lastGacha = res;
                   Sound.boxPick();   // 새 소리를 안 만들고 상자 소리를 같이 쓴다(자석과 같은 방식)
                   showShop('gacha');
                   // 결과창은 다시 그린 뒤에 띄운다 — showShop 이 맨 먼저 결과창을 닫기 때문이다
                   showGachaResult(res);
                 }, d.coins < c.price);
    })(묶음[i]);
  }
  var li = window.CatCore.gachaLevelAt(d.gacha.pulls);
  var lvs = gc.levels;
  codexSection(TF('뽑기 레벨 {n}', { n: li + 1 }));
  for (var g = 0; g < gr.grades.length; g++)
    codexRow('<span class="gtag g-' + gr.grades[g] + '">' + gr.gradeNames[gr.grades[g]] + '</span>',
             lvs[li].prob[g] + '%', true);
  codexRow(T('다음 레벨까지'), li + 1 < lvs.length
           ? TF('{n}번', { n: lvs[li + 1].atPulls - d.gacha.pulls }) : T('최고 레벨'), true);
  codexRow(T('레전더리 확정까지'), TF('{n}번', { n: gc.pity - d.gacha.pity }), true);
  // 31단계: 중복은 단계 대신 조각 — 최대 단계가 10 이 됐다. 숫자는 표에서 읽는다.
  codexNote(TF('레전더리 없이 {n}번째가 되면 반드시 레전더리가 나옵니다. 가진 장비가 또 나오면 조각이 되고, {m}단계면 코인으로 돌려받습니다.',
               { n: gc.pity, m: gr.maxLevel }));
  codexNote(T('\u{1F9E9} 중복은 조각이 됩니다 — 장비 탭에서 조각과 코인을 내고 강화하세요.'));
  if (lastGacha && lastGacha.length){
    codexSection(T('방금 뽑은 것'));
    for (var r = 0; r < lastGacha.length; r++){
      var x = lastGacha[r], it = gr.items[x.id];
      var 결과 = x.kind === 'new'  ? '\u{2728} ' + T('새 장비')
               : x.kind === 'copy' ? '\u{1F9E9} ' + T('조각 +1')
                                   : '\u{1FA99} ' + TF('환급 {n}', { n: x.refund });
      codexRow(gearIcoHtml(x.id, 40, 20) + ' <span class="gtag g-' + x.grade + '">' + gr.gradeNames[x.grade] + '</span> ' + it.name,
               결과, true);
    }
    appendCard('<div class="nm">' + T('장비 입으러 가기') + '</div>',
               function(){ showShop('gear'); }, false);
  }
}

/* 27단계 덧붙임: 뽑기 결과창. 뽑아도 아래쪽에 글자 줄만 늘어 뽑은 맛이 없었다(사용자 의견).
   상점 위를 통째로 어둡게 덮고 뽑은 장비를 한 장씩 차례로(90ms 간격) 보여 준다.
   누르기: 다 나오기 전이면 남은 장을 한꺼번에, 다 나온 뒤면 닫기. Esc · Enter · Space 도 같다.
   - 뜬 뒤 250ms 동안의 누름은 무시한다 — 뽑기 버튼을 누른 그 손가락(겹쳐 들어온 클릭)이 바로 닫지 않게.
   - 사람이 닫을 때만 카드 잠금 300ms 를 건다 — 닫는 누름이 아래 카드(뽑기 버튼)를 이어서 누르지 않게.
     showShop · closeShop 이 정리로 닫을 때는 안 건다(탭을 바꾸고 바로 누르는 것을 막을 이유가 없다).
   - 결과창은 cardsEl 밖(body)에 붙어서 cardsEl 을 비워도 안 사라진다. 그래서 showShop 이 다시 그릴 때마다,
     closeShop 이 닫을 때마다 먼저 closeGachaResult 를 부른다. 타이머 콜백도 결과창이 문서에 없으면 스스로 멈춘다.
   "방금 뽑은 것" 줄은 기록으로 그대로 남는다(닫으면 뽑기 탭 그대로). */
var gachaResultTimer = null, gachaResultKey = null;
function closeGachaResult(){
  if (gachaResultTimer !== null){ clearTimeout(gachaResultTimer); gachaResultTimer = null; }
  if (gachaResultKey){ window.removeEventListener('keydown', gachaResultKey); gachaResultKey = null; }
  var el = document.getElementById('gachaResult');
  if (el) document.body.removeChild(el);
}
function showGachaResult(results){
  closeGachaResult();
  if (!results || !results.length) return;
  var gr = CONFIG.gear, 한장 = results.length === 1;
  var box = document.createElement('div');
  box.id = 'gachaResult';
  box.className = 한장 ? 'one' : 'many';
  var 제목 = document.createElement('div');
  제목.className = 'grTitle';
  제목.textContent = T('뽑기 결과');
  box.appendChild(제목);
  var 판 = document.createElement('div');
  판.className = 'grTiles';
  var tiles = [];
  for (var i = 0; i < results.length; i++){
    var x = results[i], it = gr.items[x.id];
    var 결과 = x.kind === 'new'  ? '\u{2728} ' + T('새 장비')
             : x.kind === 'copy' ? '\u{1F9E9} ' + T('조각 +1')   // 31단계 — 중복은 조각
                                 : '\u{1FA99} ' + TF('환급 {n}', { n: x.refund });
    var tile = document.createElement('div');
    tile.className = 'grTile g-' + x.grade;
    // 정수 배 상자: 10장일 때 375px 폰의 한 장(약 65px) 안에 들어가는 크기, 1장일 때는 크게
    tile.innerHTML = '<div class="ico">' + (한장 ? gearIcoHtml(x.id, 130, 72) : gearIcoHtml(x.id, 52, 30)) + '</div>' +
                     '<div class="nm">' + it.name + '</div>' +
                     '<div class="rs">' + 결과 + '</div>';
    판.appendChild(tile);
    tiles.push(tile);
  }
  box.appendChild(판);
  var 안내 = document.createElement('div');
  안내.className = 'grHint';
  안내.textContent = T('아무 데나 눌러 닫기');
  box.appendChild(안내);
  document.body.appendChild(box);
  // 뽑기 버튼은 다시 그리면서 사라졌지만, 혹시 남은 포커스가 Enter·Space 로 아래 버튼을 누르지 않게
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  void box.offsetWidth;   // 작게 시작하는 모습을 한 번 계산시킨다 — 안 하면 첫 장이 transition 없이 뜬다

  var 뜬때 = Date.now(), 나온 = 0;
  function 하나더(){ tiles[나온].className += ' on'; 나온++; }
  function 다나옴(){
    if (gachaResultTimer !== null){ clearTimeout(gachaResultTimer); gachaResultTimer = null; }
    while (나온 < tiles.length) 하나더();
    box.className += ' done';
  }
  function 차례(){
    gachaResultTimer = null;
    if (document.getElementById('gachaResult') !== box) return;   // 닫혔거나 다른 결과창으로 바뀌었다
    하나더();
    if (나온 < tiles.length) gachaResultTimer = setTimeout(차례, 90);
    else box.className += ' done';
  }
  function 누름(e){
    if (e && e.preventDefault) e.preventDefault();
    if (document.getElementById('gachaResult') !== box) return;
    if (Date.now() - 뜬때 < 250) return;
    if (나온 < tiles.length){ 다나옴(); return; }
    카드잠금까지 = Date.now() + 300;
    closeGachaResult();
  }
  box.addEventListener('click', 누름);
  gachaResultKey = function(e){
    if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') 누름(e);
  };
  window.addEventListener('keydown', gachaResultKey);
  // 움직임 줄이기를 켠 사람에게는 한꺼번에 보여 준다
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) 다나옴();
  else 차례();
}

document.getElementById('pauseBtn').addEventListener('click', function(e){
  e.preventDefault();
  togglePause();
});

muteBtn.textContent = Sound.isMuted() ? '\u{1F507}' : '\u{1F50A}';
muteBtn.addEventListener('click', function(e){
  e.preventDefault();
  muteBtn.textContent = Sound.toggleMute() ? '\u{1F507}' : '\u{1F50A}';
});

window.addEventListener('keydown', function(e){
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
});

/* 폰에서 전화가 오거나 홈으로 나가면 여기가 불린다. 이 순간 저장해두지 않으면
   탭이 정리될 때 그 판이 통째로 사라진다 — 이 기능을 만든 이유가 이것이다.
   모바일에서 beforeunload 는 안 불리는 경우가 많아 쓰지 않는다. */
function onLeaving(){
  if (askingName) return;        // 이름 화면 중이면 그 화면을 그대로 둔다
  if (world.gameOver || world.cleared || inShop || inCodex || inAch) return;
  if (pendingRun) return;        // 이어할지 묻는 중이면 그 물음을 그대로 둔다
  if (atStartScreen) return;     // 시작 화면 중이면 그 화면을 그대로 둔다 (아직 시작 전이라 저장할 것도 없다)
  saveRun();
  if (!paused) showPause();
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') onLeaving();
});
window.addEventListener('pagehide', onLeaving);

shopBtn.addEventListener('click', function(){ shopOrigin = 'result'; showShop(); });   // 결과 화면의 상점 버튼

/* 상점에서 나가면 열었던 곳(결과 화면 또는 시작 화면)으로 돌아간다.
   왼쪽 위 닫기와 아래 닫기가 같은 일을 해야 하므로 함수로 뺐다. */
function closeShop(){
  stopGearPreview();   // 27단계: 콜백이 스스로도 멈추지만, 닫는 순간 바로 끊는다
  closeGachaResult();
  inShop = false;
  lastGacha = null;   // 다음에 열면 지난 뽑기 결과가 "방금" 처럼 남아 있지 않게
  headClose.style.display = 'none';   // 상점 밖에서는 이 버튼이 보이면 안 된다
  cardsEl.innerHTML = '';
  cardsEl.style.display = 'none';
  shopBtn.style.display = 'block';
  if (shopOrigin === 'start'){ showStartScreen(); return; }
  if (world.cleared) showCleared(); else showGameOver();
}

headClose.addEventListener('click', function(){
  if (inShop) closeShop();
  else if (inCodex) closeCodex();
  else if (inAch) closeAchievements();
});

/* 새 판을 시작한다. **한 곳에 모아 둔다.**
   시작 경로가 여럿이고(다시 하기 · 저장이 없는 첫 판 · 이어하기 화면의 새로 시작 ·
   일시정지의 처음부터) 여기서 하는 일이 열 줄 가까이 된다. 경로마다 복사해 두면
   한 곳만 빠뜨려도 조용히 깨진다 — 9단계에 실제로 그런 버그가 있었다.
   판 고유번호를 안 만든 경로의 판이 통째로 서버에서 거부됐고, 게임에는
   아무 증상이 없어서 아무도 몰랐다(계획/9-기록수집과-대시보드.md). */
/* 판 상태를 새 판으로 되돌린다. **화면은 안 건드린다** — 여기서 나가는 곳이
   둘이기 때문이다(바로 시작하거나, 시작 화면으로 가거나). */
function 새판준비(){
  var lo = Save.loadout();
  world.applyMeta(Save.get().meta, lo);   // 상점에서 산 강화·가지·입은 장비를 다음 판에 반영.
                                      // reset 만으로는 안 된다 — metaMult 는 applyMeta 가 갱신한다.
                                      // 빠지면 코인은 나갔는데 그 판에 효과가 없다.
  rebakePlayerCat(lo.gear.equipped);  // 27단계: 겉모습도 능력치와 같은 객체에서 굽는다
  world.reset(Save.starter(), Save.stage());   // 상점에서 방금 장착했을 수도 있는 시작 무기와
                                               // 마지막에 고른 스테이지(25단계)를 반영
  world.setLootSeed((Math.random() * 0x7fffffff) | 0);   // 판마다 다른 보석 운 (첫 reset 옆 주석)
  syncSoundTrackers();   // 새 판은 딜량 0·보스 없음 — 이전 판 값이 남아있지 않게 동기화
  catLastX = null;   // 이전 판 좌표가 남아있으면 안 되므로 리셋할 때마다 걸음 추적을 함께 비운다
  RunSave.clear();                   // 새 판을 시작하니 옛 저장은 버린다
  runBanked = false;
  runTainted = false;
  runResumed = false;                // 새 판이다(32단계)
  lastEarnedAchievements = [];       // 지난 판 결과 화면의 도전과제 줄이 새 판에 안 새게
  stageJustUnlocked = false;         // "스테이지 2가 열렸습니다" 도 같은 이유로 비운다
  runUid = 새판고유번호();
}

function 새판시작(){
  새판준비();
  isPauseScreen = false;
  pauseConfirmRestart = false;
  atStartScreen = false;
  overlay.classList.remove('on');
  cardsEl.innerHTML = '';            // 일시정지 화면에서 왔다면 그 카드를 치운다
  cardsEl.style.display = 'none';
  shopBtn.style.display = 'block';
  overlayBtn.style.display = 'block';
  paused = false;
  lastTime = 0;
}

overlayBtn.addEventListener('click', function(){
  if (askingName) return;               // 이름 화면 중엔 onclick 쪽 핸들러만 돈다
  if (isPauseScreen){ resumeFromPause(); return; }
  if (inShop){ closeShop(); return; }
  if (inCodex){ closeCodex(); return; }
  if (inAch){ closeAchievements(); return; }
  /* 클리어 결과 화면의 버튼은 "홈으로" 다 — 판을 새로 준비해 두고 시작 화면만 띄운다
     (일시정지의 "처음부터" · 결과 화면의 "스테이지 고르기" 와 같은 수법). 새판준비가 world 를
     되돌리므로 world.cleared 는 여기서 꺼지고, 시작 화면에서의 다음 누름은 아래 새판시작으로 간다.
     wasIdle 을 내리는 이유도 같다 — 안 내리면 시작 화면 뒤에 깬 판의 배경·HUD 가 남는다. */
  if (world.cleared){
    새판준비();
    paused = true;
    wasIdle = false;
    showStartScreen();
    return;
  }
  새판시작();
});

// 딜량 총합·보스 유무를 지난 프레임과 비교해 타격·보스 등장 소리를 낸다.
// world.dmgBy·world.boss 는 core 상태를 읽기만 한다 — core 는 안 건드린다.
// 우유 웅덩이(field)·꼬리 회전(orbit)은 켜져 있는 동안 매 프레임 계속 딜이 들어간다.
// 이 둘을 타격음 집계에 넣으면 "때리는 순간"이 아니라 끊이지 않는 배경음이 되어버려서
// (2026-08-05 실측: 무기 여럿 갖춘 구간 분당 200회, 재생 간격 중앙값 266ms로 소리가
// 중구난방으로 들림 — 사용자 피드백), 지속딜 종류는 타격음 트리거에서 뺀다.
// 토네이도(kind는 projectile)도 같은 부류다 — hitCooldownMs로 회오리 안에 머무는 적을
// 계속 재타격하는 "재타격형" 무기라, 꼬리 회전과 똑같이 끊임없이 딜이 들어간다
// (설정 주석: "꼬리 회전이 쓰는 hitCooldownMs 패턴을 그대로 따랐다"). kind가 아니라
// hitCooldownMs 유무로 판정해야 이런 무기를 놓치지 않는다.
// nuke·'?'(이름표 누락)처럼 CONFIG.weapons에 없는 항목은 그대로 둔다 — 배제 대상이 아니다.
var CONTINUOUS_HIT_KINDS = { field: true, orbit: true };
var HIT_SOUND_IDS = DAMAGE_IDS.filter(function(id){
  var w = CONFIG.weapons[id];
  if (!w) return true;
  if (CONTINUOUS_HIT_KINDS[w.kind]) return false;
  if (w.hitCooldownMs) return false;
  return true;
});

var lastDmgTotal = 0;
var lastBossAlive = false;
var lastBoxesTaken = 0;   // 🎁 상자를 먹은 횟수 — 늘어난 프레임에 소리를 낸다
var lastMagnetsTaken = 0;   // 🧲 자석을 먹은 횟수 — 같은 방식
var lastRevivesUsed = 0;    // 💫 아홉 목숨을 쓴 횟수(26단계) — 같은 방식
var lastBombsExploded = 0;  // 💣 터진 도화선 수(29단계) — 같은 방식
var reviveShownAt = -1;     // 부활한 판 시각(초). HUD 가 그 뒤 무적 시간 동안 문구를 띄운다. -1 = 없음
var endScreenSounded = false;   // 게임오버·클리어 소리가 이미 났는지 — 상점 갔다 와도 다시 안 나게
// 판을 새로 시작하거나 이어받는 모든 자리에서 반드시 불러야 한다. 안 부르면
// 이어받은 판의 기존 딜량·보스 상태를 "방금 일어난 일"로 착각해 엉뚱한 소리가 난다
// (다시 하기·시작 화면의 시작하기·이어하기 화면의 이어하기/새로 시작, 총 세 자리).
function syncSoundTrackers(){
  var total = 0;
  for (var i = 0; i < HIT_SOUND_IDS.length; i++) total += world.dmgBy[HIT_SOUND_IDS[i]];
  lastDmgTotal = total;
  lastBossAlive = !!(world.boss && world.boss.active);
  // 이어받은 판이 이미 상자를 먹었으면 그 값에서 이어 센다 — 안 그러면 이어하자마자
  // "상자 먹는 소리" 가 한 번 울린다(보스 등장 소리를 여기서 맞추는 것과 같은 이유).
  lastBoxesTaken = world.boxesTaken;
  lastMagnetsTaken = world.magnetsTaken;   // 🧲 상자와 같은 이유로 같이 맞춘다
  lastRevivesUsed = world.revivesUsed;     // 💫 같은 이유 — 이어받은 판의 부활을 "방금" 으로 착각하지 않게
  lastBombsExploded = world.bombsExploded; // 💣 같은 이유
  reviveShownAt = -1;
  endScreenSounded = false;
  // 17단계: 클리어 폭죽도 같은 자리에서 되돌린다. 여기서 안 돌리면 다음 판에서
  // 다시 클리어해도 clearCelebrateAt 이 이전 판 값(0 아님)으로 남아 연출이 안 나온다.
  clearCelebrateAt = 0;
  resetFireworks();
}
function pollSoundTriggers(now){
  var total = 0;
  for (var i = 0; i < HIT_SOUND_IDS.length; i++) total += world.dmgBy[HIT_SOUND_IDS[i]];
  if (total > lastDmgTotal) Sound.hit(now);
  lastDmgTotal = total;

  var bossAlive = !!(world.boss && world.boss.active);
  if (bossAlive && !lastBossAlive) Sound.bossAppear();
  lastBossAlive = bossAlive;

  // 🎁 상자를 먹었다. 진화 소리는 카드를 고른 뒤에 따로 난다 — 여기서 같이 내면
  // 아직 아무것도 안 고른 시점에 "진화했다" 로 들린다.
  if (world.boxesTaken > lastBoxesTaken) Sound.boxPick();
  lastBoxesTaken = world.boxesTaken;

  // 🧲 자석을 먹었다. 새 소리를 만들지 않고 상자 소리를 같이 쓴다(24단계 명세).
  if (world.magnetsTaken > lastMagnetsTaken) Sound.boxPick();
  lastMagnetsTaken = world.magnetsTaken;

  // 💫 아홉 목숨으로 일어났다(26단계). 새 소리 없이 상자 소리를 쓰고, HUD 가 무적 동안 문구를 띄운다.
  if (world.revivesUsed > lastRevivesUsed){ Sound.boxPick(); reviveShownAt = world.elapsed; }
  lastRevivesUsed = world.revivesUsed;

  /* 💣 도화선이 터졌다(29단계). 폭발 피해는 딜량에 안 들어가서 이 줄이 없으면 아무 소리도 안 난다.
     32단계: 타격음 대신 폭발음(Sound.boom). 한 프레임에 여럿이 터져도 한 번, 이어 터지면 120ms 쓰로틀. */
  if (world.bombsExploded > lastBombsExploded) Sound.boom(now);
  lastBombsExploded = world.bombsExploded;
}

/* 17단계: 클리어 폭죽 ------------------------------------------------------
   World.prototype.update 는 cleared 가 되면 곧장 반환해 판이 얼어붙는다.
   그래서 이 연출은 게임 시간이 아니라 실제 시계(frame 의 now)로 움직여야
   한다. world 를 전혀 건드리지 않는 순수 장식이므로 난수도 world.rnd 가
   아니라 Math.random() 을 쓴다 — world.rnd 는 게임의 씨드 난수라, 판이
   끝난 뒤라도 한 번 더 뽑으면 봇 재현성(같은 씨드로 같은 판을 재생하는 것)이
   깨진다.                                                                  */
var CLEAR_CELEBRATE_MS = 2500;
var clearCelebrateAt = 0;   // 0 = 연출 시작 전. syncSoundTrackers() 가 새 판마다 같이 되돌린다.

var FIREWORK_CAP = 200;                          // 상한 — 넘으면 새로 안 만든다
var FIREWORK_BURST_OFFSETS = [0, 800, 1650];     // clearCelebrateAt 로부터 몇 ms 뒤에 터질지 — 2.5초 안에 세 번
var FIREWORK_COLORS = ['#ff6b6b', '#ffd93d', '#6bff8f', '#ff9ff3', '#a29bfe', '#ffa552', '#ffffff'];
// 젬(#5ad1e8)과 헷갈리면 안 되므로 청록 계열은 일부러 뺐다.

// 미리 CAP 개만큼 만들어 두고 재사용한다 — 이 게임의 렌더 경로 규칙(매 프레임 새
// 배열·객체를 만들지 않는다)을 폭죽에도 그대로 적용한다.
var fireworks = [];
(function initFireworks(){
  for (var i = 0; i < FIREWORK_CAP; i++){
    fireworks.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, color: '#fff', size: 3 });
  }
})();
var fireworkLast = 0;     // 마지막으로 폭죽을 움직인 실제 시계 시각(now) — 델타 계산용
var fireworkBurstIdx = 0; // FIREWORK_BURST_OFFSETS 중 몇 번째까지 터뜨렸는지

// 화면 위쪽 어딘가에서 한 번 터진다. 좌표를 월드가 아니라 화면(screen) 기준으로
// 바로 잡는 이유: 연출 중엔 world.update 가 멈춰 있어 카메라(player 좌표)도
// 그대로이므로 굳이 world 좌표로 바꿨다가 다시 화면 좌표로 옮길 필요가 없다.
function spawnFirework(){
  var cx = viewW * 0.2 + Math.random() * viewW * 0.6;
  var cy = viewH * 0.25 + Math.random() * viewH * 0.3;
  var color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
  var count = 55, made = 0;
  for (var i = 0; i < fireworks.length && made < count; i++){
    var p = fireworks[i];
    if (p.active) continue;   // 상한(FIREWORK_CAP)에 걸리면 남은 개수는 그냥 못 터진다
    var ang = Math.random() * Math.PI * 2;
    var spd = 60 + Math.random() * 150;
    p.active = true;
    p.x = cx; p.y = cy;
    p.vx = Math.cos(ang) * spd;
    p.vy = Math.sin(ang) * spd - 60;   // 위쪽으로 쏘아 올린 느낌을 주려고 위 방향을 더 얹는다
    p.life = 0;
    p.maxLife = 650 + Math.random() * 500;
    p.color = color;
    p.size = 3 + (Math.random() < 0.5 ? 0 : 1);   // 3~4px — 젬(10px)보다 작게
    made++;
  }
}

// 실제 시계 델타(ms)로 입자를 옮긴다. world.elapsed 가 아니라 dtMs 를 인자로
// 직접 받는 이유는 클리어 연출 동안 world.update 가 멈춰 있어 게임 시간이
// 흐르지 않기 때문이다 — frame() 의 now 로 계산한 델타를 넘겨받는다.
function updateFireworks(dtMs){
  var dt = dtMs / 1000;
  for (var i = 0; i < fireworks.length; i++){
    var p = fireworks[i];
    if (!p.active) continue;
    p.life += dtMs;
    if (p.life >= p.maxLife){ p.active = false; continue; }
    p.vy += 260 * dt;   // 중력 — 서서히 떨어진다
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

// render() 안, 적·고양이보다 위 / HUD 보다 아래에서 부른다.
function drawFireworks(){
  for (var i = 0; i < fireworks.length; i++){
    var p = fireworks[i];
    if (!p.active) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);   // 서서히 사라진다
    ctx.fillStyle = p.color;
    // 도트 그래픽이라 동그라미 대신 작은 네모를 쓴다 — 동그라미는 겉돈다.
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// 새 판을 시작할 때 이전 판에서 터지던 폭죽이 남아있으면 안 되므로 pool 을
// 통째로 끈다. clearCelebrateAt 과 함께 syncSoundTrackers() 에서만 부른다 —
// 그 함수가 "판이 새로 시작되는 모든 자리" 를 이미 한곳에 모아 두고 있어서,
// 그 옆에 한 줄만 보태면 이 저장소가 반복해서 맞은 "여러 자리 중 하나를
// 빠뜨리는" 버그를 피할 수 있다.
function resetFireworks(){
  for (var i = 0; i < fireworks.length; i++) fireworks[i].active = false;
  fireworkBurstIdx = 0;
  fireworkLast = 0;
}

// 클리어 연출 중에 화면을 누르거나 키를 누르면 기다리지 않고 결과창으로 넘어간다.
// paused 도 같이 확인하는 이유: showCleared() 가 이미 불려 paused = true 가
// 된 뒤(결과창이 이미 떠 있는 상태)에는 다시 부를 필요가 없다.
function skipCelebrateIfActive(){
  if (world.cleared && clearCelebrateAt && !paused) showCleared();
}
window.addEventListener('keydown', skipCelebrateIfActive);
window.addEventListener('pointerdown', skipCelebrateIfActive);

var lastTime = 0;
// 지난 프레임에 render() 를 건너뛰었는가 — 정지 상태로 막 들어온 프레임엔
// (오버레이 뒤 배경을 최신 상태로 남기려) 반드시 한 번 그리고, 그 다음부터 건너뛴다.
var wasIdle = false;
function frame(now){
  if (!lastTime) lastTime = now;
  var delta = now - lastTime;
  lastTime = now;
  applyInput();
  // 이름 화면 중에는 배경 진행(레벨업·게임오버 등으로의 화면 전환)이 이름 화면을 덮으면 안 된다
  if (!paused && !askingName){
    if (world.cleared){
      // 클리어 순간 곧장 결과창을 덮지 않고 CLEAR_CELEBRATE_MS 동안 폭죽을 보여준다.
      if (!clearCelebrateAt){
        clearCelebrateAt = now;
        fireworkBurstIdx = 0;
        fireworkLast = now;
        // 팡파르는 연출을 시작하는 여기서 낸다. showCleared() 안에도 같은
        // endScreenSounded 가드가 있어, 결과창이 뜰 때는 이미 true 라 두 번 안 울린다.
        if (!endScreenSounded){ Sound.cleared(); endScreenSounded = true; }
        /* 코인·기록 적립도 결과창을 기다리지 않고 여기서 한다.
           원래 bankRun 은 showCleared() 안에서만 불렸는데, 그건 "cleared 되면
           바로 다음 프레임에 결과창이 뜬다" 는 전제 위에 있던 코드다. 연출로
           2.5초를 미루면서 그 전제가 깨졌다 — onLeaving()·saveRun() 은 둘 다
           cleared 면 그냥 빠지므로(각각 4169줄·3661줄), 그 사이에 탭을 닫거나
           폰이 페이지를 죽이면 클리어한 판의 코인과 기록이 통째로 사라진다.
           하필 제일 잃으면 안 되는 판이다.
           bankRun 은 runBanked 로 스스로 막으므로 showCleared() 가 나중에 다시
           불러도 두 번 적립되지 않는다. */
        bankRun(true);
      }
      var celebrateElapsed = now - clearCelebrateAt;
      // 밀린 터짐이 있으면 한 프레임에 다 처리한다(느린 프레임을 만나도 순서가 안 밀리게)
      while (fireworkBurstIdx < FIREWORK_BURST_OFFSETS.length &&
             celebrateElapsed >= FIREWORK_BURST_OFFSETS[fireworkBurstIdx]){
        spawnFirework();
        fireworkBurstIdx++;
      }
      updateFireworks(now - fireworkLast);
      fireworkLast = now;
      if (celebrateElapsed >= CLEAR_CELEBRATE_MS) showCleared();
    }
    else if (world.gameOver){ showGameOver(); }
    /* 진화를 레벨업보다 먼저 본다. 둘이 같은 프레임에 밀릴 수 있는데(한 프레임에
       여러 스텝이 돌아, 레벨업이 뜬 스텝 뒤의 스텝에서 상자를 밟을 수 있다),
       한 판에 두 번뿐인 쪽을 먼저 보여준다. 남은 하나는 고른 다음 프레임에 뜬다.
       ⚠️ 여기와 togglePause 두 곳이 판을 멈추는 자리다. 하나만 넣으면 카드를
       고르는 동안 쥐떼가 계속 다가온다. */
    else if (world.pendingEvolve > 0){ showEvolve(); }
    else if (world.pendingChoices > 0){ showLevelUp(); }
  }
  var steps = stepper.advance(delta);        // 정지 중에도 그대로 흘린다
  // 측정 중일 때만 계산/그리기 시간을 따로 잰다 (평소엔 시계를 읽지 않는다)
  var t0 = stressRecording ? performance.now() : 0;
  // 이름 화면 중에는 판 자체가 진행되면 안 되므로 world.update 도 건너뛴다
  for (var i = 0; i < ((paused || askingName) ? 0 : steps); i++){
    world.update(CONFIG.step.ms / 1000);
  }
  pollSoundTriggers(now);   // 딜량·보스 상태 변화를 보고 타격·보스 등장 소리를 낸다
  var t1 = stressRecording ? performance.now() : 0;
  // 일시정지·오버레이 표시 중엔 world 가 안 움직이므로 화면도 안 바뀐다.
  // backdrop-filter 블러 재계산이 특히 무거워서, 매 프레임 다시 그릴 필요가 없다.
  var idle = paused || overlay.classList.contains('on');
  gameLoopStarted = true;   // resize() 가 이제부터 안전하게 다시 그릴 수 있다
  if (!idle || !wasIdle) render();
  wasIdle = idle;
  if (stressRecording) stressTick(delta, t1 - t0, performance.now() - t1);
  requestAnimationFrame(frame);
}

/* 스테이지를 고르는 화면. 시작 화면의 "시작하기" 와 결과 화면의 "스테이지 고르기" 가 여기로 온다.
   고른 스테이지를 저장한 뒤 결과 화면의 "다시 하기" 와 **같은 함수**(새판시작)를 쓴다 —
   시작하는 자리는 하나의 틀을 따라야 runUid 나 applyMeta 가 빠지는 경로가 안 생긴다
   (시작 화면에서 상점에 다녀올 수 있으므로 applyMeta 가 특히 중요하다).
   시작 화면의 한 갈래라 atStartScreen 을 켠 채로 둔다 — 나가도 저장할 판이 없고 멈춤 키도 안 먹는다. */
function showStagePick(){
  카드잠금(300);   // 앞 화면을 누른 손가락이 이 화면 카드까지 이어서 누르는 걸 막는다
  overlayTitle.textContent = T('스테이지 고르기');
  overlayStat.innerHTML = T('어느 스테이지를 할까요?');
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  shopBtn.style.display = 'none';
  rerollBtn.style.display = 'none';
  overlayBtn.style.display = 'none';

  // 30단계: 이 화면의 카드는 전부 낮은 한 줄 카드다(.card.row) — 여섯 장이 폰 한 화면에 들어가게.
  function rowCard(html, onActivate, disabled){
    var el = appendCard(html, onActivate, disabled);
    el.className += ' row';
    return el;
  }

  rowCard('<div class="ico">\u{25B6}\u{FE0F}</div>' +
             '<div class="nm">' + escapeHtml(CONFIG.stages[1].name) + '</div>' +
             '<div class="ds">' + T('기본 난이도') + '</div>',
             function(){ Save.setStage(1); 새판시작(); }, false);
  // 28단계: 스테이지 2·3 카드는 같은 모양이다. stageOrder 고정 순서로 훑는다.
  // 누르는 함수가 번호를 붙잡도록 안쪽 함수로 한 장씩 만든다(var 반복문 변수는 하나뿐이다).
  function stageCard(sid){
    var st = CONFIG.stages[sid];
    if (Save.stageUnlocked(sid)){
      rowCard('<div class="ico">\u{1F525}</div>' +
                 '<div class="nm">' + escapeHtml(st.name) + '</div>' +
                 // 28단계 2차: 코인 배율이 1이면 "코인 1배" 라고 적지 않는다(이상하다).
                 '<div class="ds">' + (st.coinMult === 1 ? T('더 많고 단단한 쥐')
                                       : TF('더 많고 단단한 쥐 · 코인 {n}배', { n: st.coinMult })) + '</div>',
                 function(){ Save.setStage(sid); 새판시작(); }, false);
    } else {
      // 잠긴 카드는 눌러도 아무 일도 없다(appendCard 의 disabled). 여는 조건을 같이 적는다.
      rowCard('<div class="ico">\u{1F512}</div>' +
                 '<div class="nm">' + escapeHtml(st.name) + '</div>' +
                 // 30단계: 스테이지 3부터는 바로 앞 스테이지 번호를 넣는다(stageOrder 에서 하나 앞).
                 '<div class="ds">' + (sid === 2 ? T('스테이지 1의 쥐왕을 잡으면 열립니다')
                                                 : TF('스테이지 {n}의 쥐왕을 잡으면 열립니다',
                                                      { n: CONFIG.stageOrder[CONFIG.stageOrder.indexOf(sid) - 1] })) + '</div>',
                 null, true);
    }
  }
  for (var si = 1; si < CONFIG.stageOrder.length; si++) stageCard(CONFIG.stageOrder[si]);
  rowCard('<div class="ico">\u{21A9}\u{FE0F}</div>' +
             '<div class="nm">' + T('뒤로') + '</div>' +
             '<div class="ds">' + T('시작 화면으로') + '</div>',
             function(){ showStartScreen(); }, false);

  overlay.classList.add('on');
  paused = true;
  atStartScreen = true;
}

/* 이어할 판이 없을 때 뜨는 시작 화면. 시작 무기를 사고 장착하는 상점이 결과 화면에서만
   닿을 수 있었다 — 새 플레이어는 한 번 죽어야만 무기를 고를 수 있었다. 여기서 상점으로도
   갈 수 있게 열어준다. "시작하기" 흐름 자체는 예전에 여기서 바로 시작하던 것과 완전히
   같아야 하므로, 이어하기 화면의 고르기(새로 시작 쪽)와 순서를 맞춰뒀다. */
function showStartScreen(){
  카드잠금(300);   // 앞 화면을 누른 손가락이 이 화면 카드까지 이어서 누르는 걸 막는다
  overlayTitle.textContent = T('냥서바이버');
  overlayStat.innerHTML = T('고양이 한 마리가 쥐떼를 버텨내는 게임');
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  shopBtn.style.display = 'none';
  rerollBtn.style.display = 'none';
  overlayBtn.style.display = 'none';

  /* "시작하기" 한 장만 둔다. 누르면 스테이지를 고르는 화면(showStagePick)이 뜬다.
     25단계 첫 판에는 여기에 스테이지 카드 둘이 나란히 있었는데, 카드가 다섯 장이 되어
     첫 화면이 복잡해졌다(사용자 요청 2026-11-20). 스테이지가 더 늘어도 이 화면은 그대로다. */
  appendCard('<div class="ico">\u{25B6}\u{FE0F}</div>' +
             '<div class="nm">' + T('시작하기') + '</div>' +
             '<div class="ds">' + T('스테이지 고르기') + '</div>',
             function(){ showStagePick(); }, false);

  appendCard('<div class="ico">\u{1FA99}</div>' +
             '<div class="nm">' + T('상점') + '</div>' +
             '<div class="ds">' + T('강화 · 무기 · 장비 · 뽑기') + '</div>',
             function(){
               shopOrigin = 'start';   // 상점을 닫으면 결과 화면이 아니라 여기로 돌아온다
               showShop();
             }, false);

  appendCard('<div class="ico">\u{1F4D6}</div>' +
             '<div class="nm">' + T('도감') + '</div>' +
             '<div class="ds">' + T('무기 · 적 · 내 스펙') + '</div>',
             function(){
               codexOrigin = 'start';   // 닫으면 여기로 돌아온다
               showCodex('weapon');
             }, false);

  appendCard('<div class="ico">\u{1F3C6}</div>' +
             '<div class="nm">' + T('도전과제') + '</div>' +
             '<div class="ds">' + T('판 기록 · 무기 마스터리') + '</div>',
             function(){
               achOrigin = 'start';   // 닫으면 여기로 돌아온다
               showAchievements();
             }, false);

  overlay.classList.add('on');
  paused = true;
  atStartScreen = true;
}

/* 저장된 판이 있으면 시작하자마자 물어본다. 이어하기를 고르면 그 시점부터,
   새로 시작을 고르면 저장을 버리고 처음부터.
   이름 화면(showNameAsk) 뒤에 이어지는 원래 시작 흐름이라 이름을 붙여 함수로 뺐다 —
   이름을 물을 필요가 없으면 이 함수가 바로 불린다. */
var pendingRun = RunSave.load();
function showTitleOrResume(){
  // 저장된 판이 없으면 시작 화면을 연다 — 예전엔 여기서 곧장 플레이가 시작됐지만,
  // 그러면 상점(시작 무기 장착)이 결과 화면에서만 닿을 수 있어 새 플레이어는 한 번
  // 죽어야만 무기를 고를 수 있었다.
  if (!pendingRun){ showStartScreen(); return; }
  var m = Math.floor((pendingRun.elapsed || 0) / 60);
  var s = Math.floor((pendingRun.elapsed || 0) % 60);
  var pendingLevel = (typeof pendingRun.level === 'number' && isFinite(pendingRun.level) &&
                      pendingRun.level >= 1) ? Math.floor(pendingRun.level) : 1;
  overlayTitle.textContent = T('이어서 할까요?');
  // 스테이지 2 판이면 앞에 "스테이지 2 · " 를 붙인다(25단계). 스테이지 1 저장은 문구가 예전 그대로다.
  // 28단계: 스테이지 3도 같은 방식(스테이지 2 이상이면 이름을 붙인다).
  overlayStat.innerHTML = (pendingRun.stage >= 2 && CONFIG.stages[pendingRun.stage]
                             ? escapeHtml(CONFIG.stages[pendingRun.stage].name) + ' · ' : '') +
                          TF('{m}분 {s}초 · Lv.{lv} 에서 멈췄습니다',
                             { m: m, s: (s < 10 ? '0' : '') + s, lv: pendingLevel }) +
    '<br><small>' + T('이어하면 화면의 쥐는 새로 몰려옵니다') + '</small>';
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  shopBtn.style.display = 'none';
  rerollBtn.style.display = 'none';
  overlayBtn.style.display = 'none';

  function 고르기(이어할까){
    if (!이어할까){
      RunSave.clear();
      pendingRun = null;
      카드잠금(300);
      showStartScreen();
      return;
    }
    // 이어하기든 새로 시작이든, 이 브라우저 세션에서는 아직 runUid 를 만든 적이 없다
    // (여기 오는 길엔 "다시 하기" 버튼을 거치지 않는다). 여기서 만들지 않으면
    // 이어받은 판이 끝났을 때 빈 runUid 로 전송돼 서버가 판 전체를 거부한다.
    runUid = 새판고유번호();
    RunSave.clear();
    cardsEl.innerHTML = '';
    cardsEl.style.display = 'none';
    shopBtn.style.display = 'block';
    overlayBtn.style.display = 'block';
    overlay.classList.remove('on');
    paused = false;
    lastTime = 0;
    if (이어할까){
      // 스테이지는 restore 가 저장에서 정한다. 저장이 깨졌으면 마지막에 고른 스테이지로 새 판.
      var 이어졌다 = world.restore(pendingRun);
      runResumed = !!이어졌다;         // 32단계 — 이어한 판은 bombsafe 를 못 딴다(위 runResumed 주석)
      if (!이어졌다) world.reset(Save.starter(), Save.stage());
      // 복원 직후에도 정지 상태가 이어질 수 있다(예: 레벨업 카드가 뜬 채로 저장된 판).
      // wasIdle 을 안 건드리면 "정지→정지" 로만 보여 진입 프레임의 강제 렌더가 건너뛰어지고,
      // 카드 뒤 배경·HUD 가 복원 전(새 판) 상태로 남는다.
      else wasIdle = false;
    } else {
      world.reset(Save.starter(), Save.stage());                     // 새로 시작
    }
    // 복원·새로 시작 둘 다 reset 을 거쳐 기본 씨앗으로 돌아와 있다 — 판마다 다른 보석 운을 다시 준다.
    world.setLootSeed((Math.random() * 0x7fffffff) | 0);
    syncSoundTrackers();   // 이어받은 판의 기존 딜량·보스 상태를 "방금 일어난 일"로 착각하지 않게
    catLastX = null;   // 이전 판 좌표가 남아있으면 안 되므로 리셋할 때마다 걸음 추적을 함께 비운다
    pendingRun = null;
  }

  function confirmNewRun(){
    cardsEl.innerHTML = '';
    overlayStat.innerHTML = '<b>' + T('이번 판을 버리고 처음부터 할까요?') + '</b>' +
      '<br><small>' + TF('{m}분 {s}초 · Lv.{lv} 까지 온 판입니다.',
        { m: m, s: (s < 10 ? '0' : '') + s, lv: pendingLevel }) + '</small>';
    var coins = (typeof pendingRun.coins === 'number' && isFinite(pendingRun.coins))
              ? Math.max(0, Math.floor(pendingRun.coins)) : 0;
    appendCard('<div class="nm">' + T('네, 처음부터') + '</div><div class="ds">' +
      TF('이번 판은 사라집니다<br>모은 코인 {n}개도 안 들어옵니다<br>시작 화면으로 갑니다',
        { n: coins }) + '</div>', function(){ 고르기(false); }, false);
    appendCard('<div class="nm">' + T('아니요') + '</div>',
      function(){ showTitleOrResume(); }, false);
    카드잠금(300);
  }

  var 항목 = [
    { ico: '\u{25B6}️', nm: T('이어하기'), ds: TF('{m}분 {s}초부터', { m: m, s: s }), go: true },
    { ico: '\u{1F504}', nm: T('새로 시작'), ds: T('처음부터 다시'), go: false }
  ];
  for (var i = 0; i < 항목.length; i++){
    (function(c){
      appendCard('<div class="ico">' + c.ico + '</div>' +
                 '<div class="nm">' + c.nm + '</div>' +
                 '<div class="ds">' + c.ds + '</div>',
                 function(){ if (c.go) 고르기(true); else confirmNewRun(); }, false);
    })(항목[i]);
  }
  overlay.classList.add('on');
  paused = true;
}

// 처음 한 번은 이름부터 묻는다. 다 물었으면 곧장 원래 시작 흐름(이어하기 물음)으로.
if (Player.needsName()) showNameAsk(showTitleOrResume);
else showTitleOrResume();



requestAnimationFrame(frame);






// 프레임 루프(frame 함수)가 매 프레임 stressRecording 을 읽으므로 측정 도구를
// 걷어내도 이 선언은 남겨야 한다. 남기지 않으면 배포본이 첫 프레임에서 죽는다.
var stressRecording = false;

})();
</script>
</body>
