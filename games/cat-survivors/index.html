<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>냥서바이버</title>
<meta property="og:title" content="냥서바이버">
<meta property="og:description" content="고양이 한 마리가 15분 동안 쥐떼를 버텨내는 게임">
<meta property="og:type" content="website">
<meta name="description" content="고양이 한 마리가 15분 동안 쥐떼를 버텨내는 게임">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b2416}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#game{display:block;width:100%;height:100%}
#stick{
  position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px;
  border-radius:50%; border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06); pointer-events:none;
  display:none; z-index:10;
}
#stickKnob{
  position:absolute; left:50%; top:50%; width:52px; height:52px;
  margin:-26px 0 0 -26px; border-radius:50%;
  background:rgba(255,255,255,.35);
}
#overlay{
  position:fixed; inset:0; z-index:20; display:none;
  background:rgba(10,14,8,.82); backdrop-filter:blur(2px);
  /* 내용이 화면보다 길면 justify-content:center 는 위로 넘친 부분을 스크롤로
     도달할 수 없게 만든다(scrollTop 이 0 아래로 안 감). flex-start 면
     길 땐 위부터 스크롤된다. */
  align-items:center; justify-content:flex-start; flex-direction:column; gap:14px;
  padding:36px 20px; color:#f7efd8; font-family:system-ui,sans-serif;
  overflow-y:auto;
}
#overlay.on{display:flex}
/* 제목·잔액·닫기는 위에 붙박이로 둔다. 상점은 카드가 10장 넘게 늘어나서,
   닫기가 맨 아래에 있으면 폰에서 한참 내려야 나갈 수 있었다. 붙박이로 두면
   화면을 돌렸을 때 제목이 위로 밀려 사라지던 문제도 같이 없어진다.
   top 을 음수로 주는 것은 #overlay 의 위쪽 안쪽여백(36px)만큼 끌어올려
   스크롤한 카드가 제목 위로 비쳐 보이지 않게 하기 위함이다. */
#overlayHead{
  position:sticky; top:-36px; z-index:2;
  width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:36px 0 12px; margin:-36px 0 0;
  background:rgba(10,14,8,.96);
  /* 13단계에서 결과 화면에 무기별 기여도 줄이 늘면서, 붙박이 머리 자체가
     작은 폰 가로모드(세로 320px 안팎)에서는 화면보다 커지는 경우가 생겼다.
     sticky 는 자기 키가 뷰포트보다 크면 다시 하기/상점 버튼을 영원히 가린다 —
     그래서 머리 자신에게 상한을 주고 안에서 스크롤하게 한다. */
  max-height:55vh; overflow-y:auto;
  /* flex-shrink:0 필수 — #overlay(부모)는 고정 높이(inset:0) flex column인데,
     overflow-y:auto가 붙은 자식은 CSS 스펙상 자동 최소 크기가 0이 되어 형제보다
     먼저(사실상 전부) 짜부러든다. 상점 카드가 5장 넘어 #overlay 전체가 넘치면
     이 머리(제목·코인 잔액)만 패딩만 남기고 짜부러들어 코인 표시가 안 보였다
     (2026-08-05 사용자 피드백: "폰에서 상점 들어가면 위에 바가 깨져서 코인이
     안 보임"). flex-shrink:0으로 이 박스는 항상 제 내용 높이(최대 55vh)를
     유지하고, 넘치는 건 #overlay 자체 스크롤(overflow-y:auto)이 그대로 받는다. */
  flex-shrink:0;
}
/* 닫기는 왼쪽 위 구석. 붙박이 머리 안에 있으므로 같이 따라다닌다. */
#headClose{
  position:absolute; left:0; top:30px; display:none;
  padding:8px 16px; font-size:14px; font-weight:800; cursor:pointer;
  background:#7a8f5c; color:#12180d; border:none; border-radius:10px;
}
#overlayTitle{font-size:clamp(20px,6vmin,32px); font-weight:800; letter-spacing:.05em}
#cards{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%; max-width:640px}
.card{
  flex:1 1 170px; max-width:200px; cursor:pointer;
  background:linear-gradient(170deg,#3a4a2c,#26331d);
  border:2px solid #7a8f5c; border-radius:14px; padding:16px 12px; text-align:center;
  color:inherit; font:inherit; appearance:none; -webkit-appearance:none;
}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:3px solid #f7efd8; outline-offset:3px}
.card .ico{font-size:38px; line-height:1.2}
.card .nm{font-weight:800; margin-top:6px}
.card .lv{font-size:12px; opacity:.75; margin-top:2px}
.card .ds{font-size:13px; opacity:.9; margin-top:8px; line-height:1.4}
.card.off{ opacity:.45; cursor:default }
/* 장착 중인 카드 — 못 사는 카드와 같은 흐림 처리를 쓰면 "지금 쓰는 것"인지
   "못 사는 것"인지 라벨을 읽기 전엔 구분이 안 된다. 불투명하게 두고
   기존 강조색(포커스 아웃라인과 동일)으로 테두리만 준다. */
.card.sel{ opacity:1; cursor:default; border-color:#f7efd8; box-shadow:0 0 0 2px #f7efd8 inset }
/* 진화 카드 — 최대 4장이다(무기 슬롯이 4개라 그 이상은 못 나온다).
   3택 카드 폭(170px)을 그대로 쓰면 375px 폰에서 한 줄에 한 장씩 네 줄이 되어
   스크롤해야 다 볼 수 있다 — 고르는 화면에서 안 보이는 선택지는 없는 선택지다.
   폭을 줄여 한 줄에 두 장씩, 두 줄로 끝나게 한다. */
/* 기준폭 130px 은 가장 좁은 폰(320px)에서 두 장이 한 줄에 들어가는 한계다:
   화면 320 − 오버레이 좌우 여백 40 = 280, 130 + 130 + 칸 사이 12 = 272. */
.card.evo{ flex:1 1 130px; max-width:190px; padding:12px 8px }
.card.evo .nm{ font-size:15px; word-break:keep-all }
.card.evo .lv{ font-size:12px; opacity:.7 }
.card.evo .ds{ font-size:12px; margin-top:6px; word-break:keep-all }
/* 진화형 그림. 16×16 도트라 확대할 때 흐려지면 안 된다(캔버스의 imageSmoothing 과 같은 뜻). */
.evoIco{ width:44px; height:44px; display:block; margin:0 auto;
         image-rendering:pixelated; image-rendering:crisp-edges }
/* 21단계: 기본형 무기 그림을 카드에 끼운다. 크기를 이모지(38px)에 맞췄다 —
   더 키우면 카드 높이가 늘어 3택이 폰 한 화면에 안 들어간다. */
.wpnIco{ width:38px; height:38px; display:block; margin:0 auto;
         image-rendering:pixelated; image-rendering:crisp-edges }
/* 도감 절 제목에 붙는 작은 아이콘. 글자 옆에 서야 해서 inline 이다. */
.wpnIcoSm{ width:20px; height:20px; vertical-align:-4px; margin-right:4px;
           image-rendering:pixelated; image-rendering:crisp-edges }
/* 일시정지 버튼 — 폰 엄지로 닿아야 하므로 최소 44px */
#pauseBtn{
  position: fixed; top: 10px; right: 10px; z-index: 5;
  width: 44px; height: 44px; border: 0; border-radius: 10px;
  background: rgba(0,0,0,0.45); color: #f7efd8;
  font-size: 20px; line-height: 44px; text-align: center;
  cursor: pointer; padding: 0;
}
#pauseBtn:active{ background: rgba(0,0,0,0.7); }
/* 음소거 — pauseBtn 왼쪽에 나란히. 오버레이(z-index:20)보다 위에 둬야 이름 화면·
   레벨업·게임오버·클리어처럼 오버레이가 뜬 채로 소리가 나는 순간에도 끌 수 있다.
   왼쪽 위에 두면 상점의 "닫기"(#headClose)와 자리가 겹친다 — 그래서 오른쪽에 둔다. */
#muteBtn{
  position: fixed; top: 10px; right: 64px; z-index: 30;
  width: 44px; height: 44px; border: 0; border-radius: 10px;
  background: rgba(0,0,0,0.45); color: #f7efd8;
  font-size: 20px; line-height: 44px; text-align: center;
  cursor: pointer; padding: 0;
}
#muteBtn:active{ background: rgba(0,0,0,0.7); }
/* 다시 뽑기 — 레벨업 카드 아래에만 나온다. 폰 엄지로 닿아야 하므로 세로 44px 이상 */
#rerollBtn{
  display:none; min-height:44px; padding:12px 22px;
  font-size:15px; font-weight:800; cursor:pointer;
  background:#5a4a6a; color:#f0e8f8; border:none; border-radius:12px;
}
#rerollBtn:active{ transform:scale(.97) }
#overlayBtn, #shopBtn{
  padding:14px 28px; font-size:17px; font-weight:800; cursor:pointer;
  background:#7a8f5c; color:#12180d; border:none; border-radius:12px;
}
#shopBtn{ background:#3b4a5a; color:#e8eef4; margin-top:8px }
#overlayStat{font-size:15px; opacity:.9; text-align:center; line-height:1.7}
.shopSection{ flex:0 0 100%; text-align:center; opacity:.7; font-size:14px;
              margin:10px 0 2px; }
/* 도감 — 탭 셋이 한 줄에 들어가야 한다(폰 375px 에서 카드 기본폭 170px 로는 줄바꿈된다) */
.codexTab{ flex:1 1 0; min-width:0; padding:12px 4px; font-size:14px }
/* 도감 표 한 줄 — 왼쪽 이름, 오른쪽 값 */
.codexRow{ flex:0 0 100%; display:flex; justify-content:space-between; gap:12px;
           padding:8px 12px; font-size:14px; line-height:1.5 }
/* keep-all 이 없으면 한글이 어절 중간에서 끊긴다("끌 / 어당김"). 진화 줄이 길어지면서
   드러났다 — .codexNote 가 같은 이유로 이미 쓰고 있던 규칙이다. */
.codexRow > span:last-child{ text-align:right; opacity:.85; word-break:keep-all }
/* 왼쪽이 "이름표" 인 줄에만 붙인다. 오른쪽이 두 줄이 되면 왼쪽도 같이 접혀서
   "5성 진 / 화" 가 됐다 — 위 .codexNote 주석과 같은 계열의 함정이다.
   무기 설명처럼 왼쪽이 문장인 줄에는 안 붙인다(붙이면 가로로 넘친다). */
.codexKey{ white-space:nowrap }
/* 도감 안내 문구 — 좌우로 나누지 않고 폭 전체를 쓴다. 좌우 분할(.codexRow)로 두면
   375px 폰에서 1px 모자라 두 조각이 동시에 접히며 한글이 어절 중간에서 끊긴다. */
.codexNote{ flex:0 0 100%; padding:8px 12px; font-size:13px; line-height:1.6;
            word-break:keep-all; opacity:.95 }
</style>

<body>
<canvas id="game"></canvas>
  <button id="pauseBtn" aria-label="일시정지">⏸</button>
  <button id="muteBtn" aria-label="음소거">🔊</button>
<div id="stick"><div id="stickKnob"></div></div>
<div id="overlay">
  <div id="overlayHead">
    <button id="headClose" type="button">닫기</button>
    <div id="overlayTitle"></div>
    <div id="overlayStat"></div>
  </div>
  <div id="cards"></div>
  <button id="rerollBtn"></button>
  <button id="overlayBtn"></button>
  <button id="shopBtn">강화 상점</button>
</div>

<script id="core">
(function(global){
'use strict';

/* ================================================================
   CONFIG — 모든 밸런스·튜닝 수치는 여기에만 둔다
   ================================================================ */
var CONFIG = {
  step:   { ms: 1000 / 60, maxSteps: 5, maxAccumMs: 250 },
  player: { maxHp: 100, speed: 180, radius: 12, pickupRange: 45 },
  grid:   { cellSize: 64, cols: 40, rows: 30 },
  pools:  { enemies: 400, projectiles: 300, gems: 600, particles: 200, fields: 12, warns: 24, nukes: 8,
            boxes: 2,          // 상자는 동시에 최대 하나지만 여유를 둔다
            companions: 2 },   // 고양이 친구는 한 마리지만 풀 규칙을 그대로 따른다
  input:  { stickMax: 45 },                          // 조이스틱 최대 밀기 거리(px)
  render: { cullMargin: 40, maxDpr: 2 },             // 화면 밖 여유, 픽셀비 상한
  // 판 도중 저장: 이보다 짧게 한 판(그리고 아직 1레벨)은 저장하지 않는다.
  // 이어할 것이 없는데 "0분 00초에서 멈췄습니다"를 묻게 되기 때문이다.
  runSave: { minSec: 15 },
  combat:  { contactCooldownMs: 500,   // 같은 적에게 다시 맞기까지의 간격
             // 한 번 맞으면 이만큼 전부에게 무적. 이게 없으면 둘러싸인 순간
             // "닿은 마릿수 × 피해"가 한꺼번에 들어와 손쓸 새 없이 죽는다.
             invulnSec: 0.5,
             bossAimRange: 520 },   // 보스가 이 안에 있으면 자동 조준이 보스를 먼저 본다
  spawn:   { marginPx: 60, maxAlive: 240,
             recycleDist: 1400,   // 이보다 멀어진 적은 반대편 화면 밖으로 옮긴다
             recycleRingMult: 1.5,   // 단, 회수 거리는 스폰 링의 이 배수보다 가까울 수 없다
             // 보스는 이동속도가 느려(56~72) 플레이어(180)보다 훨씬 처지므로, 일반 회수
             // 거리를 그대로 적용하면 3~7초만 거리를 벌려도 "갑자기 앞에서 튀어나오는"
             // 것처럼 순간이동한다. 보스만 발동 거리를 늘려, 정상적으로 거리를 벌리며
             // 싸우는 동안은 절대 안 걸리고 작정하고 계속 도망치는 꼼수만 막는다.
             // 완전히 빼면 안 된다 — 보스전은 스폰이 0.25배라 무한 도망이 최적 전략이 된다.
             bossRecycleMult: 2,
             // 링 스폰에 나오는 종류의 고정 순서. for...in 은 엔진마다 순회 순서가
             // 달라 봇 재현성을 깨므로 이 저장소에서 금지다 — 그래서 여기에 적어 둔다.
             // 여기 없는 적은 링 스폰에 안 나온다. 적을 추가하고 이 표에 안 넣으면
             // 조용히 안 나오게 되므로, 표와 실제를 대조하는 테스트를 같이 뒀다.
             order: ['mouse', 'rat', 'fat'],
             hpPerMin: 0.22,   // 1분마다 적 체력 +22%
             bossSpawnMult: 0.25,   // 보스전 동안 일반 스폰을 줄여 1대1에 가깝게 둔다
             // 보스를 잡으면 이 시간에 걸쳐 0.25배에서 1배로 직선으로 돌아온다.
             // 즉시 되돌리면 보스에 자원을 다 쓴 직후에 떼가 한꺼번에 몰려온다 —
             // 사람 기록에서 보스1 직후 6~8분에 판이 끝나던 이유 중 하나다.
             // 계단을 하나 더 만들지 않으려고 즉시가 아니라 직선으로 올린다.
             bossEaseSec: 20,
             // 분 단위 "분당 마릿수" 표. 사이 시간은 직선 보간, 표 끝을 넘으면 마지막 값 유지.
             // 0분 170은 3-A 플레이테스트에서 "좀 쉽다"고 한 지금 값 그대로다 — 여기서 올려 간다.
             // 5단계 측정: 보스 직후 6~7분에 131→293마리로 불어나 거기서 판이 끝났다.
             // 후반을 눕혀 플레이어의 성장 속도와 보조를 맞춘다.
             perMinute: [170, 185, 200, 220, 240, 255, 270, 285,
                         295, 305, 315, 320, 325, 330, 335, 335] },
  gem:     { radius: 6, attractSpeed: 320, size: 10 },
  // ☢️ 핵폭탄 — 무기가 아니라 맵에서 줍는 물건이다.
  // 무기로 넣었더니 반경 600 짜리 화면 청소가 8~12초마다 돌아 명백히 과했다.
  // 균형 테스트는 단일 대상 화력만 재기 때문에 이 과함을 못 잡는다.
  nukeItem: { emoji: '\u{2622}\u{FE0F}', everySec: 90,   // 이 간격마다 하나 떨어진다
              damage: 600, radius: 600,              // 사실상 화면 전체
              nearMin: 160, nearMax: 380,            // 플레이어로부터 이 거리에 떨어진다
              pickupRadius: 26, size: 30,
              maxAlive: 3,                           // 무한히 쌓아두지 못하게
              showSec: 0.45 },                       // 폭발 잔상 길이
  /* 보스 상자. 5분·10분 보스를 잡으면 그 자리에 떨어진다.
     15분 쥐왕은 최종전이라 없다 — 한 판에 진화는 최대 2개다.

/* 패시브를 적을 때 쓰는 고정 순서. CONFIG.passives 를 for...in 으로 돌면

var WEAPON_IDS = ['claw', 'yarn', 'bone', 'laser', 'catnip', 'milk',

/* 패시브를 화면에 늘어놓는 고정 순서. 도감이 쓴다 — for-in 은 엔진마다 순서가 달라
   같은 저장이 다른 화면을 낸다(WEAPON_IDS 와 같은 이유). */
var PASSIVE_IDS = ['claws', 'tuna', 'bell', 'whisker', 'nap', 'clover'];

/* 딜량 측정용 칸 이름 (계획/13-딜량측정-명세.md). 무기 10종 + 핵폭탄(무기는 아니지만
   화면을 쓸어버리므로 빠지면 합계가 안 맞는다) + ?(이름 없이 들어온 호출을 담는 칸).
   WEAPON_IDS 에서 만들어 쓴다 — 손으로 다시 적으면 무기가 늘 때 한쪽만 고쳐
   새 무기 딜량이 조용히 ? 로 샌다. */
var DAMAGE_IDS = WEAPON_IDS.concat(['nuke', '?']);

/* source 가 아는 이름인지 보는 표. '?' 는 일부러 뺀다 — 모르는 이름이 오는 것
   자체가 ? 로 가는 신호라서, ? 를 아는 이름으로 쳐 버리면 방어가 무너진다. */
var DAMAGE_INDEX = (function(){
  var out = Object.create(null);
  for (var i = 0; i < WEAPON_IDS.length; i++) out[WEAPON_IDS[i]] = true;
  out.nuke = true;
  return out;
})();

/* 12칸을 전부 0으로 채운 새 그릇을 만든다. 생성자와 reset() 이 함께 쓴다 —
   따로 두면 하나만 고칠 위험이 있다. */
function freshDamageTally(){
  var out = Object.create(null);
  for (var i = 0; i < DAMAGE_IDS.length; i++) out[DAMAGE_IDS[i]] = 0;
  return out;
}

/* 저장에서 읽은 해금 정보를 믿을 수 있는 모양으로 만든다.
   손으로 고친 저장 데이터가 "게임이 시작조차 안 되는" 상태를 만들면 안 된다.
   localStorage 를 안 만지는 순수 함수라 core 에 두고 테스트로 고정한다. */
function normalizeStarterSave(raw){
  var out = { unlocked: ['claw'], starter: 'claw' };
  var i, id;
  if (raw && Array.isArray(raw.unlocked)){
    for (i = 0; i < raw.unlocked.length; i++){
      id = raw.unlocked[i];
      if (typeof id !== 'string') continue;
      if (WEAPON_IDS.indexOf(id) < 0) continue;      // 아는 무기 10종에만 있는 이름만 통과
      if (out.unlocked.indexOf(id) >= 0) continue;   // 중복 제거 (claw 포함)
      out.unlocked.push(id);
    }
  }
  if (raw && typeof raw.starter === 'string' &&
      out.unlocked.indexOf(raw.starter) >= 0) out.starter = raw.starter;
  return out;
}

/* ================================================================
   Vec — 입력 벡터 처리. out 객체를 재사용해 할당을 만들지 않는다.
   ================================================================ */
var Vec = {
  // 길이가 1을 넘으면 1로 줄인다. 1 이하면 그대로 (조이스틱 아날로그 감도 유지).
  clampToUnit: function(x, y, out){
    var lenSq = x * x + y * y;
    if (lenSq === 0){ out.x = 0; out.y = 0; return out; }
    if (lenSq <= 1){ out.x = x; out.y = y; return out; }
    var len = Math.sqrt(lenSq);
    out.x = x / len;
    out.y = y / len;
    return out;
  }
};

/* ================================================================
   Pool — 미리 만들어 두고 켜고 끄기만 한다 (생성/파괴 없음)
   빈자리 색인을 스택으로 관리해 spawn/release 가 O(1)
   ================================================================ */
function Pool(size, factory){
  this.size = size;
  this.items = new Array(size);
  this.free = new Array(size);
  this.freeCount = size;
  this.activeCount = 0;
  for (var i = 0; i < size; i++){
    var o = factory();
    o.active = false;
    o._i = i;
    this.items[i] = o;
    this.free[i] = i;
  }
}
Pool.prototype.spawn = function(){
  if (this.freeCount === 0) return null;
  this.freeCount--;
  var o = this.items[this.free[this.freeCount]];
  o.active = true;
  this.activeCount++;
  return o;
};
Pool.prototype.release = function(o){
  // null 방어 + 이 풀 소속인지 확인 (다른 풀의 객체를 넣으면 free 배열이 조용히 오염된다)
  if (!o || this.items[o._i] !== o || !o.active) return;
  o.active = false;
  this.activeCount--;
  this.free[this.freeCount] = o._i;
  this.freeCount++;
};
Pool.prototype.releaseAll = function(){
  for (var i = 0; i < this.items.length; i++) this.release(this.items[i]);
};

/* ================================================================
   Grid — 균일 격자. 충돌 "후보"만 좁힌다(정확한 거리 검사는 호출자 몫).
   카메라를 따라다니는 고정 크기 판이며, 매 프레임 reset 으로 비운다.
   ================================================================ */
function Grid(cellSize, cols, rows){
  this.cellSize = cellSize;
  this.cols = cols;
  this.rows = rows;
  this.originX = 0;
  this.originY = 0;
  this.cells = new Array(cols * rows);
  for (var i = 0; i < this.cells.length; i++) this.cells[i] = [];
}
Grid.prototype.reset = function(originX, originY){
  this.originX = originX;
  this.originY = originY;
  for (var i = 0; i < this.cells.length; i++) this.cells[i].length = 0; // 배열 재사용
};
Grid.prototype.insert = function(item){
  var cx = Math.floor((item.x - this.originX) / this.cellSize);
  var cy = Math.floor((item.y - this.originY) / this.cellSize);
  if (cx < 0 || cy < 0 || cx >= this.cols || cy >= this.rows) return false;
  this.cells[cy * this.cols + cx].push(item);
  return true;
};
Grid.prototype.forEachNear = function(x, y, radius, fn){
  var cs = this.cellSize;
  var minCx = Math.floor((x - radius - this.originX) / cs);
  var maxCx = Math.floor((x + radius - this.originX) / cs);
  var minCy = Math.floor((y - radius - this.originY) / cs);
  var maxCy = Math.floor((y + radius - this.originY) / cs);
  if (minCx < 0) minCx = 0;
  if (minCy < 0) minCy = 0;
  if (maxCx >= this.cols) maxCx = this.cols - 1;
  if (maxCy >= this.rows) maxCy = this.rows - 1;
  for (var cy = minCy; cy <= maxCy; cy++){
    var rowBase = cy * this.cols;
    for (var cx = minCx; cx <= maxCx; cx++){
      var cell = this.cells[rowBase + cx];
      for (var i = 0; i < cell.length; i++) fn(cell[i]);
    }
  }
};

/* ================================================================
   Stepper — 고정 시간 간격. 프레임이 흔들려도 게임 속도는 일정하게.
   ================================================================ */
function Stepper(stepMs, maxSteps, maxAccumMs){
  this.stepMs = stepMs;
  this.maxSteps = maxSteps;
  this.maxAccumMs = maxAccumMs;
  this.accum = 0;
}
Stepper.prototype.advance = function(deltaMs){
  if (deltaMs > this.maxAccumMs) deltaMs = this.maxAccumMs; // 탭 전환 폭주 방지
  this.accum += deltaMs;
  var steps = 0;
  while (this.accum >= this.stepMs && steps < this.maxSteps){
    this.accum -= this.stepMs;
    steps++;
  }
  if (steps === this.maxSteps) this.accum = 0; // 밀린 시간은 버린다
  return steps;
};

/* 한 투사체가 "이미 때린 적" 을 몇 마리까지 기억하는가.

   예전에는 이 기억을 **적 쪽**에 도장 한 칸(lastProjStamp)으로 뒀는데, 겹친 투사체가
   둘이면 서로 도장을 덮어써서 같은 적을 매 프레임 다시 때렸다. 8단계 최종 리뷰가
   찾아서 "다음 밸런스 작업으로 이월" 로 적어 둔 것이고(계획/8-...-측정결과.md §이월),
   생선뼈가 `counts: 2` + `pierce: 999` 라 정확히 여기에 걸렸다 —
   2026-08-11 실측: 표에 적힌 30 짜리가 **720**(24배), 레벨 3→4 에서 56배.

   그래서 기억을 **투사체 쪽**으로 옮긴다. 적의 stamp 는 스폰마다 새로 매기므로
   풀이 자리를 재활용해도 헷갈리지 않는다.
   기억이 꽉 차면 그 투사체는 더 안 때린다 — 관통을 다 쓴 것과 같이 다룬다.

   64 로 잡은 근거(2026-08-11 실측, 참치뼈 만렙 = 동시 4발 · 관통 999 · 3분):
     적 100마리 유지 → 한 투사체가 기억한 최대 **36마리**, 캡 도달 0회.
     적 400마리를 반경 460 안에 욱여넣으면 캡에 닿는다 — 실제 판은 15분에
     적 68~81마리라(봇 60판) 여기까지 갈 일이 없다.
   ⚠️ 적 수를 크게 늘리거나 관통 무기를 더 만들면 이 수를 다시 재고 올릴 것.
      캡에 닿아도 게임이 안 멈추고 **조용히** 피해만 사라진다. */
var PROJ_HIT_CAP = 64;

function projAlreadyHit(p, enemyStamp){
  if (p.hitN >= PROJ_HIT_CAP) return true;
  for (var i = 0; i < p.hitN; i++) if (p.hitIds[i] === enemyStamp) return true;
  return false;
}

/* ================================================================
   World — 게임 상태 전체. DOM 을 모르므로 Node 에서도 그대로 돈다.
   ================================================================ */
function World(config, metaLevels){

  this.rawInput = { x: 0, y: 0 };
  this.nukesTaken = 0;             // 이 판에서 밟은 핵폭탄 수 (판 기록에 들어간다)
  this.moveDir = { x: 0, y: 0 };   // 재사용 (매 프레임 새로 만들지 않음)
  this.random = Math.random;       // 4단계 봇 시뮬이 씨드 난수로 교체한다
  this.enemies = new Pool(config.pools.enemies, function(){
    // 필드를 늘리면 spawnEnemy 도 반드시 같이 고칠 것 (풀 잔존값).
    return { x: 0, y: 0, hp: 0, maxHp: 0, typeId: '', speed: 0,
             radius: 0, contact: 0, xp: 0, hitFlash: 0, contactCd: 0,
             slowT: 0, slowPct: 0,
             // 꼬리 회전 재타격 간격 — 공마다 따로 센다. 한 칸으로 두면 공을 늘려도
             // 두 번째 공이 첫 번째의 간격에 걸려 아무 일도 안 일어난다.
             orbitCds: [0, 0, 0, 0],
             tornadoCd: 0, chainStamp: 0, beamStamp: 0, stamp: 0 };
