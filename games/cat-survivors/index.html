var CONFIG = window.CatCore.CONFIG;
var normalizeStarterSave = window.CatCore.normalizeStarterSave;
var WEAPON_IDS = window.CatCore.WEAPON_IDS;
var PASSIVE_IDS = window.CatCore.PASSIVE_IDS;
var DAMAGE_IDS = window.CatCore.DAMAGE_IDS;
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d', { alpha: false });

function safeStoredInt(value, max){
  if (typeof value !== 'number' || !isFinite(value) || value <= 0) return 0;
  value = Math.floor(value);
  return value > max ? max : value;
}

/* 저장 — localStorage 가 막혀 있어도(사파리 프라이빗, file:// 정책) 게임은 돌아가야 한다.
   실패하면 이번 판만 유효한 메모리 저장소로 조용히 대체한다. */
var Save = (function(){
  var KEY = 'catSurvivor.save';
  var mem = null;              // localStorage 가 막혔을 때 쓰는 대체 저장소
  var data = null;

  function fresh(){
    return { coins: 0, meta: { power: 0, maxHp: 0, speed: 0, magnet: 0, xpGain: 0 },
             best: { sec: 0, level: 0, clears: 0 },
             unlocked: ['claw'], starter: 'claw' };
  }
  function read(){
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return fresh();
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return fresh();
      var f = fresh();
      f.coins = safeStoredInt(o.coins, Number.MAX_SAFE_INTEGER || 9007199254740991);
      // 손으로 고친 저장 데이터가 게임을 못 빠져나오는 상태로 만들지 않게 범위를 자른다
      if (o.meta) for (var k in f.meta){
        if (typeof o.meta[k] !== 'number' || !isFinite(o.meta[k])) continue;
        var step = Math.floor(o.meta[k]);
        if (step < 0) step = 0;
        if (step > CONFIG.meta.maxStep) step = CONFIG.meta.maxStep;
        f.meta[k] = step;
      }
      if (o.best && typeof o.best === 'object') for (var b in f.best)
        f.best[b] = safeStoredInt(o.best[b], Number.MAX_SAFE_INTEGER || 9007199254740991);
      // 해금·장착은 core 의 순수 함수가 검증한다 (테스트로 고정돼 있다).
      var st = normalizeStarterSave(o);
      f.unlocked = st.unlocked;
      f.starter = st.starter;
      return f;
    } catch (e){
      return mem || fresh();
    }
  }
  function write(){
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e){
      mem = data;              // 저장이 막혔다 — 이번 판 동안만 기억한다
    }
  }
  return {
    load: function(){ data = read(); return data; },
    get: function(){ return data || this.load(); },
    addCoins: function(n){
      if (!isFinite(n) || n <= 0) return;   // NaN 하나가 잔액을 통째로 날리는 걸 막는다
      this.get().coins += Math.floor(n);
      write();
    },
    recordRun: function(sec, level, cleared){
      var b = this.get().best;
      if (sec > b.sec) b.sec = sec;
      if (level > b.level) b.level = level;
      if (cleared) b.clears++;
      write();
    },
    // 살 수 있으면 사고 true, 못 사면 false
    buy: function(key){
      var d = this.get(), cfg = CONFIG.meta;
      var step = d.meta[key];
      if (step === undefined || step >= cfg.maxStep) return false;
      var cost = cfg.costs[step];
      if (d.coins < cost) return false;
      d.coins -= cost;
      d.meta[key] = step + 1;
      write();
      return true;
    },
    costOf: function(key){
      var d = this.get(), cfg = CONFIG.meta;
      var step = d.meta[key];
      return step >= cfg.maxStep ? null : cfg.costs[step];
    },
    starter: function(){ return this.get().starter; },
    isUnlocked: function(id){ return this.get().unlocked.indexOf(id) >= 0; },
    starterCostOf: function(id){
      var c = CONFIG.starterCosts[id];
      return (typeof c === 'number') ? c : null;
    },
    // 살 수 있으면 사고 true. 이미 샀거나 코인이 모자라면 false.
    buyStarter: function(id){
      var d = this.get();
      if (WEAPON_IDS.indexOf(id) < 0) return false;   // CONFIG 조회는 프로토타입 이름을 통과시킨다
      if (d.unlocked.indexOf(id) >= 0) return false;
      var cost = this.starterCostOf(id);
      if (cost === null || d.coins < cost) return false;
      d.coins -= cost;
      d.unlocked.push(id);
      write();
      return true;
    },
    // 산 무기만 장착할 수 있다
    equipStarter: function(id){
      var d = this.get();
      if (d.unlocked.indexOf(id) < 0) return false;
      d.starter = id;
      write();
      return true;
    },
    // 개발자용: 전부 만렙 + 코인 지급. 밸런스 판단이 아니라 후반 확인용이다.
    maxOut: function(coins){
      var d = this.get(), k;
      for (k in d.meta) d.meta[k] = CONFIG.meta.maxStep;
      d.coins += (coins === undefined ? 5000 : coins);
      write();
      return d;
    },
    // 개발자용: 저장을 통째로 지운다(처음부터 확인하고 싶을 때)
    wipe: function(){
      try { window.localStorage.removeItem(KEY); } catch (e){}
      data = null;
      return this.load();
    }
  };
})();

// 아직 준비 안 된 상태(고양이 애니메이션 프레임 데이터 등)를 읽어 죽는다.

  canvas.height = Math.floor(viewH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 캔버스 크기를 바꾸면 컨텍스트 상태가 초기화된다. 변하지 않는 글자 설정은 여기서 한 번만.
  ctx.font = '32px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  world.ensureGridCovers(viewW, viewH);
  /* 열어 둔 채 **회전**하면 제목이 화면 위로 밀려 사라지므로 맨 위로 되돌린다.
     ⚠️ 폭이 바뀐 경우에만 한다. 폰은 스크롤할 때 주소창이 접히며 **높이만** 바뀌고
        그것도 resize 를 부른다 — 조건 없이 되돌리면 상점·도감을 내리는 족족
        맨 위로 튕겨 올라가서 아래 카드에 영영 못 닿는다(2026-08-11 폰에서 발견).
        회전은 가로세로가 뒤집히므로 폭이 반드시 바뀐다. */
  if ((inShop || inCodex) && 폭이바뀜) overlay.scrollTop = 0;
  // 캔버스 크기를 바꾸면 그 내용이 지워진다. frame() 이 정지 상태라 다시 안 그리면
  // 오버레이 뒤 배경이 회전 후 빈 채로 남는다 — 여기서 즉시 한 번 다시 그린다.
  if (gameLoopStarted) render();
}
window.addEventListener('resize', resize);
resize();

var TILE = CONFIG.grid.cellSize;

/* 그림을 못 구웠을 때 떨어지는 자리. 12단계까지 쓰던 방식 그대로다.
   어느 하나를 빠뜨려도 화면이 검게 비지 않게 하는 안전장치다. */
function drawBackgroundFallback(camX, camY){
  ctx.fillStyle = '#1b2416';
  ctx.fillRect(0, 0, viewW, viewH);
  var offX = -(camX % TILE);
  var offY = -(camY % TILE);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = offX; x < viewW; x += TILE){
    ctx.moveTo(x, 0); ctx.lineTo(x, viewH);
  }
  for (var y = offY; y < viewH; y += TILE){
    ctx.moveTo(0, y); ctx.lineTo(viewW, y);
  }
  ctx.stroke();
}

/* 팔레트 한 벌로 바닥을 한 번 칠한다. alpha 는 시간대가 넘어가는 4초 동안만 1 미만이다. */
function paintGround(camX, camY, palIndex, alpha){
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.save();
  ctx.translate(snapPx(-(camX % GROUND_TILE_PX)), snapPx(-(camY % GROUND_TILE_PX)));
  ctx.fillStyle = GROUND_PATTERN[palIndex];
  /* 사방으로 한 타일씩 넘겨서 채운다.
     자바스크립트의 % 는 음수를 그대로 돌려준다 — -100 % 64 는 -36 이지 28 이 아니다.
     카메라는 왼쪽·위로 무한히 가므로 translate 가 양수로 밀리는 프레임이 생기고,
     0,0 부터 채우면 화면 왼쪽·위에 안 칠해진 띠가 남는다. */
  ctx.fillRect(-GROUND_TILE_PX, -GROUND_TILE_PX,
               viewW + GROUND_TILE_PX * 2, viewH + GROUND_TILE_PX * 2);
  ctx.restore();
  drawDecor(camX, camY, palIndex);      // ← 추가
  if (alpha < 1) ctx.globalAlpha = 1;
}

var GROUND_FADE_SEC = 4;

/* 지금이 몇 번째 시간대인가.
   경계는 새로 정한 숫자가 아니라 CONFIG.bosses 의 atMin 이다 — 상수를 따로 박아 두면
   밸런스를 만질 때 배경만 조용히 어긋난다(15단계에서 공격력 공식을 core 에 둔 것과 같은 이유).
   팔레트가 보스보다 적으면 마지막 팔레트를 계속 쓴다. 화면이 검게 비지 않게. */
function groundPhase(elapsed){
  var n = GROUND_PATTERN.length;
  var bosses = CONFIG.bosses;
  var idx = 0, startedAt = 0;
  // atMin 이 오름차순이라고 가정한다 — "마지막으로 일치한 보스"를 쓰지
  // "가장 늦게 일치한 보스"를 따로 찾지 않는다. 지금의 [5, 10, 15]에서는
  // 같은 결과지만, 순서를 바꾸는 밸런스 수정이 생기면 이 가정도 같이 깨진다.
  for (var i = 0; i < bosses.length; i++){
    if (elapsed >= bosses[i].atMin * 60 && i + 1 < n){
      idx = i + 1;
      startedAt = bosses[i].atMin * 60;
    }
  }
  // 새 팔레트가 드러난 정도. 4초에 걸쳐 0 → 1.
  // 구간이 시작하는 순간부터 세기 시작한다 — 보스 등장과 같은 순간이어야 연출이 맞는다.
  var fade = 1;
  if (idx > 0){
    var t = (elapsed - startedAt) / GROUND_FADE_SEC;
    if (t < 1) fade = t < 0 ? 0 : t;
  }
  return { index: idx, prevIndex: idx > 0 ? idx - 1 : 0, fade: fade };
}

function drawBackground(camX, camY){
  if (!GROUND_PATTERN.length){ drawBackgroundFallback(camX, camY); return; }
  var ph = groundPhase(world.elapsed);
  if (ph.fade < 1){
    // 이전 시간대를 꽉 채운 뒤 새 시간대를 그 위에 서서히 덮는다.
    // 순서를 바꾸면 4초 동안 바닥이 비쳐서 얼룩이 두 겹으로 보인다.
    paintGround(camX, camY, ph.prevIndex, 1);
    paintGround(camX, camY, ph.index, ph.fade);
  } else {
    paintGround(camX, camY, ph.index, 1);
  }
}

var CULL = CONFIG.render.cullMargin;
var GEM_HALF = CONFIG.gem.size / 2;
var PROJ_COLOR = { yarn: '#e88ac0', bone: '#f2ead6', tornado: '#b8d4e8' };
// 폭발 무기별 고리 색. 없는 id 는 흰색으로 떨어진다.
var BLAST_COLOR = { catnip: '#9ae86a', nuke: '#ffcf5a' };
// ☢️ 핵폭탄 아이템 글자 크기 — render() 마다 문자열을 새로 이어붙이지 않도록 한 번만 만든다.
var NUKE_FONT = CONFIG.nukeItem.size + 'px serif';
/* ── 도트 굽기 ──────────────────────────────────────────────────
   글자 격자를 오프스크린 캔버스로 시작할 때 한 번만 굽는다.
   매 프레임에 픽셀을 찍으면 적 400마리에서 감당이 안 되므로,
   그린 뒤로는 drawImage 만 한다.
   forceColor 를 주면 보이는 픽셀을 전부 그 색으로 칠한다 — 맞았을 때
   쓰는 흰색 판을 만드는 용도다.                                    */
function bakeFrame(rows, pal, forceColor){
  var w = 0, i;
  for (i = 0; i < rows.length; i++) if (rows[i].length > w) w = rows[i].length;
  var c = document.createElement('canvas');
  c.width = w || 1;
  c.height = rows.length || 1;
  var g = c.getContext('2d');
  for (var y = 0; y < rows.length; y++){
    var row = rows[y];
    for (var x = 0; x < row.length; x++){
      var col = pal[row.charAt(x)];
      if (!col) continue;              // 팔레트에 없는 글자는 투명 — 오타가 게임을 안 깬다
      g.fillStyle = forceColor || col;
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function bakeSet(frames, pal){
  var out = { frames: [], flash: [] };
  for (var i = 0; i < frames.length; i++){
    out.frames.push(bakeFrame(frames[i], pal, null));
    out.flash.push(bakeFrame(frames[i], pal, '#ffffff'));
  }
  return out;
}

/* 적 그림을 시작할 때 한 번 굽는다. ENEMY_ART 에 없는 적은 키가 안 생기고,
   렌더가 예전 네모 방식으로 떨어진다. */
var ART = window.CatArt;
/* ── 16단계: 바닥 ───────────────────────────────────────────────
   좌표 → 0~1. 상태가 없고, 같은 입력에 늘 같은 출력이다.

   ⚠️ world.rnd 를 쓰면 안 된다. 게임의 난수는 씨드 기반이고 봇 시뮬 재현성이
   거기 걸려 있다. 배경을 그리려고 난수를 한 번만 더 뽑아도 그 뒤의 모든
   스폰·드롭이 밀려서, 보여주기만 하는 코드가 10단계 600판 측정을 무너뜨린다. */
function decorHash(x, y, salt){
  var h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263)
                                      ^ Math.imul(salt | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 15), 2246822519);
  h = Math.imul(h ^ (h >>> 13), 3266489917);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

var GROUND_TILE_DOTS = 32;   // 타일 격자 칸 수
var GROUND_TILE_PX = 64;     // 화면 크기 (도트 하나 = 2px, 장식과 같은 배율)

/* 카메라는 실수 좌표다. 소수점이 섞인 채로 타일을 깔면 픽셀 경계에 안 맞아
   브라우저가 이웃 색을 섞는다 — imageSmoothingEnabled 를 꺼도 그렇다.
   실측(375x812, dpr 2): 반 픽셀 어긋나면 화면 픽셀의 55% 가 팔레트에 없는
   중간색이 된다. 그래서 장치 픽셀 단위로 맞춰서 깐다.
   배경이 최대 1/dpr px 만큼 늦게 따라오지만 눈에 안 띄고,
   도트가 뭉개지는 쪽이 훨씬 나쁘다. */
function snapPx(v){ return Math.round(v * dpr) / dpr; }

/* 바닥 타일은 손으로 안 찍는다. 이 무늬는 그릴 의도가 있는 그림이 아니라
   흙과 풀의 얼룩이라, 1024글자를 손으로 찍으면 오타 위험만 는다.
   얼룩이 너무 많거나 적으면 아래 문턱값 네 개만 고치면 된다.
   32×32 는 통째로 반복되므로 이음매는 저절로 맞는다(방향성 있는
   그라데이션만 없으면 되고, 얼룩 노이즈에는 없다).
   ⚠️ 캔버스는 GROUND_TILE_DOTS(32칸)가 아니라 GROUND_TILE_PX(64px)로 굽는다 —
   createPattern 은 원본 이미지를 자연 크기 그대로 반복할 뿐 늘려 주지 않는다.
   32px 로 구우면 바닥 도트가 1px 가 되어, 24px/12칸 = 2px 인 장식 도트의
   절반 크기가 된다. 그래서 칸마다 2×2 블록을 찍어 64px 캔버스를 채운다. */
function bakeGround(pal){
  var n = GROUND_TILE_DOTS;
  var c = document.createElement('canvas');
  c.width = GROUND_TILE_PX; c.height = GROUND_TILE_PX;
  var g = c.getContext('2d');
  g.fillStyle = pal.g;
  g.fillRect(0, 0, GROUND_TILE_PX, GROUND_TILE_PX);
  for (var y = 0; y < n; y++){
    for (var x = 0; x < n; x++){
      var v = decorHash(x, y, 7);
      var col = null;
      if (v < 0.06)      col = pal.d;   // 진한 점
      else if (v < 0.16) col = pal.G;   // 짙은 얼룩
      else if (v < 0.26) col = pal.h;   // 밝은 얼룩
      else if (v < 0.29) col = pal.H;   // 가장 밝은 점
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x * 2, y * 2, 2, 2);
    }
  }
  return c;
}

/* 팔레트가 "있지만 칸이 빠진" 경우도 실패로 쳐야 한다 — fillStyle 에
   undefined 를 주면 Canvas 는 조용히 무시하고 그 자리를 기본 검정으로
   남긴다. 그러면 createPattern 은 성공(검은 타일)해 버려서 화면은 안 비지만
   통째로 검게 칠해진다 — §5 가 막으려던 "화면이 검게 비는" 상황을 다른
   모습으로 재현하는 셈이다. GROUND_KEYS 를 고정 순서로 훑어서 미리 잡는다
   (엔진마다 순서가 다른 for...in 은 봇 재현성 때문에 이 저장소에서 금지). */
function validGroundPalette(pal){
  if (!pal) return false;
  for (var i = 0; i < ART.GROUND_KEYS.length; i++){
    if (typeof pal[ART.GROUND_KEYS[i]] !== 'string') return false;
  }
  return true;
}
/* DECOR 행 배열이 비었거나 문자열이 아닌 항목을 담고 있으면 bakeFrame 안의
   row.charAt 이 죽는다 — 하나 잘못된 장식이 art 셸 전체 IIFE 를 끌고
   내려가면 안 되므로 굽기 전에 미리 걸러 낸다. */
function validDecorRows(rows){
  if (!rows || !rows.length) return false;
  for (var i = 0; i < rows.length; i++){
    if (typeof rows[i] !== 'string') return false;
  }
  return true;
}

/* 팔레트 벌마다 타일 하나와 패턴 하나를 굽는다.
   패턴은 여기서 한 번만 만든다 — 프레임마다 createPattern 을 부르면 안 된다.
   하나라도 실패하면 전부 비워서 옛 방식(단색+격자선)으로 떨어진다.
   반쯤 채워 두면 어떤 시간대에서만 화면이 비는 편이 더 나쁘다. */
var GROUND_PATTERN = [];
var DECOR_BAKED = [];
(function bakeGroundAll(){
  var ids = ART.GROUND_PALETTE_IDS;
  /* GROUND_KEYS 도 반드시 여기서 막는다. validGroundPalette 이 이걸 무방비로
     참조하는데, 없으면 TypeError 가 나고 이 IIFE 는 try 로 감싸여 있지 않아서
     셸 블록 전체가 거기서 끊긴다 — 렌더 루프도 조작도 정의되지 않는다.
     팔레트 하나가 잘못돼서 게임이 통째로 안 뜨는 것은, 이 검사가 막으려던
     "검은 화면" 보다 나쁘다. */
  if (!ids || !ART.GROUND_PALETTES || !ART.GROUND_KEYS || !ART.DECOR_IDS || !ART.DECOR) return;
  var pats = [], decors = [];
  for (var i = 0; i < ids.length; i++){
    var pal = ART.GROUND_PALETTES[ids[i]];
    if (!validGroundPalette(pal)) return;
    var pat = ctx.createPattern(bakeGround(pal), 'repeat');
    if (!pat) return;
    pats.push(pat);
    var set = {};
    for (var d = 0; d < ART.DECOR_IDS.length; d++){
      var did = ART.DECOR_IDS[d];
      if (!validDecorRows(ART.DECOR[did])) return;
      set[did] = bakeFrame(ART.DECOR[did], pal, null);
    }
    decors.push(set);
  }
  GROUND_PATTERN = pats;
  DECOR_BAKED = decors;
})();

var DECOR_CELL = 96;         // 장식 한 칸의 크기(px)
var DECOR_DENSITY = 0.55;    // 해시 값이 이보다 작은 칸에만 놓는다
var DECOR_PX = 24;           // 화면 크기 (12칸 × 2px)

/* 바닥을 96px 칸으로 나누고, 칸 좌표를 해시에 넣어 장식을 정한다.
   같은 자리로 돌아오면 늘 같은 장식이 있다 — 무한 평면인데 아무것도 저장하지 않는다.
   salt 별 쓰임: 0 있음/없음 · 1 종류 · 2 가로 위치 · 3 세로 위치.
   폰(390×780)에서 화면에 걸리는 칸이 60개 안팎, 밀도 55% 면 drawImage 33번쯤이다.
   적 400마리 옆에서는 잡히지 않는 비용이다. */
function drawDecor(camX, camY, palIndex){
  var baked = DECOR_BAKED[palIndex];
  if (!baked) return;
  var ids = ART.DECOR_IDS;
  var c0 = Math.floor(camX / DECOR_CELL) - 1;
  var r0 = Math.floor(camY / DECOR_CELL) - 1;
  var c1 = Math.floor((camX + viewW) / DECOR_CELL) + 1;
  var r1 = Math.floor((camY + viewH) / DECOR_CELL) + 1;
  var span = DECOR_CELL - DECOR_PX;
  for (var cy = r0; cy <= r1; cy++){
    for (var cx = c0; cx <= c1; cx++){
      if (decorHash(cx, cy, 0) >= DECOR_DENSITY) continue;
      var img = baked[ids[Math.floor(decorHash(cx, cy, 1) * ids.length)]];
      if (!img) continue;
      var wx = cx * DECOR_CELL + decorHash(cx, cy, 2) * span;
      var wy = cy * DECOR_CELL + decorHash(cx, cy, 3) * span;
      // paintGround 와 같은 이유로 snapPx 를 쓴다 — CSS 픽셀 반올림은
      // dpr 1.5 같은 장치에서 장치 픽셀 경계에 안 맞아 도트가 뭉개진다.
      ctx.drawImage(img, snapPx(wx - camX), snapPx(wy - camY),
                    DECOR_PX, DECOR_PX);
    }
  }
}
var ENEMY_BAKED = {};
(function bakeEnemies(){
  for (var i = 0; i < ART.ENEMY_IDS.length; i++){
    var id = ART.ENEMY_IDS[i];
    var spec = ART.ENEMY_ART[id];
    if (!spec) continue;
    var frames = ART.SPRITES[spec.sprite];
    if (!frames) continue;
    ENEMY_BAKED[id] = bakeSet(frames, ART.mobPalette(spec.tint));
  }
})();

/* 고양이. 플레이어와 고양이 친구가 같은 그림에 팔레트만 다르다.
   feral(들고양이)은 고양이 친구의 진화형이다 — 그림은 그대로고 색만 사납다. */
var CAT_BAKED = {
  cheese: bakeSet(ART.SPRITES.cat, ART.CAT_SKINS.cheese),
  friend: bakeSet(ART.SPRITES.cat, ART.CAT_SKINS.friend),
  feral:  bakeSet(ART.SPRITES.cat, ART.CAT_SKINS.feral)
};
var CAT_BLINK = {
  cheese: bakeSet(ART.SPRITES.catBlink, ART.CAT_SKINS.cheese),
  friend: bakeSet(ART.SPRITES.catBlink, ART.CAT_SKINS.friend),
  feral:  bakeSet(ART.SPRITES.catBlink, ART.CAT_SKINS.feral)
};

/* ── 19단계: 진화형 그림과 상자 ──────────────────────────────────
   열한 장을 시작할 때 한 번만 굽는다. 적·고양이와 같은 방식(bakeFrame)이다.
   bakeSet 을 안 쓰는 이유: 진화형·상자는 맞아서 번쩍이지 않으므로 flash 판
   열한 장이 통째로 낭비다.

   카드에 넣을 그림은 data URL 로도 같이 뽑아 둔다. 오버레이 카드는
   innerHTML 로 만들어져서 캔버스를 그대로 끼울 자리가 없기 때문이다. */
var WEAPON_BAKED = {};
var WEAPON_ICON = {};
(function bakeWeaponArt(){
  if (!ART.WEAPON_SPRITE_IDS || !ART.WEAPON_SPRITES || !ART.WEAPON_PALETTE) return;
  for (var i = 0; i < ART.WEAPON_SPRITE_IDS.length; i++){
    var id = ART.WEAPON_SPRITE_IDS[i];
    var rows = ART.WEAPON_SPRITES[id];
    // 줄이 비었거나 문자열이 아니면 bakeFrame 의 row.charAt 이 죽는다.
    // 그림 한 장 때문에 셸 블록 전체가 끊기면 게임이 아예 안 뜬다 — 그 한 장만 버린다.
    if (!validDecorRows(rows)) continue;
    var img = bakeFrame(rows, ART.WEAPON_PALETTE, null);
    WEAPON_BAKED[id] = img;
    // toDataURL 은 캔버스가 오염됐을 때만 던지는데(여기선 직접 찍은 픽셀뿐이라 안 그렇다),
    // 실패해도 필드에 그리는 쪽은 살아 있어야 하므로 조용히 넘긴다.
    try { WEAPON_ICON[id] = img.toDataURL(); } catch (e) {}
  }
})();

/* 21단계: 기본형도 같은 방식으로 굽는다. 표만 다르고 절차는 위와 똑같다.
   판이 따로인 이유는 id 가 겹치기 때문이다 — WEAPON_BAKED.yarn 은 실타래 폭풍,
   BASE_BAKED.yarn 은 털뭉치다. 한 판에 담으면 하나가 다른 하나를 덮어쓴다. */
var BASE_BAKED    = {};   // 필드에 그리는 판. 여섯 무기만 들어 있다.
var BASE_ICON     = {};   // 카드·도감용 data URL(HTML 에 끼운다). 열 무기 전부.
var BASE_ICON_IMG = {};   // HUD 용 캔버스(canvas 에 그린다). 열 무기 전부.
(function bakeBaseArt(){
  if (!ART.BASE_SPRITE_IDS || !ART.BASE_SPRITES || !ART.WEAPON_PALETTE) return;
  /* 판마다 **어느 표에서 가져오는지를 못 박는다.** 두 표를 차례로 훑으면서
     덮어쓰게 두면 "나중에 훑은 쪽이 이긴다" 가 되어, 표를 훑는 순서를 바꾸는
     순간 우유 카드에 장판 무늬가 뜬다(우유는 양쪽에 다 있다). */
  var 아이콘표 = ART.BASE_ICON_SPRITES || {}, 아이콘목록 = ART.BASE_ICON_IDS || [];
  var i, id, rows, img;

  // ① 필드 판 — 필드 표에서만 가져온다
  for (i = 0; i < ART.BASE_SPRITE_IDS.length; i++){
    id = ART.BASE_SPRITE_IDS[i];
    rows = ART.BASE_SPRITES[id];
    if (!validDecorRows(rows)) continue;   // 한 장이 망가져도 나머지는 살린다
    BASE_BAKED[id] = bakeFrame(rows, ART.WEAPON_PALETTE, null);
  }

  // ② 아이콘 판 — 아이콘 표를 **먼저** 보고, 없을 때만 필드 그림을 빌려 쓴다
  var 아이콘id = ART.BASE_SPRITE_IDS.concat(아이콘목록);
  for (i = 0; i < 아이콘id.length; i++){
    id = 아이콘id[i];
    if (BASE_ICON_IMG[id]) continue;                       // 이미 넣었다
    rows = 아이콘표[id] || ART.BASE_SPRITES[id];
    if (!validDecorRows(rows)) continue;
    img = (rows === ART.BASE_SPRITES[id] && BASE_BAKED[id])
        ? BASE_BAKED[id]                                   // 같은 그림이면 다시 안 굽는다
        : bakeFrame(rows, ART.WEAPON_PALETTE, null);
    BASE_ICON_IMG[id] = img;
    // toDataURL 이 실패해도(캔버스 오염) 필드 쪽은 살아 있어야 하므로 조용히 넘긴다.
    try { BASE_ICON[id] = img.toDataURL(); } catch (e) {}
  }
})();

/* 무기 아이콘 한 칸(HTML). 그림이 있으면 도트, 없으면 **이모지로 떨어진다**.
   패시브·고양이 캔·적에는 그림이 없어서 그쪽은 이 함수를 안 거치고 이모지 그대로다.
   진화한 무기는 진화형 그림을 보여준다 — 손에 든 것과 화면에 나는 것이 같아야 한다. */
function weaponIcoHtml(id, 이모지){
  var url = (world && world.isEvolved(id) && WEAPON_ICON[id]) ? WEAPON_ICON[id]
                                                             : BASE_ICON[id];
  return url ? '<img class="wpnIco" src="' + url + '" alt="">' : 이모지;
}

/* 우유 바다는 화면 세로 절반을 덮는 장판이다(반경 = viewHalfH, 폰에서 390px 안팎).
   16×16 을 가운데 한 장 찍으면 안 보이고, 반경만큼 통째로 늘리면 도트 하나가
   50px 짜리 덩어리가 된다. 4배로 키운 타일을 반복 패턴으로 만들어 판정 반경 안을 채운다.
   타일은 먼저 우유색으로 꽉 칠하고 그 위에 그림을 얹는다 — 원본 그림은 네 귀퉁이가
   비어 있어서(둥근 웅덩이 모양) 그대로 이어 붙이면 이음매마다 구멍이 뚫린다. */
var MILK_TILE_PX = 64;         // 16도트 × 4배
function bakeMilkPattern(src){
  if (!src) return null;
  var c = document.createElement('canvas');
  c.width = MILK_TILE_PX; c.height = MILK_TILE_PX;
  var g = c.getContext('2d');
  if (!g) return null;
  g.fillStyle = ART.WEAPON_PALETTE.W || '#fff6e8';
  g.fillRect(0, 0, MILK_TILE_PX, MILK_TILE_PX);
  g.imageSmoothingEnabled = false;   // 도트를 흐리게 늘리지 않는다
  g.drawImage(src, 0, 0, MILK_TILE_PX, MILK_TILE_PX);
  return ctx.createPattern(c, 'repeat');
}
var MILK_PATTERN      = bakeMilkPattern(WEAPON_BAKED.milk);   // 우유 바다(진화형)
var MILK_PATTERN_BASE = bakeMilkPattern(BASE_BAKED.milk);     // 우유 웅덩이(기본형)

/* 레이저 띠 타일. 기본형(붉은 포인터)과 진화형(노란 햇살)이 **같은 그림**이고
   팔레트만 다르다 — 생물 그림에서 king1/king2 를 같은 그림 다른 색으로 쓰는
   것과 같은 수법이다. 그림을 따로 만들면 "같은 빔이 세졌다" 가 아니라 딴 무기가 된다. */
var LASER_TILE = BASE_BAKED.laser || null;
var LASER_TILE_EVO = (function bakeSunBeam(){
  var rows = ART.BASE_SPRITES && ART.BASE_SPRITES.laser;
  if (!rows || !validDecorRows(rows)) return null;
  var pal = {}, k;
  for (k in ART.WEAPON_PALETTE) pal[k] = ART.WEAPON_PALETTE[k];
  pal.r = ART.WEAPON_PALETTE.y || '#fff2a8';   // 붉은 테두리를 햇빛 노랑으로
  return bakeFrame(rows, pal, null);
})();

// 🎁 상자 화면 크기. 16도트 × 3배 — 정수 배율이라 도트가 안 뭉개진다.
// 판정(pickupRadius 26 + 고양이 반경)보다 조금 작아서 "닿았는데 안 먹힌다" 가 안 생긴다.
var BOX_PX = 48;

/* 고양이 걸음은 "움직인 거리" 로 센다. 시간으로 세면 서 있을 때도 다리가
   움직여서 미끄러지는 것처럼 보인다. */
var catWalk = 0, catLastX = null, catLastY = null;
function catFrame(skin, size, sx, sy){
  var img;
  // 4초에 한 번, 0.12초 동안 눈을 감는다
  if ((world.elapsed % 4) < 0.12){
    img = CAT_BLINK[skin].frames[0];
  } else {
    var set = CAT_BAKED[skin].frames;
    img = set[Math.floor(catWalk / 11) % set.length];
  }
  var dw = size, dh = size * img.height / img.width;
  ctx.drawImage(img, sx - dw / 2, sy - dh / 2, dw, dh);
}

function render(){
  var camX = world.player.x - viewW / 2;
  var camY = world.player.y - viewH / 2;

  // 도트는 흐리게 늘리면 죽는다. 캔버스 크기가 바뀌면 이 설정이 풀리므로
  // 프레임마다 켠다 (설정 비용은 무시할 수 있다).
  // drawBackground 보다 먼저 켜야 한다 — 리사이즈 직후 첫 프레임에 바닥
  // 타일이 스무딩 켜진 채로 그려져 뭉개지는 걸 막는다.
  ctx.imageSmoothingEnabled = false;

  drawBackground(camX, camY);

  // 고양이가 이번 프레임에 움직인 거리를 걸음에 더한다
  if (catLastX !== null){
    catWalk += Math.abs(world.player.x - catLastX) + Math.abs(world.player.y - catLastY);
  }
  catLastX = world.player.x;
  catLastY = world.player.y;

  // 우유 웅덩이 (바닥에 깔리므로 가장 먼저 그린다)
  var fitems = world.fields.items;
  for (var fi = 0; fi < fitems.length; fi++){
    var fd = fitems[fi];
    if (!fd.active) continue;
    var fx = fd.x - camX, fy = fd.y - camY;
    /* 여백에 장판 반경을 더해서 잘라야 한다. 고정 CULL(40) 만 쓰면 우유 바다처럼
       큰 장판(폰에서 반경 390)이 중심만 살짝 화면을 벗어나도 통째로 안 그려진다 —
       아직 살아서 적을 늦추고 때리고 있는데 그림만 한 프레임에 사라진다.
       장판을 깔고 한 방향으로 1초만 달리면 바로 일어나는 일이다.
       진화 전 반경(92)에서는 40px 여유로 대충 가려져 안 드러났다. */
    var fcull = CULL + fd.radius;
    if (fx < -fcull || fy < -fcull || fx > viewW + fcull || fy > viewH + fcull) continue;
    /* 판정 반경 안을 무늬 타일로 채운다. 진화형(우유 바다)은 물결이 빽빽하고
       기본형(우유 웅덩이)은 방울 셋만 띄운 잔잔한 면이다 — 무늬만 다르고 길은 같다.
       패턴 원점을 카메라만큼 밀어 world 좌표에 못 박는다. 안 그러면 걸어갈 때
       물결이 화면에 붙어 따라와서 장판이 미끄러지는 것처럼 보인다(바닥 타일과 같은 이유).
       투명도는 원래 웅덩이와 같은 0.35 를 지킨다 — 진화형은 화면 절반을 덮는 것이라
       조금만 더 진해도 그 안의 쥐가 안 보인다. */
    var milkPat = world.isEvolved(fd.weaponId) ? MILK_PATTERN : MILK_PATTERN_BASE;
    if (milkPat){
      ctx.save();
      ctx.beginPath();
      ctx.arc(fx, fy, fd.radius, 0, Math.PI * 2);
      ctx.clip();
      ctx.globalAlpha = 0.35;
      ctx.translate(snapPx(-(camX % MILK_TILE_PX)), snapPx(-(camY % MILK_TILE_PX)));
      ctx.fillStyle = milkPat;
      ctx.fillRect(-MILK_TILE_PX, -MILK_TILE_PX,
                   viewW + MILK_TILE_PX * 2, viewH + MILK_TILE_PX * 2);
      ctx.restore();
      // 테두리 — 어디까지가 우유인지 안 보이면 "밟고 있나" 를 판단할 수 없다.
      // 반투명 장판은 가장자리가 특히 흐려서 이 선이 없으면 경계가 사라진다.
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#a9c4dc';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(fx, fy, fd.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#eef3ff';
    ctx.beginPath();
    ctx.arc(fx, fy, fd.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 두더지 예고 — 흙더미가 부풀다가 터진다
  var witems = world.warns.items;
  for (var wi2 = 0; wi2 < witems.length; wi2++){
    var wn2 = witems[wi2];
    if (!wn2.active) continue;
    var wx = wn2.x - camX, wy = wn2.y - camY;
    if (wx < -CULL || wy < -CULL || wx > viewW + CULL || wy > viewH + CULL) continue;
    var grow = 1 - wn2.left / CONFIG.enemies.mole.warnSec;   // 0 → 1
    ctx.globalAlpha = 0.3 + 0.5 * grow;
    ctx.fillStyle = '#6b4b2a';
    ctx.beginPath();
    ctx.arc(wx, wy, CONFIG.enemies.mole.radius * (0.6 + 0.8 * grow), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 젬 (적보다 먼저 그려 아래에 깔리게)
  ctx.fillStyle = '#5ad1e8';
  var gitems = world.gems.items;
  for (var gi = 0; gi < gitems.length; gi++){
    var g = gitems[gi];
    if (!g.active) continue;
    var gx = g.x - camX, gy = g.y - camY;
    if (gx < -CULL || gy < -CULL || gx > viewW + CULL || gy > viewH + CULL) continue;
    ctx.fillRect(gx - GEM_HALF, gy - GEM_HALF, CONFIG.gem.size, CONFIG.gem.size);
  }

  // ☢️ 핵폭탄 아이템 — 젬 바로 다음에 그린다. 밟으면 터지고, 안 밟으면 아껴둔 것이다.
  ctx.font = NUKE_FONT;
  var nitems = world.nukes.items;
  for (var ni = 0; ni < nitems.length; ni++){
    var nk = nitems[ni];
    if (!nk.active) continue;
    var nx = nk.x - camX, ny = nk.y - camY;
    if (nx < -CULL || ny < -CULL || nx > viewW + CULL || ny > viewH + CULL) continue;
    ctx.fillText(CONFIG.nukeItem.emoji, nx, ny);
  }

  /* 🎁 보스 상자 — 보스를 잡은 직후는 화면이 거의 비어 있어서, 가만히 놓인 그림
     하나는 배경 장식으로 보고 지나치기 쉽다. 위아래로 떠오르게 하고 뒤에서
     금빛 고리가 뛰게 해서 "이건 주우라고 놓은 것" 을 만든다.
     ⚠️ 움직임은 world.elapsed(게임 시계)로만 만든다. world.rnd 를 한 번이라도
     뽑으면 그 뒤의 모든 스폰·드롭이 밀려서, 보여주기만 하는 코드가 봇
     재현성을 통째로 깨뜨린다(바닥 장식·폭죽에 적어 둔 것과 같은 규칙). */
  var boxImg = WEAPON_BAKED.box;
  var bxitems = world.boxes.items;
  for (var bxi = 0; bxi < bxitems.length; bxi++){
    var bx0 = bxitems[bxi];
    if (!bx0.active) continue;
    var bsx = bx0.x - camX, bsy = bx0.y - camY;
    if (bsx < -CULL || bsy < -CULL || bsx > viewW + CULL || bsy > viewH + CULL) continue;
    var bob = Math.sin(world.elapsed * 3) * 5;                       // 위아래 ±5px
    var pulse = 0.25 + 0.3 * (1 + Math.sin(world.elapsed * 4)) / 2;  // 0.25 ~ 0.55
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#ffd86a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(bsx, bsy, CONFIG.bossBox.pickupRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;
    if (boxImg){
      ctx.drawImage(boxImg, bsx - BOX_PX / 2, bsy - BOX_PX / 2 + bob, BOX_PX, BOX_PX);
    } else {
      // 그림을 못 구웠을 때 — 상자가 화면에서 사라지면 보스를 잡은 보상이 통째로
      // 안 보인다. 글꼴·정렬은 바로 위 핵폭탄 쪽에서 이미 맞춰 둔 그대로 쓴다.
      ctx.fillText(CONFIG.bossBox.emoji, bsx, bsy + bob);
    }
  }

  // 적 — 맞은 직후에는 흰색으로 번쩍인다
  var items = world.enemies.items;
  for (var i = 0; i < items.length; i++){
    var e = items[i];
    if (!e.active) continue;
    var sx = e.x - camX, sy = e.y - camY;
    if (sx < -CULL || sy < -CULL || sx > viewW + CULL || sy > viewH + CULL) continue;
    var etype = CONFIG.enemies[e.typeId];
    var baked = ENEMY_BAKED[e.typeId];
    if (baked){
      var set = e.hitFlash > 0 ? baked.flash : baked.frames;
      var fi = 0;
      if (set.length > 1){
        // 걷는 놈은 "지나온 거리" 로 프레임을 고른다. 시간으로 고르면 화면의
        // 모든 쥐가 발을 맞춰 걸어서 기계처럼 보인다. 좌표로 하면 개체마다
        // 위상이 달라지고, 빠른 놈이 저절로 빨리 걷는다.
        // 제자리인 놈(두더지)은 좌표가 안 변하므로 시간으로 들썩인다.
        fi = etype.speed > 0
           ? Math.floor((e.x + e.y) / 9) % set.length
           : Math.floor(world.elapsed * 3) % set.length;
        if (fi < 0) fi += set.length;    // 좌표는 음수일 수 있다
      }
      var img = set[fi];
      var dw = etype.size;
      var dh = etype.size * img.height / img.width;
      var spec = ART.ENEMY_ART[e.typeId];
      if (spec.flip && e.x > world.player.x){
        // 고양이보다 오른쪽에 있으면 뒤집어서 고양이 쪽을 보게 한다.
        // "쫓아온다" 는 느낌은 이것 하나로 생긴다.
        ctx.save();
        ctx.translate(sx, sy);
        ctx.scale(-1, 1);
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.restore();
      } else {
        ctx.drawImage(img, sx - dw / 2, sy - dh / 2, dw, dh);
      }
    } else {
      // 그림이 아직 없는 적 — 예전 방식으로 그린다. 어느 하나를 빠뜨려도
      // 화면에서 사라지지 않게 하는 안전장치다.
      var half = etype.size / 2;
      ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : etype.color;
      ctx.fillRect(sx - half, sy - half, half * 2, half * 2);
    }
  }

  // 투사체
  var pitems = world.projectiles.items;
  for (var pi = 0; pi < pitems.length; pi++){
    var pj = pitems[pi];
    if (!pj.active) continue;
    var ppx = pj.x - camX, ppy = pj.y - camY;
    if (ppx < -CULL || ppy < -CULL || ppx > viewW + CULL || ppy > viewH + CULL) continue;
    /* 진화형(실타래 폭풍·참치뼈·태풍)은 동그라미 대신 그림으로 그린다.
       판정 반경을 그대로 지름으로 쓰면 실타래(반경 8)가 16px 라 모양이 안 읽힌다 —
       작은 것만 최소 크기로 올린다. 태풍(반경 26)은 판정 그대로 52px 다.
       21단계: 기본형에도 그림이 생겼다. 둘 다 없으면 아래 동그라미로 떨어진다. */
    var pimg = world.isEvolved(pj.weaponId) ? WEAPON_BAKED[pj.weaponId]
                                            : BASE_BAKED[pj.weaponId];
    if (pimg){
      var psz = pj.radius * 2;
      if (psz < 24) psz = 24;
      ctx.drawImage(pimg, ppx - psz / 2, ppy - psz / 2, psz, psz);
      continue;
    }
    ctx.fillStyle = PROJ_COLOR[pj.weaponId] || '#ffffff';
    ctx.beginPath();
    ctx.arc(ppx, ppy, pj.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 할퀴기 스윙 — 공격 리듬이 보여야 "언제 다가갈지"를 판단할 수 있다
  if (world.swingTimer > 0){
    var swingT = world.swingTimer / (CONFIG.weapons.claw.swingMs / 1000);  // 1 → 0
    var ang = Math.atan2(world.swingDir.y, world.swingDir.x);
    var half = CONFIG.weapons.claw.arcDeg * Math.PI / 180 / 2;
    ctx.globalAlpha = 0.35 * swingT;
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.moveTo(viewW / 2, viewH / 2);
    ctx.arc(viewW / 2, viewH / 2, world.swingRadius, ang - half, ang + half);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    /* 발톱 자국 석 줄을 스윙 방향으로 눕혀 얹는다.
       부채꼴은 지우지 않는다. 그건 "어디까지 닿는가" 를 보여주는 것이고,
       그림은 "무엇이 지나갔는가" 를 보여주는 것이라 역할이 다르다.
       21단계: 기본형(가는 자국)과 진화형(굵은 자국 + 주황 불)이 같은 자리를 쓴다.
       ⚠️ 진화형이 먼저다 — 진화하면 둘 다 있으므로 순서를 뒤집으면 안 그려진다. */
    var clawImg = world.isEvolved('claw') ? WEAPON_BAKED.claw : BASE_BAKED.claw;
    if (clawImg){
      var cs = world.swingRadius;
      ctx.save();
      ctx.translate(viewW / 2, viewH / 2);
      ctx.rotate(ang);
      // 기본형은 옅게 얹는다. 부채꼴(0.35)보다는 진하되 진화형(0.95)만큼
      // 존재감을 주면 5성을 찍었을 때 달라진 게 안 느껴진다.
      ctx.globalAlpha = (world.isEvolved('claw') ? 0.95 : 0.7) * swingT;
      ctx.drawImage(clawImg, 0, -cs / 2, cs, cs);
      ctx.restore();
    }
  }

  // 레이저 잔상
  if (world.beamTimer > 0){
    var beamT = world.beamTimer / (CONFIG.weapons.laser.showMs / 1000);   // 1 → 0
    // 햇빛 모으기(진화형)는 붉은 포인터 자국이 아니라 노란 햇살이다.
    var laserEvo = world.isEvolved('laser');
    // 줄 수는 core 가 정한다(beamN). 여기서 세면 판정과 어긋난다.
    for (var bmi = 0; bmi < world.beamN; bmi++){
      var bdir = world.beamDirs[bmi];
      var bang = Math.atan2(bdir.y, bdir.x);
      ctx.save();
      ctx.translate(viewW / 2, viewH / 2);
      ctx.rotate(bang);
      ctx.globalAlpha = 0.75 * beamT;
      /* 띠를 따라 타일을 이어 붙인다. 사거리(400~640)가 레벨마다 달라 한 장으로는
         못 덮으므로, 타일 하나를 **띠 높이만큼** 키워 길이 방향으로 반복한다.
         타일 높이 = 띠 높이 = 판정 폭이라 "그린 것과 맞는 것" 이 어긋나지 않는다.
         ⚠️ 마지막 한 장은 남은 길이만큼만 잘라 그린다 — 통째로 그리면 띠가
            사거리 밖으로 삐져나가 "닿을 것 같은데 안 닿는" 구간이 생긴다. */
      var ltile = laserEvo ? LASER_TILE_EVO : LASER_TILE;
      var bh = world.beamHalfW * 2;
      if (ltile && bh > 0){
        var 남음 = world.beamLen, x = 0;
        ctx.imageSmoothingEnabled = false;   // 도트를 흐리게 늘리지 않는다
        while (남음 > 0.5){
          var 폭 = 남음 < bh ? 남음 : bh;
          ctx.drawImage(ltile, 0, 0, ltile.width * (폭 / bh), ltile.height,
                        x, -world.beamHalfW, 폭, bh);
          x += 폭; 남음 -= 폭;
        }
      } else {
        ctx.fillStyle = laserEvo ? '#fff2a8' : '#ff5a5a';   // 그림이 없으면 옛 방식
        ctx.fillRect(0, -world.beamHalfW, world.beamLen, world.beamHalfW * 2);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      /* 빛이 모이는 자리(집광점)를 띠 끝에 찍는다. 회전한 상태에서 그리면 그림까지
         같이 누워서 렌즈가 뒤집혀 보이므로, 끝점을 직접 구해 세워서 그린다.
         고양이 자리(띠의 시작)에 두지 않는 이유: 고양이는 이보다 나중에 그려져서 가려진다. */
      if (laserEvo && WEAPON_BAKED.laser){
        var lsz = 40;
        ctx.globalAlpha = 0.95 * beamT;
        ctx.drawImage(WEAPON_BAKED.laser,
                      viewW / 2 + Math.cos(bang) * world.beamLen - lsz / 2,
                      viewH / 2 + Math.sin(bang) * world.beamLen - lsz / 2, lsz, lsz);
        ctx.globalAlpha = 1;
      }
    }
  }

  // 폭발 고리 (캣닢·핵폭탄) — 어느 무기가 터뜨렸는지는 core 가 알려준다.
  // 캣닢의 showMs 를 박아 두면 핵폭탄 잔상이 1 을 넘어 이상해진다.
  if (world.blastTimer > 0 && world.blastShow > 0){
    var blastT = world.blastTimer / world.blastShow;   // 1 → 0
    var bx = world.blastX - camX, by = world.blastY - camY;
    /* 고리 안을 잎으로 채운다 — 기본형은 잎 한 장, 진화형(캣닢 폭풍)은 바람개비.
       고리는 그대로 둔다(판정 범위).
       blastWeaponId 에는 'nuke' 도 들어오는데, 핵폭탄은 무기가 아니다.
       isEvolved('nuke') 가 false 인 데다 BASE_BAKED 에도 'nuke' 가 없어서
       양쪽 모두에서 저절로 걸러진다 — ⚠️ 나중에 핵폭탄 그림을 그리게 되면
       그때는 여기에 그림이 붙는다는 뜻이므로 이 자리를 다시 볼 것. */
    var blastImg = world.isEvolved(world.blastWeaponId)
                 ? WEAPON_BAKED[world.blastWeaponId]
                 : BASE_BAKED[world.blastWeaponId];
    if (blastImg){
      var bsz = world.blastR * 2 * (1.15 - 0.15 * blastT);
      ctx.globalAlpha = 0.85 * blastT;
      ctx.drawImage(blastImg, bx - bsz / 2, by - bsz / 2, bsz, bsz);
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = 0.55 * blastT;
    ctx.strokeStyle = BLAST_COLOR[world.blastWeaponId] || '#ffffff';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(bx, by, world.blastR * (1.15 - 0.15 * blastT), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  // 정전기 번개 — core 가 적어 준 연출용 좌표(chainX·chainY)만 읽는다.
  // 판정용 스크래치(_hitDmg·_hitRadius)는 무기들이 돌려쓰므로 여기서 읽으면 안 된다.
  if (world.chainTimer > 0 && world.chainShow > 0 && world.chainN > 1){
    var chainT = world.chainTimer / world.chainShow;   // 1 → 0
    // 번개(진화형)는 얇은 선이 아니라 굵은 줄기다 — 선 굵기부터 다르게 간다.
    var zapImg = world.isEvolved('zap') ? WEAPON_BAKED.zap : null;
    ctx.globalAlpha = 0.9 * chainT;
    ctx.strokeStyle = '#ffe66a';
    ctx.lineWidth = zapImg ? 6 : 3;
    ctx.beginPath();
    ctx.moveTo(world.chainX[0] - camX, world.chainY[0] - camY);
    for (var ci = 1; ci < world.chainN; ci++){
      ctx.lineTo(world.chainX[ci] - camX, world.chainY[ci] - camY);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
    // 튄 자리마다 번개가 내리꽂힌다. 선만으로는 "몇 마리에게 튀었는가" 가 안 보인다.
    if (zapImg){
      var zsz = 30;
      ctx.globalAlpha = 0.95 * chainT;
      for (var zi = 0; zi < world.chainN; zi++){
        ctx.drawImage(zapImg, world.chainX[zi] - camX - zsz / 2,
                              world.chainY[zi] - camY - zsz / 2, zsz, zsz);
      }
      ctx.globalAlpha = 1;
    }
  }

  // 꼬리 회전 공 — 공 수는 core 가 정한다(orbitN). 여기서 세면 판정과 어긋난다.
  if (world.weapons.tail){
    for (var obi = 0; obi < world.orbitN; obi++){
      var obx = world.orbitXs[obi] - camX, oby = world.orbitYs[obi] - camY;
      // 회오리 꼬리(진화형) — 공을 바람이 감고 있는 그림이라, 공(판정 반경)이
      // 그림 가운데에 오도록 바람 획만큼 여유를 두고 크게 그린다.
      if (world.isEvolved('tail') && WEAPON_BAKED.tail){
        var tsz = CONFIG.weapons.tail.ballRadius * 2 * 1.6;
        ctx.drawImage(WEAPON_BAKED.tail, obx - tsz / 2, oby - tsz / 2, tsz, tsz);
      } else if (BASE_BAKED.tail){
        /* 기본형 구슬은 그림이 곧 공이라 판정 반경을 그대로 지름으로 쓴다.
           진화형의 1.6 배는 바람 획이 그림 바깥에 있어서 둔 여유라, 여기 쓰면
           공이 판정보다 커 보인다 — 안 맞았는데 맞은 것처럼 읽힌다. */
        var bsz2 = CONFIG.weapons.tail.ballRadius * 2;
        ctx.drawImage(BASE_BAKED.tail, obx - bsz2 / 2, oby - bsz2 / 2, bsz2, bsz2);
      } else {
        ctx.fillStyle = '#c9b4ff';
        ctx.beginPath();
        ctx.arc(obx, oby, CONFIG.weapons.tail.ballRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 고양이 친구 — 플레이어보다 먼저 그려 뒤에 깔린다
  var citems = world.companions.items;
  for (var cmi = 0; cmi < citems.length; cmi++){
    var cm = citems[cmi];
    if (!cm.active) continue;
    var cmx = cm.x - camX, cmy = cm.y - camY;
    if (cmx < -CULL || cmy < -CULL || cmx > viewW + CULL || cmy > viewH + CULL) continue;
    /* 들고양이(진화형)는 전신 그림을 그대로 쓰고 색만 사나워진다.
       진화형 그림(WEAPON_SPRITES.friend)은 16×16 얼굴이라 여기 끼우면
       머리만 떠다닌다 — 그 그림은 진화 카드의 아이콘으로만 쓴다. */
    catFrame(world.isEvolved('friend') ? 'feral' : 'friend', 24, cmx, cmy);
  }

  // 고양이 (아트 교체 지점)
  // 맞은 직후 무적인 동안은 깜빡인다 — 왜 안 맞는지가 보여야 한다.
  var inv = world.player.invuln;
  if (inv > 0) ctx.globalAlpha = (Math.floor(inv * 20) % 2) ? 0.35 : 1;
  catFrame('cheese', 32, viewW / 2, viewH / 2);
  ctx.globalAlpha = 1;

  // 클리어 폭죽 — 적·고양이보다 위, HUD 보다 아래
  drawFireworks();

  drawHud();
}

function drawHud(){
  // 우상단 일시정지·음소거 버튼(각 44px, 사이 10px 여백) 자리를 비워 두고 바를 그린다.
  // 안 그러면 체력·경험치 바의 오른쪽 끝이 버튼에 가려 얼마나 남았는지 안 보인다.
  var pad = 12, barW = viewW - pad * 2 - 106;

  // 체력 바
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(pad, pad, barW, 14);
  ctx.fillStyle = '#e05252';
  ctx.fillRect(pad, pad, barW * Math.max(0, world.player.hp / world.player.maxHp), 14);

  // 경험치 바
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(pad, pad + 18, barW, 8);
  ctx.fillStyle = '#5ad1e8';
  ctx.fillRect(pad, pad + 18, barW * Math.min(1, world.xp / world.xpToNext()), 8);

  // 글자 (경과 시간 · 레벨 · 처치 수)
  var total = Math.floor(world.elapsed);
  var mm = Math.floor(total / 60), ss = total % 60;
  ctx.font = '16px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#f7efd8';
  ctx.fillText('Lv.' + world.level + '   ' + mm + ':' + (ss < 10 ? '0' : '') + ss +
               '   잡은 쥐 ' + world.kills +
               '   \u{1FA99} ' + Math.floor(world.coins), pad, pad + 44);
  // 보스 체력바 (보스가 있을 때만)
  // 글자 줄(baseline pad+44, 16px 가운데 정렬 → 아래끝 pad+52) 아래에 둔다.
  // 폰 세로 화면에서 겹치면 보스전 내내 레벨·시간이 안 읽힌다.
  if (world.boss && world.boss.active){
    var bw = viewW - pad * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(pad, pad + 56, bw, 10);
    ctx.fillStyle = '#d46a6a';
    ctx.fillRect(pad, pad + 56, bw * Math.max(0, world.boss.hp / world.boss.maxHp), 10);
  }
  /* 보유 무기 아이콘 (좌하단). 그림이 있으면 도트, 없으면 이모지로 떨어진다.
     ⚠️ 이모지는 **글자 밑선** 기준이고 그림은 **네모** 기준이라 같은 y 를 주면
        줄이 어긋난다. 26px 짜리 그림의 아래를 밑선(viewH-26)에 맞춰 올린다. */
  ctx.textAlign = 'left';
  ctx.font = '22px serif';
  var order = world.weaponOrder, ICO = 26;
  for (var wi = 0; wi < order.length; wi++){
    var wid = order[wi];
    var wimg = (world.isEvolved(wid) && WEAPON_BAKED[wid]) ? WEAPON_BAKED[wid]
                                                           : BASE_ICON_IMG[wid];
    if (wimg) ctx.drawImage(wimg, 12 + wi * 30, viewH - 26 - ICO + 4, ICO, ICO);
    else      ctx.fillText(CONFIG.weapons[wid].emoji, 12 + wi * 30, viewH - 26);
  }
  // 고양이 그리기용 설정으로 되돌린다
  ctx.font = '32px serif';
  ctx.textAlign = 'center';
}



/* ---------------- 입력: 키보드 ---------------- */
var keys = Object.create(null);
window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   function(e){ keys[e.key.toLowerCase()] = false; });
// 창을 벗어나면 키·포인터 스틱 모두 해제 (고착 방지)
window.addEventListener('blur', function(){
  for (var k in keys) keys[k] = false;
  if (stickId !== null) stickEnd();
});

function keyboardVec(out){
  var x = 0, y = 0;
  if (keys['a'] || keys['arrowleft'])  x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup'])    y -= 1;
  if (keys['s'] || keys['arrowdown'])  y += 1;
  out.x = x; out.y = y;
  return out;
}

/* ---------------- 입력: 가상 조이스틱 ---------------- */
var STICK_MAX = CONFIG.input.stickMax; // 이 거리에서 최대 속도
var stickEl = document.getElementById('stick');
var knobEl = document.getElementById('stickKnob');
var stickId = null, stickOX = 0, stickOY = 0;
var touchVec = { x: 0, y: 0 };

function stickStart(id, x, y){
  stickId = id; stickOX = x; stickOY = y;
  stickEl.style.left = x + 'px';
  stickEl.style.top = y + 'px';
  stickEl.style.display = 'block';
}
function stickMove(x, y){
  var dx = x - stickOX, dy = y - stickOY;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len > STICK_MAX){ dx = dx / len * STICK_MAX; dy = dy / len * STICK_MAX; }
  knobEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  touchVec.x = dx / STICK_MAX;
  touchVec.y = dy / STICK_MAX;
}
function stickEnd(){
  stickId = null;
  touchVec.x = 0; touchVec.y = 0;
  stickEl.style.display = 'none';
  knobEl.style.transform = 'translate(0,0)';
}

/* 터치·펜·마우스를 Pointer Events 하나로 처리한다. 캔버스에서 시작한 포인터를
   캡처하므로 화면 밖으로 밀었다가 놓아도 조이스틱이 고착되지 않는다. */
canvas.addEventListener('pointerdown', function(e){
  if (stickId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
  stickStart(e.pointerId, e.clientX, e.clientY);
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

canvas.addEventListener('pointermove', function(e){
  if (e.pointerId !== stickId) return;
  stickMove(e.clientX, e.clientY);
  e.preventDefault();
});

function onPointerGone(e){
  if (e.pointerId !== stickId) return;
  stickEnd();
}
canvas.addEventListener('pointerup', onPointerGone);
canvas.addEventListener('pointercancel', onPointerGone);   // 알림 등으로 입력이 끊겨도 멈추게
/* 캔버스 것만으로는 부족하다. setPointerCapture 가 걸리면 손 뗀 이벤트가 캔버스로
   되돌아오지만, 캡처가 실패하거나 도중에 풀리면 그 이벤트는 다른 곳으로 가버리고
   조이스틱이 눌린 채로 굳는다(고양이가 계속 달린다). window 에도 같은 감지를 둬서
   어디서 놓든 반드시 풀리게 한다. 캡처가 정상일 때는 캔버스 쪽이 먼저 처리하고
   여기서는 stickId 가 이미 null 이라 그냥 지나간다. */
window.addEventListener('pointerup', onPointerGone);
window.addEventListener('pointercancel', onPointerGone);

var kbVec = { x: 0, y: 0 };
function applyInput(){
  keyboardVec(kbVec);
  world.setInput(kbVec.x + touchVec.x, kbVec.y + touchVec.y);
}

/* ---------------- 오버레이: 레벨업 3택 · 게임오버 ---------------- */

/* 판 도중 저장. 강화 저장(catSurvivor.save)과 키를 나눈다 —
   판 저장이 깨져도 모은 코인과 영구 강화는 영향을 받으면 안 된다. */
var RunSave = (function(){
  var KEY = 'catSurvivor.run';
  return {
    save: function(snap){
      if (!snap) return false;
      try { window.localStorage.setItem(KEY, JSON.stringify(snap)); return true; }
      catch (e){ return false; }
    },
    load: function(){
      try {
        var raw = window.localStorage.getItem(KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e){ return null; }
    },
    clear: function(){
      try { window.localStorage.removeItem(KEY); } catch (e){}
    }
  };
})();

/* 플레이어 이름과 고유번호. 고유번호는 이름을 바꿔도 같은 사람으로 묶기 위한
   무작위 문자열이고 개인정보가 아니다. localStorage 가 막혀 있어도 게임은 돈다. */
var Player = (function(){
  var KEY = 'catSurvivor.player';
  var mem = null;                       // localStorage 가 막혔을 때의 대체 보관소
  function 새고유번호(){
    var abc = 'abcdefghijklmnopqrstuvwxyz0123456789', s = '';
    for (var i = 0; i < 10; i++) s += abc.charAt(Math.floor(Math.random() * abc.length));
    return s;
  }
  function read(){
    if (mem) return mem;
    var o = null;
    try { o = JSON.parse(window.localStorage.getItem(KEY)); } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !o.id)
      o = { id: 새고유번호(), name: '', asked: false };
    if (typeof o.name !== 'string') o.name = '';
    o.asked = !!o.asked;
    mem = o;
    return o;
  }
  function write(){
    try { window.localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {}
  }
  return {
    get: function(){ var o = read(); return { id: o.id, name: o.name }; },
    needsName: function(){ return !read().asked; },
    setName: function(s){
      var o = read();
      o.name = String(s == null ? '' : s).trim().slice(0, 20);
      o.asked = true;
      write();
    }
  };
})();

/* 소리 — 음원 파일 없이 Web Audio API로 그 자리에서 합성한다(계획/14-소리-명세.md).
   core 는 이 모듈을 전혀 모른다 — 여기서만 다룬다. */
var Sound = (function(){
  var KEY = 'catSurvivor.muted';
  var muted = false;
  try { muted = window.localStorage.getItem(KEY) === '1'; } catch (e) {}
  var ctx = null;   // 첫 사용자 입력 전엔 안 만든다 — 브라우저 자동재생 정책
  var lastHitAt = 0;   // 타격음 쓰로틀용 — 마지막으로 낸 시각(ms)

  function ensureCtx(){
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;   // 아주 오래된 브라우저 — 조용히 포기
    ctx = new AC();
    return ctx;
  }
  // 사용자 입력(클릭/터치/키보드) 아무거나에서 한 번만 불려 AudioContext 를 깨운다.
  // 특정 버튼 하나에 묶지 않는다 — 이름 저장·이어하기·새로 시작·시작하기 등
  // 소리가 나기 전에 거치는 진입 경로가 여러 개라, 전부 따로 챙길 필요가 없게 한다.
  // 키보드만으로 시작하는 데스크톱 경로는 pointerdown이 안 오므로 keydown도 같이 듣는다.
  function unlock(){
    var c = ensureCtx();
    if (c && c.state === 'suspended') c.resume();
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
  }
  document.addEventListener('pointerdown', unlock, { once: true });
  document.addEventListener('keydown', unlock, { once: true });

  // 짧은 톤 하나. dur(초) 동안 freq1→freq2로 오실레이터 주파수를 스윕하고,
  // 볼륨을 vol 에서 지수적으로 거의 0까지 줄인다(뚝 끊기지 않고 자연스럽게 잦아든다).
  function tone(freq1, freq2, dur, type, vol){
    if (muted) return;
    var c = ensureCtx();
    if (!c) return;
    // 전화·시리 등으로 세션 도중 컨텍스트가 다시 suspended 될 수 있다(특히 iOS).
    // 깨우기 리스너는 최초 1회뿐이라, 매번 재생 시도할 때마다 여기서 되살린다.
    if (c.state === 'suspended') c.resume();
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, c.currentTime);
    osc.frequency.linearRampToValueAtTime(freq2, c.currentTime + dur);
    gain.gain.setValueAtTime(vol, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start();
    osc.stop(c.currentTime + dur);
  }

  return {
    // 타격 — 아주 짧고 조용한 "틱". 매번 음높이를 살짝 무작위로 흔들어 반복 피로를 줄인다.
    // 90ms 쓰로틀 — 안 그러면 우유 웅덩이·꼬리 회전처럼 매 프레임 계속 딜이 들어가는
    // 무기 앞에서 초당 60번(기관총 소리)이 된다.
    hit: function(now){
      if (now - lastHitAt < 90) return;
      lastHitAt = now;
      var f = 700 + Math.random() * 300;
      tone(f, f * 0.6, 0.05, 'square', 0.05);
    },
    // 레벨업 — 올라가는 3음 아르페지오
    levelUp: function(){
      tone(440, 440, 0.08, 'triangle', 0.12);
      setTimeout(function(){ tone(554, 554, 0.08, 'triangle', 0.12); }, 80);
      setTimeout(function(){ tone(659, 659, 0.14, 'triangle', 0.14); }, 160);
    },
    // 보스 등장 — 낮고 무거운 톤, 다른 넷과 확실히 다르게
    bossAppear: function(){
      tone(90, 60, 0.5, 'sawtooth', 0.18);
    },
    /* 🎁 상자를 먹었다 — 뚜껑이 톡 열리는 짧은 두 음.
       바로 뒤에 진화 소리(또는 회복)가 이어지므로 여기서 길게 끌면 겹쳐서 뭉갠다. */
    boxPick: function(){
      tone(520, 720, 0.07, 'triangle', 0.16);
      setTimeout(function(){ tone(760, 1040, 0.10, 'triangle', 0.16); }, 70);
    },
    /* 진화 — 한 판에 많아야 두 번뿐인 순간이다. 레벨업(0.12~0.14)보다 확실히 크고
       길어야 "방금 다른 일이 일어났다" 가 귀로 구분된다.
       낮은 굉음을 깔고 그 위로 5음을 올린다. 음끼리 110ms 씩 어긋나게 둬서
       한 번에 두 개 넘게 겹치지 않는다 — 동시에 다섯이 울리면 합쳐져 찢어진다. */
    evolve: function(){
      tone(110, 165, 0.55, 'sawtooth', 0.22);           // 아래를 받치는 굉음
      tone(392, 392, 0.14, 'triangle', 0.26);
      setTimeout(function(){ tone(523, 523, 0.14, 'triangle', 0.28); }, 110);
      setTimeout(function(){ tone(659, 659, 0.14, 'triangle', 0.28); }, 220);
      setTimeout(function(){ tone(784, 784, 0.14, 'triangle', 0.30); }, 330);
      setTimeout(function(){ tone(1047, 1047, 0.5, 'triangle', 0.30); }, 440);
    },
    // 게임오버 — 내려가는 톤
    gameOver: function(){
      tone(300, 120, 0.4, 'sawtooth', 0.14);
    },
    // 클리어 — 올라가는 4음 팡파르, 레벨업보다 길고 화려하게
    cleared: function(){
      tone(440, 440, 0.1, 'triangle', 0.14);
      setTimeout(function(){ tone(554, 554, 0.1, 'triangle', 0.14); }, 100);
      setTimeout(function(){ tone(659, 659, 0.1, 'triangle', 0.14); }, 200);
      setTimeout(function(){ tone(880, 880, 0.3, 'triangle', 0.16); }, 300);
    },
    isMuted: function(){ return muted; },
    toggleMute: function(){
      muted = !muted;
      try { window.localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
      return muted;
    }
  };
})();

// Player 이름처럼 사용자가 적은 문자열을 innerHTML 에 넣을 때 쓰는 최소 이스케이프.
// Task 7 대시보드에서도 이 이름을 다시 그리므로 습관을 잡아둔다.
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
  });
}

// 카드형 선택지는 실제 button 으로 만든다. 마우스·터치뿐 아니라 Tab/Enter 로도 고를 수 있다.
function appendCard(html, onActivate, disabled, selected){
  var el = document.createElement('button');
  el.type = 'button';
  el.className = !disabled ? 'card' : (selected ? 'card sel' : 'card off');
  el.disabled = !!disabled;
  el.innerHTML = html;
  if (onActivate && !disabled) el.addEventListener('click', onActivate);
  cardsEl.appendChild(el);
  return el;
}

// 3택 카드를 그린다. 다시 뽑기가 같은 자리를 새 카드로 갈아 끼울 때도 이걸 쓴다.
function renderChoices(choices){
  cardsEl.innerHTML = '';
  for (var i = 0; i < choices.length; i++){
    (function(c){
      // 무기 카드만 그림이다. 패시브·고양이 캔은 그림이 없어서 이모지 그대로 간다.
      var 아이콘 = (c.kind === 'weapon') ? weaponIcoHtml(c.id, c.emoji) : c.emoji;
      appendCard('<div class="ico">' + 아이콘 + '</div>' +
                 '<div class="nm">' + c.name + '</div>' +
                 '<div class="lv">' + (c.level ? 'Lv.' + c.level : '') + '</div>' +
                 '<div class="ds">' + c.desc + '</div>',
                 function(){ pick(c); }, false);
    })(choices[i]);
  }
}

// 남은 다시 뽑기 횟수를 버튼에 반영한다. 0 이면 버튼 자체가 사라진다.
function updateRerollBtn(){
  if (world.rerollLeft > 0){
    rerollBtn.style.display = 'block';
    rerollBtn.textContent = '\u{1F3B2} 다시 뽑기 (' + world.rerollLeft + '번 남음)';
  } else {
    rerollBtn.style.display = 'none';
  }
}

function showLevelUp(){
  overlayTitle.textContent = '레벨 ' + world.level + ' 달성!';
  overlayStat.textContent = '하나를 고르세요';
  overlayBtn.style.display = 'none';
  shopBtn.style.display = 'none';
  cardsEl.style.display = 'flex';
  // 복원된 3택이 있으면 그대로 쓴다 — 없으면(새 레벨업, 또는 옛 저장) 새로 뽑는다.
  renderChoices(world.rolledChoices || world.rollChoices());
  updateRerollBtn();
  overlay.classList.add('on');
  paused = true;
  Sound.levelUp();
}

rerollBtn.addEventListener('click', function(e){
  e.preventDefault();
  var cs = world.reroll();
  if (!cs) return;              // 이미 다 썼다
  renderChoices(cs);
  updateRerollBtn();
});

function pick(c){
  world.applyChoice(c);
  rerollBtn.style.display = 'none';
  overlay.classList.remove('on');
  paused = false;
  lastTime = 0;                 // 정지한 동안 쌓인 시간을 버린다
  if (world.pendingChoices > 0) showLevelUp();
}

/* ── 19단계: 진화 카드 ────────────────────────────────────────────
   보스 상자를 먹었고 5성 무기가 있으면 core 가 pendingEvolve 를 세운다.
   레벨업 3택 화면을 그대로 재사용한다 — 새 화면을 만들면 폰에서 검증된
   자리(제목·카드·닫기)를 처음부터 다시 맞춰야 한다.
   카드는 최대 4장이다(무기 슬롯이 4개라 5성이 다섯 개일 수 없다). */
function showEvolve(){
  var ids = world.evolveCandidates();
  if (!ids.length){
    /* 여기 오면 안 된다 — core 는 후보가 있을 때만 pendingEvolve 를 세우고,
       저장 복원도 후보가 없으면 이 값을 버린다. 그래도 도달한다면 카드를
       한 장도 못 그리는 화면에서 판이 영원히 멈춘다. 판을 살리는 쪽을 고른다. */
    world.cancelEvolve();
    return;
  }
  overlayTitle.textContent = '진화!';
  overlayStat.textContent = '5성 무기 하나가 다른 것이 됩니다';
  overlayBtn.style.display = 'none';
  shopBtn.style.display = 'none';
  rerollBtn.style.display = 'none';   // 진화는 다시 뽑기가 없다 — 후보가 곧 내가 키운 무기다
  cardsEl.style.display = 'flex';
  cardsEl.innerHTML = '';
  for (var i = 0; i < ids.length; i++){
    (function(id){
      var base = CONFIG.weapons[id];
      var evo = CONFIG.evolutions[id];
      if (!base || !evo) return;
      // 그림을 못 구웠으면 원래 무기 이모지로 떨어진다 — 카드가 빈 채로 뜨면 안 된다
      var ico = WEAPON_ICON[id]
        ? '<img class="evoIco" src="' + WEAPON_ICON[id] + '" alt="">'
        : base.emoji;
      var el = appendCard('<div class="ico">' + ico + '</div>' +
                          '<div class="lv">' + base.emoji + ' ' + base.name + '</div>' +
                          '<div class="nm">↓ ' + evo.name + '</div>' +
                          '<div class="ds">' + evo.desc + '</div>',
                          function(){ pickEvolve(id); }, false);
      el.className += ' evo';
    })(ids[i]);
  }
  overlay.classList.add('on');
  paused = true;
}

function pickEvolve(id){
  world.applyEvolve(id);            // core 가 진화시키고 pendingEvolve 를 내린다
  Sound.evolve();
  cardsEl.innerHTML = '';           // 진화 카드가 다음에 열리는 화면에 잠깐 비쳐선 안 된다
  overlay.classList.remove('on');
  paused = false;
  lastTime = 0;                     // 정지한 동안 쌓인 시간을 버린다
  // 레벨업이 같이 밀려 있으면 frame() 이 다음 프레임에 3택을 띄운다.
}

var isPauseScreen = false;   // 지금 오버레이가 일시정지 화면인가

/* 지금 판을 저장한다. 끝난 판·측정 중·조작한 판은 저장하지 않는다.
   "이어서 할까요?"를 묻는 중(pendingRun)에도 저장하면 안 된다 — 그 시점의 world 는
   아직 아무것도 안 한 빈 판이라, 저장해 둔 진행을 빈 판으로 덮어써 날려버린다. */
function saveRun(force){
  if (world.gameOver || world.cleared || world.benchMode || runTainted) return;
  if (pendingRun) return;
  // 막 시작한 판은 저장하지 않는다. 안 그러면 게임을 열자마자 나갈 때마다
  // "0분 00초에서 멈췄습니다"를 묻게 된다 — 이어할 것이 없는 물음이다.
  if (!force && world.elapsed < CONFIG.runSave.minSec && world.level <= 1) return;
  var snap = world.snapshot();
  if (snap) RunSave.save(snap);
}

function showPause(){
  var m = Math.floor(world.elapsed / 60), s = Math.floor(world.elapsed % 60);
  overlayTitle.textContent = '잠깐 멈춤';
  overlayStat.innerHTML = m + '분 ' + (s < 10 ? '0' : '') + s + '초 · Lv.' + world.level +
    '<br><small>지금 나가셔도 됩니다. 다음에 열면 여기서부터 이어집니다.</small>';
  cardsEl.innerHTML = '';
  cardsEl.style.display = 'flex';
  appendCard('<div class="ico">\u{1F4D6}</div>' +
             '<div class="nm">도감</div>' +
             '<div class="ds">무기 · 적 · 내 스펙</div>',
             function(){
               codexOrigin = 'pause';   // 닫으면 이 일시정지 화면으로 돌아온다
               showCodex('weapon');
             }, false);
  rerollBtn.style.display = 'none';
  shopBtn.style.display = 'none';
  overlayBtn.style.display = 'block';
  overlayBtn.textContent = '계속하기';
  overlay.classList.add('on');
  paused = true;
  isPauseScreen = true;
}

function resumeFromPause(){
  overlay.classList.remove('on');
  cardsEl.innerHTML = '';        // 일시정지 화면의 도감 카드를 치운다
  cardsEl.style.display = 'none';
  paused = false;
  isPauseScreen = false;
  lastTime = 0;              // 멈춰 있던 동안 쌓인 시간을 버린다
}

// 일시정지 버튼·키가 부른다. 레벨업 카드·상점·결과 화면에서는 아무것도 하지 않는다.
function togglePause(){
  if (askingName) return;                                   // 이름 화면 중에는 아무것도 안 한다
  if (world.gameOver || world.cleared || inShop || inCodex) return;
  if (pendingRun) return;                                   // 이어할지 고르는 중
  if (atStartScreen) return;                                // 시작 화면 중
  if (world.pendingChoices > 0 && !isPauseScreen) return;   // 카드를 고르는 중
  if (world.pendingEvolve > 0 && !isPauseScreen) return;    // 진화 카드를 고르는 중
  if (isPauseScreen) resumeFromPause();
  else { saveRun(); showPause(); }
}

var META_ORDER = ['power', 'maxHp', 'speed', 'magnet', 'xpGain'];

/* 판이 끝나면 기록을 보낸다. 보내고 잊는다 — 실패해도 플레이어는 모른다.
   알 필요가 없기 때문이다. */
function sendRecord(){
  try {
    // 개발 중 판은 보내지 않는다. 기록을 모으는 목적은 "라이브 게임에서 사람들이
    // 어떻게 하는가" 인데, 개발 중 빌드는 밸런스가 다르다(가격·적·무기가 손보는
    // 중이다). 그걸 같이 세면 평균이 조용히 틀어진다. version 필드로 걸러낼 수도
    // 있지만, 안 쌓이는 쪽이 앞으로 모든 질의에서 걸러내는 것을 기억하는 것보다 확실하다.
    // tools/build-dist.js 가 배포본에서 이 값을 git 해시로 바꾸므로 배포본은 안 걸린다.
    if (GAME_VERSION === 'dev') return;
    var run = world.recordSummary();
    if (!run) return;                       // 안 끝났거나 15초 미만
    // 안전장치: 새 판 시작 지점(다시 하기 버튼 / 첫 판 / 이어하기 화면)에서 전부
    // runUid 를 만들도록 해뒀지만, 나중에 시작 경로가 하나 더 생겨 그중 하나를 놓치면
    // 여기서라도 만들어 쓴다. 그래야 runUid 가 빈 채로 서버에 가서(서버가 판 전체를
    // 거부한다) 기록이 조용히 사라지는 일이 없다.
    if (!runUid) runUid = 새판고유번호();
    var save = Save.get();
    var meta = [];
    for (var i = 0; i < META_ORDER.length; i++) meta.push(save.meta[META_ORDER[i]] || 0);
    var body = {
      v: 1,
      version: GAME_VERSION,
      runUid: runUid,
      player: Player.get(),
      run: run,
      meta: meta.join(','),
      device: {
        touch: (navigator.maxTouchPoints || 0) > 0,
        w: window.innerWidth, h: window.innerHeight,
        viewHalfW: Math.round(world.viewHalfW),
        viewHalfH: Math.round(world.viewHalfH),
        spawnRing: Math.round(world.spawnRing())
      }
    };
    fetch(RECORD_URL, {
      method: 'POST',
      keepalive: true,                      // 화면이 바뀌어도 전송이 안 끊기게
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).catch(function(){});                 // 실패는 조용히 삼킨다
  } catch (e) {}                            // 여기서 터져도 게임은 계속된다
}

// 판의 결과를 저장소에 반영한다. 한 판에 한 번만.
function bankRun(cleared){
  if (runBanked) return;
  runBanked = true;
  RunSave.clear();                   // 끝난 판은 이어할 것이 없다
  Save.addCoins(world.coins);
  if (!runTainted) Save.recordRun(Math.floor(world.elapsed), world.level, cleared);
  if (!runTainted) sendRecord();     // 치트 판은 데이터에 넣지 않는다
}

// 결과 화면 아래에 붙는 최고 기록 줄
function bestLine(){
  var b = Save.get().best;
  if (!b.sec) return '';
  var bm = Math.floor(b.sec / 60), bs = b.sec % 60;
  return '<br><small>최고 기록 ' + bm + '분 ' + (bs < 10 ? '0' : '') + bs + '초' +
         ' · 최고 Lv.' + b.level +
         (b.clears ? ' · 클리어 ' + b.clears + '회' : '') + '</small>';
}

// 결과 화면에 붙는 무기별 딜량 기여도. 큰 순서로 최대 5줄, 나머지는 "그 외" 로 묶는다.
// bestLine() 과 같은 방식으로 <br><small> 텍스트만 만든다 — 새 CSS/레이아웃을
// 만들지 않는 이유는 이미 폰에서 검증된 자리(overlayStat)를 그대로 쓰기 위함이다.
// ? 칸(이름 없이 들어온 호출)은 개발용 신호라 사람에게 보이면 안 된다.
function damageBreakdownHtml(world){
  // DAMAGE_IDS 에서 ? 만 뺀다 — 손으로 다시 나열하면 나중에 딜량 칸이 하나 늘 때
  // 여기와 botsim.js 둘 중 한쪽만 고쳐서 새 칸이 조용히 화면에서 빠질 수 있다.
  var ids = DAMAGE_IDS.filter(function(id){ return id !== '?'; });
  var rows = [];
  var total = 0;
  var i;
  for (i = 0; i < ids.length; i++){
    var v = world.dmgBy[ids[i]] || 0;
    if (v <= 0) continue;
    total += v;
    var label = ids[i] === 'nuke'
      ? (CONFIG.nukeItem.emoji + '핵폭탄')
      : (CONFIG.weapons[ids[i]].emoji + CONFIG.weapons[ids[i]].name);
    rows.push({ label: label, v: v });
  }
  if (total <= 0) return '';   // 15초 미만 등으로 아예 못 때린 판은 이 칸을 안 그린다
  rows.sort(function(a, b){ return b.v - a.v; });
  var shown = rows.slice(0, 5);
  var restV = 0;
  for (i = 5; i < rows.length; i++) restV += rows[i].v;
  if (restV > 0) shown.push({ label: '그 외', v: restV });

  var BAR = 10;   // 막대 칸 수 — 너무 길면 폰 폭에서 줄바꿈된다
  var lines = [];
  for (i = 0; i < shown.length; i++){
    var pct = Math.round(shown[i].v / total * 100);
    var fill = Math.round(pct / 100 * BAR);
    var bar = '';
    for (var k = 0; k < BAR; k++) bar += (k < fill) ? '█' : '░';
    // v>0 인데 반올림하면 0%로 보여 "때렸는데 0%"라는 자기모순 표시가 된다 — 글로만 구분한다
    var pctText = (pct === 0) ? '1% 미만' : (pct + '%');
    lines.push(escapeHtml(shown[i].label) + ' ' + bar + ' ' + pctText);
  }
  return '<br><small>' + lines.join('<br>') + '</small>';
}

                          '잡은 쥐 ' + world.kills + '마리<br>' +
                          '최종 레벨 ' + world.level + '<br>' +
                          '\u{1FA99} 이번 판 ' + Math.floor(world.coins) +
                          ' (모은 코인 ' + Save.get().coins + ')' + bestLine() +

// 강화 한 항목의 "n단계일 때의 효과"를 사람이 읽는 문구로 만든다.
// CONFIG.meta 의 항목은 비율(pct) 아니면 가산(add) 중 하나를 가진다.
function metaEffectText(key, step){
  var m = CONFIG.meta[key];
  if (m.pct !== undefined) return '+' + (step * m.pct) + '%';
  return '+' + (step * m.add);
}

// 처음 한 번 이름을 묻는 화면. 끝나면 after() 를 불러 원래 흐름(시작/이어하기 물음)으로 이어간다.
function showNameAsk(after){
