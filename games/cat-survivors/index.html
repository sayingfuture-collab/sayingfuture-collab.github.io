  this.gems = new Pool(config.pools.gems, function(){
    return { x: 0, y: 0, xp: 0 };
  });
  this.projectiles = new Pool(config.pools.projectiles, function(){
    // 필드를 늘리면 spawnProjectile 도 반드시 같이 고칠 것.
    // 풀이 객체를 재활용하므로 한쪽만 고치면 이전 투사체의 값이 샌다.
    return { x: 0, y: 0, vx: 0, vy: 0, dmg: 0, radius: 0,
             life: 0, pierce: 0, stamp: 0, weaponId: '', turnAt: 0,
             pullRadius: 0, pullSpeed: 0, hitCd: 0,
             // 이미 때린 적들의 stamp. 자리는 미리 잡아 두고 hitN 까지만 쓴다.
             hitIds: new Array(PROJ_HIT_CAP), hitN: 0,
             // 실타래 폭풍이 갈라 놓은 것인가. true 면 다시 안 갈라진다.
             split: false };
  });
  this.fields = new Pool(config.pools.fields, function(){
    return { x: 0, y: 0, radius: 0, tickDmg: 0, life: 0,
             tickLeft: 0, slowPct: 0, slowDur: 0, weaponId: '' };
  });
  this.warns = new Pool(config.pools.warns, function(){
    return { x: 0, y: 0, left: 0, typeId: '' };
  });
  /* 고양이 친구 —
     state 0 = 플레이어를 따라감, 1 = 목표에게 달려듦.
     target 참조만 붙들면 그 적이 죽어 풀로 돌아가고 같은 슬롯에 새 적이 스폰될 때
     엉뚱한 적을 물러 간다. 그래서 targetStamp 를 같이 들고 다니며 대조한다. */
  this.companions = new Pool(config.pools.companions, function(){
    return { x: 0, y: 0, state: 0, target: null, targetStamp: 0,
             weaponId: '', dmg: 0 };
  });
  this.companion = null;   // 지금 살아 있는 동료 (없으면 null)
  this.enemyStamp = 0;     // 적 스폰 일련번호
  this.warnAcc = 0;
  this.nukes = new Pool(config.pools.nukes, function(){
    return { x: 0, y: 0 };
  });
  this.nukeAcc = 0;   // ☢️ 맵 아이템 낙하 누적 시간(초)
  this.boxes = new Pool(config.pools.boxes, function(){
    return { x: 0, y: 0 };
  });
  this.pendingEvolve = 0;   // 1 이면 진화 카드를 고르는 중 — 셸이 이걸 보고 판을 멈춘다
  this.boxesTaken = 0;      // 이 판에서 먹은 상자 수 (봇 관문이 이걸 본다)
  this.projStamp = 0;   // 투사체마다 주는 고유 번호 (같은 적을 두 번 때리지 않게)
  this.xp = 0;
  this.grid = new Grid(config.grid.cellSize, config.grid.cols, config.grid.rows);
  this.gameOver = false;
  this.cleared = false;   // 마지막 보스를 잡았는가
  // 보스를 잡은 뒤 스폰이 완만하게 돌아오는 유예의 끝 시각(초). 0 이면 유예 없음.
  this.bossEaseUntil = 0;
  this.elapsed = 0;      // 판 시작부터의 누적 시간(초)
  this.viewHalfW = 640;    // ensureGridCovers 가 실제 화면 크기로 갱신한다
  this.viewHalfH = 400;
  this.spawnAcc = 0;
  this.bossIndex = 0;   // 다음에 나올 보스 번호
  this.boss = null;     // 지금 살아 있는 보스 (없으면 null)
  this.benchMode = false;   // 성능 측정 도구가 켰을 때: 스폰·접촉피해를 끈다 (순수 부하만 측정)

  // 매 프레임 콜백을 새로 만들지 않도록 생성자에서 한 번만 만든다.
  // 호출마다 바뀌는 값은 _contactCd 로 전달한다.
  var self = this;
  this._contactCd = 0;
  this._onContactCandidate = function(e){
    if (!e.active) return;              // 이번 프레임에 죽은 적은 건너뛴다
    var p = self.player;
    if (p.invuln > 0) return;           // 무적 중에는 몇 마리에 닿아도 안 맞는다
    if (e.contactCd > 0) return;
    var dx = p.x - e.x, dy = p.y - e.y;
    var reach = self.config.player.radius + e.radius;
    if (dx * dx + dy * dy > reach * reach) return;
    p.hp -= e.contact;
    e.contactCd = self._contactCd;
    p.invuln = self.config.combat.invulnSec;
    if (p.hp <= 0){ p.hp = 0; self.gameOver = true; }
  };

  this.facing = { x: 1, y: 0 };   // 마지막 이동 방향. 멈춰도 유지된다.
  this.aimDir = { x: 1, y: 0 };   // 이번 공격이 향한 방향 (자동 조준 결과)
  this.starter = 'claw';   // 이 판을 시작한 무기. reset 이 바꾼다.
  this.weapons = { claw: { level: 1, cdLeft: 0 } };
  this.weaponOrder = ['claw'];   // 발동 순서 고정 (for-in 은 순서가 엔진 마음이라 봇 시뮬 재현성이 깨진다)
  // 진화한 무기 {id: true}. 한 판에 최대 2개(보스 상자가 5분·10분 두 번뿐).
  this.evolved = {};
  this.swingTimer = 0;   // 할퀴기 스윙 이펙트 남은 시간(초) — 렌더 전용, 판정과 무관
  this.swingRadius = 0;  // 그 스윙의 반경. _hitRadius 는 무기들이 돌려쓰는 판정용이라 렌더가 읽으면 안 된다
  this.swingDir = { x: 1, y: 0 };   // 그 스윙이 향한 방향. aimDir 는 다른 무기가 덮어쓴다
  this.beamTimer = 0;                 // 빔 잔상 남은 시간(초) — 렌더 전용
  /* 쏜 순간의 방향들 (그 뒤 조준이 바뀌어도 잔상은 유지). 햇빛 모으기(진화)는
     앞뒤로 두 줄이라 자리를 미리 잡아 두고 beamN 까지만 쓴다. */
  this.beamDirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }];
  this.beamN = 0;
  this.beamLen = 0;
  this.beamHalfW = 0;
  // 이번 발동 번호. 빔이 둘이라 겹치는 자리의 적을 두 번 때리지 않게 적에 찍는다.
  this.beamStamp = 0;
  this.blastTimer = 0;   // 폭발 이펙트 남은 시간(초) — 렌더 전용
  this.blastX = 0;
  this.blastY = 0;
  this.blastR = 0;
  // 폭발 무기가 둘(캣닢·핵폭탄)이 됐다. 렌더가 어느 무기의 폭발인지 알아야
  // 잔상 길이와 색을 맞출 수 있다. 판정용 _hitRadius 는 무기들이 돌려쓰므로
  // 렌더가 읽으면 안 된다 — 그래서 연출용으로 따로 둔다.
  this.blastShow = 0;        // 이번 폭발의 연출 길이(초)
  this.blastWeaponId = '';   // 이번 폭발을 낸 무기 id
  this.orbitAngle = 0;   // 꼬리 공의 현재 각도(라디안)
  /* 공 자리. 회오리 꼬리(진화)는 둘이라 자리를 미리 잡아 두고 orbitN 까지만 쓴다.
     셸이 이걸 읽어 그린다 — 공 수가 코어와 그림에서 갈리면 안 때리는 공이 보인다. */
  this.orbitXs = [0, 0, 0, 0];
  this.orbitYs = [0, 0, 0, 0];
  this.orbitN = 0;
  this.orbitR = 0;
  this._orbitCd = 0;
  /* 회오리 꼬리(진화)가 맞은 적을 바깥으로 미는 초당 거리(px). 0 이면 안 민다.
     fireOrbit 이 매 프레임 다시 정하므로, 꼬리를 안 들었거나 진화 전이면 0 이다.
     미는 일 자체는 moveEnemies 가 한다 — 이유는 그 함수의 주석에 적었다. */
  this.galePush = 0;
  /* 정전기 연쇄 —
     대상 고르기는 격자 순회로, 때리기는 순회가 전부 끝난 뒤에 한다.
     격자 콜백 안에서 damageEnemy 를 부르면 죽은 적이 풀로 돌아가며 바깥 순회가
     보던 셀 배열이 흔들려 나머지 적이 조용히 안 맞는다(재진입 함정).
     버퍼는 여기서 한 번만 만들고 발동할 때마다 length 만 0 으로 되돌린다 —
     매번 [] 를 만들면 루프 안 할당 금지 규칙을 어긴다. */
  this._chainBuf = [];
  this.chainStamp = 0;      // 발동 일련번호. 같은 적을 두 번 고르지 않게 도장을 찍는다.
  this._chainFrom = null;   // 지금 어느 적에서 튀는 중인가
  this._chainBest = null;   // 그 적에서 가장 가까운 다음 대상
  this._chainBestSq = 0;
  this._onChainCandidate = function(e){
    if (!e.active) return;
    if (e.chainStamp === self.chainStamp) return;   // 이번 발동에 이미 골랐다
    var f = self._chainFrom;
    if (f === null || e === f) return;
    var dx = e.x - f.x, dy = e.y - f.y;
    var d2 = dx * dx + dy * dy;
    if (d2 >= self._chainBestSq) return;
    self._chainBestSq = d2;
    self._chainBest = e;
  };
  // 연출 전용 — 판정용 _hitDmg·_hitRadius 는 무기들이 돌려쓰므로 렌더가 읽으면 안 된다.
  this.chainTimer = 0;   // 번개 잔상 남은 시간(초)
  this.chainShow = 0;    // 이번 잔상의 전체 길이(초)
  this.chainN = 0;       // 이번에 맞은 대상 수
  var zapCfg = config.weapons.zap;
  // 첫 대상 + 연쇄 횟수. ⚠️ 진화하면 연쇄가 chain 배로 늘어나므로 진화 뒤 최대치로
  // 잡아 둔다. 안 그러면 Float64Array 범위를 넘는 쓰기가 조용히 버려지고
  // (예외가 안 난다) 렌더가 그 칸을 undefined 로 읽어 번개가 NaN 자리에 그려진다.
  var zapEvo = config.evolutions && config.evolutions.zap
             ? (config.evolutions.zap.chain || 1) : 1;
  var zapMax = zapCfg ? Math.round(zapCfg.chainCount * zapEvo) + 1 : 1;
  this.chainX = new Float64Array(zapMax);
  this.chainY = new Float64Array(zapMax);

  // 격자에서 충돌 후보를 고를 때 쓰는 여유 반경. 가장 큰 적의 반경을 CONFIG 에서 구한다.
  this.maxEnemyR = 0;
  for (var eid in config.enemies){
    if (config.enemies[eid].radius > this.maxEnemyR) this.maxEnemyR = config.enemies[eid].radius;
  }
  this.kills = 0;
  this.coins = 0;    // 이번 판에 번 코인 (영구 잔액은 shell 이 관리한다)
  this.dmgBy = freshDamageTally();   // 무기별 실제 딜량 (계획/13-딜량측정-명세.md)
  this.level = 1;
  this.pendingChoices = 0;
  this.rolledChoices = null;   // 지금 떠 있는 3택 — rollChoices 가 채우고 applyChoice 가 비운다
  this.rerollLeft = config.level.rerollPerRun;   // 판당 다시 뽑기 남은 횟수
  this.passives = { claws: 0, tuna: 0, bell: 0, whisker: 0, nap: 0, clover: 0 };

  // 범위 판정용 공용 필드 — 호출마다 값을 채우고 콜백이 읽는다 (콜백은 여기서 한 번만 만든다)
  this._hitDmg = 0;
  this._hitRadius = 0;
  this._hitCosHalf = 0;
  this._onArcCandidate = function(e){
    if (!e.active) return;                 // 이번 프레임에 이미 죽은 적
    var p = self.player, f = self.aimDir;
    var dx = e.x - p.x, dy = e.y - p.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > self._hitRadius + e.radius) return;
    // 이 콜백은 fireClaw 만 부른다 — 다른 무기와 안 겹치므로 이름을 그대로 적는다.
    if (dist < 1e-6){ self.damageEnemy(e, self._hitDmg, 'claw'); return; }   // 겹쳐 있으면 무조건 맞음
    if ((dx / dist) * f.x + (dy / dist) * f.y < self._hitCosHalf) return;
    self.damageEnemy(e, self._hitDmg, 'claw');
  };

  /* 빔 판정 콜백 — 후보 원 안의 적을 선분까지의 정확한 거리(사영+수직)로 거른다.
     검사 중인 줄의 번호는 _bmI 로 전달한다. 햇빛 모으기는 앞뒤 두 줄이라
     플레이어 바로 옆의 적이 두 줄 모두에 걸린다 — beamStamp 로 한 번만 때린다. */
  this._bmI = 0;
  this._onBeamCandidate = function(e){
    if (!e.active) return;
    if (e.beamStamp === self.beamStamp) return;      // 이번 발동에 이미 맞았다
    var p = self.player, d = self.beamDirs[self._bmI];
    var ex = e.x - p.x, ey = e.y - p.y;
    var along = ex * d.x + ey * d.y;                 // 빔 방향으로 얼마나 갔나
    if (along < 0 || along > self.beamLen) return;   // 뒤쪽이거나 사거리 밖
    var perp = ex * d.y - ey * d.x;                  // 빔 축에서 옆으로 벗어난 거리
    if (perp < 0) perp = -perp;
    if (perp > self.beamHalfW + e.radius) return;
    e.beamStamp = self.beamStamp;
    self.damageEnemy(e, self._hitDmg, 'laser');   // 이 콜백은 fireBeam 만 부른다
  };

  // 폭발 판정 콜백 — 폭발 중심에서 원형 반경 안의 적을 거른다
  this._onBlastCandidate = function(e){
    if (!e.active) return;
    var dx = e.x - self.blastX, dy = e.y - self.blastY;
    var r = self._hitRadius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    // 캣닢·핵폭탄이 이 콜백을 같이 쓴다 — blastWeaponId 로 어느 쪽인지 구분한다.
    self.damageEnemy(e, self._hitDmg, self.blastWeaponId);
  };

  // 장판 판정 콜백 — 검사 중인 장판은 _field 로 전달한다. 안에 있으면 둔화를 걸고 때린다.
  this._field = null;
  this._onFieldCandidate = function(e){
    var f = self._field;
    if (f === null || !e.active) return;
    var dx = e.x - f.x, dy = e.y - f.y;
    var r = f.radius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    e.slowT = f.slowDur;
    e.slowPct = f.slowPct;
    self.damageEnemy(e, f.tickDmg, f.weaponId);
  };

  /* 꼬리 회전 판정 콜백 — 공 반경 안의 적을 때리고 적마다 재타격 간격을 건다.
     검사 중인 공의 번호는 _obI 로 전달한다. 재타격 간격을 **공마다** 따로 세는 것이
     핵심이다: 한 칸이면 회오리 꼬리의 둘째 공이 첫째 공의 간격에 걸려 아무 일도
     안 하고, 그건 투사체 도장 한 칸이 만들었던 것과 같은 종류의 함정이다. */
  this._obI = 0;
  this._onOrbitCandidate = function(e){
    var i = self._obI;
    if (!e.active || e.orbitCds[i] > 0) return;
    var dx = e.x - self.orbitXs[i], dy = e.y - self.orbitYs[i];
    var r = self._hitRadius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    e.orbitCds[i] = self._orbitCd;
    self.damageEnemy(e, self._hitDmg, 'tail');   // 이 콜백은 fireOrbit 만 부른다
  };

  /* 토네이도 끌어당김 콜백 — 피해를 주지 않고 좌표만 옮긴다.
     damageEnemy 를 부르지 않으므로 격자 콜백 재진입 함정에 걸리지 않는다.
     검사 중인 투사체는 _proj, 이번 프레임의 dt 는 _pullDt 로 전달한다. */
  this._pullDt = 0;
  this._onPullCandidate = function(e){
    var p = self._proj;
    if (p === null || !p.active || !e.active) return;
    if (p.pullRadius <= 0) return;
    var dx = p.x - e.x, dy = p.y - e.y;
    var d2 = dx * dx + dy * dy;
    if (d2 > p.pullRadius * p.pullRadius || d2 < 1e-6) return;
    /* 회오리가 **지나온 쪽** 의 적은 안 끈다.

       예전에는 방향을 안 봐서 뒤에 있던 적까지 앞으로 끌어왔고, 그것들이 끌려오는
       길에 플레이어를 그대로 통과했다. 사용자 신고(2026-08-11): "뒤에 애들이
       끌려오다가 나를 맞추는 경우가 엄청 많아".
       실측(태풍 만렙·적 30마리·60초·3씨드): 분당 38번 맞는 중 **20번(52%)** 이
       끌려온 적이었다. 끌리는 적의 81% 가 뒤쪽이었다.
       이 줄을 넣으면 분당 맞는 횟수 38 → 25, 피해 418 → 263 이다.

       덤으로 태풍의 초당 딜이 789 → 451 이 되어 "2위의 2.4배" 였던 쏠림도 풀린다
       (계획/20-무기밸런스-조사.md 발견 4). */
    if ((e.x - p.x) * p.vx + (e.y - p.y) * p.vy < 0) return;
    var d = Math.sqrt(d2);
    var step = p.pullSpeed * self._pullDt;
    if (step > d) step = d;          // 중심을 지나쳐 튕기지 않게
    e.x += dx / d * step;
    e.y += dy / d * step;
  };

  // 투사체 충돌 판정 콜백 — 검사 중인 투사체는 _proj 로 전달한다
  this._proj = null;
  this._onProjCandidate = function(e){
    var p = self._proj;
    if (p === null || !p.active || p.pierce <= 0) return;
    if (!e.active) return;
    /* 두 갈래다.
       ① 재타격형(토네이도, hitCd > 0): 회오리 안에 머무는 동안 간격마다 다시 때린다.
          "한 투사체가 같은 적을 두 번 안 때린다" 는 규칙과 정면으로 충돌하므로
          여기서는 그 기억을 쓰지 않는다.
          pierce 도 깎지 않는다 — 재타격마다 깎으면 회오리가 도중에 사라진다.
       ② 보통 투사체(털뭉치·생선뼈): 한 적당 한 번. 투사체가 직접 기억한다
          (PROJ_HIT_CAP 주석 참고 — 적 쪽에 도장 한 칸으로 두면 겹친 투사체가
           서로 덮어써서 매 프레임 다시 때린다). */
    if (p.hitCd > 0){
      if (e.tornadoCd > 0) return;             // 아직 재타격 간격 안이다
    } else {
      if (projAlreadyHit(p, e.stamp)) return;  // 이 투사체에는 이미 맞았다
    }
    var dx = e.x - p.x, dy = e.y - p.y;
    var r = p.radius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    if (p.hitCd > 0){
      e.tornadoCd = p.hitCd;
    } else {
      p.hitIds[p.hitN++] = e.stamp;
      p.pierce--;
    }
    // 털뭉치·생선뼈·토네이도가 이 콜백을 같이 쓴다 — p.weaponId 로 구분한다.
    self.damageEnemy(e, p.dmg, p.weaponId);
    /* 실타래 폭풍 — 맞은 자리에서 좌우로 갈라진다.
       갈라진 것(p.split)은 다시 안 갈라진다: 안 막으면 적이 많을수록 무한 증식해
       투사체 풀이 터진다. 투사체 풀은 적 격자와 별개라 여기서 spawn 해도
       바깥 순회(forEachNear)가 흔들리지 않는다. */
    if (!p.split && self.isEvolved(p.weaponId)){
      var ev = self.config.evolutions[p.weaponId];
      // 맞은 적 e 를 같이 넘긴다 — 갈라진 것을 그 적의 판정 원 **바깥**에서 태워야
      // 자기를 낳아 준 적을 한 번 더 안 때린다(진화표에 없는 3배 딜의 원인이었다).
      if (ev && ev.rule === 'split') self.splitProjectile(p, ev, e);
    }
  };
}
World.prototype.setRandom = function(fn){ this.random = fn; };
World.prototype.setInput = function(x, y){
  this.rawInput.x = x;
  this.rawInput.y = y;
};
World.prototype.step = function(dt){
  Vec.clampToUnit(this.rawInput.x, this.rawInput.y, this.moveDir);
  var speed = this.config.player.speed * this.metaMult.speed *
              (1 + this.passives.bell * this.config.passives.bell.speedPct / 100);
  this.player.x += this.moveDir.x * speed * dt;
  this.player.y += this.moveDir.y * speed * dt;
  // 움직인 프레임에만 정면을 갱신한다 (멈추면 마지막 방향 유지)
  var mx = this.moveDir.x, my = this.moveDir.y;
  var len = Math.sqrt(mx * mx + my * my);
  if (len > 1e-6){ this.facing.x = mx / len; this.facing.y = my / len; }
};
// 경과 시간에 따른 적 체력 배수. 속도·피해에는 걸지 않는다(후반이 감당 불가가 된다).
World.prototype.hpScale = function(){
  return 1 + (this.elapsed / 60) * this.config.spawn.hpPerMin;
};
// 적을 켠다. 풀이 객체를 재사용하므로 여기서 모든 필드를 빠짐없이 덮어쓴다.
// (필드를 새로 추가하면 반드시 이 함수도 같이 고칠 것 — 안 그러면 이전 적의 값이 샌다)
World.prototype.spawnEnemy = function(typeId, x, y){
  var t = this.config.enemies[typeId];
  if (!t) return null;
  var e = this.enemies.spawn();
  if (!e) return null;
  // 보스 체력은 표에 적힌 값이 최종값이다. 시간 배율까지 곱하면 15분 보스가 78,000이 되어
  // 4슬롯 빌드의 최대 화력(초당 200~286)으로는 몇 분을 때려야 하는 수치가 된다.
  var scaledHp = t.boss ? t.hp : t.hp * this.hpScale();
  e.x = x;            e.y = y;
  e.typeId = typeId;  e.hp = scaledHp;  e.maxHp = scaledHp;
  e.speed = t.speed;  e.radius = t.radius;
  e.contact = t.contact;                e.xp = t.xp;
  e.hitFlash = 0;     e.contactCd = 0;
  e.slowT = 0;        e.slowPct = 0;
  for (var oi = 0; oi < e.orbitCds.length; oi++) e.orbitCds[oi] = 0;
  e.tornadoCd = 0;    // 토네이도 재타격 간격 (꼬리 회전의 orbitCds 와 같은 방식)
  e.chainStamp = 0;   // 정전기 연쇄가 "이번 발동에 이미 골랐다" 를 찍는 자리
  e.beamStamp = 0;    // 레이저가 "이번 발동에 이미 맞혔다" 를 찍는 자리 (빔이 둘이라 필요하다)
  // 스폰마다 오르는 일련번호. 동료가 목표를 붙잡을 때 "이 슬롯이 아직 그 적인가"를
  // 이걸로 확인한다. 참조만 붙들면 죽은 목표의 자리에 스폰된 새 적을 쫓아간다.
  e.stamp = ++this.enemyStamp;
  return e;
};
// 격자를 플레이어 중심으로 다시 놓고 활성 적을 담는다.
World.prototype.rebuildGrid = function(){
  var g = this.grid;
  var halfW = g.cols * g.cellSize / 2;
  var halfH = g.rows * g.cellSize / 2;
  g.reset(this.player.x - halfW, this.player.y - halfH);
  var items = this.enemies.items;
  for (var i = 0; i < items.length; i++){
    if (items[i].active) g.insert(items[i]);
  }
};
// 활성 적을 전부 플레이어 쪽으로 옮긴다.
World.prototype.moveEnemies = function(dt){
  var px = this.player.x, py = this.player.y;
  var items = this.enemies.items;
  for (var i = 0; i < items.length; i++){
    var e = items[i];
    if (!e.active) continue;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    // 공마다 재타격 간격이 따로 흐른다. 어느 하나라도 남아 있으면 "방금 맞았다" 로 본다
    // (밀어내기가 그 창을 쓴다).
    var orbHot = false;
    for (var oi = 0; oi < e.orbitCds.length; oi++){
      if (e.orbitCds[oi] > 0){ e.orbitCds[oi] -= dt; orbHot = true; }
    }
    if (e.tornadoCd > 0) e.tornadoCd -= dt;
    var sp = e.speed;
    if (e.slowT > 0){
      e.slowT -= dt;
      sp *= (1 - e.slowPct / 100);
    }
    var dx = px - e.x, dy = py - e.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1e-6) continue;            // 겹쳐 있으면 0으로 나누지 않는다
    var step = sp * dt;
    if (step > len) step = len;          // 지나쳐서 플레이어 주위를 진동하지 않게
    e.x += dx / len * step;
    e.y += dy / len * step;
    /* 회오리 꼬리(진화) 밀어내기 —
       속도가 아니라 위치를 직접 옮긴다. 적의 이동은 바로 윗줄처럼 매 프레임
       플레이어를 향해 다시 계산되므로 속도를 만져도 다음 프레임에 지워진다.
       미는 창은 "맞은 뒤 재타격 간격(orbitCds)" 이다. 맞은 그 프레임에만 밀면
       220 × 1/60 = 3.7px 라 눈에도 안 보이고 적이 다가오는 속도도 못 이긴다.
       ⚠️ 여기(update 안, rebuildGrid 앞)에서 옮겨야 격자와 안 어긋난다. */
    // 부호를 그대로 쓴다 — 음수면 밖으로 미는 대신 안으로 당긴다(관문 실험용).
    if (this.galePush !== 0 && orbHot){
      var push = this.galePush * dt;
      e.x -= dx / len * push;            // dx·dy 는 적→플레이어 방향이라 부호를 뒤집는다
      e.y -= dy / len * push;
    }
  }
};
// 플레이어에 닿은 적이 피해를 준다.
// 적마다 재적용 간격을 따로 센다(여러 마리에게 둘러싸이면 그만큼 아프다).
World.prototype.resolveContacts = function(dt){
  if (this.gameOver || this.benchMode) return;
  var p = this.player;
  if (p.invuln > 0) p.invuln -= dt;
  var pr = this.config.player.radius;
  var items = this.enemies.items;
  var i;
  // 쿨타임은 활성 적 전부에 대해 흐른다 (격자 후보만이 아니라)
  for (i = 0; i < items.length; i++){
    if (items[i].active && items[i].contactCd > 0) items[i].contactCd -= dt;
  }
  this._contactCd = this.config.combat.contactCooldownMs / 1000;
  var maxR = pr + this.maxEnemyR;   // 격자 후보 반경 — 가장 큰 적이 닿을 수 있는 최대 거리
  this.grid.forEachNear(p.x, p.y, maxR, this._onContactCandidate);
};

/* 영구강화 단계 -> 배수·가산값. 순수 계산이라 world 상태를 안 건드린다.
   applyMeta(적용) 와 playerStats(표시) 가 이 한 표를 같이 쓴다 — 두 벌로 갈라지면
   도감 숫자가 실제 효과와 조용히 어긋난다. */
World.prototype.metaMultFrom = function(metaLevels){
  var ml = metaLevels || {};
  var mc = this.config.meta;
  return {
    damage:   1 + (ml.power  || 0) * mc.power.pct / 100,
    maxHpAdd:     (ml.maxHp  || 0) * mc.maxHp.add,
    speed:    1 + (ml.speed  || 0) * mc.speed.pct / 100,
    pickup:   1 + (ml.magnet || 0) * mc.magnet.pct / 100,
    xp:       1 + (ml.xpGain || 0) * mc.xpGain.pct / 100
  };
};

// 영구강화 단계를 갈아끼운다(상점에서 산 뒤 다음 판에 반영). reset 이 뒤따라야 한다.
// metaMult 객체 자체는 갈지 않는다 — 매 프레임 읽는 자리라 참조를 유지한다.
World.prototype.applyMeta = function(metaLevels){
  var m = this.metaMultFrom(metaLevels);
  this.metaMult.damage   = m.damage;
  this.metaMult.maxHpAdd = m.maxHpAdd;
  this.metaMult.speed    = m.speed;
  this.metaMult.pickup   = m.pickup;
  this.metaMult.xp       = m.xp;
};

/* 도감에 쓸 적 한 종의 표시 정보.
   보스 이름·등장 시각은 CONFIG.bosses 에서 읽는다 — CONFIG.enemies 에 중복해
   넣으면 나중에 한쪽만 고쳐서 어긋난다(계획/15-수치공개-명세.md ④).
   hpLate 는 "마지막 보스가 나오는 시각의 체력" 이다. 적 체력은 1분마다
   hpPerMin 만큼 늘고 보스만 예외라, 잡졸은 후반에 몇 배가 되는지가 중요하다. */
World.prototype.enemyInfo = function(id){
  var e = this.config.enemies[id];
  if (!e) return null;
  var name = e.name || '';
  var fromMin = e.fromMin;
  var i;
  if (e.boss){
    for (i = 0; i < this.config.bosses.length; i++){
      if (this.config.bosses[i].typeId === id){
        name = this.config.bosses[i].name;
        fromMin = this.config.bosses[i].atMin;
        break;
      }
    }
  }
  var lateMin = this.config.bosses[this.config.bosses.length - 1].atMin;
  var scale = 1 + lateMin * this.config.spawn.hpPerMin;
  return {
    id: id, name: name, emoji: e.emoji, boss: !!e.boss,
    hp: e.hp,
    hpLate:  e.boss ? null : Math.round(e.hp * scale),
    lateMin: e.boss ? null : lateMin,
    contact: e.contact, speed: e.speed,
    fromMin: fromMin, coin: e.coin, xp: e.xp
  };
};

/* 도감 "나" 칸. 영구강화 단계를 받아 기본값과 지금 값을 함께 준다.
   **패시브를 섞지 않는다.** 시작 화면에서 열린 도감은 world 가 아직 초기화되기
   전이라 world.passives 가 직전 판 값일 수 있다 — 그걸 읽으면 "아직 시작도
   안 했는데 발톱갈이 3단계" 가 나온다. 이번 판 패시브는 shell 이 일시정지에서
   열렸을 때만 따로 보여준다. */
World.prototype.playerStats = function(metaLevels){
  var p = this.config.player;
  var m = this.metaMultFrom(metaLevels);
  return {
    maxHp:  { base: p.maxHp,       now: p.maxHp + m.maxHpAdd },
    speed:  { base: p.speed,       now: Math.round(p.speed * m.speed) },
    damage: { base: 1,             now: m.damage },
    pickup: { base: p.pickupRange, now: Math.round(p.pickupRange * m.pickup) },
    xp:     { base: 1,             now: m.xp }
  };
};

// 판을 처음 상태로 되돌린다.
World.prototype.reset = function(starterId){
  this.enemies.releaseAll();
  this.player.x = 0; this.player.y = 0;
  this.player.invuln = 0;
  var startHp = this.config.player.maxHp + this.metaMult.maxHpAdd;
  this.player.hp = startHp;
  this.player.maxHp = startHp;
  this.rawInput.x = 0; this.rawInput.y = 0;
  this.nukesTaken = 0;
  this.gameOver = false;
  this.cleared = false;
  this.bossEaseUntil = 0;
  this.elapsed = 0;
  this.spawnAcc = 0;
  this.bossIndex = 0;
  this.boss = null;
  this.facing.x = 1; this.facing.y = 0;
  this.aimDir.x = 1; this.aimDir.y = 0;
  this.swingTimer = 0;
  this.swingRadius = 0;
  this.swingDir.x = 1; this.swingDir.y = 0;
  this.beamTimer = 0;
  this.beamN = 0;
  this.beamStamp = 0;
  this.blastTimer = 0;
  this.blastShow = 0;
  this.blastWeaponId = '';
  this.orbitAngle = 0;
  this.orbitN = 0; this.orbitR = 0;
  for (var obi = 0; obi < this.orbitXs.length; obi++){ this.orbitXs[obi] = 0; this.orbitYs[obi] = 0; }
  this.galePush = 0;   // 진화가 풀리므로 밀어내기도 꺼 둔다 (fireOrbit 이 매 프레임 다시 정한다)
  this.chainTimer = 0;
  this.chainShow = 0;
  this.chainN = 0;
  this.chainStamp = 0;
  this._chainBuf.length = 0;
  this.kills = 0;
  this.dmgBy = freshDamageTally();   // 이어할 때마다 새로 세지 않도록 reset 이 비운다 (Task 3 가 복원한다)
  this.gems.releaseAll();
  this.projectiles.releaseAll();
  this.fields.releaseAll();
  this.warns.releaseAll();
  var citems = this.companions.items;
  for (var cj = 0; cj < citems.length; cj++) citems[cj].target = null;
  this.companions.releaseAll();
  this.companion = null;
  this.enemyStamp = 0;
  this.warnAcc = 0;
  this.nukes.releaseAll();
  this.nukeAcc = 0;
  this.boxes.releaseAll();
  this.pendingEvolve = 0;
  this.boxesTaken = 0;
  this.projStamp = 0;
  this.xp = 0;
  this.level = 1;
  this.pendingChoices = 0;
  this.rolledChoices = null;
  this.rerollLeft = this.config.level.rerollPerRun;   // 새 판이면 다시 뽑기도 새로
  this.passives.claws = 0; this.passives.tuna = 0; this.passives.bell = 0;
  this.passives.whisker = 0; this.passives.nap = 0; this.passives.clover = 0;
  this.coins = 0;
  // 시작 무기를 정한다. 모르는 값이 오면 쓰던 것을 그대로 둔다 —
  // shell 이 검증을 하더라도 core 혼자서 유효한 판을 만들 수 있어야 한다.
  if (typeof starterId === 'string' && WEAPON_IDS.indexOf(starterId) >= 0)
    this.starter = starterId;
  // 무기를 통째로 새로 만든다. 하나씩 지우면 "아는 무기 목록에 없는 id" 가
  // 살아남아 다음 판까지 따라온다 — 옛 코드는 그걸 막고 있었다.
  // reset 은 판당 한 번이라 여기서 객체를 새로 만들어도 된다.
  this.weapons = {};
  this.weaponOrder.length = 0;
  this.evolved = {};
  this.weapons[this.starter] = { level: 1, cdLeft: 0 };
  this.weaponOrder.push(this.starter);
  this.benchMode = false;
  this.rebuildGrid();
};

// 저장에서 읽은 값을 믿을 수 있는 숫자로 만든다. 숫자가 아니거나 음수면 0.
function safeNum(v){
  return (typeof v === 'number' && isFinite(v) && v > 0) ? v : 0;
}
function safeInt(v, min, max, fallback){
  if (typeof v !== 'number' || !isFinite(v)) return fallback;
  v = Math.floor(v);
  if (v < min) return min;
  if (v > max) return max;
  return v;
}

/* ── 판 도중 저장 ──────────────────────────────────────────────
   평평한 값만 뽑는다. 적·투사체·젬·장판은 매 프레임 바뀌는 풀 객체 수백 개라
   저장하지 않고, 이어할 때 스폰이 다시 채우게 둔다.
   보스는 예외로 남은 체력까지 뽑는다 — 안 그러면 보스전 도중에 나갔다 오는 것이
   보스를 만피로 되돌리는 회피 수단이 된다. */
World.prototype.snapshot = function(){
  if (this.gameOver || this.cleared) return null;   // 끝난 판은 이어할 것이 없다
  var weapons = {}, id;
  for (var i = 0; i < this.weaponOrder.length; i++){
    id = this.weaponOrder[i];
    weapons[id] = this.weapons[id].level;
  }
  var passives = {};
  for (id in this.passives) passives[id] = this.passives[id];
  // 딜량: DAMAGE_IDS 순서 그대로 정수 배열로 뽑는다. 정수로 내리는 이유는
  // 소수점까지 저장할 필요가 없어서다 — 결과 화면은 퍼센트만 보여준다.
  var dmg = new Array(DAMAGE_IDS.length);
  for (i = 0; i < DAMAGE_IDS.length; i++) dmg[i] = Math.floor(this.dmgBy[DAMAGE_IDS[i]]);
  // 레벨업 3택: 안 저장하면 이어하기가 공짜 리롤이 된다(카드가 다시 뽑힌다).
  // (kind,id) 만 저장한다 — 이름·설명·단계는 복원 후 지금 상태로 다시 만들 수 있다.
  var choices = null;
  if (this.pendingChoices > 0 && Array.isArray(this.rolledChoices)){
    choices = this.rolledChoices.map(function(c){ return [c.kind, c.id]; });
  }
  // 진화는 판 전체를 지배하는 상태다. 18단계의 보스 유예와 달리 반드시 저장한다 —
  // 빠지면 이어하기 했을 때 무기가 통째로 원래대로 돌아간다.
  // evolutionOrder 고정 순서로 훑어 배열로 담는다(for...in 금지).
  var evolved = [];
  for (i = 0; i < this.config.evolutionOrder.length; i++){
    var eid = this.config.evolutionOrder[i];
    if (this.evolved[eid] === true) evolved.push(eid);
  }
  var boxes = [];
  var bitems = this.boxes.items;
  for (i = 0; i < bitems.length; i++){
    if (bitems[i].active) boxes.push([bitems[i].x, bitems[i].y]);
  }
  return {
    v: 2,
    elapsed: this.elapsed,
    level: this.level,
    xp: this.xp,
    kills: this.kills,
    coins: this.coins,
    bossIndex: this.bossIndex,
    nukesTaken: this.nukesTaken,
    pendingChoices: this.pendingChoices,
    choices: choices,
    rerollLeft: this.rerollLeft,   // 안 저장하면 멈췄다 이어하는 게 공짜 리롤이 된다
    hp: this.player.hp,
    maxHp: this.player.maxHp,
    weaponOrder: this.weaponOrder.slice(),
    weapons: weapons,
    passives: passives,
    boss: (this.boss && this.boss.active)
            ? { typeId: this.boss.typeId, hp: this.boss.hp } : null,
    dmg: dmg,
    evolved: evolved,
    boxes: boxes,
    pendingEvolve: this.pendingEvolve ? 1 : 0
  };
};

/* 끝난 판의 성적표. 네트워크·DOM 을 모른다 — shell 이 이걸 받아
   기기 정보와 강화 단계를 붙여 보낸다. 판마다 한 번만 불리므로
   배열·문자열을 만들어도 된다. */
World.prototype.recordSummary = function(){
  if (!this.gameOver && !this.cleared) return null;
  var sec = Math.round(this.elapsed);
  if (sec < this.config.runSave.minSec) return null;   // 실수로 켰다 끈 판은 안 보낸다
  var i, id, w = [], p = [];
  for (i = 0; i < this.weaponOrder.length; i++){
    id = this.weaponOrder[i];
    if (this.weapons[id] && this.weapons[id].level > 0)
      w.push(id + this.weapons[id].level);
  }
  for (i = 0; i < PASSIVE_ORDER.length; i++){
    id = PASSIVE_ORDER[i];
    if (this.passives[id] > 0) p.push(id + this.passives[id]);
  }
  return {
    sec: sec,
    cleared: !!this.cleared,
    level: this.level,
    kills: this.kills,
    coins: Math.floor(this.coins),
    bossIndex: this.bossIndex,
    nukes: this.nukesTaken,
    weapons: w.join(' '),
    passives: p.join(' ')
  };
};

// 스냅샷으로 판을 되돌린다. 못 쓸 스냅샷이면 아무것도 안 하고 false.
World.prototype.restore = function(s){
  // v1(19단계 이전 저장)도 계속 읽는다 — 지금 사람들이 실제로 갖고 있는 저장이다.
  if (!s || typeof s !== 'object' || (s.v !== 1 && s.v !== 2)) return false;
  if (typeof s.elapsed !== 'number' || !isFinite(s.elapsed) || s.elapsed < 0) return false;
  if (typeof s.level !== 'number' || !isFinite(s.level) || s.level < 1) return false;
  if (!Array.isArray(s.weaponOrder) || !s.weaponOrder.length ||
      !s.weapons || typeof s.weapons !== 'object' ||
      !s.passives || typeof s.passives !== 'object') return false;
  if (typeof s.hp !== 'number' || !isFinite(s.hp) || s.hp <= 0) return false;
  if (typeof s.maxHp !== 'number' || !isFinite(s.maxHp) || s.maxHp <= 0) return false;

  this.reset();          // 풀·타이머를 전부 비우고 시작한다
  this.elapsed = s.elapsed;
  this.level   = Math.floor(s.level);
  // 손댄 저장 데이터가 숫자 아닌 값을 밀어 넣어도 판이 조용히 망가지지 않게 한다.
  // 예: xp 가 문자열이면 이후 xp += 가 문자열 이어붙이기가 되어 레벨이 영영 안 오른다.
  this.xp      = safeNum(s.xp);
  this.kills   = safeInt(s.kills, 0, Number.MAX_SAFE_INTEGER || 9007199254740991, 0);
  this.coins   = safeNum(s.coins);
  this.bossIndex = safeInt(s.bossIndex, 0, this.config.bosses.length, 0);
  this.nukesTaken = safeInt(s.nukesTaken, 0, 100, 0);
  this.pendingChoices = safeInt(s.pendingChoices, 0, this.level, 0);
  // 다시 뽑기: 이 기능이 없던 시절의 저장에는 필드 자체가 없다. 그때는 만석으로 준다.
  // 숫자로 들어 있으면 0 도 그대로 존중해야 한다 — 안 그러면 무한 리롤이 된다.
  var rr = s.rerollLeft;
  if (typeof rr !== 'number' || !isFinite(rr) || rr < 0) rr = this.config.level.rerollPerRun;
  if (rr > this.config.level.rerollPerRun) rr = this.config.level.rerollPerRun;
  this.rerollLeft = Math.floor(rr);

  var id, i;
  for (id in this.passives) this.passives[id] = 0;
  for (id in s.passives){
    var passiveCfg = this.config.passives[id];
    if (passiveCfg)
      this.passives[id] = safeInt(s.passives[id], 0, passiveCfg.maxLevel, 0);
  }

  this.weapons = {};
  this.weaponOrder.length = 0;
  var restoredWeapons = Object.create(null);
  for (i = 0; i < s.weaponOrder.length &&
              this.weaponOrder.length < this.config.level.slotsWeapon; i++){
    id = s.weaponOrder[i];
    var weaponCfg = this.config.weapons[id];
    if (!weaponCfg || restoredWeapons[id]) continue;   // 없어진 무기·중복 항목은 건너뛴다
    restoredWeapons[id] = true;
    this.weapons[id] = {
      level: safeInt(s.weapons[id], 1, weaponCfg.maxLevel, 1),
      cdLeft: 0
    };
    this.weaponOrder.push(id);
  }
  if (!this.weaponOrder.length){                 // 무기가 하나도 안 남으면 시작 무기라도
    this.weapons[this.starter] = { level: 1, cdLeft: 0 };
    this.weaponOrder.push(this.starter);
  }

  // 최대 체력은 저장값을 그대로 믿는다. 참치캔·영구강화가 이미 반영된 값이라
  // 여기서 다시 더하면 이중으로 붙는다.
  this.player.maxHp = s.maxHp;
  this.player.hp    = s.hp > s.maxHp ? s.maxHp : s.hp;

  var savedBossCfg = s.boss && this.config.enemies[s.boss.typeId];
  if (savedBossCfg && savedBossCfg.boss &&
      typeof s.boss.hp === 'number' && isFinite(s.boss.hp) && s.boss.hp > 0){
    var ring = this.spawnRing();
    var b = this.spawnEnemy(s.boss.typeId, this.player.x + ring, this.player.y);
    if (b){ b.hp = s.boss.hp > b.maxHp ? b.maxHp : s.boss.hp; this.boss = b; }
  }

  // 딜량: 배열이 없거나(예전 저장) 길이가 안 맞거나 숫자가 아니면 그 판은
  // 전부 0으로 두고 계속한다 (reset() 이 이미 dmgBy 를 0으로 채워 뒀다).
  if (Array.isArray(s.dmg) && s.dmg.length === DAMAGE_IDS.length){
    var dmgOk = true;
    for (var di = 0; di < s.dmg.length; di++){
      if (typeof s.dmg[di] !== 'number' || !isFinite(s.dmg[di]) || s.dmg[di] < 0){
        dmgOk = false;
        break;
      }
    }
    if (dmgOk){
      for (di = 0; di < DAMAGE_IDS.length; di++) this.dmgBy[DAMAGE_IDS[di]] = s.dmg[di];
    }
  }

  // 레벨업 3택: 검증을 통과해야만 복원한다. 배열이 아니거나, 정확히 3장이 아니거나
  // (rollChoices 는 항상 정확히 3장을 돌려준다 — dmg 배열의 정확 길이 검증과 같은 패턴),
  // 항목 하나라도 지금 CONFIG·상태와 안 맞으면(무기가 없어졌다 등) 전부 버린다 —
  // reset() 이 이미 rolledChoices 를 null 로 둬서, showLevelUp 이 새로 추첨하는
  // 지금까지의 동작으로 폴백한다.
  if (this.pendingChoices > 0 && Array.isArray(s.choices) && s.choices.length === 3){
    var restoredChoices = [];
    var choicesOk = true;
    for (var ci = 0; ci < s.choices.length; ci++){
      var pair = s.choices[ci];
      if (!Array.isArray(pair) || pair.length !== 2 ||
          typeof pair[0] !== 'string' || typeof pair[1] !== 'string'){
        choicesOk = false;
        break;
      }
      var built = this.choiceFromKindId(pair[0], pair[1]);
      if (!built){ choicesOk = false; break; }
      restoredChoices.push(built);
    }
    if (choicesOk) this.rolledChoices = restoredChoices;
  }

  /* v1 저장(19단계 이전)에는 이 셋이 없다. 없으면 "진화 없음" 으로 읽는다 —
     지금 사람들이 갖고 있는 저장이라 버리면 안 된다. */
  this.evolved = {};
  if (Array.isArray(s.evolved)){
    for (i = 0; i < s.evolved.length; i++){
      var evid = s.evolved[i];
      // 저장은 사람이 고칠 수 있는 곳이다. CONFIG 에 있는 이름만 받는다.
      if (typeof evid === 'string' && this.config.evolutions[evid]) this.evolved[evid] = true;
    }
  }
  this.boxes.releaseAll();
  if (Array.isArray(s.boxes)){
    for (i = 0; i < s.boxes.length; i++){
      var bp = s.boxes[i];
      if (!Array.isArray(bp) || bp.length !== 2) continue;
      if (!isFinite(bp[0]) || !isFinite(bp[1])) continue;
      var nb = this.boxes.spawn();
      if (!nb) break;
      nb.x = bp[0]; nb.y = bp[1];
    }
  }
  this.pendingEvolve = (s.pendingEvolve === 1 && this.evolveCandidates().length > 0) ? 1 : 0;

  return true;
};

// 이 적을 잡았을 때 들어오는 코인. 네잎클로버 패시브가 곱해진다.
World.prototype.coinGain = function(typeId){
  var t = this.config.enemies[typeId];
  if (!t) return 0;
  var base = t.coin || 0;          // coin 을 빠뜨린 적이 저장을 망가뜨리지 않게
  var cl = this.config.passives.clover;
  return base * (1 + this.passives.clover * cl.coinPct / 100);
};

// 적에게 피해를 준다. 죽으면 풀로 돌려보내고 true 를 반환한다.
// source 는 무기 id (또는 'nuke') — 딜량 측정에 쓴다. 모르는 이름·빈 값은 ? 로 간다.
World.prototype.damageEnemy = function(e, amount, source){
  // 남은 체력보다 크게 때려도 실제로 깎인 만큼만 센다 — 넘친 분까지 세면
  // 캣닢·핵폭탄처럼 한 번에 크게 때리는 무기가 실제보다 세 보인다.
  var real = amount < e.hp ? amount : e.hp;
  if (real > 0) this.dmgBy[DAMAGE_INDEX[source] ? source : '?'] += real;
  e.hp -= amount;
  e.hitFlash = 0.12;                  // 렌더가 흰색으로 번쩍이는 데 쓴다(초)
  if (e.hp > 0) return false;
  this.kills++;
  this.coins += this.coinGain(e.typeId);
  this.dropGem(e.x, e.y, e.xp);
  this.enemies.release(e);
  return true;
};

// 젬을 떨군다. 풀이 꽉 찼으면 조용히 넘어간다(게임이 멈추면 안 된다).
World.prototype.dropGem = function(x, y, xp){
  var g = this.gems.spawn();
  if (!g) return null;
  g.x = x; g.y = y; g.xp = xp;
  return g;
};

// 흡수 범위 안의 젬을 끌어당기고, 닿으면 먹는다.
World.prototype.updateGems = function(dt){
  var p = this.player;
  var range = this.pickupRange();
  var cfg = this.config.gem;
  var eat = cfg.radius + this.config.player.radius;
  var items = this.gems.items;
  for (var i = 0; i < items.length; i++){
    var g = items[i];
    if (!g.active) continue;
    var dx = p.x - g.x, dy = p.y - g.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= eat){
      this.xp += g.xp * this.metaMult.xp;
      this.gems.release(g);
      continue;
    }
    if (dist > range) continue;              // 범위 밖이면 가만히
    var step = cfg.attractSpeed * dt;
    if (step > dist) step = dist;
    g.x += dx / dist * step;
    g.y += dy / dist * step;
  }
  this.checkLevelUp();
};

// 표시용 소수 자르기. 17.5 를 18 로 반올림하지 않는다 — 실제 피해는 소수 그대로 들어간다.
function round1(x){ return Math.round(x * 10) / 10; }

/* 무기마다 "사거리" 의 뜻이 다르다. weaponRadius() 는 할퀴기·캣닢·우유에만 맞고
   레이저·꼬리 회전·고양이 친구는 radius 필드 자체가 없어 NaN 이 나온다
   (계획/15-수치공개-명세.md ①). weaponRadius() 는 실제 판정에 쓰이므로 고치지 않고,
   표시 전용으로 "그 무기가 레벨마다 실제로 좋아지는 것" 을 여기서 따로 정의한다.
   null 은 "공격력만 오르는 무기" 다 — 안 변하는 숫자를 억지로 띄우지 않는다.
   무기를 새로 늘리면 여기에도 줄을 더해야 한다(빠뜨리면 core.test.js 가 잡는다). */
var WEAPON_FEATURE = {
  claw:    { label: '사거리',    from: 'radius' },
  yarn:    { label: '발사 수',   from: 'counts', unit: '발' },
  bone:    { label: '발사 수',   from: 'counts', unit: '발' },
  laser:   { label: '사거리',    from: 'length' },
  catnip:  { label: '폭발 범위', from: 'radius' },
  milk:    { label: '장판 크기', from: 'radius' },
  tail:    { label: '공전 반경', from: 'orbit'  },
  tornado: { label: '발사 수',   from: 'counts', unit: '발' },
  zap:     null,      // 연쇄 수·연쇄 범위가 레벨과 무관하다
  friend:  null       // 탐지 범위가 레벨과 무관하다
};

/* 진화표의 숫자를 도감에 띄울 때 붙일 이름표. **무기마다 손으로 적는다.**

   같은 key 가 무기마다 다른 것을 뜻하기 때문이다 — `radius` 가 앞발은 사거리,
   꼬리는 공전 반경, 태풍은 회오리 크기다. `count` 도 생선뼈는 발사 수, 레이저는
   줄 수, 꼬리는 공 개수다. 자동으로 이름을 붙이면 **틀린 숫자를 자신 있게 띄운다.**
   WEAPON_FEATURE 와 같은 방식이고, 빠뜨리면 core.test.js 가 잡는다. */
var EVO_FEATURE = {
  claw:    { damage: '공격력', radius: '사거리' },
  yarn:    {},                                        // 갈라지는 규칙뿐 — 배수가 없다
  bone:    { count: '발사 수' },
  laser:   { damage: '공격력', width: '빔 폭', count: '줄 수' },
  catnip:  { damage: '공격력', radius: '폭발 범위' },
  milk:    {},                                        // 반경이 화면 크기라 배수가 없다
  tail:    { radius: '공전 반경', count: '공 개수' },
  tornado: { damage: '공격력', radius: '회오리 크기', pull: '끌어당김' },
  zap:     { damage: '공격력', chain: '연쇄 횟수' },
  friend:  { damage: '공격력', cooldown: '공격 주기', seek: '쫓는 거리' }
};

/* 배수가 아니라 절대값이라 "×N" 으로 적으면 거짓말이 되는 항목들.
   갈라지는 각도(35도)·미는 힘(초당 110px)이 그렇다. 설명(desc)이 대신 말한다. */
var EVO_PLAIN = { splitDeg: true, pushPerSec: true };

/* 진화 항목을 훑는 고정 순서. for-in 은 엔진마다 순서가 달라 쓰지 않는다
   (weaponOrder 와 같은 이유 — 여기서는 재현성이 아니라 도감 줄 순서가 걸린다). */
var EVO_KEY_ORDER = ['damage', 'radius', 'width', 'count', 'chain', 'pull', 'cooldown', 'seek'];

/* 패시브·영구강화를 뺀 순수 기본 피해량. 상점과 도감이 쓴다 — 그 화면들은 판 밖에서도
   열리는데, 그 시점 world.passives 는 직전 판이 남긴 값일 수 있다. 실제 피해량을
   보여주면 "발톱갈이를 들고 죽은 뒤 상점을 열면 앞발 할퀴기가 14 가 아니라 20" 이 된다. */
World.prototype.weaponBaseDamageAt = function(id, lv){
  var w = this.config.weapons[id];
  return w.damage * (1 + (lv - 1) * this.config.level.damagePerLvPct / 100);
};

// 레벨 lv 에서의 실제 피해량. 기본값 위에 발톱갈이 패시브와 영구강화를 얹는다.
// weaponDamage(id) 가 이걸 현재 레벨로 부른다 — 공식은 여기 한 벌뿐이다.
World.prototype.weaponDamageAt = function(id, lv){
  var pct = this.passives.claws * this.config.passives.claws.damagePct;
  return this.weaponBaseDamageAt(id, lv) * (1 + pct / 100) * this.metaMult.damage;
};

World.prototype.isEvolved = function(id){
  return this.evolved[id] === true;
};

/* 진화 배율. 진화 안 했거나 그 무기의 진화표에 그 항목이 없으면 1 이다.
   1 을 돌려주므로 부르는 쪽이 조건 없이 곱하기만 하면 된다 — 전투 함수마다
   if 를 흩뿌리면 하나 빠뜨렸을 때 조용히 안 걸린다. */
World.prototype.evoMult = function(id, key){
  if (this.evolved[id] !== true) return 1;
  var e = this.config.evolutions[id];
  if (!e) return 1;
  var v = e[key];
  return typeof v === 'number' ? v : 1;
};

/* 도감이 쓸 "진화하면 이만큼 달라진다" 줄들. [{label, text}, ...] 를 돌려주고
   셸이 이어 붙인다.

   ⚠️ **진화 여부를 안 본다.** 도감은 5성을 안 찍어도 미리 다 보여주는 화면이다
      (15단계 정신 — 어느 무기를 끝까지 키울지가 이 표를 보고 정하는 일이다).
      그래서 evoMult() 를 안 쓴다. 그건 "지금 진화했는가" 를 묻는 전투용이다.

   공격력과 공격 주기만 **실제 숫자**로 보여준다. 사람이 제일 궁금해하는 둘이고,
   특히 주기는 배수가 1보다 작아서(고양이 친구 0.6) "×0.6" 이 약해지는 것처럼 읽힌다. */
World.prototype.evolutionRows = function(id){
  var e = this.config.evolutions[id];
  if (!e) return [];
  var labels = EVO_FEATURE[id] || {};
  var cfg = this.config.weapons[id];
  var out = [], i, key, v, label;
  for (i = 0; i < EVO_KEY_ORDER.length; i++){
    key = EVO_KEY_ORDER[i];
    v = e[key];
    if (typeof v !== 'number') continue;
    label = labels[key];
    if (!label) continue;          // 이름표가 없으면 안 띄운다 (빠뜨림은 테스트가 잡는다)
    if (key === 'damage'){
      var base = this.weaponBaseDamageAt(id, cfg.maxLevel);
      out.push({ label: label, text: round1(base) + ' → ' + round1(base * v) });
    } else if (key === 'cooldown'){
      var cd = cfg.cooldownMs / 1000;
      out.push({ label: label, text: round1(cd) + '초 → ' + round1(cd * v) + '초' });
    } else {
      out.push({ label: label, text: '×' + round1(v) });
    }
  }
  return out;
};

World.prototype.evolve = function(id){
  if (!this.config.evolutions[id]) return false;
  if (this.evolved[id] === true) return false;
  this.evolved[id] = true;
  return true;
};

/* 전투용 피해. 진화 배율은 여기 한 곳에서만 건다 — 전투 경로 아홉 자리가
   전부 이 함수를 거치므로(1466·1483·1503·1516·1545·1563·1611·1634),
   여기에 걸면 하나도 안 빠진다.
   표시용 weaponDamageAt 에는 안 건다. 도감·레벨업 카드가 그걸 쓰는데,
   진화 배율이 새면 진화 안 한 무기의 숫자까지 부풀어 보인다. */
World.prototype.weaponDamage = function(id){
  return this.weaponDamageAt(id, this.weapons[id].level)
         * this.evoMult(id, 'damage');
};

// 레벨 lv 에서 그 무기의 "두 번째 수치". 없으면 null.
World.prototype.weaponFeatureAt = function(id, lv){
  var f = WEAPON_FEATURE[id];
  if (!f) return null;
  var c = this.config.weapons[id];
  var v;
  if (f.from === 'radius')      v = c.radius + (lv - 1) * (c.radiusPerLv || 0);
  else if (f.from === 'length') v = c.length + (lv - 1) * (c.lengthPerLv || 0);
  else if (f.from === 'orbit')  v = c.orbitRadius + (lv - 1) * (c.orbitRadiusPerLv || 0);
  // 발사 수는 fireProjectile 과 같은 색인 규칙을 써야 한다 — 한쪽만 고치면 어긋난다
  else                          v = c.counts[Math.min(lv, c.counts.length) - 1];
  return { label: f.label, value: Math.round(v), unit: f.unit || '' };
};

/* 레벨업 카드에 쓸 무기 설명. toLv 는 그 카드를 고르면 도달할 레벨이다.
   toLv === 1 이면 새로 얻는 무기라 비교할 "지금" 이 없다.
   두 번째 수치는 실제로 값이 바뀔 때만 줄을 만든다 — 털뭉치 Lv1->Lv2 처럼
   발사 수가 그대로인 구간에 "1 -> 1" 을 띄우면 정보가 아니라 소음이다. */
World.prototype.weaponCardDesc = function(id, toLv){
  var dTo = round1(this.weaponDamageAt(id, toLv));
  var fTo = this.weaponFeatureAt(id, toLv);
  if (toLv <= 1){
    var s = '공격력 ' + dTo;
    if (fTo) s += ' · ' + fTo.label + ' ' + fTo.value + fTo.unit;
    return s;
  }
  var out = '공격력 ' + round1(this.weaponDamageAt(id, toLv - 1)) + ' → ' + dTo;
  var fFrom = this.weaponFeatureAt(id, toLv - 1);
  if (fTo && fFrom && fFrom.value !== fTo.value)
    out += '<br>' + fTo.label + ' ' + fFrom.value + ' → ' + fTo.value + fTo.unit;
  return out;
};

// 젬 흡수 범위. 수염 패시브가 곱해진다.
World.prototype.pickupRange = function(){
  var wh = this.config.passives.whisker;
  return this.config.player.pickupRange * this.metaMult.pickup *
         (1 + this.passives.whisker * wh.pickupPct / 100);
};

// 무기의 현재 사거리. 레벨당 radiusPerLv 만큼 늘어난다.
// ⚠️ 이 함수는 radius 필드가 있는 무기(할퀴기·캣닢·우유)에만 유효하다. 레이저·꼬리
//    회전·고양이 친구는 radius 가 없어서 NaN 이 나온다 — 실제 판정에서는 그 셋에
//    대해 부르지 않으므로 문제가 없지만, 화면에 띄우려면 weaponFeatureAt() 를 쓸 것.
World.prototype.weaponRadius = function(id){
  var w = this.config.weapons[id];
  return (w.radius + (this.weapons[id].level - 1) * (w.radiusPerLv || 0))
         * this.evoMult(id, 'radius');
};

// 가장 가까운 살아있는 적 쪽으로 aimDir 를 맞춘다. 적이 없으면 이동 방향을 쓴다.
// 반환값은 조준한 적(없으면 null) — 폭발처럼 "적 위치"가 필요한 무기가 쓴다.
World.prototype.aimAtNearest = function(){
  var items = this.enemies.items;
  var best = null, bestSq = Infinity, bx = 0, by = 0;
  // 보스가 가까이 있으면 보스를 먼저 본다. 이게 없으면 잡졸이 항상 더 가까워서
  // 공격이 전부 잡졸에게 가고 보스는 체력이 거의 안 깎인다 (5분 보스가 안 죽던 원인).
  if (this.boss && this.boss.active){
    var bdx = this.boss.x - this.player.x, bdy = this.boss.y - this.player.y;
    var bd2 = bdx * bdx + bdy * bdy;
    var range = this.config.combat.bossAimRange;
    if (bd2 <= range * range){
      if (bd2 > 1e-12){
        var bd = Math.sqrt(bd2);
        this.aimDir.x = bdx / bd;
        this.aimDir.y = bdy / bd;
      }
      return this.boss;
    }
  }
  for (var i = 0; i < items.length; i++){
    var e = items[i];
    if (!e.active) continue;
    var dx = e.x - this.player.x, dy = e.y - this.player.y;
    var d2 = dx * dx + dy * dy;
    if (d2 < bestSq){ bestSq = d2; bx = dx; by = dy; best = e; }
  }
  if (best === null){
    this.aimDir.x = this.facing.x;
    this.aimDir.y = this.facing.y;
  } else if (bestSq > 1e-12){
    var d = Math.sqrt(bestSq);
    this.aimDir.x = bx / d;
    this.aimDir.y = by / d;
  }
  return best;   // 완전히 겹쳐 있으면(bestSq≈0) 직전 조준 방향을 유지한다
};

// 무기 쿨타임을 흘리고, 다 찬 무기를 순서대로 발동한다.
World.prototype.fireWeapons = function(dt){
  if (this.swingTimer > 0) this.swingTimer -= dt;
  if (this.beamTimer > 0) this.beamTimer -= dt;
  if (this.blastTimer > 0) this.blastTimer -= dt;
  if (this.chainTimer > 0) this.chainTimer -= dt;
  // 측정 중엔 무기도 멈춘다 — 적을 잡으면 부하가 줄고, 젬·레벨업 카드가 측정을 끊는다
  if (this.benchMode) return;
  var order = this.weaponOrder;
  for (var i = 0; i < order.length; i++){
    var id = order[i];
    var st = this.weapons[id];
    st.cdLeft -= dt;
    if (st.cdLeft > 0) continue;
    st.cdLeft = this.weaponCooldown(id);
    this.fireWeapon(id, dt);
  }
};

// 무기의 재사용 대기 시간(초). 패시브 보정은 여기 한 곳에서만 건다.
World.prototype.weaponCooldown = function(id){
  var np = this.config.passives.nap;
  var mult = 1 - this.passives.nap * np.cooldownPct / 100;
  if (mult < np.minMult) mult = np.minMult;
  // 진화 배율은 그 무기의 진화표에 cooldown 이 적혀 있을 때만 걸린다.
  // evoMult 는 없으면 1 을 돌려주므로 진화 안 한 무기의 쿨타임은 그대로다 —
  // 이 함수는 무기 전체가 쓰기 때문에 여기서 새면 게임 속도가 통째로 흔들린다.
  return this.config.weapons[id].cooldownMs / 1000 * mult
         * this.evoMult(id, 'cooldown');
};

// 종류에 따라 실제 발동 함수로 넘긴다. 무기를 추가하면 여기에 한 줄이 붙는다.
World.prototype.fireWeapon = function(id, dt){
  var kind = this.config.weapons[id].kind;
  if (kind === 'claw') this.fireClaw(id);
  else if (kind === 'projectile') this.fireProjectile(id);
  else if (kind === 'beam') this.fireBeam(id);
  else if (kind === 'blast') this.fireBlast(id);
  else if (kind === 'field') this.fireField(id);
  else if (kind === 'orbit') this.fireOrbit(id, dt);
  else if (kind === 'chain') this.fireChain(id);
  else if (kind === 'companion') this.fireCompanion(id);
};

// 부채꼴 안의 적을 전부 때린다. 방향은 자동 조준: 가장 가까운 적, 없으면 이동 방향.
World.prototype.fireClaw = function(id){
  var cfg = this.config.weapons[id];
  this.swingTimer = cfg.swingMs / 1000;
  this._hitDmg = this.weaponDamage(id);
  this._hitRadius = this.weaponRadius(id);
  this.swingRadius = this._hitRadius;   // 렌더용으로 따로 보관
  this.aimAtNearest();
  this.swingDir.x = this.aimDir.x;
  this.swingDir.y = this.aimDir.y;
  // 부채꼴 판정: 조준 방향과 이루는 각이 절반각 이내인가 → 내적으로 비교
  this._hitCosHalf = Math.cos(cfg.arcDeg * Math.PI / 180 / 2);
  this.grid.forEachNear(this.player.x, this.player.y,
                        this._hitRadius + this.maxEnemyR, this._onArcCandidate);
};

// 조준 방향으로 투사체를 count 발 부채꼴로 뿌린다.
World.prototype.fireProjectile = function(id){
  var cfg = this.config.weapons[id];
  var lv = this.weapons[id].level;
  var n = cfg.counts[Math.min(lv, cfg.counts.length) - 1] * this.evoMult(id, 'count');
  var dmg = this.weaponDamage(id);
  this.aimAtNearest();
  var baseAng = Math.atan2(this.aimDir.y, this.aimDir.x);
  var spread = cfg.spreadDeg * Math.PI / 180;
  for (var k = 0; k < n; k++){
    var a = baseAng + (n === 1 ? 0 : (k - (n - 1) / 2) * spread);
    this.spawnProjectile(id, Math.cos(a) * cfg.speed, Math.sin(a) * cfg.speed, dmg, cfg);
  }
};

// 조준 방향으로 뻗은 선분 위의 적을 전부 때린다 (즉시 판정, 관통).
World.prototype.fireBeam = function(id){
  var cfg = this.config.weapons[id];
  var lv = this.weapons[id].level;
  this.aimAtNearest();
  /* 줄 수. 햇빛 모으기(진화)는 2 줄이고, 둘째 줄은 **정반대 방향**이다.
     레이저의 약점이 "앞만 본다" 라서 뒤를 덮는 것이 제일 크게 달라진다.
     자리 배열 길이를 넘지 않게 자른다. */
  var n = Math.round(this.evoMult(id, 'count'));
  if (n < 1) n = 1;
  if (n > this.beamDirs.length) n = this.beamDirs.length;
  this.beamN = n;
  var i;
  for (i = 0; i < n; i++){
    var s = i === 0 ? 1 : -1;
    this.beamDirs[i].x = this.aimDir.x * s;
    this.beamDirs[i].y = this.aimDir.y * s;
  }
  this.beamLen = cfg.length + (lv - 1) * cfg.lengthPerLv;
  // 빔 폭은 cfg.width 를 직접 쓰므로 weaponRadius 의 진화 배율이 안 걸린다 —
  // 햇빛 모으기(width) 는 여기서 곱해야 실제로 넓어진다.
  this.beamHalfW = cfg.width / 2 * this.evoMult(id, 'width');
  this.beamTimer = cfg.showMs / 1000;
  this._hitDmg = this.weaponDamage(id);
  // 이번 발동 번호. 두 줄이 겹치는 자리(플레이어 바로 옆)의 적을 두 번 안 때리게 한다.
  this.beamStamp++;
  // 선분 전체를 감싸는 원으로 후보를 좁힌 뒤, 콜백이 선분까지의 거리를 정확히 잰다
  for (i = 0; i < n; i++){
    this._bmI = i;
    var d = this.beamDirs[i];
    var midX = this.player.x + d.x * this.beamLen / 2;
    var midY = this.player.y + d.y * this.beamLen / 2;
    this.grid.forEachNear(midX, midY, this.beamLen / 2 + this.maxEnemyR, this._onBeamCandidate);
  }
};

// 가장 가까운 적의 자리에서 원형 폭발. 적이 없으면 발밑에서 터진다.
World.prototype.fireBlast = function(id){
  var cfg = this.config.weapons[id];
  var target = this.aimAtNearest();
  var x = target ? target.x : this.player.x;
  var y = target ? target.y : this.player.y;
  this.blastAt(x, y, this.weaponRadius(id), this.weaponDamage(id), cfg.showMs / 1000, id);
};

// 폭발 판정 + 연출 정보를 한 곳에 모은다. 무기(캣닢, fireBlast)든 맵 아이템
// (☢️ 핵폭탄, updateNukes)이든 터뜨릴 땐 반드시 여기를 거친다 — 폭발 로직이
// 두 벌로 갈라지지 않게 하기 위함. colorKey 는 shell 의 BLAST_COLOR 표 키.
World.prototype.blastAt = function(x, y, radius, damage, showSec, colorKey){
  this.blastX = x;
  this.blastY = y;
  this.blastR = radius;
  this.blastTimer = showSec;
  this.blastShow = showSec;      // 렌더가 잔상 비율을 낼 때 쓴다
  this.blastWeaponId = colorKey; // 새 문자열이 아니라 CONFIG 키(또는 'nuke')의 참조다
  this._hitDmg = damage;
  this._hitRadius = radius;
  // 알려진 한계: 핵폭탄처럼 반경이 격자 탐색 한계보다 크면 forEachNear 가
  // 격자 가장자리에서 후보를 잘라낼 수 있다. 계획서에서 알고도 그대로 두기로
  // 했다 — 화면 밖 끄트머리 적 몇 마리를 놓치는 정도라 체감이 없다.
  this.grid.forEachNear(this.blastX, this.blastY,
                        this.blastR + this.maxEnemyR, this._onBlastCandidate);
};

// 발밑에 장판을 깐다.
World.prototype.fireField = function(id){
  var cfg = this.config.weapons[id];
  var evo = this.config.evolutions[id];
  // 우유 바다 — 배율이 아니라 규칙이 바뀐다(반경이 화면 절반, 지속이 갱신).
  var sea = this.isEvolved(id) && evo && evo.rule === 'sea';
  if (sea){
    /* 이미 깔려 있으면 새로 깔지 않고 그 장판의 지속만 되돌린다.
       장판이 겹겹이 쌓이면 같은 적이 장판 수만큼 맞아 피해가 몇 배가 된다 —
       화면 절반짜리 장판이라 겹침이 사고가 아니라 기본값이 된다. */
    var fitems = this.fields.items;
    for (var fi = 0; fi < fitems.length; fi++){
      var old = fitems[fi];
      if (old.active && old.weaponId === id){
        old.life = cfg.durationSec;
        /* 자리와 피해도 같이 되돌린다.
           ⚠️ 지금 이 세 줄은 한 번도 안 돈다 — 낮잠(nap.minMult 0.7) 을 만렙으로
           찍어도 우유 쿨타임은 3.5초라 지속 2.5초짜리 장판이 **항상 먼저 꺼진다.**
           하지만 뒤 태스크의 관문에서 쿨타임이 2.5초 밑으로 내려가는 순간 이 가지가
           살아나는데, 그때 자리를 안 옮기면 우유 바다가 처음 깐 자리에 영구히
           못 박혀 플레이어를 안 따라오고, tickDmg 를 안 되돌리면 그 뒤의
           발톱갈이 레벨업이 우유에만 안 붙는다. */
        old.x = this.player.x;  old.y = this.player.y;
        old.tickDmg = this.weaponDamage(id) * cfg.tickSec;
        /* 반경도 되돌린다. 이게 빠져 있으면, 진화하기 **전에** 깔린 작은 장판(92)이
           살아 있는 채로 진화 후 캐스트가 오는 순간 그 장판이 영원히 갱신되면서
           우유 바다가 끝까지 작은 채로 남는다 — 큰 장판이 아예 안 생긴다.
           지금 수치(쿨 5.0초 > 지속 2.5초)에서는 장판이 먼저 꺼져 도달하지 않지만,
           녹화 도구가 쿨을 0 으로 만들자 바로 재현됐다. 한 줄이면 막힌다. */
        old.radius = this.viewHalfH;
        return old;
      }
    }
  }
  var f = this.fields.spawn();
  if (!f) return null;              // 풀이 꽉 찼으면 조용히 넘어간다
  f.x = this.player.x;  f.y = this.player.y;
  // 화면 세로의 절반. core 는 ensureGridCovers 로 이미 화면 크기를 알고 있으므로
  // 새 상수를 만들지 않고 그 값을 쓴다.
  f.radius = sea ? this.viewHalfH : this.weaponRadius(id);
  f.tickDmg = this.weaponDamage(id) * cfg.tickSec;   // 초당 피해 × 간격
  f.life = cfg.durationSec;
  f.tickLeft = 0;                   // 깔리자마자 한 번 때린다
  f.slowPct = cfg.slowPct;
  f.slowDur = cfg.tickSec + 0.1;    // 다음 판정까지 둔화가 끊기지 않게 조금 길게
  f.weaponId = id;
  return f;
};

// 내 주위를 도는 공. 쿨타임이 0이라 매 프레임 불리고, 대신 적마다 재타격 간격을 센다.
World.prototype.fireOrbit = function(id, dt){
  var cfg = this.config.weapons[id];
  var lv = this.weapons[id].level;
  this.orbitAngle += cfg.rotSpeed * dt;
  if (this.orbitAngle > Math.PI * 2) this.orbitAngle -= Math.PI * 2;
  // 궤도 반경은 weaponRadius 를 안 탄다 — 여기서 직접 계산하므로 진화 배율도 여기서 건다.
  this.orbitR = (cfg.orbitRadius + (lv - 1) * cfg.orbitRadiusPerLv)
                * this.evoMult(id, 'radius');
  // 회오리 꼬리면 맞은 적을 민다. 미는 일은 moveEnemies 가 한다(격자와 안 어긋나게).
  var evo = this.config.evolutions[id];
  // 값이 있는지를 typeof 로 묻고 부호는 그대로 넘긴다. 관문에서 "당기는 꼬리" 를
  // 실험하려고 음수를 넣었을 때 여기서든 moveEnemies 의 가드에서든 부호가 잘리면
  // 실험이 **조용히** 무시되어 관문이 "효과가 없네" 로 잘못 읽는다.
  /* 공 수. 진화표의 count 를 그대로 쓴다(없으면 evoMult 가 1 을 준다).
     자리 배열 길이를 넘지 않게 자른다 — 표에 5 를 적어도 조용히 4 로만 돈다. */
  var n = Math.round(this.evoMult(id, 'count'));
  if (n < 1) n = 1;
  if (n > this.orbitXs.length) n = this.orbitXs.length;
  this.orbitN = n;
  /* 밀어내기는 **공 수로 나눈다** — pushPerSec 는 "공 하나가 미는 힘" 이 아니라
     "이 무기가 미는 총량" 이다.

     안 나누면 공을 늘리는 순간 미는 총량이 같이 곱해진다. 실제로 그렇게 터졌다:
     공을 2개로 늘린 날(2026-08-11), 우유 바다와 같이 들고 **손을 놓고 서 있어도
     16분을 안 죽었다**(공 1개일 때 321초 · 우유만 들면 315초). 밀어내기가
     초당 110 에서 220 이 되면서 적이 영영 못 닿게 된 것이다.
     6단계가 "가만히 서 있는 게 정답이 됐다" 로 적어 둔 그 사고이고,
     19단계에 이어 세 번째다. 이번엔 곱셈이 아니라 나눗셈으로 막는다. */
  this.galePush = (this.isEvolved(id) && evo && typeof evo.pushPerSec === 'number')
                  ? evo.pushPerSec / n : 0;
  var i;
  // ① 자리를 전부 먼저 정한다. 공들은 원을 n 등분한 자리에 고르게 놓인다.
  for (i = 0; i < n; i++){
    var a = this.orbitAngle + i * Math.PI * 2 / n;
    this.orbitXs[i] = this.player.x + Math.cos(a) * this.orbitR;
    this.orbitYs[i] = this.player.y + Math.sin(a) * this.orbitR;
  }
  this._hitDmg = this.weaponDamage(id);
  this._hitRadius = cfg.ballRadius;
  this._orbitCd = cfg.hitCooldownMs / 1000;
  // ② 그 다음에 때린다. 때리는 도중에 적이 풀로 돌아가므로 자리 계산과 섞으면 안 된다.
  for (i = 0; i < n; i++){
    this._obI = i;
    this.grid.forEachNear(this.orbitXs[i], this.orbitYs[i],
                          cfg.ballRadius + this.maxEnemyR, this._onOrbitCandidate);
  }
};

/* 정전기 — 첫 대상을 맞히고 근처 적으로 튄다.
   ① 대상을 전부 모으고 ② 격자 순회가 끝난 뒤에 때린다. 이 순서를 바꾸면
   연쇄 도중에 죽은 적이 풀로 돌아가면서 바깥 순회의 피해가 망가진다. */
World.prototype.fireChain = function(id){
  var cfg = this.config.weapons[id];
  var first = this.aimAtNearest();
  if (!first || !first.active) return;   // 때릴 적이 없다 — 직전 번개 잔상(chainN)을 지우지 않는다
  this.chainN = 0;

  this.chainStamp++;
  var buf = this._chainBuf;
  buf.length = 0;
  buf.push(first);
  first.chainStamp = this.chainStamp;

  // ① 대상 고르기 — 여기서는 절대 때리지 않는다
  // 연쇄 횟수는 cfg.chainCount 를 직접 쓰므로 진화 배율을 여기서 건다.
  // (생성자의 chainX/chainY 길이도 이 최대치에 맞춰 잡아 뒀다)
  var chainCount = Math.round(cfg.chainCount * this.evoMult(id, 'chain'));
  var cur = first, i;
  for (i = 0; i < chainCount; i++){
    this._chainFrom = cur;
    this._chainBest = null;
    this._chainBestSq = cfg.chainRange * cfg.chainRange;
    this.grid.forEachNear(cur.x, cur.y, cfg.chainRange + this.maxEnemyR,
                          this._onChainCandidate);
    if (this._chainBest === null) break;   // 더 튈 곳이 없다
    cur = this._chainBest;
    cur.chainStamp = this.chainStamp;
    buf.push(cur);
  }
  this._chainFrom = null;
  this._chainBest = null;

  // 연출용 좌표를 먼저 적어 둔다 (때리면 죽은 적이 풀로 돌아간다)
  this.chainN = buf.length;
  for (i = 0; i < buf.length; i++){
    this.chainX[i] = buf[i].x;
    this.chainY[i] = buf[i].y;
  }
  this.chainTimer = cfg.showMs / 1000;
  this.chainShow  = cfg.showMs / 1000;

  // ② 이제 때린다 — 격자 순회 밖이라 재진입이 아니다
  var dmg = this.weaponDamage(id);
  for (i = 0; i < buf.length; i++){
    this.damageEnemy(buf[i], dmg, id);
    dmg *= cfg.chainFalloff;
  }
  buf.length = 0;   // 죽은 적 참조를 붙잡고 있지 않게 비운다
};

/* 고양이 친구 — 쿨타임이 찰 때마다 목표를 하나 잡는다.
   동료가 없으면 이때 한 마리 불러낸다(무기를 얻자마자 화면에 나타난다). */
World.prototype.fireCompanion = function(id){
  var cfg = this.config.weapons[id];
  var c = this.companion;
  if (c === null || !c.active){
    c = this.companions.spawn();
    if (!c) return;                 // 풀이 꽉 찼으면 조용히 넘어간다
    // 풀이 객체를 재활용하므로 여기서 모든 필드를 빠짐없이 덮어쓴다
    c.x = this.player.x;  c.y = this.player.y;
    c.state = 0;          c.target = null;   c.targetStamp = 0;
    c.weaponId = id;      c.dmg = 0;
    this.companion = c;
  }
  c.weaponId = id;
  c.dmg = this.weaponDamage(id);    // 발톱갈이·영구강화가 이 시점 값으로 반영된다
  if (c.state === 1) return;        // 이미 달려드는 중이면 목표를 바꾸지 않는다

  // 가장 가까운 적 **하나**만 고른다 — 한 번에 한 마리다(AC-4).
  // 격자가 아니라 선형 훑기다: 쿨타임 1.2초에 한 번뿐이고 aimAtNearest 도 같은 방식이다.
  // 들고양이(진화)는 더 멀리 찾는다. seekRange 는 여기서만 쓰여 다른 경로가 없다.
  var seek = cfg.seekRange * this.evoMult(id, 'seek');
  var best = null, bestSq = seek * seek;
  var items = this.enemies.items;
  for (var i = 0; i < items.length; i++){
    var e = items[i];
    if (!e.active) continue;
    var dx = e.x - c.x, dy = e.y - c.y;
    var d2 = dx * dx + dy * dy;
    if (d2 < bestSq){ bestSq = d2; best = e; }
  }
  if (best === null) return;        // 사거리 안에 적이 없다 — 계속 따라다닌다
  c.state = 1;
  c.target = best;
  c.targetStamp = best.stamp;
};

/* 동료를 옮기고, 목표에 닿으면 문다.
   damageEnemy 를 격자 콜백 밖에서 부르므로 재진입 함정에 걸리지 않는다. */
World.prototype.updateCompanions = function(dt){
  var items = this.companions.items;
  for (var i = 0; i < items.length; i++){
    var c = items[i];
    if (!c.active) continue;
    var cfg = this.config.weapons[c.weaponId];
    if (!cfg) continue;
    var dx, dy, d, step;
    if (c.state === 1){
      var t = c.target;
      // 목표가 죽었거나 그 슬롯을 다른 적이 물려받았으면 따라가기로 돌아온다
      if (t === null || !t.active || t.stamp !== c.targetStamp){
        c.state = 0;  c.target = null;  c.targetStamp = 0;
      } else {
        dx = t.x - c.x;  dy = t.y - c.y;
        d = Math.sqrt(dx * dx + dy * dy);
        if (d <= cfg.biteRadius + t.radius){
          this.damageEnemy(t, c.dmg, c.weaponId);          // 한 마리만 문다
          c.state = 0;  c.target = null;  c.targetStamp = 0;
        } else {
          step = cfg.moveSpeed * dt;
          if (step > d) step = d;
          c.x += dx / d * step;
          c.y += dy / d * step;
        }
        continue;
      }
    }
    // 따라가기 — 플레이어 뒤쪽 자리에 붙는다
    dx = (this.player.x - this.facing.x * cfg.followDist) - c.x;
    dy = (this.player.y - this.facing.y * cfg.followDist) - c.y;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) continue;
    step = cfg.moveSpeed * dt;
    if (step > d) step = d;
    c.x += dx / d * step;
    c.y += dy / d * step;
  }
};

// 장판 수명을 흘리고, 간격마다 안에 있는 적을 때린다.
World.prototype.updateFields = function(dt){
  var items = this.fields.items;
  for (var i = 0; i < items.length; i++){
    var f = items[i];
    if (!f.active) continue;
    f.life -= dt;
    if (f.life <= 0){ this.fields.release(f); continue; }
    f.tickLeft -= dt;
    if (f.tickLeft > 0) continue;
    f.tickLeft = this.config.weapons[f.weaponId].tickSec;
    this._field = f;
    this.grid.forEachNear(f.x, f.y, f.radius + this.maxEnemyR, this._onFieldCandidate);
  }
  this._field = null;
};

// 투사체 하나를 켠다. 풀이 꽉 찼으면 조용히 넘어간다(게임이 멈추면 안 된다).
World.prototype.spawnProjectile = function(id, vx, vy, dmg, cfg){
  var p = this.projectiles.spawn();
  if (!p) return null;
  this.projStamp++;
  p.x = this.player.x;  p.y = this.player.y;
  p.vx = vx;            p.vy = vy;
  p.dmg = dmg;
  // 투사체는 weaponRadius 를 안 탄다(그 함수는 radiusPerLv 가 있는 무기용이다).
  // 태풍(tornado.radius) 은 여기서 곱해야 실제로 커진다.
  p.radius = cfg.radius * this.evoMult(id, 'radius');
  p.life = cfg.lifeSec; p.pierce = cfg.pierce;
  p.stamp = this.projStamp;
  p.weaponId = id;
  p.turnAt = cfg.boomerang ? cfg.lifeSec / 2 : 0;   // 0이면 직진만
  // 끌어당김·재타격이 없는 무기는 반드시 0 으로 덮어쓴다. 안 그러면 토네이도가 쓰던
  // 슬롯을 물려받은 털뭉치가 적을 빨아들이고 무한히 재타격한다(풀 잔존값).
  // 태풍(tornado.pull) 은 범위와 세기를 함께 키운다.
  p.pullRadius = (cfg.pullRadius || 0) * this.evoMult(id, 'pull');
  p.pullSpeed  = (cfg.pullSpeed  || 0) * this.evoMult(id, 'pull');
  p.hitCd = cfg.hitCooldownMs ? cfg.hitCooldownMs / 1000 : 0;   // 0 이면 "한 적당 한 번" 방식
  p.hitN = 0;        // 풀 잔존값 방어 — 앞판이 때린 적 목록을 물려받으면 새 것이 못 때린다
  p.split = false;   // 풀 잔존값 방어 — 앞판의 갈라진 투사체가 남으면 새 것이 안 갈라진다
  return p;
};

/* 실타래 폭풍 — 맞은 자리에서 좌우 ±splitDeg 로 두 개가 갈라진다.
   spawnProjectile 을 못 쓴다: 그 함수는 투사체를 **플레이어 자리**에 만드는데
   갈라진 것은 맞은 자리에서 나가야 한다. 그래서 여기서 필드를 전부 덮어쓴다
   (풀이 객체를 재활용하므로 하나라도 빠뜨리면 이전 투사체의 값이 샌다).

   ⚠️ 태우는 자리는 **맞은 적 e 의 판정 원 바깥**이다. 맞은 자리(p.x·p.y)에서
   그대로 태우면 도장이 새것이라 자기를 낳아 준 적을 한 번 더 때린다 —
   안 죽는 적(보스)에게 한 방이 3배가 되는데 그 3배는 진화표 어디에도 안 적혀
   있어서 뒤 태스크의 밸런스 관문이 표를 보고는 절대 못 찾는다. */
World.prototype.splitProjectile = function(p, evo, e){
  var wcfg = this.config.weapons[p.weaponId];
  if (!wcfg) return;
  var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  var base = Math.atan2(p.vy, p.vx);
  var off = (evo.splitDeg || 0) * Math.PI / 180;
  // 충돌은 거리 <= p.radius + e.radius 로 판정하므로 그보다 1px 밖에서 태우면
  // 이미 안 닿는다. 갈라진 것은 거기서 바깥으로 나아가므로 다시 안 닿는다.
  var out = e.radius + p.radius + 1;
  for (var s = -1; s <= 1; s += 2){
    var q = this.projectiles.spawn();
    if (!q) return;                 // 풀이 꽉 찼으면 조용히 넘어간다 (게임이 멈추면 안 된다)
    var a = base + s * off;
    q.x = e.x + Math.cos(a) * out; q.y = e.y + Math.sin(a) * out;
    q.vx = Math.cos(a) * speed;    q.vy = Math.sin(a) * speed;
    q.dmg = p.dmg;                 q.radius = p.radius;
    q.life = wcfg.lifeSec;         q.pierce = wcfg.pierce;
    /* 때린 적 목록을 비운다. 원본 것을 물려주면 갈라진 투사체가 원본이 스쳐 간 적을
       영영 못 때린다. (2026-08-11 이전에는 이 자리가 "도장을 새로 매긴다" 였다 —
       기억이 적 쪽 한 칸이던 시절의 방어였고, 그 방식 자체를 PROJ_HIT_CAP 으로 바꿨다.) */
    q.hitN = 0;
    this.projStamp++;
    q.stamp = this.projStamp;
    // weaponId 를 원본 그대로 둔다. 딜량이 원래 무기 이름으로 쌓여야
    // 결과 화면의 무기 비중이 진화 전후로 쪼개지지 않는다(명세가 정한 것).
    q.weaponId = p.weaponId;
    q.turnAt = 0;                  // 갈라진 것은 안 돌아온다
    q.pullRadius = 0;  q.pullSpeed = 0;  q.hitCd = 0;
    q.split = true;                // 다시 안 갈라진다 — 무한 증식 방지
  }
};

// 투사체를 옮기고, 수명이 끝나거나 관통을 다 쓰면 회수한다.
World.prototype.updateProjectiles = function(dt){
  var items = this.projectiles.items;
  for (var i = 0; i < items.length; i++){
    var p = items[i];
    if (!p.active) continue;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.turnAt > 0 && p.life <= p.turnAt){
      p.vx = -p.vx;
      p.vy = -p.vy;
      p.turnAt = 0;     // 한 번만 뒤집는다
    }
    if (p.life <= 0){ this.projectiles.release(p); continue; }
    this._proj = p;
    // 끌어당김을 먼저 하고 그 다음에 때린다 — 당겨진 자리로 충돌을 판정한다.
    if (p.pullRadius > 0){
      this._pullDt = dt;
      this.grid.forEachNear(p.x, p.y, p.pullRadius + this.maxEnemyR, this._onPullCandidate);
    }
    this.grid.forEachNear(p.x, p.y, p.radius + this.maxEnemyR, this._onProjCandidate);
    if (p.pierce <= 0) this.projectiles.release(p);
  }
  this._proj = null;
};

// 기획안 §3.7 곡선: 10레벨까지 5 + 레벨×4, 이후 레벨×9
World.prototype.xpToNext = function(){
  return this.level <= 10 ? 5 + this.level * 4 : this.level * 9;
};

World.prototype.checkLevelUp = function(){
  var guard = 0;
  while (this.xp >= this.xpToNext() && guard++ < 1000){
    this.xp -= this.xpToNext();
    this.level++;
    this.pendingChoices++;
    var p = this.player;
    p.hp += p.maxHp * this.config.level.healPerLvPct / 100;
    if (p.hp > p.maxHp) p.hp = p.maxHp;
  }
};

// 레벨업 후보 3개. 슬롯이 꽉 찼으면 강화만, 만렙은 제외, 다 만렙이면 회복.
World.prototype.rollChoices = function(){
  var cfg = this.config;
  var pool = [];
  var id, ii;
  /* 무기·패시브 둘 다 **고정 순서 배열**로 훑는다.
     예전에는 for-in 이었다. 이 저장소가 weaponOrder 를 배열로 만든 이유가
     "for-in 은 엔진마다 순서가 달라 봇 시뮬 재현성이 깨진다" 인데, 정작
     **카드 후보를 모으는 이 자리**가 for-in 이었다 — 뽑기 결과를 정하는 곳이라
     여기가 흔들리면 같은 씨드가 다른 판이 된다(2026-08-11 정리).
     V8 은 문자열 키를 선언 순서로 주므로 지금 결과는 안 바뀐다. 봇 12판 출력이
     바이트까지 같은 것을 확인했다. 이건 다른 엔진에 대한 보험이다. */
  for (ii = 0; ii < WEAPON_IDS.length; ii++){
    id = WEAPON_IDS[ii];
    if (!cfg.weapons[id]) continue;
    var wst = this.weapons[id];
    var owned = !!wst;
    var lv = owned ? wst.level : 0;
    if (owned && lv >= cfg.weapons[id].maxLevel) continue;
    if (!owned && this.weaponSlotsUsed() >= cfg.level.slotsWeapon) continue;
    pool.push({ kind: 'weapon', id: id, name: cfg.weapons[id].name,
                emoji: cfg.weapons[id].emoji, level: lv + 1,
                desc: this.weaponCardDesc(id, lv + 1) });
  }
  // 패시브
  for (ii = 0; ii < PASSIVE_IDS.length; ii++){
    id = PASSIVE_IDS[ii];
    if (!cfg.passives[id]) continue;
    var plv = this.passives[id];
    if (plv >= cfg.passives[id].maxLevel) continue;
    if (plv === 0 && this.passiveSlotsUsed() >= cfg.level.slotsPassive) continue;
    pool.push({ kind: 'passive', id: id, name: cfg.passives[id].name,
                emoji: cfg.passives[id].emoji, level: plv + 1,
                desc: this.passiveDesc(id) });
  }
  // 무작위로 3개 뽑기 (모자라면 회복으로 채운다)
  var out = [];
  var i;

  /* ① 초반 미보유 우선 —
     무기 슬롯에 빈 칸이 있는 동안 3택 중 newWeaponPicks 장을 "아직 없는 무기" 로
     채운다(가능한 만큼). 슬롯이 차면 pool 자체에 미보유 무기가 안 들어오므로
     이 블록은 저절로 꺼진다. */
  if (this.weaponSlotsUsed() < cfg.level.slotsWeapon){
    var newIdx = [];
    for (i = 0; i < pool.length; i++)
      if (pool[i].kind === 'weapon' && !this.weapons[pool[i].id]) newIdx.push(i);
    while (out.length < cfg.level.newWeaponPicks && newIdx.length > 0){
      var nk = Math.floor(this.random() * newIdx.length);
      if (nk >= newIdx.length) nk = newIdx.length - 1;
      out.push(pool[newIdx[nk]]);      // pool 색인이 흔들리지 않게 지금은 빼지 않는다
      newIdx.splice(nk, 1);
    }
    for (i = 0; i < out.length; i++){
      var pi = pool.indexOf(out[i]);
      if (pi >= 0) pool.splice(pi, 1);
    }
  }

  /* ② 미보유 우선이 한 장도 못 채웠으면(슬롯이 찼거나 새 무기가 없다)
     기존 규칙대로 최소 1장은 무기를 보장한다. */
  if (out.length === 0){
    var wIdx = [];
    for (i = 0; i < pool.length; i++) if (pool[i].kind === 'weapon') wIdx.push(i);
    if (wIdx.length > 0){
      var wk = Math.floor(this.random() * wIdx.length);
      if (wk >= wIdx.length) wk = wIdx.length - 1;
      out.push(pool.splice(wIdx[wk], 1)[0]);
    }
  }
  while (out.length < 3 && pool.length > 0){
    var k = Math.floor(this.random() * pool.length);
    if (k >= pool.length) k = pool.length - 1;
    out.push(pool.splice(k, 1)[0]);
  }
  while (out.length < 3){
    out.push({ kind: 'heal', id: 'heal' + out.length, name: '고양이 캔',
               emoji: '\u{1F41F}', level: 0,
               desc: '체력을 ' + cfg.level.healAmount + ' 회복합니다' });
  }
  this.rolledChoices = out;   // 저장(snapshot)이 이걸 (kind,id)만 뽑아 담는다
  return out;
};

/* 3택을 통째로 다시 만든다. 판당 CONFIG.level.rerollPerRun 회.
   남은 횟수가 없으면 null 을 돌려주고 아무것도 바꾸지 않는다. */
World.prototype.reroll = function(){
  if (this.rerollLeft <= 0) return null;
  this.rerollLeft--;
  return this.rollChoices();
};

World.prototype.weaponSlotsUsed = function(){
  var n = 0, id;
  for (id in this.weapons) n++;
  return n;
};
World.prototype.passiveSlotsUsed = function(){
  var n = 0, id;
  for (id in this.passives) if (this.passives[id] > 0) n++;
  return n;
};
/* 패시브 단계 lv 에서의 효과 수치. **공식은 여기 한 벌뿐이다.**

   전에는 같은 계산이 두 벌이었다 — core 의 passiveDesc 와 shell 의
   codexPassiveEffectText. 그리고 카드 쪽(passiveDesc)은 여섯 중 셋
   (수염·네잎클로버·낮잠)이 숫자를 아예 안 보여주고 "젬을 더 멀리서 줍습니다" 처럼
   말로만 적혀 있었다. 15단계가 정한 "수치를 감추지 않는다" 가 패시브에는 안 걸려 있었다.

   lv = 0 은 "아직 없음" 이라 배수 1.00 · 가산 0 이 나온다 — 카드가 "지금 → 다음" 을
   만들 때 그 자리를 쓴다.
   모르는 id 는 null 이다. 예전에는 낮잠 설명이 기본값(return 문)이라 패시브를 새로
   넣고 줄을 안 더하면 **조용히 "공격이 더 자주 나갑니다" 가 붙었다.** */
World.prototype.passiveEffectAt = function(id, lv){
  var pc = this.config.passives[id];
  if (!pc) return null;
  if (id === 'claws' && typeof pc.damagePct === 'number')
    return { label: '공격력', text: '×' + (1 + lv * pc.damagePct / 100).toFixed(2) };
  if (id === 'tuna' && typeof pc.maxHpAdd === 'number')
    return { label: '최대 체력', text: '+' + (lv * pc.maxHpAdd) };
  if (id === 'bell' && typeof pc.speedPct === 'number')
    return { label: '이동 속도', text: '×' + (1 + lv * pc.speedPct / 100).toFixed(2) };
  if (id === 'whisker' && typeof pc.pickupPct === 'number')
    return { label: '젬 줍는 범위', text: '×' + (1 + lv * pc.pickupPct / 100).toFixed(2) };
  if (id === 'nap' && typeof pc.cooldownPct === 'number' && typeof pc.minMult === 'number'){
    // 쿨타임은 낮을수록 좋다. minMult 아래로는 안 내려간다(만렙에서 딱 그 값이다).
    var mult = 1 - lv * pc.cooldownPct / 100;
    if (mult < pc.minMult) mult = pc.minMult;
    return { label: '공격 주기', text: '×' + mult.toFixed(2) };
  }
  if (id === 'clover' && typeof pc.coinPct === 'number')
    return { label: '코인', text: '×' + (1 + lv * pc.coinPct / 100).toFixed(2) };
  return null;
};

/* 레벨업 카드에 쓸 패시브 설명. 무기 카드(weaponCardDesc)와 같은 모양으로 맞춘다 —
   새로 얻으면 값 하나, 이미 있으면 "지금 → 다음". */
World.prototype.passiveDesc = function(id){
  var now = this.passives[id] || 0;
  var to = this.passiveEffectAt(id, now + 1);
  if (!to) return '';
  if (now === 0) return to.label + ' ' + to.text;   // 새로 얻는다 — 비교할 "지금" 이 없다
  var from = this.passiveEffectAt(id, now);
  return to.label + ' ' + from.text + ' → ' + to.text;
};

// (kind, id) 한 장을 지금 상태 기준 카드 한 장으로 되살린다. 레벨업 3택 저장 복원 전용 —
// 이름·설명·단계는 저장하지 않고(현재 상태에서 다시 만들 수 있어서) 여기서 만든다.
// kind/id 가 지금 CONFIG·상태와 안 맞으면(무기가 없어졌다 등) null — 부르는 쪽이 폴백한다.
World.prototype.choiceFromKindId = function(kind, id){
  var cfg = this.config;
  if (kind === 'weapon' && cfg.weapons[id]){
    var wst = this.weapons[id];
    var lv = wst ? wst.level : 0;
    // rollChoices 가 애초에 걸러내는 것과 같은 조건 — 만렙인데 또 뽑혔거나
    // (레벨이 어긋난 저장), 미보유인데 그새 무기 슬롯이 꽉 찼으면(다른 경로로 채워진
    // 저장) 지금 상태로는 줄 수 없는 카드다.
    if (wst && lv >= cfg.weapons[id].maxLevel) return null;
    if (!wst && this.weaponSlotsUsed() >= cfg.level.slotsWeapon) return null;
    return { kind: 'weapon', id: id, name: cfg.weapons[id].name,
             emoji: cfg.weapons[id].emoji, level: lv + 1,
             desc: this.weaponCardDesc(id, lv + 1) };
  }
  if (kind === 'passive' && cfg.passives[id]){
    var plv = this.passives[id];
    if (plv >= cfg.passives[id].maxLevel) return null;
    if (plv === 0 && this.passiveSlotsUsed() >= cfg.level.slotsPassive) return null;
    return { kind: 'passive', id: id, name: cfg.passives[id].name,
             emoji: cfg.passives[id].emoji, level: plv + 1,
             desc: this.passiveDesc(id) };
  }
  if (kind === 'heal' && typeof id === 'string' && id.indexOf('heal') === 0){
    return { kind: 'heal', id: id, name: '고양이 캔', emoji: '\u{1F41F}', level: 0,
             desc: '체력을 ' + cfg.level.healAmount + ' 회복합니다' };
  }
  return null;
};

// 고른 것을 반영한다.
World.prototype.applyChoice = function(choice){
  if (choice.kind === 'weapon'){
    if (this.weapons[choice.id]){
      this.weapons[choice.id].level++;
    } else {
      this.weapons[choice.id] = { level: 1, cdLeft: 0 };
      this.weaponOrder.push(choice.id);   // 얻은 순서가 곧 발동 순서
    }
  } else if (choice.kind === 'passive'){
    this.passives[choice.id]++;
    if (choice.id === 'tuna'){
      var add = this.config.passives.tuna.maxHpAdd;
      this.player.maxHp += add;
      this.player.hp += add;            // 올린 만큼 바로 채워준다
    }
  } else {
    this.player.hp += this.config.level.healAmount;
    if (this.player.hp > this.player.maxHp) this.player.hp = this.player.maxHp;
  }
  if (this.pendingChoices > 0) this.pendingChoices--;
  this.rolledChoices = null;   // 고른 3택은 소비됐다 — 남은 pendingChoices 는 다음에 새로 뽑는다
};

// 보스 등장·퇴장을 관리한다. 화면 밖 링에서 걸어 들어온다.
World.prototype.bossTick = function(){
  if (this.benchMode) return;
  // 죽은 보스 정리 (damageEnemy 가 풀로 돌려보내면 active 가 false 가 된다)
  if (this.boss && !this.boss.active){
    var deadX = this.boss.x, deadY = this.boss.y;
    this.boss = null;
    this.bossIndex++;
    // 잡은 순간부터 유예 시작 — spawnRate 가 이 시각까지 배수를 끌어올린다
    this.bossEaseUntil = this.elapsed + this.config.spawn.bossEaseSec;
    if (this.bossIndex >= this.config.bosses.length) this.cleared = true;
    else this.dropBossBox(deadX, deadY);   // 마지막 보스는 안 준다 — 판이 끝나므로 먹을 수가 없다
  }
  if (this.boss) return;                          // 이미 싸우는 중
  var list = this.config.bosses;
  if (this.bossIndex >= list.length) return;      // 다 잡았다
  var next = list[this.bossIndex];
  if (this.elapsed / 60 < next.atMin) return;
  // 보스가 들어올 때 화면을 비운다. 쌓여 있던 잡졸을 그대로 두면 보스가 어디
  // 있는지도 안 보이고, 보스전이 "잡졸에 둘러싸인 채 죽는 구간"이 된다.
  var old = this.enemies.items;
  for (var oi = 0; oi < old.length; oi++){
    if (old[oi].active) this.enemies.release(old[oi]);
  }
  var ring = this.spawnRing();
  var ang = this.random() * Math.PI * 2;
  this.boss = this.spawnEnemy(next.typeId,
    this.player.x + Math.cos(ang) * ring,
    this.player.y + Math.sin(ang) * ring);
};

// 지금 시점의 초당 스폰 수. 분 단위 표를 직선 보간한다.
World.prototype.spawnRate = function(){
  var table = this.config.spawn.perMinute;
  var minutes = this.elapsed / 60;
  var rate;
  var i = Math.floor(minutes);
  if (i >= table.length - 1){
    rate = table[table.length - 1];
  } else {
    var f = minutes - i;
    rate = table[i] + (table[i + 1] - table[i]) * f;
  }
  if (this.boss) rate *= this.config.spawn.bossSpawnMult;   // 보스전에는 잡졸을 줄인다
  else if (this.elapsed < this.bossEaseUntil){
    // 보스를 막 잡았다 — 0.25배에서 1배로 직선으로 돌아온다
    var ease = this.config.spawn.bossEaseSec;
    var m = this.config.spawn.bossSpawnMult;
    var t = 1 - (this.bossEaseUntil - this.elapsed) / ease;   // 0 → 1
    rate *= m + (1 - m) * t;
  }
  return rate / 60;
};

/* 시각에 따른 스폰 가중치. rampMin 동안 0 에서 weight 까지 서서히 차오른다.

   왜 필요했나: 예전에는 풀린 종류를 균등하게 뽑았다. 그래서 5분이 되는 순간
   뚱쥐가 곧장 스폰의 3분의 1이 되고 평균 스폰 체력이 13 에서 28.7 로 뛰었다.
   사람 기록 33판에서 보스1 을 잡은 18판이 거의 전부 6~8분에 죽었고,
   봇도 같은 것을 재현했다(계획/18-난이도-조사결과.md).
   9분부터는 예전과 같은 비율이 된다 — 후반을 물렁하게 만드는 것이 아니라
   계단을 오르막으로 바꾸는 것이다. */
World.prototype.spawnWeightAt = function(id, minutes){
  var t = this.config.enemies[id];
  if (!t || t.fromMin === undefined || minutes < t.fromMin) return 0;
  var w = t.weight === undefined ? 1 : t.weight;
  if (!t.rampMin) return w;
  var f = (minutes - t.fromMin) / t.rampMin;
  return f >= 1 ? w : w * f;
};

/* 지금 나올 수 있는 종류 중 하나를 가중치로 고른다.
   늦게 등장하는 종류일수록 처음에는 드물게 나온다.
   (이 주석은 예전에도 그렇게 적혀 있었는데 코드는 균등 추첨이었다.
    의도는 처음부터 있었고 구현만 없었다.)

   난수는 예전과 똑같이 한 번만 뽑는다 — 뽑는 횟수가 달라지면 그 뒤의 모든
   뽑기가 밀려서, 기준선과의 비교가 "구성을 바꾼 효과" 가 아니게 된다. */
World.prototype.pickSpawnType = function(){
  var order = this.config.spawn.order;
  var minutes = this.elapsed / 60;
  var total = 0, i;
  for (i = 0; i < order.length; i++) total += this.spawnWeightAt(order[i], minutes);
  // total<=0 이라도 난수를 한 번 소비한다 — 어느 경로로 빠지든 이 함수가 쓰는
  // 난수 호출 횟수가 같아야 봇 재현성이 지켜진다. 지금은 생쥐 가중치가 항상 1이라
  // 이 분기에 실제로 들어오지 않지만, 나중에 weight:0 이나 fromMin>0 인 종류가
  // 생겨도 조용히 깨지지 않도록 미리 맞춰 둔다.
  if (total <= 0) { this.random(); return order[0]; }        // 아직 아무것도 안 풀린 시각
  var r = this.random() * total;
  for (i = 0; i < order.length; i++){
    r -= this.spawnWeightAt(order[i], minutes);
    if (r < 0) return order[i];
  }
  return order[order.length - 1];          // 부동소수 오차로 끝까지 흘러온 경우
};

// 적이 나타나는(그리고 회수되어 되돌아가는) 화면 밖 링의 반지름.
World.prototype.spawnRing = function(){
  return Math.sqrt(this.viewHalfW * this.viewHalfW +
                   this.viewHalfH * this.viewHalfH) + this.config.spawn.marginPx;
};
// 너무 멀어진 적을 화면 밖 링의 다른 자리로 옮긴다.
// (죽이지 않는다 — 죽이면 젬이 떨어지고 처치 수가 오른다. 옮기는 것뿐이다.)
// 접촉 쿨타임(contactCd)은 건드리지 않는다. 초기화하면 방금 때린 적이 순간이동해 곧바로 또 때린다.
World.prototype.recycleFarEnemies = function(){
  var cfg = this.config.spawn;
  var ring = this.spawnRing();
  // 회수 거리는 스폰 링보다 반드시 넉넉히 멀어야 한다. 큰 화면에서는 링이 CONFIG 값을
  // 넘어서, 갓 스폰된 적이 곧바로 회수 대상이 되는 무한 왕복이 생긴다.
  var far = cfg.recycleDist;
  var minFar = ring * cfg.recycleRingMult;
  if (far < minFar) far = minFar;
  var far2 = far * far;
  var bossFar = far * cfg.bossRecycleMult;
  var bossFar2 = bossFar * bossFar;
  var items = this.enemies.items;
  for (var i = 0; i < items.length; i++){
    var e = items[i];
    if (!e.active) continue;
    var dx = e.x - this.player.x, dy = e.y - this.player.y;
    var limit2 = (e === this.boss) ? bossFar2 : far2;
    if (dx * dx + dy * dy < limit2) continue;
    // 스스로 못 움직이는 적(두더지)은 옮겨봐야 그 자리에 굳는다. 화면 밖을 맴돌며
    // 동시 상한만 차지하므로 조용히 걷어낸다(젬·처치 수는 주지 않는다).
    if (e.speed === 0){ this.enemies.release(e); continue; }
    var ang = this.random() * Math.PI * 2;
    e.x = this.player.x + Math.cos(ang) * ring;
    e.y = this.player.y + Math.sin(ang) * ring;
  }
};
// 두더지 예고를 띄운다. 예고는 적이 아니므로 어떤 판정에도 걸리지 않는다.
World.prototype.warnTick = function(dt){
  if (this.gameOver || this.benchMode) return;
  var t = this.config.enemies.mole;
  if (this.elapsed / 60 < t.fromMin) return;
  this.warnAcc += dt * t.perSec;
  var guard = 0;
  while (this.warnAcc >= 1 && guard++ < 100){
    this.warnAcc -= 1;
    var wn = this.warns.spawn();
    if (!wn) continue;                     // 예고 풀이 꽉 찼으면 조용히 넘어간다
    var ang = this.random() * Math.PI * 2;
    var dist = t.nearMin + this.random() * (t.nearMax - t.nearMin);
    wn.x = this.player.x + Math.cos(ang) * dist;
    wn.y = this.player.y + Math.sin(ang) * dist;
    wn.left = t.warnSec;
    wn.typeId = 'mole';
  }
};

// 예고 시간이 다 된 자리에서 적을 켠다.
World.prototype.updateWarns = function(dt){
  if (this.benchMode) return;   // 측정 중엔 대기 중이던 예고도 터지지 않는다 (순수 부하만 잰다)
  var items = this.warns.items;
  var max = this.config.spawn.maxAlive;
  for (var i = 0; i < items.length; i++){
    var wn = items[i];
    if (!wn.active) continue;
    wn.left -= dt;
    if (wn.left > 0) continue;
    // 동시 상한은 링 스폰과 똑같이 지킨다. 꽉 찼으면 예고만 조용히 걷는다.
    if (this.enemies.activeCount < max) this.spawnEnemy(wn.typeId, wn.x, wn.y);
    this.warns.release(wn);
  }
};

// ☢️ 핵폭탄 아이템을 플레이어 주변에 떨어뜨린다. 무기가 아니라 맵 아이템이므로
// 쿨타임이 아니라 "떨어져 있나"로 존재한다 — 안 밟고 놔두면 아껴두는 것이 된다.
World.prototype.nukeTick = function(dt){
  // 성능 측정 중에 아이템이 떨어지면 측정이 오염된다(이 프로젝트에서 네 번 사고 났다).
  if (this.benchMode) return;
  if (this.gameOver || this.cleared) return;
  var cfg = this.config.nukeItem;
  this.nukeAcc += dt;
  var guard = 0;
  // 부동소수 오차로 딱 경계에서 근소하게 못 미칠 수 있어 아주 작은 여유를 둔다.
  while (this.nukeAcc >= cfg.everySec - 1e-9 && guard++ < 100){
    this.nukeAcc -= cfg.everySec;
    if (this.nukes.activeCount >= cfg.maxAlive) continue;   // 꽉 찼으면 이번 몫은 흘려보낸다
    var it = this.nukes.spawn();
    if (!it) continue;
    var ang = this.random() * Math.PI * 2;
    var dist = cfg.nearMin + this.random() * (cfg.nearMax - cfg.nearMin);
    it.x = this.player.x + Math.cos(ang) * dist;
    it.y = this.player.y + Math.sin(ang) * dist;
  }
};

// ☢️ 핵폭탄 아이템을 밟았는지 검사한다. 밟으면 즉시 blastAt 으로 터뜨리고 회수한다.
World.prototype.updateNukes = function(dt){
  if (this.benchMode) return;
  var cfg = this.config.nukeItem;
  var p = this.player;
  var eat = cfg.pickupRadius + this.config.player.radius;
  var items = this.nukes.items;
  for (var i = 0; i < items.length; i++){
    var it = items[i];
    if (!it.active) continue;
    var dx = p.x - it.x, dy = p.y - it.y;
    if (dx * dx + dy * dy > eat * eat) continue;   // 안 밟았으면 그대로 둔다(아껴두기)
    this.blastAt(it.x, it.y, cfg.radius, cfg.damage, cfg.showSec, 'nuke');
    this.nukes.release(it);
    this.nukesTaken++;
  }
};

/* 보스를 잡은 자리에 상자를 떨어뜨린다. 난수를 안 쓴다 —
   여기서 한 번이라도 쓰면 이후 모든 스폰·드롭이 밀려 기준선 비교가 깨진다. */
World.prototype.dropBossBox = function(x, y){
  if (this.benchMode) return;
  var it = this.boxes.spawn();
  if (!it) return;
  it.x = x; it.y = y;
};

/* 지금 진화할 수 있는 무기들. 5성이면서 아직 안 진화한 것.
   weaponOrder 는 "얻은 순서" 고 보유한 무기만 들어 있어 그대로 쓴다 —
   for...in 으로 훑으면 엔진마다 순서가 달라 봇 재현성이 깨진다. */
World.prototype.evolveCandidates = function(){
  var out = [];
  for (var i = 0; i < this.weaponOrder.length; i++){
    var id = this.weaponOrder[i];
    if (!this.config.evolutions[id]) continue;
    if (this.evolved[id] === true) continue;
    if (this.weapons[id].level < this.config.weapons[id].maxLevel) continue;
    out.push(id);
  }
  return out;
};

/* 상자를 밟았는지 검사한다. 밟으면 5성 무기가 있는지 보고 갈린다. */
World.prototype.updateBoxes = function(dt){
  if (this.benchMode) return;
  if (this.pendingEvolve > 0) return;      // 이미 고르는 중이면 또 먹지 않는다
  var cfg = this.config.bossBox;
  var p = this.player;
  var eat = cfg.pickupRadius + this.config.player.radius;
  var items = this.boxes.items;
  for (var i = 0; i < items.length; i++){
    var it = items[i];
    if (!it.active) continue;
    var dx = p.x - it.x, dy = p.y - it.y;
    if (dx * dx + dy * dy > eat * eat) continue;
    this.boxes.release(it);
    this.boxesTaken++;
    if (this.evolveCandidates().length > 0){
      this.pendingEvolve = 1;              // 셸이 카드를 띄운다
    } else {
      // 5성이 없다 — 헛탕을 만들지 않는다
      p.hp += p.maxHp * cfg.healPct;
      if (p.hp > p.maxHp) p.hp = p.maxHp;
      this.coins += cfg.coins;
    }
    return;                                // 한 프레임에 하나만 먹는다
  }
};

World.prototype.applyEvolve = function(id){
  this.evolve(id);
  this.pendingEvolve = 0;
};

/* 진화를 안 하고 카드만 닫는다. 셸의 방어용 — 후보가 하나도 없는데 카드가 떴을 때
   판을 살리려고 부른다(도달하면 안 되는 경로다).
   셸이 world.pendingEvolve 를 직접 0 으로 쓰면 안 되기 때문에 여기 둔다 —
   이 저장소는 "셸은 core 를 읽고 메서드만 부른다" 를 지켜 왔고, 그 경계가 한 줄씩
   무너지면 나중에 어디까지가 core 의 규칙인지 아무도 못 가린다. */
World.prototype.cancelEvolve = function(){
  this.pendingEvolve = 0;
};

// 화면 밖 링에서 적을 생성한다. 초당 수는 spawnRate 곡선이 정한다.
World.prototype.spawnTick = function(dt){
  if (this.gameOver || this.benchMode) return;
  var cfg = this.config.spawn;
  this.spawnAcc += dt * this.spawnRate();
  var ring = this.spawnRing();
  var guard = 0;
  while (this.spawnAcc >= 1 && guard++ < 1000){
    this.spawnAcc -= 1;
    if (this.enemies.activeCount >= cfg.maxAlive) continue;
    var ang = this.random() * Math.PI * 2;
    this.spawnEnemy(this.pickSpawnType(),
      this.player.x + Math.cos(ang) * ring,
      this.player.y + Math.sin(ang) * ring);
  }
};
// 한 스텝 진행 — 실제 게임과 봇 시뮬이 반드시 이 함수 하나를 공유한다.
// 2단계에서 늘어나는 단계(적 이동·무기 발사·충돌·드롭 등)도 전부 여기에 넣는다.
World.prototype.update = function(dt){
  if (this.gameOver || this.cleared) return;
  this.elapsed += dt;
  this.step(dt);
  this.moveEnemies(dt);
  this.rebuildGrid();
  this.fireWeapons(dt);
  this.updateProjectiles(dt);
  this.updateCompanions(dt);
  this.updateFields(dt);
  this.resolveContacts(dt);
  this.updateGems(dt);
  this.recycleFarEnemies();
  this.bossTick();
  this.spawnTick(dt);
  this.warnTick(dt);
  this.updateWarns(dt);
  this.nukeTick(dt);
  this.updateNukes(dt);
  this.updateBoxes(dt);
};

// (격자가 화면보다 좁으면 화면 가장자리의 적이 충돌 후보에서 조용히 빠진다)
World.prototype.ensureGridCovers = function(viewW, viewH){
  this.viewHalfW = viewW / 2;
  this.viewHalfH = viewH / 2;
  var cs = this.config.grid.cellSize;
  var cols = Math.ceil(viewW / cs) + 4;   // 좌우 2칸씩 여유
  var rows = Math.ceil(viewH / cs) + 4;
  if (cols < this.config.grid.cols) cols = this.config.grid.cols;
  if (rows < this.config.grid.rows) rows = this.config.grid.rows;
  if (cols === this.grid.cols && rows === this.grid.rows) return false;
  this.grid = new Grid(cs, cols, rows);
  return true;
};

<script id="shell">
(function(){
