<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>냥서바이버</title>
<meta property="og:title" content="냥서바이버">
<meta property="og:description" content="고양이 한 마리가 15분 동안 쥐떼를 버텨내는 게임">
<meta property="og:type" content="website">
<meta name="description" content="고양이 한 마리가 15분 동안 쥐떼를 버텨내는 게임">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b2416}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#game{display:block;width:100%;height:100%}
#stick{
  position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px;
  border-radius:50%; border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06); pointer-events:none;
  display:none; z-index:10;
}
#stickKnob{
  position:absolute; left:50%; top:50%; width:52px; height:52px;
  margin:-26px 0 0 -26px; border-radius:50%;
  background:rgba(255,255,255,.35);
}
#overlay{
  position:fixed; inset:0; z-index:20; display:none;
  background:rgba(10,14,8,.82); backdrop-filter:blur(2px);
  /* 내용이 화면보다 길면 justify-content:center 는 위로 넘친 부분을 스크롤로
     도달할 수 없게 만든다(scrollTop 이 0 아래로 안 감). flex-start 면
     길 땐 위부터 스크롤된다. */
  align-items:center; justify-content:flex-start; flex-direction:column; gap:14px;
  padding:36px 20px; color:#f7efd8; font-family:system-ui,sans-serif;
  overflow-y:auto;
}
#overlay.on{display:flex}
/* 제목·잔액·닫기는 위에 붙박이로 둔다. 상점은 카드가 10장 넘게 늘어나서,
   닫기가 맨 아래에 있으면 폰에서 한참 내려야 나갈 수 있었다. 붙박이로 두면
   화면을 돌렸을 때 제목이 위로 밀려 사라지던 문제도 같이 없어진다.
   top 을 음수로 주는 것은 #overlay 의 위쪽 안쪽여백(36px)만큼 끌어올려
   스크롤한 카드가 제목 위로 비쳐 보이지 않게 하기 위함이다.
   32단계: 머리 안의 위 여백만 36 → 58px. 소리·멈춤 버튼(위에서 10~54px) 아래에서 제목이 시작한다.
   top·margin 의 −36 은 #overlay 의 안쪽여백과 맞물린 값이라 그대로 둔다(머리 상자는 여전히 화면 맨 위에 붙는다). */
#overlayHead{
  position:sticky; top:-36px; z-index:2;
  width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:58px 0 12px; margin:-36px 0 0;
  background:rgba(10,14,8,.96);
  /* 13단계에서 결과 화면에 무기별 기여도 줄이 늘면서, 붙박이 머리 자체가
     작은 폰 가로모드(세로 320px 안팎)에서는 화면보다 커지는 경우가 생겼다.
     sticky 는 자기 키가 뷰포트보다 크면 다시 하기/상점 버튼을 영원히 가린다 —
     그래서 머리 자신에게 상한을 주고 안에서 스크롤하게 한다. */
  max-height:55vh; overflow-y:auto;
  /* flex-shrink:0 필수 — #overlay(부모)는 고정 높이(inset:0) flex column인데,
     overflow-y:auto가 붙은 자식은 CSS 스펙상 자동 최소 크기가 0이 되어 형제보다
     먼저(사실상 전부) 짜부러든다. 상점 카드가 5장 넘어 #overlay 전체가 넘치면
     이 머리(제목·코인 잔액)만 패딩만 남기고 짜부러들어 코인 표시가 안 보였다
     (2026-08-05 사용자 피드백: "폰에서 상점 들어가면 위에 바가 깨져서 코인이
     안 보임"). flex-shrink:0으로 이 박스는 항상 제 내용 높이(최대 55vh)를
     유지하고, 넘치는 건 #overlay 자체 스크롤(overflow-y:auto)이 그대로 받는다. */
  flex-shrink:0;
}
/* 닫기는 왼쪽 위 구석. 붙박이 머리 안에 있으므로 같이 따라다닌다.
   32단계: 제목이 22px 내려간 만큼 같이 내린다(30 → 52px, 제목보다 6px 위 — 예전과 같은 간격). */
#headClose{
  position:absolute; left:0; top:52px; display:none;
  padding:8px 16px; font-size:14px; font-weight:800; cursor:pointer;
  background:#7a8f5c; color:#12180d; border:none; border-radius:10px;
}
#overlayTitle{font-size:clamp(20px,6vmin,32px); font-weight:800; letter-spacing:.05em}
#cards{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%; max-width:640px}
.card{
  flex:1 1 170px; max-width:200px; cursor:pointer;
  background:linear-gradient(170deg,#3a4a2c,#26331d);
  border:2px solid #7a8f5c; border-radius:14px; padding:16px 12px; text-align:center;
  color:inherit; font:inherit; appearance:none; -webkit-appearance:none;
}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:3px solid #f7efd8; outline-offset:3px}
.card .ico{font-size:38px; line-height:1.2}
.card .nm{font-weight:800; margin-top:6px}
.card .lv{font-size:12px; opacity:.75; margin-top:2px}
.card .ds{font-size:13px; opacity:.9; margin-top:8px; line-height:1.4}
.card.off{ opacity:.45; cursor:default }
/* 한 줄 카드(30단계) — 스테이지 고르는 화면 전용. 스테이지가 다섯이 되어 카드가 여섯 장인데, 보통 카드로는
   폰(375×812)에서 스테이지 5와 "뒤로" 가 화면 아래로 밀렸다. 아이콘을 왼쪽에 두고 낮게 쌓아 한 화면에 다 넣는다. */
.card.row{ flex:1 1 100%; max-width:340px; display:grid; grid-template-columns:44px 1fr; column-gap:10px;
           align-items:center; text-align:left; padding:10px 14px }
.card.row .ico{ grid-row:1 / span 2; font-size:28px; line-height:1; text-align:center }
.card.row .nm{ margin-top:0 }
.card.row .ds{ margin-top:2px }
/* 장착 중인 카드 — 못 사는 카드와 같은 흐림 처리를 쓰면 "지금 쓰는 것"인지
   "못 사는 것"인지 라벨을 읽기 전엔 구분이 안 된다. 불투명하게 두고
   기존 강조색(포커스 아웃라인과 동일)으로 테두리만 준다. */
.card.sel{ opacity:1; cursor:default; border-color:#f7efd8; box-shadow:0 0 0 2px #f7efd8 inset }
/* 진화 카드 — 최대 4장이다(무기 슬롯이 4개라 그 이상은 못 나온다).
   3택 카드 폭(170px)을 그대로 쓰면 375px 폰에서 한 줄에 한 장씩 네 줄이 되어
   스크롤해야 다 볼 수 있다 — 고르는 화면에서 안 보이는 선택지는 없는 선택지다.
   폭을 줄여 한 줄에 두 장씩, 두 줄로 끝나게 한다. */
/* 기준폭 130px 은 가장 좁은 폰(320px)에서 두 장이 한 줄에 들어가는 한계다:
   화면 320 − 오버레이 좌우 여백 40 = 280, 130 + 130 + 칸 사이 12 = 272. */
.card.evo{ flex:1 1 130px; max-width:190px; padding:12px 8px }
.card.evo .nm{ font-size:15px; word-break:keep-all }
.card.evo .lv{ font-size:12px; opacity:.7 }
.card.evo .ds{ font-size:12px; margin-top:6px; word-break:keep-all }
/* 진화형 그림. 16×16 도트라 확대할 때 흐려지면 안 된다(캔버스의 imageSmoothing 과 같은 뜻). */
.evoIco{ width:44px; height:44px; display:block; margin:0 auto;
         image-rendering:pixelated; image-rendering:crisp-edges }
/* 21단계: 기본형 무기 그림을 카드에 끼운다. 크기를 이모지(38px)에 맞췄다 —
   더 키우면 카드 높이가 늘어 3택이 폰 한 화면에 안 들어간다. */
.wpnIco{ width:38px; height:38px; display:block; margin:0 auto;
         image-rendering:pixelated; image-rendering:crisp-edges }
/* 도감 절 제목에 붙는 작은 아이콘. 글자 옆에 서야 해서 inline 이다.
   ⚠️ height 를 고정하면 안 된다. 무기 그림은 16×16 정사각이라 티가 안 나지만,
      적 그림은 종류마다 가로세로가 달라서(도감 적 탭 7종) 전부 정사각으로 눌린다. */
.wpnIcoSm{ width:20px; height:auto; vertical-align:-4px; margin-right:4px;
           image-rendering:pixelated; image-rendering:crisp-edges }
/* 일시정지 버튼 — 폰 엄지로 닿아야 하므로 최소 44px */
#pauseBtn{
  position: fixed; top: 10px; right: 10px; z-index: 5;
  width: 44px; height: 44px; border: 0; border-radius: 10px;
  background: rgba(0,0,0,0.45); color: #f7efd8;
  font-size: 20px; line-height: 44px; text-align: center;
  cursor: pointer; padding: 0;
}
#pauseBtn:active{ background: rgba(0,0,0,0.7); }
/* 음소거 — pauseBtn 왼쪽에 나란히. 오버레이(z-index:20)보다 위에 둬야 이름 화면·
   레벨업·게임오버·클리어처럼 오버레이가 뜬 채로 소리가 나는 순간에도 끌 수 있다.
   왼쪽 위에 두면 상점의 "닫기"(#headClose)와 자리가 겹친다 — 그래서 오른쪽에 둔다. */
#muteBtn{
  position: fixed; top: 10px; right: 64px; z-index: 30;
  width: 44px; height: 44px; border: 0; border-radius: 10px;
  background: rgba(0,0,0,0.45); color: #f7efd8;
  font-size: 20px; line-height: 44px; text-align: center;
  cursor: pointer; padding: 0;
}
#muteBtn:active{ background: rgba(0,0,0,0.7); }
/* 다시 뽑기 — 레벨업 카드 아래에만 나온다. 폰 엄지로 닿아야 하므로 세로 44px 이상 */
#rerollBtn{
  display:none; min-height:44px; padding:12px 22px;
  font-size:15px; font-weight:800; cursor:pointer;
  background:#5a4a6a; color:#f0e8f8; border:none; border-radius:12px;
}
#rerollBtn:active{ transform:scale(.97) }
#overlayBtn, #shopBtn{
  padding:14px 28px; font-size:17px; font-weight:800; cursor:pointer;
  background:#7a8f5c; color:#12180d; border:none; border-radius:12px;
}
#shopBtn{ background:#3b4a5a; color:#e8eef4; margin-top:8px }
#overlayStat{font-size:15px; opacity:.9; text-align:center; line-height:1.7}
.shopSection{ flex:0 0 100%; text-align:center; opacity:.7; font-size:14px;
              margin:10px 0 2px; }
/* 도감 — 탭 셋이 한 줄에 들어가야 한다(폰 375px 에서 카드 기본폭 170px 로는 줄바꿈된다) */
.codexTab{ flex:1 1 0; min-width:0; padding:12px 4px; font-size:14px }
/* 탭 줄 바로 뒤에서 줄을 끊는다. 없으면 뽑기 탭처럼 첫 카드가 좁을 때 그 카드가 탭과 같은 줄에
   끼어들어 탭 네 개가 세로로 찌그러진다(26단계 화면 확인에서 발견). 높이 0 이라 보이지 않고,
   #cards 의 줄 간격(12px)이 한 번 더 들어가는 것만 음수 여백으로 되돌린다. */
.rowBreak{ flex:0 0 100%; height:0; margin-top:-12px }
/* 도감 표 한 줄 — 왼쪽 이름, 오른쪽 값 */
.codexRow{ flex:0 0 100%; display:flex; justify-content:space-between; gap:12px;
           padding:8px 12px; font-size:14px; line-height:1.5 }
/* keep-all 이 없으면 한글이 어절 중간에서 끊긴다("끌 / 어당김"). 진화 줄이 길어지면서
   드러났다 — .codexNote 가 같은 이유로 이미 쓰고 있던 규칙이다. */
.codexRow > span:last-child{ text-align:right; opacity:.85; word-break:keep-all }
/* 왼쪽이 "이름표" 인 줄에만 붙인다. 오른쪽이 두 줄이 되면 왼쪽도 같이 접혀서
   "5성 진 / 화" 가 됐다 — 위 .codexNote 주석과 같은 계열의 함정이다.
   무기 설명처럼 왼쪽이 문장인 줄에는 안 붙인다(붙이면 가로로 넘친다). */
.codexKey{ white-space:nowrap }
/* 도감 안내 문구 — 좌우로 나누지 않고 폭 전체를 쓴다. 좌우 분할(.codexRow)로 두면
   375px 폰에서 1px 모자라 두 조각이 동시에 접히며 한글이 어절 중간에서 끊긴다. */
.codexNote{ flex:0 0 100%; padding:8px 12px; font-size:13px; line-height:1.6;
            word-break:keep-all; opacity:.95 }
/* 23단계 도전과제 목록 — 잠긴 줄. .card.off 와 같은 값(opacity .45)을 써서
   "잠겨 있다" 는 표시가 이 게임 안에서 늘 같은 느낌이게 한다. */
.codexRow.off{ opacity:.45 }
/* 26단계 상점 — 강화 탭은 줄기 한 장마다 한 줄을 다 쓰고, 그 밑의 가지는 들여쓰고 왼쪽 선을 둘러
   "딸린 것" 임을 보이게 한다. 한 줄씩이라 폰에서도 순서가 안 섞인다. 높이는 그대로 44px 이상. */
.card.trunk{ flex:0 0 100%; max-width:none }
/* 묶음 상자(31단계 뒤 사용자 말: "뭐가 뭐의 줄기인지 모르겠다"). 예전에는 가지 카드를 조금 들여쓰기만 해서
   줄기 카드와 거의 같아 보였고, 스크롤로 줄기가 화면 밖에 나가면 누구의 가지인지 알 수 없었다.
   이제 줄기 한 장과 그 가지들이 **한 상자**로 붙는다: 줄기는 상자의 머리(위만 둥글다), 가지는 그 아래에
   틈 없이 이어 붙고(#cards 의 줄 간격 12px 를 음수 여백으로 되돌린다) 왼쪽 세로선에 매달린 줄로 보인다.
   마지막 가지(.last)가 상자의 바닥(아래만 둥글다)이고 세로선도 거기서 끝난다.
   카드는 여전히 #cards 의 형제 버튼들이다 — 감싸는 요소를 두지 않아 화면 시험이 세는 카드 수가 그대로다. */
.card.trunk.grp{ border-radius:14px 14px 0 0; margin-top:6px }
.card.branch{ flex:0 0 100%; max-width:none; margin:-12px 0 0 0; min-height:44px; position:relative;
              border-top-width:0; border-radius:0; padding:10px 12px 10px 48px; text-align:left;
              background:#1b2415 }
.card.branch.last{ border-radius:0 0 14px 14px }
.card.branch::before{ content:''; position:absolute; left:22px; top:0; bottom:0; width:2px; background:#7a8f5c }
.card.branch.last::before{ bottom:50% }
.card.branch::after{ content:''; position:absolute; left:22px; top:50%; width:16px; height:2px; background:#7a8f5c }
/* 상자 안에서는 못 사는 카드를 통째로 흐리게 하지 않는다 — 테두리와 세로선까지 흐려지면 상자가 끊겨 보인다.
   글자만 흐리게 한다(최대 단계인 줄기 머리는 읽혀야 하므로 덜 흐리게). */
.card.trunk.grp.off{ opacity:1 }
.card.trunk.grp.off > div{ opacity:.72 }
.card.branch.off{ opacity:1 }
.card.branch.off > div{ opacity:.5 }
/* 장비 탭 — 부위 세 칸은 한 줄, 장비 카드는 진화 카드처럼 한 줄에 두 장(320px 폰 계산은 .card.evo 주석). */
.card.slot{ flex:1 1 0; min-width:0; padding:10px 4px; cursor:default }
.card.slot .ico{ font-size:28px }
/* 장비 카드 — 가로형 한 줄(왼쪽에 도트 그림, 오른쪽에 이름 · 단계 · 효과). 31단계에서 강화 카드가 생기며
   세로형 카드가 한 줄에 한 장씩 좁게 놓였고(그 아래 강화 카드만 넓었다) 12종이면 화면 네 개 분량이었다.
   가로형으로 눕혀 길이를 줄이고, 강화 카드와 **한 상자**로 묶는다(강화 탭의 묶음 상자와 같은 규칙):
   장비 카드가 상자의 머리(.grp — 위만 둥글다), 강화 카드가 틈 없이 붙은 바닥(아래만 둥글다)이다.
   카드는 여전히 #cards 의 형제 버튼들이다 — 위를 누르면 입기/벗기, 아래를 누르면 강화. */
.card.gear{ flex:0 0 100%; max-width:none; padding:10px 12px; text-align:left;
            display:grid; grid-template-columns:82px 1fr; column-gap:10px; align-items:center }
.card.gear .ico{ grid-row:1 / span 3; line-height:1; text-align:center }
.card.gear .nm{ margin-top:0 }
.card.gear .ds{ font-size:12px; word-break:keep-all; margin-top:4px }
.card.gear.grp{ border-radius:14px 14px 0 0 }
.card.worn{ box-shadow:0 0 0 2px #f7efd8 inset }
/* 강화 카드 — 장비 카드 바로 뒤에 붙는 상자의 바닥. 테두리는 그 장비의 등급 색(g-등급)을 이어받는다. */
.card.upg{ flex:0 0 100%; max-width:none; margin:-12px 0 0 0; min-height:44px;
           border-top-width:0; border-radius:0 0 14px 14px; padding:10px 12px; text-align:left;
           background:#1b2415 }
.card.upg .nm{ font-size:14px }
.card.upg .ds{ font-size:12px; word-break:keep-all; margin-top:4px }

/* 패시브를 적을 때 쓰는 고정 순서. CONFIG.passives 를 for...in 으로 돌면
   엔진마다 순서가 달라져 같은 판이 다른 문자열로 기록된다. */

/* 무기를 훑을 때 쓰는 고정 순서. CONFIG.weapons 를 for...in 으로 돌면 엔진마다
   순서가 달라져 같은 저장 데이터가 다른 화면·다른 결과를 낸다.
   맨 앞은 반드시 'claw' — 무료 기본 무기이고, 모든 되돌림의 착지점이다. */
var WEAPON_IDS = ['claw', 'yarn', 'bone', 'laser', 'catnip', 'milk',
                  'tail', 'tornado', 'zap', 'friend'];

/* 패시브를 화면에 늘어놓는 고정 순서. 도감이 쓴다 — for-in 은 엔진마다 순서가 달라
   같은 저장이 다른 화면을 낸다(WEAPON_IDS 와 같은 이유). */
var PASSIVE_IDS = ['claws', 'tuna', 'bell', 'whisker', 'nap', 'clover'];

/* 딜량 측정용 칸 이름 (계획/13-딜량측정-명세.md). 무기 10종 + 핵폭탄(무기는 아니지만
   화면을 쓸어버리므로 빠지면 합계가 안 맞는다) + ?(이름 없이 들어온 호출을 담는 칸).
   WEAPON_IDS 에서 만들어 쓴다 — 손으로 다시 적으면 무기가 늘 때 한쪽만 고쳐
   새 무기 딜량이 조용히 ? 로 샌다. */
var DAMAGE_IDS = WEAPON_IDS.concat(['nuke', '?']);

/* source 가 아는 이름인지 보는 표. '?' 는 일부러 뺀다 — 모르는 이름이 오는 것
   자체가 ? 로 가는 신호라서, ? 를 아는 이름으로 쳐 버리면 방어가 무너진다. */
var DAMAGE_INDEX = (function(){
  var out = Object.create(null);
  for (var i = 0; i < WEAPON_IDS.length; i++) out[WEAPON_IDS[i]] = true;
  out.nuke = true;
  return out;
})();

/* 12칸을 전부 0으로 채운 새 그릇을 만든다. 생성자와 reset() 이 함께 쓴다 —
   따로 두면 하나만 고칠 위험이 있다. */
function freshDamageTally(){
  var out = Object.create(null);
  for (var i = 0; i < DAMAGE_IDS.length; i++) out[DAMAGE_IDS[i]] = 0;
  return out;
}

/* 저장에서 읽은 해금 정보를 믿을 수 있는 모양으로 만든다.
   손으로 고친 저장 데이터가 "게임이 시작조차 안 되는" 상태를 만들면 안 된다.
   localStorage 를 안 만지는 순수 함수라 core 에 두고 테스트로 고정한다. */
function normalizeStarterSave(raw){
  var out = { unlocked: ['claw'], starter: 'claw' };
  var i, id;
  if (raw && Array.isArray(raw.unlocked)){
    for (i = 0; i < raw.unlocked.length; i++){
      id = raw.unlocked[i];
      if (typeof id !== 'string') continue;
      if (WEAPON_IDS.indexOf(id) < 0) continue;      // 아는 무기 10종에만 있는 이름만 통과
      if (out.unlocked.indexOf(id) >= 0) continue;   // 중복 제거 (claw 포함)
      out.unlocked.push(id);
    }
  }
  if (raw && typeof raw.starter === 'string' &&
      out.unlocked.indexOf(raw.starter) >= 0) out.starter = raw.starter;
  return out;
}

/* 아는 스테이지 번호. CONFIG.stageOrder 를 그대로 쓴다 — 손으로 다시 적으면 스테이지가
   늘 때 한쪽만 고친다. */
var STAGE_IDS = CONFIG.stageOrder;

/* 저장에서 읽은 "마지막에 고른 스테이지" 를 믿을 수 있는 번호로 만든다(25단계).
   스테이지 2는 스테이지 1 클리어가 1회 이상일 때만 고를 수 있다 — 손으로 고친 저장이
   잠긴 스테이지를 열면 안 된다. 그 밖의 값(문자열 "2", 99, 없음)은 전부 1.
   normalizeStarterSave 와 같은 이유로 core 에 둔다: shell 의 Save 는 Node 에서 못 돌린다.
   28단계: 스테이지 3은 스테이지 1·2를 각각 한 번 이상 깼을 때만(셋째 인자). 인자 둘로 부르면
   셋째가 없으니 3은 늘 1이 되고, 2·1 동작은 예전 그대로다.
   30단계: 스테이지 N 은 1…N−1 을 전부 한 번 이상 깼을 때만. 둘째 인자부터 차례로 스테이지 1, 2, 3, 4…의
   클리어 수다. 배열 하나로도 받는다(normalizeStagePick(4, [1, 1, 1])) — 셸이 stageOrder 를 훑어 만든 배열.
   인자가 모자라면 그 스테이지는 잠긴 것이다. 번호를 손으로 나열하지 않으므로 스테이지가 늘어도 그대로다. */
function normalizeStagePick(rawStage){
  if (typeof rawStage !== 'number' || STAGE_IDS.indexOf(rawStage) < 0) return 1;
  var list = arguments, off = 1;
  if (Array.isArray(arguments[1])){ list = arguments[1]; off = 0; }
  var pos = STAGE_IDS.indexOf(rawStage);
  for (var i = 0; i < pos; i++){
    var c = list[off + i];
    if (typeof c !== 'number' || !(c >= 1)) return 1;
  }
  return rawStage;
}

/* ── 26단계: 스킬 트리 · 장비 · 뽑기 ─────────────────────────────────
   전부 판 밖(상점·저장·뽑기)에서 한 번씩 불리는 순수 함수라 객체를 만들어도 된다.
   localStorage 를 모르므로 core 에 두고 Node 에서 테스트한다(normalizeStarterSave 와 같은 이유). */

var GEAR_IDS = CONFIG.gear.order;

/* 아무것도 없는 트리·장비·뽑기. 모든 가지 키와 세 부위 키가 늘 들어 있는 "완전한 모양" 이라
   부르는 쪽(셸·World)이 칸이 있는지 따로 확인하지 않아도 된다. */
function emptyLoadout(){
  var tree = {}, equipped = {}, i;
  for (i = 0; i < TREE_IDS.length; i++) tree[TREE_IDS[i]] = 0;
  for (i = 0; i < CONFIG.gear.slots.length; i++) equipped[CONFIG.gear.slots[i]] = null;
  // 31단계 copies: 장비마다 모은 조각 수 { id: n }. 0 이면 칸을 안 둔다(읽는 쪽은 없으면 0 으로 본다).
  return { tree: tree, gear: { owned: {}, equipped: equipped, copies: {} }, gacha: { pulls: 0, pity: 0 } };
}

/* 저장에서 읽은 트리·장비·뽑기 칸을 믿을 수 있는 모양으로 만든다(명세 2절 ①).
   raw 는 영구 저장 객체 통째(o.tree · o.gear · o.gacha 를 읽는다), metaLevels 는 이미 걸러 낸 줄기 단계.
   - 가지: 숫자가 아니면 0, 0~최대로 자른다. 줄기가 열리는 단계에 못 미치면 0 —
     손으로 고친 저장이 잠긴 가지를 열면 안 된다.
   - 가진 장비: 아는 이름만, 단계 1~최대(31단계부터 10). 숫자가 아니면 "안 가짐".
   - 입은 장비: 가진 것이고 그 부위의 것일 때만. 아니면 null.
   - 천장 카운터 0 ~ pity−1, 뽑은 횟수 0 이상의 정수.
   칸이 아예 없는 옛 저장은 전부 빈 값이 된다(강화 단계·코인은 셸이 따로 읽으므로 그대로 남는다). */
function normalizeLoadoutSave(raw, metaLevels){
  var out = emptyLoadout();
  var ml = metaLevels || {};
  var i, id, v;
  var rt = raw && raw.tree && typeof raw.tree === 'object' ? raw.tree : null;
  for (i = 0; i < TREE_IDS.length; i++){
    id = TREE_IDS[i];
    var b = CONFIG.tree[id];
    v = rt ? rt[id] : 0;
    if (typeof v !== 'number' || !isFinite(v)) v = 0;
    v = Math.floor(v);
    if (v < 0) v = 0;
    if (v > b.maxStep) v = b.maxStep;
    var trunkStep = ml[b.trunk];
    if (typeof trunkStep !== 'number' || !(trunkStep >= b.needStep)) v = 0;
    out.tree[id] = v;
  }
  var rg = raw && raw.gear && typeof raw.gear === 'object' ? raw.gear : null;
  var ro = rg && rg.owned && typeof rg.owned === 'object' ? rg.owned : null;
  if (ro){
    for (i = 0; i < GEAR_IDS.length; i++){
      id = GEAR_IDS[i];
      v = ro[id];
      if (typeof v !== 'number' || !isFinite(v) || v < 1) continue;   // 안 가짐
      v = Math.floor(v);
      if (v > CONFIG.gear.maxLevel) v = CONFIG.gear.maxLevel;
      out.gear.owned[id] = v;
    }
  }
  var re = rg && rg.equipped && typeof rg.equipped === 'object' ? rg.equipped : null;
  if (re){
    for (i = 0; i < CONFIG.gear.slots.length; i++){
      var slot = CONFIG.gear.slots[i];
      id = re[slot];
      if (typeof id !== 'string' || GEAR_IDS.indexOf(id) < 0) continue;
      if (CONFIG.gear.items[id].slot !== slot) continue;
      if (typeof out.gear.owned[id] !== 'number') continue;
      out.gear.equipped[slot] = id;
    }
  }
  // 31단계 조각: 가진 장비이고 최대 단계 미만일 때만, 1 이상의 정수(소수는 내림)로 남긴다.
  // 칸이 없는 옛 저장 · 음수 · 문자열 · 안 가진 장비 · 최대 단계 장비의 조각은 버린다(= 0).
  var rc = rg && rg.copies && typeof rg.copies === 'object' ? rg.copies : null;
  if (rc){
    for (i = 0; i < GEAR_IDS.length; i++){
      id = GEAR_IDS[i];
      v = rc[id];
      if (typeof v !== 'number' || !isFinite(v)) continue;
      v = Math.floor(v);
      if (v < 1) continue;
      if (typeof out.gear.owned[id] !== 'number' || out.gear.owned[id] >= CONFIG.gear.maxLevel) continue;
      out.gear.copies[id] = v;
    }
  }
  var ra = raw && raw.gacha && typeof raw.gacha === 'object' ? raw.gacha : null;
  if (ra){
    out.gacha.pulls = safeInt(ra.pulls, 0, Number.MAX_SAFE_INTEGER || 9007199254740991, 0);
    out.gacha.pity = safeInt(ra.pity, 0, CONFIG.gacha.pity - 1, 0);
  }
  return out;
}

// 가지 하나를 step 단계에서 한 단계 올리는 값. 이미 최대면 null.
function treeCostOf(id, step){
  var b = TREE_IDS.indexOf(id) >= 0 ? CONFIG.tree[id] : null;
  if (!b || typeof step !== 'number' || step >= b.maxStep) return null;
  return b.costs[step < 0 ? 0 : step];
}

// 줄기가 열렸고 아직 최대가 아니면 살 수 있다(코인은 부르는 쪽이 본다 — 잔액은 Save 가 안다).
function treeCanBuy(id, tree, metaLevels){
  if (TREE_IDS.indexOf(id) < 0) return false;
  var b = CONFIG.tree[id];
  var step = tree && typeof tree[id] === 'number' ? tree[id] : 0;
  var trunk = metaLevels && typeof metaLevels[b.trunk] === 'number' ? metaLevels[b.trunk] : 0;
  return trunk >= b.needStep && step < b.maxStep;
}

/* 가지 step 단계의 효과 { label, text }. **공식은 여기 한 벌** — 상점·도감이 같이 쓴다
   (passiveEffectAt 과 같은 이유). step 0 은 "아직 없음" 이라 0 효과가 나온다. 모르는 id 는 null. */
function treeEffectAt(id, step){
  if (TREE_IDS.indexOf(id) < 0) return null;
  var b = CONFIG.tree[id];
  var n = step || 0;
  if (id === 'bossHunter')   return { label: STR.tBoss,   text: '+' + round1(n * b.bossDmgPct) + '%' };
  if (id === 'thickHide')    return { label: STR.tTaken,  text: '−' + round1(n * b.takenPct) + '%' };
  if (id === 'nineLives')    return { label: STR.tRevive, text: (n * b.revives) + STR.tTimes };
  if (id === 'breather')     return { label: STR.tRegen,  text: '+' + round1(n * b.regenPerSec) };
  if (id === 'magnetMaster') return { label: STR.tMagnet,
                                      text: round1(CONFIG.magnetItem.everySec - n * b.magnetSecLess) + STR.sec };
  if (id === 'secondChance') return { label: STR.tReroll, text: '+' + (n * b.rerollAdd) };
  if (id === 'luckyCoin')    return { label: STR.tCoin,   text: '+' + round1(n * b.coinPct) + '%' };
  if (id === 'huntInstinct') return { label: STR.tAtk,    text: '+' + round1(n * b.damagePct) + '%' };
  if (id === 'packHunter')   return { label: STR.tMob,    text: '+' + round1(n * b.mobDmgPct) + '%' };
  return null;
}

// 장비 한 줄 효과 값(단계 lv). 고유 효과는 따로 — 단계가 올라도 그대로다.
function gearStatAt(st, lv){ return st.base + (lv - 1) * st.perLv; }
// 31단계 — 6단계부터 붙는 공격 효과 한 줄(lt = items[id].late[k]). fromLv 아래는 정확히 0.
function gearLateAt(lt, lv){ return lv >= lt.fromLv ? (lv - lt.fromLv + 1) * lt.perLv : 0; }

/* 장비 lv 단계의 효과 줄 [{label, text}]. **공식은 여기 한 벌** — 장비 탭·뽑기 결과·도감이 같이 쓴다.
   모르는 id 는 빈 배열. */
function gearEffectRows(id, lv){
  var out = [];
  if (GEAR_IDS.indexOf(id) < 0) return out;
  var it = CONFIG.gear.items[id];
  var L = lv >= 1 ? lv : 1;
  for (var i = 0; i < it.stats.length; i++){
    var st = it.stats[i], v = round1(gearStatAt(st, L));
    if (st.key === 'xpPct')     out.push({ label: STR.gXp,     text: '+' + v + '%' });
    if (st.key === 'pickupPct') out.push({ label: STR.gPickup, text: '+' + v + '%' });
    if (st.key === 'speedPct')  out.push({ label: STR.gSpeed,  text: '+' + v + '%' });
    if (st.key === 'maxHpAdd')  out.push({ label: STR.gMaxHp,  text: '+' + v });
    if (st.key === 'takenPct')  out.push({ label: STR.gTaken,  text: '−' + v + '%' });
  }
  // 31단계 — 6단계부터의 공격 효과. 그 단계에 못 미치면 줄을 안 만든다(5단계 이하 화면은 예전 그대로).
  var late = it.late || [];
  for (var li = 0; li < late.length; li++){
    if (L < late[li].fromLv) continue;
    var lv2 = round1(gearLateAt(late[li], L));
    if (late[li].key === 'damagePct') out.push({ label: STR.gAtk, text: '+' + lv2 + '%' });
    if (late[li].key === 'mobDmgPct') out.push({ label: STR.gMob, text: '+' + lv2 + '%' });
  }
  var u = it.unique;
  if (u){
    if (typeof u.rerollAdd === 'number')
      out.push({ label: STR.gReroll, text: '+' + u.rerollAdd });
    if (typeof u.invulnAdd === 'number')
      out.push({ label: STR.gInvuln, text: CONFIG.combat.invulnSec + ' → ' +
                 round1(CONFIG.combat.invulnSec + u.invulnAdd) + STR.sec });
    if (typeof u.lowHpSpeedPct === 'number')
      out.push({ label: STR.gLowHp.replace('{n}', u.lowHpBelowPct), text: '+' + u.lowHpSpeedPct + '%' });
  }
  return out;
}

/* 뽑기 레벨 — **0부터 시작하는 색인**이다(CONFIG.gacha.levels 의 칸 번호). 화면에는 +1 해서 보인다.
   지금까지 뽑은 횟수(pulls)로 정한다: atPulls 를 넘긴 마지막 칸. */
function gachaLevelAt(pulls){
  var lv = CONFIG.gacha.levels, n = typeof pulls === 'number' && pulls > 0 ? pulls : 0;
  var idx = 0;
  for (var i = 1; i < lv.length; i++) if (n >= lv[i].atPulls) idx = i;
  return idx;
}

/* 한 번 뽑는다. loadout 은 { gear, gacha } 를 가진 저장 모양(셸의 Save 데이터 그대로)이고 **직접 고친다**.
   rnd 는 [0,1) 을 돌려주는 함수 — 판의 world.random·lootRoll 은 절대 안 쓴다.
   ⚠️ 한 번 뽑을 때 rnd 를 **정확히 두 번** 부른다: 첫째는 등급, 둘째는 등급 안의 종류.
      천장으로 레전더리가 확정된 뽑기에서도 첫째를 버리고 부른다 — 횟수가 상황마다 다르면
      같은 씨앗으로 재현할 때 천장 하나가 뒤의 결과를 전부 밀어낸다.
   확률은 이번 뽑기 **전**의 횟수로 고른 레벨이다 — 10회 도중에 레벨이 오르면 그다음 뽑기부터 새 확률.
   돌려주는 것: { id, grade, kind: 'new'|'copy'|'refund', level(뽑은 뒤 단계), copies(뽑은 뒤 조각), refund(코인) }.
   31단계: 중복은 단계가 오르지 않고 조각(gear.copies) +1 — 옛 'up' 은 없어졌다. 최대 단계의 중복만 환급.
   코인을 받고 내는 일은 하지 않는다(잔액은 Save 가 안다). */
function gachaPull(loadout, rnd){
  var gc = CONFIG.gacha, gr = CONFIG.gear;
  var prob = gc.levels[gachaLevelAt(loadout.gacha.pulls)].prob;
  var r1 = rnd(), r2 = rnd();
  var gi;
  if (loadout.gacha.pity >= gc.pity - 1){
    gi = gr.grades.length - 1;                    // 천장 — 레전더리 확정
  } else {
    var u = r1 * 100, cum = 0;
    gi = gr.grades.length - 1;                    // 부동소수 끝자락은 마지막 등급으로
    for (var i = 0; i < prob.length; i++){
      cum += prob[i];
      if (u < cum){ gi = i; break; }
    }
  }
  var grade = gr.grades[gi];
  var pool = [];
  for (var j = 0; j < GEAR_IDS.length; j++) if (gr.items[GEAR_IDS[j]].grade === grade) pool.push(GEAR_IDS[j]);
  var k = Math.floor(r2 * pool.length);
  if (k >= pool.length) k = pool.length - 1;
  var id = pool[k];
  loadout.gacha.pulls++;
  loadout.gacha.pity = (grade === 'legend') ? 0 : loadout.gacha.pity + 1;
  var owned = loadout.gear.owned;
  var have = typeof owned[id] === 'number' ? owned[id] : 0;
  if (have <= 0){ owned[id] = 1; return { id: id, grade: grade, kind: 'new', level: 1, copies: 0, refund: 0 }; }
  // 31단계: 최대가 아닌 중복은 단계 대신 조각 +1(강화는 장비 탭에서 gearUpgrade 로).
  if (have < gr.maxLevel){
    if (!loadout.gear.copies) loadout.gear.copies = {};
    var cp = loadout.gear.copies;
    cp[id] = (typeof cp[id] === 'number' ? cp[id] : 0) + 1;
    return { id: id, grade: grade, kind: 'copy', level: have, copies: cp[id], refund: 0 };
  }
  return { id: id, grade: grade, kind: 'refund', level: have, copies: 0, refund: gc.refund[grade] };
}

/* 31단계 — 장비 id 를 level 단계에서 한 단계 올리는 값 { copies(조각), coins }. 모르는 id ·
   1 미만 · 최대 이상 · 정수가 아니면 null. 표는 CONFIG.gear.upgrade(칸 번호 = 지금 단계 − 1). */
function gearUpgradeCost(id, level){
  if (GEAR_IDS.indexOf(id) < 0) return null;
  var gr = CONFIG.gear, up = gr.upgrade;
  if (typeof level !== 'number' || Math.floor(level) !== level || level < 1 || level >= gr.maxLevel) return null;
  var grade = gr.items[id].grade;
  return { copies: up.need[grade][level - 1], coins: Math.round(up.costs[level - 1] * up.mult[grade]) };
}

/* 31단계 — 조각을 내고 한 단계 올린다. loadout 을 **직접 고친다**(gachaPull 과 같다).
   못 올리면(안 가짐 · 최대 · 조각 부족) null 이고 아무것도 안 바꾼다.
   올리면 { id, level(올린 뒤), coins(낼 값), refund } — 최대 단계가 됐으면 남은 조각 × 환급 값을 refund 에 담고
   조각을 0으로 만든다. **코인은 여기서 안 본다** — 잔액은 Save 가 알고, 코인 확인·차감도 Save 가 한다. */
function gearUpgrade(loadout, id){
  var g = loadout && loadout.gear;
  if (!g || !g.owned) return null;
  var lv = g.owned[id];
  var cost = gearUpgradeCost(id, lv);
  if (!cost) return null;
  var have = g.copies && typeof g.copies[id] === 'number' ? g.copies[id] : 0;
  if (have < cost.copies) return null;
  if (!g.copies) g.copies = {};
  var left = have - cost.copies;
  g.owned[id] = lv + 1;
  var refund = 0;
  if (lv + 1 >= CONFIG.gear.maxLevel){
    refund = left * CONFIG.gacha.refund[CONFIG.gear.items[id].grade];
    left = 0;
  }
  if (left > 0) g.copies[id] = left;
  else delete g.copies[id];
  return { id: id, level: lv + 1, coins: cost.coins, refund: refund };
}

/* 기록 전송의 강화 문자열(meta) 뒤에 붙일 토막. 트리·장비가 하나도 없으면 빈 문자열 —
   그 사람의 기록은 지금과 글자까지 같아야 서버 대시보드가 "강화 0 판" 을 그대로 센다.
   |t: 가지 단계(tree.order 순서), |g: 입은 장비 id+단계(부위 순서). 각 토막은 없으면 뺀다. */
function loadoutRecordSuffix(loadout){
  if (!loadout) return '';
  var t = [], g = [], anyT = false, i;
  for (i = 0; i < TREE_IDS.length; i++){
    var s = loadout.tree && typeof loadout.tree[TREE_IDS[i]] === 'number' ? loadout.tree[TREE_IDS[i]] : 0;
    if (s > 0) anyT = true;
    t.push(s);
  }
  var eq = loadout.gear && loadout.gear.equipped, ow = loadout.gear && loadout.gear.owned;
  for (i = 0; i < CONFIG.gear.slots.length; i++){
    var id = eq && eq[CONFIG.gear.slots[i]];
    if (typeof id === 'string' && ow && typeof ow[id] === 'number') g.push(id + ow[id]);
  }
  return (anyT ? '|t:' + t.join(',') : '') + (g.length ? '|g:' + g.join(',') : '');
}

/* ================================================================
   Vec — 입력 벡터 처리. out 객체를 재사용해 할당을 만들지 않는다.
   ================================================================ */
var Vec = {
  // 길이가 1을 넘으면 1로 줄인다. 1 이하면 그대로 (조이스틱 아날로그 감도 유지).
  clampToUnit: function(x, y, out){
    var lenSq = x * x + y * y;
    if (lenSq === 0){ out.x = 0; out.y = 0; return out; }
    if (lenSq <= 1){ out.x = x; out.y = y; return out; }
    var len = Math.sqrt(lenSq);
    out.x = x / len;
    out.y = y / len;
    return out;
  }
};

/* ================================================================
   Pool — 미리 만들어 두고 켜고 끄기만 한다 (생성/파괴 없음)
   빈자리 색인을 스택으로 관리해 spawn/release 가 O(1)
   ================================================================ */
function Pool(size, factory){
  this.size = size;
  this.items = new Array(size);
  this.free = new Array(size);
  this.freeCount = size;
  this.activeCount = 0;
  for (var i = 0; i < size; i++){
    var o = factory();
    o.active = false;
    o._i = i;
    this.items[i] = o;
    this.free[i] = i;
  }
}
Pool.prototype.spawn = function(){
  if (this.freeCount === 0) return null;
  this.freeCount--;
  var o = this.items[this.free[this.freeCount]];
  o.active = true;
  this.activeCount++;
  return o;
};
Pool.prototype.release = function(o){
  // null 방어 + 이 풀 소속인지 확인 (다른 풀의 객체를 넣으면 free 배열이 조용히 오염된다)
  if (!o || this.items[o._i] !== o || !o.active) return;
  o.active = false;
  this.activeCount--;
  this.free[this.freeCount] = o._i;
  this.freeCount++;
};
Pool.prototype.releaseAll = function(){
  for (var i = 0; i < this.items.length; i++) this.release(this.items[i]);
};

/* ================================================================
   Grid — 균일 격자. 충돌 "후보"만 좁힌다(정확한 거리 검사는 호출자 몫).
   카메라를 따라다니는 고정 크기 판이며, 매 프레임 reset 으로 비운다.
   ================================================================ */
function Grid(cellSize, cols, rows){
  this.cellSize = cellSize;
  this.cols = cols;
  this.rows = rows;
  this.originX = 0;
  this.originY = 0;
  this.cells = new Array(cols * rows);
  for (var i = 0; i < this.cells.length; i++) this.cells[i] = [];
}
Grid.prototype.reset = function(originX, originY){
  this.originX = originX;
  this.originY = originY;
  for (var i = 0; i < this.cells.length; i++) this.cells[i].length = 0; // 배열 재사용
};
Grid.prototype.insert = function(item){
  var cx = Math.floor((item.x - this.originX) / this.cellSize);
  var cy = Math.floor((item.y - this.originY) / this.cellSize);
  if (cx < 0 || cy < 0 || cx >= this.cols || cy >= this.rows) return false;
  this.cells[cy * this.cols + cx].push(item);
  return true;
};
Grid.prototype.forEachNear = function(x, y, radius, fn){
  var cs = this.cellSize;
  var minCx = Math.floor((x - radius - this.originX) / cs);
  var maxCx = Math.floor((x + radius - this.originX) / cs);
  var minCy = Math.floor((y - radius - this.originY) / cs);
  var maxCy = Math.floor((y + radius - this.originY) / cs);
  if (minCx < 0) minCx = 0;
  if (minCy < 0) minCy = 0;
  if (maxCx >= this.cols) maxCx = this.cols - 1;
  if (maxCy >= this.rows) maxCy = this.rows - 1;
  for (var cy = minCy; cy <= maxCy; cy++){
    var rowBase = cy * this.cols;
    for (var cx = minCx; cx <= maxCx; cx++){
      var cell = this.cells[rowBase + cx];
      for (var i = 0; i < cell.length; i++) fn(cell[i]);
    }
  }
};

/* ================================================================
   Stepper — 고정 시간 간격. 프레임이 흔들려도 게임 속도는 일정하게.
   ================================================================ */
function Stepper(stepMs, maxSteps, maxAccumMs){
  this.stepMs = stepMs;
  this.maxSteps = maxSteps;
  this.maxAccumMs = maxAccumMs;
  this.accum = 0;
}
Stepper.prototype.advance = function(deltaMs){
  if (deltaMs > this.maxAccumMs) deltaMs = this.maxAccumMs; // 탭 전환 폭주 방지
  this.accum += deltaMs;
  var steps = 0;
  while (this.accum >= this.stepMs && steps < this.maxSteps){
    this.accum -= this.stepMs;
    steps++;
  }
  if (steps === this.maxSteps) this.accum = 0; // 밀린 시간은 버린다
  return steps;
};

/* 한 투사체가 "이미 때린 적" 을 몇 마리까지 기억하는가.

   예전에는 이 기억을 **적 쪽**에 도장 한 칸(lastProjStamp)으로 뒀는데, 겹친 투사체가
   둘이면 서로 도장을 덮어써서 같은 적을 매 프레임 다시 때렸다. 8단계 최종 리뷰가
   찾아서 "다음 밸런스 작업으로 이월" 로 적어 둔 것이고(계획/8-...-측정결과.md §이월),
   생선뼈가 `counts: 2` + `pierce: 999` 라 정확히 여기에 걸렸다 —
   2026-08-11 실측: 표에 적힌 30 짜리가 **720**(24배), 레벨 3→4 에서 56배.

   그래서 기억을 **투사체 쪽**으로 옮긴다. 적의 stamp 는 스폰마다 새로 매기므로
   풀이 자리를 재활용해도 헷갈리지 않는다.
   기억이 꽉 차면 그 투사체는 더 안 때린다 — 관통을 다 쓴 것과 같이 다룬다.

   64 로 잡은 근거(2026-08-11 실측, 참치뼈 만렙 = 동시 4발 · 관통 999 · 3분):
     적 100마리 유지 → 한 투사체가 기억한 최대 **36마리**, 캡 도달 0회.
     적 400마리를 반경 460 안에 욱여넣으면 캡에 닿는다 — 실제 판은 15분에
     적 68~81마리라(봇 60판) 여기까지 갈 일이 없다.
   ⚠️ 적 수를 크게 늘리거나 관통 무기를 더 만들면 이 수를 다시 재고 올릴 것.
      캡에 닿아도 게임이 안 멈추고 **조용히** 피해만 사라진다. */
var PROJ_HIT_CAP = 64;

/* 보석용 난수의 기본 씨앗. reset 이 매번 이 값으로 되돌려, 따로 씨앗을 안 준 World 도
   (테스트·측정 도구) 매번 같은 드롭이 나온다. 실제 게임은 셸이 판마다 새 씨앗을 준다.
   LOOT_SEED_SALT: setLootSeed 가 받은 값에 섞는다. 봇은 world.random 과 보석 난수에
   같은 판 번호를 씨앗으로 주는데, 안 섞으면 두 줄기가 똑같은 수열이 되어
   "스폰 각도가 작으면 보석이 나온다" 같은 엉뚱한 상관이 생긴다. */
var LOOT_SEED_DEFAULT = 0x2F6B1D3A;
var LOOT_SEED_SALT = 0x5BD1E995;

function projAlreadyHit(p, enemyStamp){
  if (p.hitN >= PROJ_HIT_CAP) return true;
  for (var i = 0; i < p.hitN; i++) if (p.hitIds[i] === enemyStamp) return true;
  return false;
}

  this.orbitR = 0;
  this._orbitCd = 0;
  /* 회오리 꼬리(진화)가 맞은 적을 바깥으로 미는 초당 거리(px). 0 이면 안 민다.
     fireOrbit 이 매 프레임 다시 정하므로, 꼬리를 안 들었거나 진화 전이면 0 이다.
     미는 일 자체는 moveEnemies 가 한다 — 이유는 그 함수의 주석에 적었다. */
  this.galePush = 0;
  /* 정전기 연쇄 —
     대상 고르기는 격자 순회로, 때리기는 순회가 전부 끝난 뒤에 한다.
     격자 콜백 안에서 damageEnemy 를 부르면 죽은 적이 풀로 돌아가며 바깥 순회가
     보던 셀 배열이 흔들려 나머지 적이 조용히 안 맞는다(재진입 함정).
     버퍼는 여기서 한 번만 만들고 발동할 때마다 length 만 0 으로 되돌린다 —
     매번 [] 를 만들면 루프 안 할당 금지 규칙을 어긴다. */
  this._chainBuf = [];
  this.chainStamp = 0;      // 발동 일련번호. 같은 적을 두 번 고르지 않게 도장을 찍는다.
  this._chainFrom = null;   // 지금 어느 적에서 튀는 중인가
  this._chainBest = null;   // 그 적에서 가장 가까운 다음 대상
  this._chainBestSq = 0;
  this._onChainCandidate = function(e){
    if (!e.active) return;
    if (e.chainStamp === self.chainStamp) return;   // 이번 발동에 이미 골랐다
    var f = self._chainFrom;
    if (f === null || e === f) return;
    var dx = e.x - f.x, dy = e.y - f.y;
    var d2 = dx * dx + dy * dy;
    if (d2 >= self._chainBestSq) return;
    self._chainBestSq = d2;
    self._chainBest = e;
  };
  // 연출 전용 — 판정용 _hitDmg·_hitRadius 는 무기들이 돌려쓰므로 렌더가 읽으면 안 된다.
  this.chainTimer = 0;   // 번개 잔상 남은 시간(초)
  this.chainShow = 0;    // 이번 잔상의 전체 길이(초)
  this.chainN = 0;       // 이번에 맞은 대상 수
  var zapCfg = config.weapons.zap;
  // 첫 대상 + 연쇄 횟수. ⚠️ 진화하면 연쇄가 chain 배로 늘어나므로 진화 뒤 최대치로
  // 잡아 둔다. 안 그러면 Float64Array 범위를 넘는 쓰기가 조용히 버려지고
  // (예외가 안 난다) 렌더가 그 칸을 undefined 로 읽어 번개가 NaN 자리에 그려진다.
  var zapEvo = config.evolutions && config.evolutions.zap
             ? (config.evolutions.zap.chain || 1) : 1;
  var zapMax = zapCfg ? Math.round(zapCfg.chainCount * zapEvo) + 1 : 1;
  this.chainX = new Float64Array(zapMax);
  this.chainY = new Float64Array(zapMax);

  // 격자에서 충돌 후보를 고를 때 쓰는 여유 반경. 가장 큰 적의 반경을 CONFIG 에서 구한다.
  this.maxEnemyR = 0;
  for (var eid in config.enemies){
    if (config.enemies[eid].radius > this.maxEnemyR) this.maxEnemyR = config.enemies[eid].radius;
  }
  this.kills = 0;
  this.coins = 0;    // 이번 판에 번 코인 (영구 잔액은 shell 이 관리한다)
  this.dmgBy = freshDamageTally();   // 무기별 실제 딜량 (계획/13-딜량측정-명세.md)
  this.level = 1;
  this.pendingChoices = 0;
  this.rolledChoices = null;   // 지금 떠 있는 3택 — rollChoices 가 채우고 applyChoice 가 비운다
  this.rerollLeft = config.level.rerollPerRun;   // 판당 다시 뽑기 남은 횟수
  this.passives = { claws: 0, tuna: 0, bell: 0, whisker: 0, nap: 0, clover: 0 };

  // 범위 판정용 공용 필드 — 호출마다 값을 채우고 콜백이 읽는다 (콜백은 여기서 한 번만 만든다)
  this._hitDmg = 0;
  this._hitRadius = 0;
  this._hitCosHalf = 0;
  this._onArcCandidate = function(e){
    if (!e.active) return;                 // 이번 프레임에 이미 죽은 적
    var p = self.player, f = self.aimDir;
    var dx = e.x - p.x, dy = e.y - p.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > self._hitRadius + e.radius) return;
    // 이 콜백은 fireClaw 만 부른다 — 다른 무기와 안 겹치므로 이름을 그대로 적는다.
    if (dist < 1e-6){ self.damageEnemy(e, self._hitDmg, 'claw'); return; }   // 겹쳐 있으면 무조건 맞음
    if ((dx / dist) * f.x + (dy / dist) * f.y < self._hitCosHalf) return;
    self.damageEnemy(e, self._hitDmg, 'claw');
  };

  /* 빔 판정 콜백 — 후보 원 안의 적을 선분까지의 정확한 거리(사영+수직)로 거른다.
     검사 중인 줄의 번호는 _bmI 로 전달한다. 햇빛 모으기는 앞뒤 두 줄이라
     플레이어 바로 옆의 적이 두 줄 모두에 걸린다 — beamStamp 로 한 번만 때린다. */
  this._bmI = 0;
  this._onBeamCandidate = function(e){
    if (!e.active) return;
    if (e.beamStamp === self.beamStamp) return;      // 이번 발동에 이미 맞았다
    var p = self.player, d = self.beamDirs[self._bmI];
    var ex = e.x - p.x, ey = e.y - p.y;
    var along = ex * d.x + ey * d.y;                 // 빔 방향으로 얼마나 갔나
    if (along < 0 || along > self.beamLen) return;   // 뒤쪽이거나 사거리 밖
    var perp = ex * d.y - ey * d.x;                  // 빔 축에서 옆으로 벗어난 거리
    if (perp < 0) perp = -perp;
    if (perp > self.beamHalfW + e.radius) return;
    e.beamStamp = self.beamStamp;
    self.damageEnemy(e, self._hitDmg, 'laser');   // 이 콜백은 fireBeam 만 부른다
  };

  // 폭발 판정 콜백 — 폭발 중심에서 원형 반경 안의 적을 거른다
  this._onBlastCandidate = function(e){
    if (!e.active) return;
    var dx = e.x - self.blastX, dy = e.y - self.blastY;
    var r = self._hitRadius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    // 캣닢·핵폭탄이 이 콜백을 같이 쓴다 — blastWeaponId 로 어느 쪽인지 구분한다.
    self.damageEnemy(e, self._hitDmg, self.blastWeaponId);
  };

  /* 💣 도화선 폭발 판정 콜백(29단계). blastAt 의 화면 상태(blastX 등)를 안 쓴다 —
     덮어쓰면 캣닢·핵폭탄 잔상이 사라진다. 'bomb' 은 딜량 칸이 아니다(damageEnemy 가 안 센다). */
  this._fuseX = 0; this._fuseY = 0; this._fuseR = 0; this._fuseDmg = 0;
  this._onFuseCandidate = function(e){
    if (!e.active) return;              // 이번 폭발(또는 앞의 폭발)에 이미 죽었다
    var dx = e.x - self._fuseX, dy = e.y - self._fuseY;
    var r = self._fuseR + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    if (self.damageEnemy(e, self._fuseDmg, 'bomb')) self.bombKills++;
  };

  // 장판 판정 콜백 — 검사 중인 장판은 _field 로 전달한다. 안에 있으면 둔화를 걸고 때린다.
  this._field = null;
  this._onFieldCandidate = function(e){
    var f = self._field;
    if (f === null || !e.active) return;
    var dx = e.x - f.x, dy = e.y - f.y;
    var r = f.radius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    e.slowT = f.slowDur;
    e.slowPct = f.slowPct;
    self.damageEnemy(e, f.tickDmg, f.weaponId);
  };

  /* 꼬리 회전 판정 콜백 — 공 반경 안의 적을 때리고 적마다 재타격 간격을 건다.
     검사 중인 공의 번호는 _obI 로 전달한다. 재타격 간격을 **공마다** 따로 세는 것이
     핵심이다: 한 칸이면 회오리 꼬리의 둘째 공이 첫째 공의 간격에 걸려 아무 일도
     안 하고, 그건 투사체 도장 한 칸이 만들었던 것과 같은 종류의 함정이다. */
  this._obI = 0;
  this._onOrbitCandidate = function(e){
    var i = self._obI;
    if (!e.active || e.orbitCds[i] > 0) return;
    var dx = e.x - self.orbitXs[i], dy = e.y - self.orbitYs[i];
    var r = self._hitRadius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    e.orbitCds[i] = self._orbitCd;
    self.damageEnemy(e, self._hitDmg, 'tail');   // 이 콜백은 fireOrbit 만 부른다
  };

  /* 토네이도 밀어내기 콜백(예전 이름은 끌어당김 — 2026-11-21 에 방향을 뒤집었다, 아래 주석) — 피해를 주지 않고 좌표만 옮긴다.
     damageEnemy 를 부르지 않으므로 격자 콜백 재진입 함정에 걸리지 않는다.
     검사 중인 투사체는 _proj, 이번 프레임의 dt 는 _pullDt 로 전달한다. */
  this._pullDt = 0;
  this._onPullCandidate = function(e){
    var p = self._proj;
    if (p === null || !p.active || !e.active) return;
    if (p.pullRadius <= 0) return;
    var dx = p.x - e.x, dy = p.y - e.y;
    var d2 = dx * dx + dy * dy;
    if (d2 > p.pullRadius * p.pullRadius || d2 < 1e-6) return;
    /* 회오리가 **지나온 쪽** 의 적은 안 끈다.

       예전에는 방향을 안 봐서 뒤에 있던 적까지 앞으로 끌어왔고, 그것들이 끌려오는
       길에 플레이어를 그대로 통과했다. 사용자 신고(2026-08-11): "뒤에 애들이
       끌려오다가 나를 맞추는 경우가 엄청 많아".
       실측(태풍 만렙·적 30마리·60초·3씨드): 분당 38번 맞는 중 **20번(52%)** 이
       끌려온 적이었다. 끌리는 적의 81% 가 뒤쪽이었다.
       이 줄을 넣으면 분당 맞는 횟수 38 → 25, 피해 418 → 263 이다.

       덤으로 태풍의 초당 딜이 789 → 451 이 되어 "2위의 2.4배" 였던 쏠림도 풀린다
       (계획/20-무기밸런스-조사.md 발견 4). */
    if ((e.x - p.x) * p.vx + (e.y - p.y) * p.vy < 0) return;
    /* 2026-11-21 — **끌어당기지 않고 민다.**
       예전에는 여기서 회오리 중심 쪽으로 끌었다. 회오리 앞쪽의 적만 끌므로 그 방향은 늘 고양이 쪽이다 —
       사용자 신고: "멀리 있는 애들이 당겨져 와서 보스가 계속 끌려와 근접 딜이 박힌다. 당기는 건 없애고
       밀려나는 효과만." 이제 같은 적(앞쪽 · 반경 안)을 **회오리가 가는 방향**으로 민다 = 고양이에게서 멀어진다.
       미는 속도(pullSpeed 90)가 회오리(150)보다 느려서 회오리가 따라잡아 지나가며 때린다.
       보스는 밀지 않는다(당기지도 않는다) — 태풍은 초당 180 으로 미는데 보스는 56~72 로 걷는다. 밀면 보스가
       영영 못 다가와 보스전이 사라진다. 두목쥐는 보스가 아니라 밀린다.
       칸 이름(pullRadius · pullSpeed · 진화표의 pull)은 그대로 둔다 — 뜻만 "미는 범위 · 미는 세기" 로 바뀌었다. */
    var pt = self.config.enemies[e.typeId];
    if (pt && pt.boss) return;
    var pv = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (pv < 1e-6) return;
    var step = p.pullSpeed * self._pullDt;
    e.x += p.vx / pv * step;
    e.y += p.vy / pv * step;
  };

  // 투사체 충돌 판정 콜백 — 검사 중인 투사체는 _proj 로 전달한다
  this._proj = null;
  this._onProjCandidate = function(e){
    var p = self._proj;
    if (p === null || !p.active || p.pierce <= 0) return;
    if (!e.active) return;
    /* 두 갈래다.
       ① 재타격형(토네이도, hitCd > 0): 회오리 안에 머무는 동안 간격마다 다시 때린다.
          "한 투사체가 같은 적을 두 번 안 때린다" 는 규칙과 정면으로 충돌하므로
          여기서는 그 기억을 쓰지 않는다.
          pierce 도 깎지 않는다 — 재타격마다 깎으면 회오리가 도중에 사라진다.
       ② 보통 투사체(털뭉치·생선뼈): 한 적당 한 번. 투사체가 직접 기억한다
          (PROJ_HIT_CAP 주석 참고 — 적 쪽에 도장 한 칸으로 두면 겹친 투사체가
           서로 덮어써서 매 프레임 다시 때린다). */
    if (p.hitCd > 0){
      if (e.tornadoCd > 0) return;             // 아직 재타격 간격 안이다
    } else {
      if (projAlreadyHit(p, e.stamp)) return;  // 이 투사체에는 이미 맞았다
    }
    var dx = e.x - p.x, dy = e.y - p.y;
    var r = p.radius + e.radius;
    if (dx * dx + dy * dy > r * r) return;
    if (p.hitCd > 0){
      e.tornadoCd = p.hitCd;
    } else {
      p.hitIds[p.hitN++] = e.stamp;
      p.pierce--;
    }
    // 털뭉치·생선뼈·토네이도가 이 콜백을 같이 쓴다 — p.weaponId 로 구분한다.
    self.damageEnemy(e, p.dmg, p.weaponId);
    /* 실타래 폭풍 — 맞은 자리에서 좌우로 갈라진다.
       갈라진 것(p.split)은 다시 안 갈라진다: 안 막으면 적이 많을수록 무한 증식해
       투사체 풀이 터진다. 투사체 풀은 적 격자와 별개라 여기서 spawn 해도
       바깥 순회(forEachNear)가 흔들리지 않는다. */
    if (!p.split && self.isEvolved(p.weaponId)){
      var ev = self.config.evolutions[p.weaponId];
      // 맞은 적 e 를 같이 넘긴다 — 갈라진 것을 그 적의 판정 원 **바깥**에서 태워야
      // 자기를 낳아 준 적을 한 번 더 안 때린다(진화표에 없는 3배 딜의 원인이었다).
      if (ev && ev.rule === 'split') self.splitProjectile(p, ev, e);
    }
  };
}
World.prototype.setRandom = function(fn){ this.random = fn; };
// 보석 난수 씨앗을 정한다. 정수 상태 하나뿐이라 판 도중 객체를 안 만든다.
World.prototype.setLootSeed = function(n){ this.lootState = ((n | 0) ^ LOOT_SEED_SALT) | 0; };
// 테스트용: [0,1) 을 돌려주는 함수를 꽂는다. null 이면 lootState 로 돌아간다.
World.prototype.setLootRandom = function(fn){ this.lootRandom = (typeof fn === 'function') ? fn : null; };
/* 보석 난수 한 번 — [0,1). mulberry32 를 정수 상태 위에서 그대로 돌린다(클로저·할당 없음).
   드롭 추첨과 자석 위치는 반드시 이것만 쓴다. world.random 을 부르면 기준선이 밀린다. */
World.prototype.lootRoll = function(){
  if (this.lootRandom) return this.lootRandom();
  var s = (this.lootState + 0x6D2B79F5) | 0;
  this.lootState = s;
  var t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
World.prototype.setInput = function(x, y){
  this.rawInput.x = x;
  this.rawInput.y = y;
};
World.prototype.step = function(dt){
  Vec.clampToUnit(this.rawInput.x, this.rawInput.y, this.moveDir);
  var speed = this.config.player.speed * this.metaMult.speed *
              (1 + this.passives.bell * this.config.passives.bell.speedPct / 100);
  // 날개 신발(26단계) — 체력이 일정 비율 아래면 더 빠르다. 없으면(×1) 이 줄을 건너뛴다.
  if (this.metaMult.lowHpSpeed !== 1 && this.player.hp < this.player.maxHp * this.metaMult.lowHpBelow)
    speed *= this.metaMult.lowHpSpeed;
  this.player.x += this.moveDir.x * speed * dt;
  this.player.y += this.moveDir.y * speed * dt;
  // 움직인 프레임에만 정면을 갱신한다 (멈추면 마지막 방향 유지)
  var mx = this.moveDir.x, my = this.moveDir.y;
  var len = Math.sqrt(mx * mx + my * my);
  if (len > 1e-6){ this.facing.x = mx / len; this.facing.y = my / len; }
};
// 경과 시간에 따른 적 체력 배수. 속도·피해에는 걸지 않는다(후반이 감당 불가가 된다).
World.prototype.hpScale = function(){
  return 1 + (this.elapsed / 60) * this.config.spawn.hpPerMin;
};
/* 지금 스테이지의 배율 하나. 숫자로 적혀 있으면 그 값, 아니면 1 (25단계).
   1 을 돌려주므로 부르는 쪽은 조건 없이 곱하기만 한다 — 곱하는 자리마다 "스테이지 2면"
   을 흩뿌리면 하나 빠뜨렸을 때 조용히 안 걸린다(evoMult 와 같은 이유). */
World.prototype.stageMult = function(key){
  var s = this.stageCfg;
  if (!s) return 1;
  var v = s[key];
  return typeof v === 'number' ? v : 1;
};
/* 보스 한 마리의 스테이지 체력 배율(28단계 2차). 스테이지에 bossHpMults(CONFIG.bosses 순서)가
   있고 그 보스 칸이 숫자면 그 값, 아니면 지금처럼 bossHpMult. 스테이지 1·2에는 bossHpMults 가
   없으므로 예전과 같은 stageMult('bossHpMult') 를 그대로 돌려준다 — 계산이 한 글자도 안 바뀐다.
   번호가 아니라 typeId 로 찾는다: 되살리기·디버그 이동처럼 bossIndex 와 따로 켜는 길도 같은 값을 받는다. */
World.prototype.bossHpMultFor = function(typeId){
  var s = this.stageCfg;
  var arr = s && s.bossHpMults;
  if (arr){
    var list = this.config.bosses;
    for (var i = 0; i < list.length; i++){
      if (list[i].typeId !== typeId) continue;
      if (typeof arr[i] === 'number') return arr[i];
      break;
    }
  }
  return this.stageMult('bossHpMult');
};
// 적을 켠다. 풀이 객체를 재사용하므로 여기서 모든 필드를 빠짐없이 덮어쓴다.
// (필드를 새로 추가하면 반드시 이 함수도 같이 고칠 것 — 안 그러면 이전 적의 값이 샌다)
World.prototype.spawnEnemy = function(typeId, x, y){
  var t = this.config.enemies[typeId];
  if (!t) return null;
  var e = this.enemies.spawn();
  if (!e) return null;
  // 보스 체력은 표에 적힌 값이 최종값이다. 시간 배율까지 곱하면 15분 보스가 78,000이 되어
  // 4슬롯 빌드의 최대 화력(초당 200~286)으로는 몇 분을 때려야 하는 수치가 된다.
  // 스테이지 배율(25단계)은 스테이지 1에서 전부 1 이다 — 1을 곱한 값은 원래 값과 비트까지 같다.
  // 보스는 "표의 값 × 스테이지 보스 배율" 이 최종값이다(시간 배율은 여전히 안 받는다).
  // 28단계 2차: 보스마다 배율이 다를 수 있다(bossHpMultFor — 없으면 bossHpMult).
  var scaledHp = t.boss ? t.hp * this.bossHpMultFor(typeId)
                        : t.hp * this.hpScale() * this.stageMult('enemyHpMult');
  e.x = x;            e.y = y;
  e.typeId = typeId;  e.hp = scaledHp;  e.maxHp = scaledHp;
  e.speed = t.speed;  e.radius = t.radius;
  e.contact = t.contact * this.stageMult(t.boss ? 'bossContactMult' : 'contactMult');
  e.xp = t.xp;
  // 🍒 새총쥐 상태. 쿨타임은 스폰 때부터 흐른다(첫 발은 firstDelaySec 뒤).
  // 원거리가 아닌 쥐도 전부 덮어쓴다 — 새총쥐가 쓰던 슬롯을 물려받은 생쥐가 쏘면 안 된다.
  e.ranged = t.ranged || null;
  e.shootCd = e.ranged !== null ? e.ranged.firstDelaySec : 0;
  e.aimT = 0;         e.aimX = 0;       e.aimY = 0;
  e.holding = false;
  e.elite = false;    // eliteTick 이 켠 직후에 true 로 바꾼다
  e.hitFlash = 0;     e.contactCd = 0;
  e.slowT = 0;        e.slowPct = 0;
  for (var oi = 0; oi < e.orbitCds.length; oi++) e.orbitCds[oi] = 0;
  e.tornadoCd = 0;    // 토네이도 재타격 간격 (꼬리 회전의 orbitCds 와 같은 방식)
  e.chainStamp = 0;   // 정전기 연쇄가 "이번 발동에 이미 골랐다" 를 찍는 자리
  e.beamStamp = 0;    // 레이저가 "이번 발동에 이미 맞혔다" 를 찍는 자리 (빔이 둘이라 필요하다)
  // 스폰마다 오르는 일련번호. 동료가 목표를 붙잡을 때 "이 슬롯이 아직 그 적인가"를
  // 이걸로 확인한다. 참조만 붙들면 죽은 목표의 자리에 스폰된 새 적을 쫓아간다.
  e.stamp = ++this.enemyStamp;
  return e;
};
// 격자를 플레이어 중심으로 다시 놓고 활성 적을 담는다.
World.prototype.rebuildGrid = function(){
  var g = this.grid;
  var halfW = g.cols * g.cellSize / 2;
  var halfH = g.rows * g.cellSize / 2;
  g.reset(this.player.x - halfW, this.player.y - halfH);
  var items = this.enemies.items;
  for (var i = 0; i < items.length; i++){
    if (items[i].active) g.insert(items[i]);
  }
};
// 활성 적을 전부 플레이어 쪽으로 옮긴다.
World.prototype.moveEnemies = function(dt){
  var px = this.player.x, py = this.player.y;
  var items = this.enemies.items;
  /* 🍒 새총쥐 조준 상한(25단계). prevAiming 은 직전 프레임에 센 조준 수, started 는
     이번 프레임에 새로 시작한 수, nowAiming 은 이번 프레임 끝의 조준 수(다음 프레임의 prevAiming).
     스테이지 1에는 ranged 쥐가 없어 아래 블록을 한 번도 안 지나가고 nowAiming 은 0 이다. */
  var rcfg = this.config.ranged;
  var prevAiming = this.aimingCount, started = 0, nowAiming = 0;
  var halfW = this.viewHalfW - 12, halfH = this.viewHalfH - 12;
  for (var i = 0; i < items.length; i++){
    var e = items[i];
    if (!e.active) continue;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    // 공마다 재타격 간격이 따로 흐른다. 어느 하나라도 남아 있으면 "방금 맞았다" 로 본다
    // (밀어내기가 그 창을 쓴다).
    var orbHot = false;
    for (var oi = 0; oi < e.orbitCds.length; oi++){
      if (e.orbitCds[oi] > 0){ e.orbitCds[oi] -= dt; orbHot = true; }
    }
    if (e.tornadoCd > 0) e.tornadoCd -= dt;
    var sp = e.speed;
    if (e.slowT > 0){
      e.slowT -= dt;
      sp *= (1 - e.slowPct / 100);
    }
    var dx = px - e.x, dy = py - e.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    /* 🍒 새총쥐 — 사거리 안이면 멈춰 서서 조준하고 쏜다(25단계).
       ⚠️ e.speed 를 0 으로 바꾸지 않는다. recycleFarEnemies 가 speed 0 인 적을 "스스로 못
          움직이는 두더지" 로 보고 조용히 걷어내고, 그리기도 speed 로 걷는 그림을 고른다.
          그래서 멈춤은 이 지역 변수(hold)로만 한다.
       겹침(len≈0) 검사보다 **앞에** 둔다 — 뒤에 두면 고양이와 딱 겹친 조준 중인 쥐가
       그 프레임 조준 수에서 빠져 상한을 한 마리 넘길 수 있다. */
    var hold = false;
    if (e.ranged !== null){
      var rc = e.ranged;
      // 멈춤과 재개 사이에 틈(range 170 · resumeDist 200)을 둔다 — 경계에서 섰다 걸었다 떨지 않게.
      if (e.holding){ if (len > rc.resumeDist) e.holding = false; }
      else if (len <= rc.range) e.holding = true;
      hold = e.holding;
      if (e.shootCd > 0) e.shootCd -= dt;   // 쿨타임은 조준 중에도 흐른다(발사 간격 = cooldownSec)
      if (e.aimT > 0){
        hold = true;                         // 조준 중에는 고양이가 멀어져도 서서 쏜다
        e.aimT -= dt;
        if (e.aimT <= 0){ e.aimT = 0; this.fireShot(e); }
        else nowAiming++;
      } else if (e.holding && e.shootCd <= 0 && !this.benchMode && len >= 1e-6 &&
                 // 화면 안에 있는 쥐만 조준한다 — 폰 가로 390px 에서 화면 밖에 멈춰 선 쥐가
                 // 안 보이는 데서 쏘는 일을 막는다(명세 2절).
                 (dx < 0 ? -dx : dx) <= halfW && (dy < 0 ? -dy : dy) <= halfH &&
                 prevAiming + started < rcfg.maxAiming &&
                 prevAiming + started + this.shots.activeCount < rcfg.maxShots){
        e.aimT = rc.aimSec;
        e.aimX = dx / len;                   // 방향은 이 순간의 고양이 쪽으로 굳는다 — 쏠 때 다시 겨누지 않는다
        e.aimY = dy / len;
        e.shootCd = rc.cooldownSec;
        started++;
        nowAiming++;
        hold = true;
      }
    }
    if (len < 1e-6) continue;            // 겹쳐 있으면 0으로 나누지 않는다
    var step = hold ? 0 : sp * dt;
    if (step > len) step = len;          // 지나쳐서 플레이어 주위를 진동하지 않게
    e.x += dx / len * step;
    e.y += dy / len * step;
    /* 회오리 꼬리(진화) 밀어내기 —
       속도가 아니라 위치를 직접 옮긴다. 적의 이동은 바로 윗줄처럼 매 프레임
       플레이어를 향해 다시 계산되므로 속도를 만져도 다음 프레임에 지워진다.
       미는 창은 "맞은 뒤 재타격 간격(orbitCds)" 이다. 맞은 그 프레임에만 밀면
       220 × 1/60 = 3.7px 라 눈에도 안 보이고 적이 다가오는 속도도 못 이긴다.
       ⚠️ 여기(update 안, rebuildGrid 앞)에서 옮겨야 격자와 안 어긋난다. */
    // 부호를 그대로 쓴다 — 음수면 밖으로 미는 대신 안으로 당긴다(관문 실험용).
    if (this.galePush !== 0 && orbHot){
      var push = this.galePush * dt;
      e.x -= dx / len * push;            // dx·dy 는 적→플레이어 방향이라 부호를 뒤집는다
      e.y -= dy / len * push;
    }
  }
  this.aimingCount = nowAiming;          // 다음 프레임의 상한 판단이 이 값을 쓴다
};

/* 🍒 조준이 끝난 새총쥐가 열매 하나를 쏜다. 풀이 꽉 찼으면 조용히 넘어간다(게임이 멈추면 안 된다).
   풀 객체를 재사용하므로 필드를 빠짐없이 덮어쓴다. 난수를 안 쓴다 — 방향은 조준 때 굳혀 둔 값이다. */
World.prototype.fireShot = function(e){
  var s = this.shots.spawn();
  if (!s) return null;
  var rc = e.ranged;
  s.x = e.x;                  s.y = e.y;
  s.vx = e.aimX * rc.shotSpeed;
  s.vy = e.aimY * rc.shotSpeed;
  s.life = rc.shotLifeSec;
  s.radius = rc.shotRadius;
  s.dmg = rc.shotDamage;
  this.shotsFired++;
  return s;
};

/* 🍒 열매를 옮기고, 수명이 끝나면 회수하고, 고양이에 닿으면 때린다.
   가드는 updateNukes 와 같다 — 판이 끝난 프레임에 죽은/이긴 몸이 또 맞지 않게.
   무적은 몸에 닿았을 때와 **같은 것**을 쓴다(명세 2절 ②). 따로 두면 "물리고 → 곧바로 열매"
   가 되어 무적이 지키려던 것이 무너진다. 무적 중에 닿은 열매는 피해 없이 지나간다(남는다).
   무기로 열매를 지울 수는 없다 — 적 격자와 안 섞이므로 무기 판정에 안 걸린다. */
World.prototype.updateShots = function(dt){
  if (this.gameOver || this.cleared || this.benchMode) return;
  if (this.shots.activeCount === 0) return;
  var p = this.player;
  var pr = this.config.player.radius;
  var items = this.shots.items;
  for (var i = 0; i < items.length; i++){
    var s = items[i];
    if (!s.active) continue;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0){ this.shots.release(s); continue; }
    if (p.invuln > 0) continue;
    var dx = p.x - s.x, dy = p.y - s.y;
    var reach = s.radius + pr;
    if (dx * dx + dy * dy > reach * reach) continue;
    p.hp -= s.dmg * this.metaMult.taken;   // 몸에 닿은 피해와 같은 받는 피해 배율
    p.invuln = this.config.combat.invulnSec + this.metaMult.invulnAdd;
    this.shotsHit++;
    this.shots.release(s);
    if (p.hp <= 0 && this.playerDown()) return;   // 부활하면 판이 이어진다(남은 열매도 계속 난다)
  }
};

/* 💣 쥐 e 의 자리에 도화선을 놓는다(29단계). 풀이 꽉 찼으면 조용히 null.
   풀 객체를 재사용하므로 칸을 전부 덮어쓴다(풀 잔존값 — 옛 show 가 남으면 터지기도 전에 잔상이 보인다).
   stamp 를 지금의 fuseTick 으로 찍는다: updateFuses 가 순회 전에 fuseTick 을 올리므로, 순회 밖(무기 등)에서
   생긴 도화선은 이번 프레임부터 타고, 순회 안(이어 터지기)에서 생긴 것은 다음 프레임부터 탄다. */
World.prototype.dropFuse = function(e){
  var t = this.config.enemies[e.typeId];
  var bomb = t && t.bomb;
  if (!bomb) return null;
  var f = this.fuses.spawn();
  if (!f) return null;
  f.x = e.x;               f.y = e.y;
  f.left = bomb.fuseSec;   f.show = 0;
  f.radius = bomb.radius;
  f.playerDmg = bomb.playerDamage;
  f.enemyBase = bomb.enemyDamage;
  f.showSec = bomb.showSec;
  f.stamp = this.fuseTick;
  if (this.fuses.activeCount > this.fusesPeak) this.fusesPeak = this.fuses.activeCount;
  return f;
};

/* 💣 도화선을 태우고, 다 타면 터뜨리고, 잔상을 줄인다(29단계).
   가드는 updateNukes·updateShots 와 같다 — 판이 끝난 프레임에 죽은 몸이 또 맞거나 이긴 뒤 처치가 얹히지 않게.
   터질 때는 고양이부터 본다: 그 폭발로 판이 끝나면 쥐 처치도 얹지 않고 바로 멈춘다(남은 도화선도 안 터진다).
   고양이 피해는 열매와 같은 식이다 — 같은 무적을 쓰고, 받는 피해 배율이 걸리고, 쓰러지면 playerDown.
   쥐 피해는 터지는 순간의 체력 배율(시간 × 스테이지)을 받는다. 판정은 격자로(blastAt 은 안 쓴다). */
World.prototype.updateFuses = function(dt){
  if (this.gameOver || this.cleared || this.benchMode) return;
  if (this.fuses.activeCount === 0) return;
  var tick = ++this.fuseTick;
  var p = this.player;
  var pr = this.config.player.radius;
  var items = this.fuses.items;
  for (var i = 0; i < items.length; i++){
    var f = items[i];
    if (!f.active || f.stamp === tick) continue;   // 이번 순회에 생긴 것 — 0.9초를 온전히 받는다
    if (f.left <= 0){                              // 잔상
      f.show -= dt;
      if (f.show <= 1e-9) this.fuses.release(f);
      continue;
    }
    f.left -= dt;
    if (f.left > 1e-9) continue;                   // 54프레임 × 1/60 의 부동소수 찌꺼기를 흡수한다
    f.left = 0;
    f.show = f.showSec;
    this.bombsExploded++;
    // 고양이
    if (p.invuln <= 0){
      var dx = p.x - f.x, dy = p.y - f.y;
      var reach = f.radius + pr;
      if (dx * dx + dy * dy <= reach * reach){
        p.hp -= f.playerDmg * this.metaMult.taken;
        p.invuln = this.config.combat.invulnSec + this.metaMult.invulnAdd;
        this.bombHitsPlayer++;
        if (p.hp <= 0 && this.playerDown()) return;   // 부활하면 판이 이어진다(남은 도화선도 계속 탄다)
      }
    }
    // 쥐 — 이 안에서 폭탄쥐가 죽으면 새 도화선이 생긴다(stamp === tick 이라 이번 순회에선 안 탄다)
    this._fuseX = f.x;
    this._fuseY = f.y;
    this._fuseR = f.radius;
    this._fuseDmg = f.enemyBase * this.hpScale() * this.stageMult('enemyHpMult');
    this.grid.forEachNear(f.x, f.y, f.radius + this.maxEnemyR, this._onFuseCandidate);
  }
};

/* 체력이 0 이하가 됐다(26단계). 몸 접촉·열매 두 자리가 이 한 함수를 부른다 —
   자리마다 "부활이 남았나" 를 따로 적으면 한쪽만 고쳤을 때 그 피해로는 부활이 안 된다.
   아홉 목숨이 남았으면 하나 쓰고 최대 체력의 reviveHpPct% 로 일어나 reviveInvulnSec 초 무적.
   true = 판이 끝났다. */
World.prototype.playerDown = function(){
  var p = this.player;
  if (this.revivesLeft > 0){
    var nl = this.config.tree.nineLives;
    this.revivesLeft--;
    this.revivesUsed++;
    p.hp = p.maxHp * nl.reviveHpPct / 100;
    p.invuln = nl.reviveInvulnSec;
    return false;
  }
  p.hp = 0;
  this.gameOver = true;
  return true;
};

/* 숨 고르기(26단계) — 초당 regen 만큼 찬다. 재생이 없으면 아무것도 안 한다(줄 자체를 건너뛴다 —
   0 을 더하는 식이라도 빈 판의 계산 모양을 바꾸지 않으려고). 판이 끝난 프레임에는 안 찬다. */
World.prototype.regenTick = function(dt){
  var r = this.metaMult.regen;
  if (!(r > 0) || this.gameOver || this.cleared) return;
  var p = this.player;
  p.hp += r * dt;
  if (p.hp > p.maxHp) p.hp = p.maxHp;
};
// 플레이어에 닿은 적이 피해를 준다.
// 적마다 재적용 간격을 따로 센다(여러 마리에게 둘러싸이면 그만큼 아프다).
World.prototype.resolveContacts = function(dt){
  if (this.gameOver || this.benchMode) return;
  var p = this.player;
  if (p.invuln > 0) p.invuln -= dt;
  var pr = this.config.player.radius;
  var items = this.enemies.items;
  var i;
  // 쿨타임은 활성 적 전부에 대해 흐른다 (격자 후보만이 아니라)
  for (i = 0; i < items.length; i++){
    if (items[i].active && items[i].contactCd > 0) items[i].contactCd -= dt;
  }
  this._contactCd = this.config.combat.contactCooldownMs / 1000;
  var maxR = pr + this.maxEnemyR;   // 격자 후보 반경 — 가장 큰 적이 닿을 수 있는 최대 거리
  this.grid.forEachNear(p.x, p.y, maxR, this._onContactCandidate);
};

/* 영구강화 단계 -> 배수·가산값. 순수 계산이라 world 상태를 안 건드린다.
   applyMeta(적용) 와 playerStats(표시) 가 이 한 표를 같이 쓴다 — 두 벌로 갈라지면
   도감 숫자가 실제 효과와 조용히 어긋난다. */
/* 26단계: 가지·장비(loadout)를 같이 받는다. loadout 을 안 주면 "전부 빈 것" 과 같다.
   장비의 %는 줄기 값에 **곱한다**(예: 경험치 = (1 + 줄기 80%) × (1 + 장비 16%)). 받는 피해는 가지 × 장비.
   빈 loadout 이면 곱하는 쪽은 전부 ×1, 더하는 쪽은 +0 이라 결과가 비트까지 예전과 같다.
   loadout 은 저장 검사(normalizeLoadoutSave)를 거친 모양이라고 믿는다 — 줄기 조건은 거기서 본다. */
World.prototype.metaMultFrom = function(metaLevels, loadout){
  var ml = metaLevels || {};
  var mc = this.config.meta;
  // 테스트가 손으로 만든 config 에 tree·gear 가 없어도 돌게 기본 표로 떨어진다
  var tc = this.config.tree || CONFIG.tree, gc = this.config.gear || CONFIG.gear;
  var tr = loadout && loadout.tree;
  function ts(id){ return tr && typeof tr[id] === 'number' ? tr[id] : 0; }
  // 입은 장비의 효과를 키별로 모은다(부위 고정 순서로 훑는다)
  // 31단계: damagePct · mobDmgPct(late) 도 0 으로 넣어 둔다 — 빠뜨리면 undefined += n 이 NaN 이다.
  var g = { xpPct: 0, pickupPct: 0, speedPct: 0, maxHpAdd: 0, takenPct: 0,
            rerollAdd: 0, invulnAdd: 0, lowHpSpeedPct: 0, lowHpBelowPct: 0, damagePct: 0, mobDmgPct: 0 };
  var eq = loadout && loadout.gear && loadout.gear.equipped;
  var ow = loadout && loadout.gear && loadout.gear.owned;
  if (eq && ow && gc){
    for (var si = 0; si < gc.slots.length; si++){
      var gid = eq[gc.slots[si]];
      if (typeof gid !== 'string' || GEAR_IDS.indexOf(gid) < 0 || typeof ow[gid] !== 'number') continue;
      var it = gc.items[gid];
      for (var k = 0; k < it.stats.length; k++) g[it.stats[k].key] += gearStatAt(it.stats[k], ow[gid]);
      if (it.late) for (var lk = 0; lk < it.late.length; lk++) g[it.late[lk].key] += gearLateAt(it.late[lk], ow[gid]);
      if (it.unique){
        if (typeof it.unique.rerollAdd === 'number') g.rerollAdd += it.unique.rerollAdd;
        if (typeof it.unique.invulnAdd === 'number') g.invulnAdd += it.unique.invulnAdd;
        if (typeof it.unique.lowHpSpeedPct === 'number'){
          g.lowHpSpeedPct += it.unique.lowHpSpeedPct;
          g.lowHpBelowPct = it.unique.lowHpBelowPct;
        }
      }
    }
  }
  /* 31단계 — 공격력 = 줄기 × (1 + 사냥 본능) × (1 + 입은 장비 공격력 합), 쥐떼 피해 = (1 + 쥐떼 사냥꾼) × (1 + 장비 합).
     가지가 config 에 없으면(손으로 만든 테스트 config) 그 인자는 ×1. 없는 판·옛 최대(가지 0 · 장비 5단계 이하)는
     ×1 을 곱하므로 damage 는 예전과 비트까지 같고 mobDamage 는 정확히 1 이다. */
  var hunt = tc.huntInstinct ? 1 + ts('huntInstinct') * tc.huntInstinct.damagePct / 100 : 1;
  var pack = tc.packHunter ? 1 + ts('packHunter') * tc.packHunter.mobDmgPct / 100 : 1;
  return {
    damage:  (1 + (ml.power  || 0) * mc.power.pct / 100) * hunt * (1 + g.damagePct / 100),
    mobDamage: pack * (1 + g.mobDmgPct / 100),
    maxHpAdd:     (ml.maxHp  || 0) * mc.maxHp.add + g.maxHpAdd,
    speed:   (1 + (ml.speed  || 0) * mc.speed.pct / 100) * (1 + g.speedPct / 100),
    pickup:  (1 + (ml.magnet || 0) * mc.magnet.pct / 100) * (1 + g.pickupPct / 100),
    xp:      (1 + (ml.xpGain || 0) * mc.xpGain.pct / 100) * (1 + g.xpPct / 100),
    taken:   (1 - ts('thickHide') * tc.thickHide.takenPct / 100) * (1 - g.takenPct / 100),
    regen:      ts('breather') * tc.breather.regenPerSec,
    revives:    ts('nineLives') * tc.nineLives.revives,
    rerollAdd:  ts('secondChance') * tc.secondChance.rerollAdd + g.rerollAdd,
    magnetSecLess: ts('magnetMaster') * tc.magnetMaster.magnetSecLess,
    coin:       1 + ts('luckyCoin') * tc.luckyCoin.coinPct / 100,
    bossDamage: 1 + ts('bossHunter') * tc.bossHunter.bossDmgPct / 100,
    invulnAdd:  g.invulnAdd,
    lowHpSpeed: 1 + g.lowHpSpeedPct / 100,
    lowHpBelow: g.lowHpBelowPct / 100
  };
};

// 영구강화 단계를 갈아끼운다(상점에서 산 뒤 다음 판에 반영). reset 이 뒤따라야 한다.
// metaMult 객체 자체는 갈지 않는다 — 매 프레임 읽는 자리라 참조를 유지한다.
// 26단계: 가지·장비도 같은 길로 들어온다(loadout). 칸을 하나씩 덮어쓴다 — 고정 목록이라 for...in 을 안 쓴다.
var META_MULT_KEYS = ['damage', 'maxHpAdd', 'speed', 'pickup', 'xp', 'taken', 'regen', 'revives',
                      'rerollAdd', 'magnetSecLess', 'coin', 'bossDamage', 'invulnAdd', 'lowHpSpeed', 'lowHpBelow',
                      'mobDamage'];
World.prototype.applyMeta = function(metaLevels, loadout){
  var m = this.metaMultFrom(metaLevels, loadout);
  for (var i = 0; i < META_MULT_KEYS.length; i++) this.metaMult[META_MULT_KEYS[i]] = m[META_MULT_KEYS[i]];
};

/* 도감에 쓸 적 한 종의 표시 정보.
   보스 이름·등장 시각은 CONFIG.bosses 에서 읽는다 — CONFIG.enemies 에 중복해
   넣으면 나중에 한쪽만 고쳐서 어긋난다(계획/15-수치공개-명세.md ④).
   hpLate 는 "마지막 보스가 나오는 시각의 체력" 이다. 적 체력은 1분마다
   hpPerMin 만큼 늘고 보스만 예외라, 잡졸은 후반에 몇 배가 되는지가 중요하다. */
World.prototype.enemyInfo = function(id){
  var e = this.config.enemies[id];
  if (!e) return null;
  var name = e.name || '';
  var fromMin = e.fromMin;
  var i;
  if (e.boss){
    for (i = 0; i < this.config.bosses.length; i++){
      if (this.config.bosses[i].typeId === id){
        name = this.config.bosses[i].name;
        fromMin = this.config.bosses[i].atMin;
        break;
      }
    }
  }
  /* 스테이지 전용 쥐(25단계). 적 표에는 등장 시각이 없으므로 스테이지 표에서 찾는다.
     stageOrder 고정 순서로 훑는다(for...in 금지). 새총쥐는 spawnInfo, 두목쥐는 첫 elites. */
  var stageOnly = null, eliteHps = null, eliteMins = null;
  /* 스테이지 전용 쥐는 **그 스테이지의 배율이 걸린 실제 값**으로 보여 준다.
     새총쥐의 기본 체력 14 는 게임 어디에도 안 나오는 숫자다(스테이지 2에만 나오고 거기서는 21 이다).
     기본값을 그대로 띄우면 도감 숫자가 실제와 조용히 어긋난다(15단계 수치 공개 원칙).
     스테이지 1에도 나오는 쥐는 지금처럼 기본값을 보여 주고, 스테이지 2 배율은 도감 맨 위 줄이 말한다. */
  var hpMult = 1, contactMult = 1;
  var stages = this.config.stages, order = this.config.stageOrder || [];
  for (i = 0; i < order.length && stageOnly === null; i++){
    var st = stages && stages[order[i]];
    if (!st) continue;
    if (st.spawnInfo && st.spawnInfo[id]){
      stageOnly = st.id;
      fromMin = st.spawnInfo[id].fromMin;
    }
    if (st.elites){
      for (var ej = 0; ej < st.elites.length; ej++){
        if (st.elites[ej].typeId !== id) continue;
        if (eliteHps === null){
          eliteHps = []; eliteMins = [];
          stageOnly = st.id; fromMin = st.elites[ej].atMin;
        }
        eliteHps.push(st.elites[ej].hp);
        eliteMins.push(st.elites[ej].atMin);
      }
    }
    if (stageOnly !== null){
      if (typeof st.enemyHpMult === 'number') hpMult = st.enemyHpMult;
      if (typeof st.contactMult === 'number') contactMult = st.contactMult;
    }
  }
  var lateMin = this.config.bosses[this.config.bosses.length - 1].atMin;
  var scale = 1 + lateMin * this.config.spawn.hpPerMin;
  // 두목쥐는 표의 체력이 최종값이라 후반 체력(hpLate)이 없다 — 보스와 같다.
  var fixedHp = !!e.boss || eliteHps !== null;
  return {
    id: id, name: name, emoji: e.emoji, boss: !!e.boss,
    hp: fixedHp ? e.hp : Math.round(e.hp * hpMult),
    hpLate:  fixedHp ? null : Math.round(e.hp * hpMult * scale),
    lateMin: fixedHp ? null : lateMin,
    stageOnly: stageOnly,          // 이 스테이지에서만 나온다(없으면 null)
    eliteHps: eliteHps,            // 두목쥐: 나올 때마다의 체력 [300, 900, 1500]
    eliteMins: eliteMins,          // 두목쥐: 나오는 시각(분) [2.5, 7.5, 12.5]
    range:     e.ranged ? e.ranged.range : null,        // 새총쥐 사거리
    shotDamage: e.ranged ? e.ranged.shotDamage : null,  // 새총쥐 열매 피해
    // 💣 폭탄쥐(29단계). 쥐 피해는 체력과 같은 규칙으로 그 스테이지 배율을 건 값(갓 나온 폭탄쥐 체력과 같다).
    fuseSec:           e.bomb ? e.bomb.fuseSec : null,
    blastRadius:       e.bomb ? e.bomb.radius : null,
    blastPlayerDamage: e.bomb ? e.bomb.playerDamage : null,
    blastEnemyDamage:  e.bomb ? Math.round(e.bomb.enemyDamage * hpMult) : null,
    contact: e.contact * contactMult, speed: e.speed,
    fromMin: fromMin, coin: e.coin, xp: e.xp,
    // 보석: gem 이 없으면(보스) 둘 다 null. dropPct 를 빠뜨린 적은 dropLoot 처럼 100 으로 본다.
    gem: e.gem || null,
    dropPct: e.gem ? (typeof e.dropPct === 'number' ? e.dropPct : 100) : null
  };
};

/* 도감 "나" 칸. 영구강화 단계를 받아 기본값과 지금 값을 함께 준다.
   **패시브를 섞지 않는다.** 시작 화면에서 열린 도감은 world 가 아직 초기화되기
   전이라 world.passives 가 직전 판 값일 수 있다 — 그걸 읽으면 "아직 시작도
   안 했는데 발톱갈이 3단계" 가 나온다. 이번 판 패시브는 shell 이 일시정지에서
   열렸을 때만 따로 보여준다. */
World.prototype.playerStats = function(metaLevels, loadout){
  var p = this.config.player;
  var m = this.metaMultFrom(metaLevels, loadout);
  var mi = this.config.magnetItem, cb = this.config.combat;
  return {
    maxHp:  { base: p.maxHp,       now: p.maxHp + m.maxHpAdd },
    speed:  { base: p.speed,       now: Math.round(p.speed * m.speed) },
    damage: { base: 1,             now: m.damage },
    pickup: { base: p.pickupRange, now: Math.round(p.pickupRange * m.pickup) },
    xp:     { base: 1,             now: m.xp },
    // 26단계 — 가지·장비가 바꾸는 값. 기본값 그대로인 줄은 셸이 안 그린다.
    taken:      { base: 1, now: m.taken },
    regen:      { base: 0, now: m.regen },
    revives:    { base: 0, now: m.revives },
    bossDamage: { base: 1, now: m.bossDamage },
    mobDamage:  { base: 1, now: m.mobDamage },   // 31단계 — 쥐떼 피해
    coin:       { base: 1, now: m.coin },
    reroll:     { base: this.config.level.rerollPerRun, now: this.config.level.rerollPerRun + m.rerollAdd },
    magnetSec:  { base: mi.everySec, now: mi.everySec - m.magnetSecLess },
    invuln:     { base: cb.invulnSec, now: round1(cb.invulnSec + m.invulnAdd) },
    lowHpSpeed: { base: 1, now: m.lowHpSpeed, belowPct: Math.round(m.lowHpBelow * 100) }
  };
};

// 판을 처음 상태로 되돌린다.
World.prototype.reset = function(starterId, stageId){
  this.enemies.releaseAll();
  /* 스테이지(25단계). 아는 번호면 바꾸고, 아니면(안 줌 포함) 쓰던 것을 그대로 둔다 —
     시작 무기와 같은 규칙. 기존 호출부 전부가 인자 하나로 부르므로 그대로 스테이지 1이다. */
  if (typeof stageId === 'number' && STAGE_IDS.indexOf(stageId) >= 0 &&
      this.config.stages && this.config.stages[stageId]){
    this.stage = stageId;
    this.stageCfg = this.config.stages[stageId];
  }
  this.shots.releaseAll();
  this.aimingCount = 0;
  this.shotsFired = 0;
  this.shotsHit = 0;
  this.fuses.releaseAll();   // 💣 29단계 — 되살리기(restore)도 여기를 지난다
  this.bombsExploded = 0;
  this.bombHitsPlayer = 0;
  this.bombKills = 0;
  this.fusesPeak = 0;
  this.eliteIndex = 0;
  this.elitesKilled = 0;
  this.player.x = 0; this.player.y = 0;
  this.player.invuln = 0;
  var startHp = this.config.player.maxHp + this.metaMult.maxHpAdd;
  this.player.hp = startHp;
  this.player.maxHp = startHp;
  this.rawInput.x = 0; this.rawInput.y = 0;
  this.nukesTaken = 0;
  this.gameOver = false;
  this.cleared = false;
  this.bossEaseUntil = 0;
  this.elapsed = 0;
  this.spawnAcc = 0;
  this.bossIndex = 0;
  this.boss = null;
  this.facing.x = 1; this.facing.y = 0;
  this.aimDir.x = 1; this.aimDir.y = 0;
  this.swingTimer = 0;
  this.swingRadius = 0;
  this.swingDir.x = 1; this.swingDir.y = 0;
  this.beamTimer = 0;
  this.beamN = 0;
  this.beamStamp = 0;
  this.blastTimer = 0;
  this.blastShow = 0;
  this.blastWeaponId = '';
  this.orbitAngle = 0;
  this.orbitN = 0; this.orbitR = 0;
  for (var obi = 0; obi < this.orbitXs.length; obi++){ this.orbitXs[obi] = 0; this.orbitYs[obi] = 0; }
  this.galePush = 0;   // 진화가 풀리므로 밀어내기도 꺼 둔다 (fireOrbit 이 매 프레임 다시 정한다)
  this.chainTimer = 0;
  this.chainShow = 0;
  this.chainN = 0;
  this.chainStamp = 0;
  this._chainBuf.length = 0;
  this.kills = 0;
  this.dmgBy = freshDamageTally();   // 이어할 때마다 새로 세지 않도록 reset 이 비운다 (Task 3 가 복원한다)
  this.gems.releaseAll();
  this.projectiles.releaseAll();
  this.fields.releaseAll();
  this.warns.releaseAll();
  var citems = this.companions.items;
  for (var cj = 0; cj < citems.length; cj++) citems[cj].target = null;
  this.companions.releaseAll();
  this.companion = null;
  this.enemyStamp = 0;
  this.warnAcc = 0;
  this.nukes.releaseAll();
  this.nukeAcc = 0;
  this.magnets.releaseAll();
  this.magnetAcc = 0;
  this.magnetsTaken = 0;
  this.lootState = LOOT_SEED_DEFAULT;   // 꽂아 둔 lootRandom 은 setRandom 처럼 그대로 둔다
  this.boxes.releaseAll();
  this.pendingEvolve = 0;
  this.boxesTaken = 0;
  this.projStamp = 0;
  this.xp = 0;
  this.level = 1;
  this.pendingChoices = 0;
  this.rolledChoices = null;
  // 새 판이면 다시 뽑기도 새로. 가지(두 번째 기회)·왕관이 더해 준다(없으면 +0).
  this.rerollLeft = this.config.level.rerollPerRun + this.metaMult.rerollAdd;
  this.revivesLeft = this.metaMult.revives;   // 아홉 목숨도 판마다 새로(26단계)
  this.revivesUsed = 0;
  this.passives.claws = 0; this.passives.tuna = 0; this.passives.bell = 0;
  this.passives.whisker = 0; this.passives.nap = 0; this.passives.clover = 0;
  this.coins = 0;
  // 시작 무기를 정한다. 모르는 값이 오면 쓰던 것을 그대로 둔다 —
  // shell 이 검증을 하더라도 core 혼자서 유효한 판을 만들 수 있어야 한다.
  if (typeof starterId === 'string' && WEAPON_IDS.indexOf(starterId) >= 0)
    this.starter = starterId;
  // 무기를 통째로 새로 만든다. 하나씩 지우면 "아는 무기 목록에 없는 id" 가
  // 살아남아 다음 판까지 따라온다 — 옛 코드는 그걸 막고 있었다.
  // reset 은 판당 한 번이라 여기서 객체를 새로 만들어도 된다.
  this.weapons = {};
  this.weaponOrder.length = 0;
  this.evolved = {};
  this.weapons[this.starter] = { level: 1, cdLeft: 0 };
  this.weaponOrder.push(this.starter);
  this.benchMode = false;
  this.rebuildGrid();
};

// 저장에서 읽은 값을 믿을 수 있는 숫자로 만든다. 숫자가 아니거나 음수면 0.
function safeNum(v){
  return (typeof v === 'number' && isFinite(v) && v > 0) ? v : 0;
}
function safeInt(v, min, max, fallback){
  if (typeof v !== 'number' || !isFinite(v)) return fallback;
  v = Math.floor(v);
  if (v < min) return min;
  if (v > max) return max;
  return v;
}

/* ── 판 도중 저장 ──────────────────────────────────────────────
   평평한 값만 뽑는다. 적·투사체·젬·장판은 매 프레임 바뀌는 풀 객체 수백 개라
   저장하지 않고, 이어할 때 스폰이 다시 채우게 둔다.
   보스는 예외로 남은 체력까지 뽑는다 — 안 그러면 보스전 도중에 나갔다 오는 것이
   보스를 만피로 되돌리는 회피 수단이 된다. */
World.prototype.snapshot = function(){
  if (this.gameOver || this.cleared) return null;   // 끝난 판은 이어할 것이 없다
  var weapons = {}, id;
  for (var i = 0; i < this.weaponOrder.length; i++){
    id = this.weaponOrder[i];
    weapons[id] = this.weapons[id].level;
  }
  var passives = {};
  for (id in this.passives) passives[id] = this.passives[id];
  // 딜량: DAMAGE_IDS 순서 그대로 정수 배열로 뽑는다. 정수로 내리는 이유는
  // 소수점까지 저장할 필요가 없어서다 — 결과 화면은 퍼센트만 보여준다.
  var dmg = new Array(DAMAGE_IDS.length);
  for (i = 0; i < DAMAGE_IDS.length; i++) dmg[i] = Math.floor(this.dmgBy[DAMAGE_IDS[i]]);
  // 레벨업 3택: 안 저장하면 이어하기가 공짜 리롤이 된다(카드가 다시 뽑힌다).
  // (kind,id) 만 저장한다 — 이름·설명·단계는 복원 후 지금 상태로 다시 만들 수 있다.
  var choices = null;
  if (this.pendingChoices > 0 && Array.isArray(this.rolledChoices)){
    choices = this.rolledChoices.map(function(c){ return [c.kind, c.id]; });
  }
  // 진화는 판 전체를 지배하는 상태다. 18단계의 보스 유예와 달리 반드시 저장한다 —
  // 빠지면 이어하기 했을 때 무기가 통째로 원래대로 돌아간다.
  // evolutionOrder 고정 순서로 훑어 배열로 담는다(for...in 금지).
  var evolved = [];
  for (i = 0; i < this.config.evolutionOrder.length; i++){
    var eid = this.config.evolutionOrder[i];
    if (this.evolved[eid] === true) evolved.push(eid);
  }
  var boxes = [];
  var bitems = this.boxes.items;
  for (i = 0; i < bitems.length; i++){
    if (bitems[i].active) boxes.push([bitems[i].x, bitems[i].y]);
  }
  return {
    v: 4,
    stage: this.stage,   // v4(25단계) — 스테이지 2 판을 이어하면 스테이지 2로 돌아와야 한다
    playerPos: [this.player.x, this.player.y],
    elapsed: this.elapsed,
    level: this.level,
    xp: this.xp,
    kills: this.kills,
    coins: this.coins,
    bossIndex: this.bossIndex,
    nukesTaken: this.nukesTaken,
    pendingChoices: this.pendingChoices,
    choices: choices,
    rerollLeft: this.rerollLeft,   // 안 저장하면 멈췄다 이어하는 게 공짜 리롤이 된다
    // 26단계 — 안 저장하면 "쓰러지고 → 부활하고 → 껐다 켜면 부활이 다시 생긴다".
    // 형식 번호는 안 올린다: rerollLeft 처럼 칸이 없는 옛 저장은 "아직 안 썼다" 로 읽는다.
    revivesLeft: this.revivesLeft,
    hp: this.player.hp,
    maxHp: this.player.maxHp,
    weaponOrder: this.weaponOrder.slice(),
    weapons: weapons,
    passives: passives,
    boss: (this.boss && this.boss.active)
            ? { typeId: this.boss.typeId, hp: this.boss.hp } : null,
    dmg: dmg,
    evolved: evolved,
    boxes: boxes,
    pendingEvolve: this.pendingEvolve ? 1 : 0
  };
};

/* 끝난 판의 성적표. 네트워크·DOM 을 모른다 — shell 이 이걸 받아
   기기 정보와 강화 단계를 붙여 보낸다. 판마다 한 번만 불리므로
   배열·문자열을 만들어도 된다. */
World.prototype.recordSummary = function(){
  if (!this.gameOver && !this.cleared) return null;
  var sec = Math.round(this.elapsed);
  if (sec < this.config.runSave.minSec) return null;   // 실수로 켰다 끈 판은 안 보낸다
  var i, id, w = [], p = [];
  for (i = 0; i < this.weaponOrder.length; i++){
    id = this.weaponOrder[i];
    if (this.weapons[id] && this.weapons[id].level > 0)
      w.push(id + this.weapons[id].level);
  }
  for (i = 0; i < PASSIVE_ORDER.length; i++){
    id = PASSIVE_ORDER[i];
    if (this.passives[id] > 0) p.push(id + this.passives[id]);
  }
  return {
    stage: this.stage,   // 25단계 — 셸이 스테이지 2 판만 규격 2로 보낸다
    sec: sec,
    cleared: !!this.cleared,
    level: this.level,
    kills: this.kills,
    coins: Math.floor(this.coins),
    bossIndex: this.bossIndex,
    nukes: this.nukesTaken,
    weapons: w.join(' '),
    passives: p.join(' ')
  };
};

// 스냅샷으로 판을 되돌린다. 못 쓸 스냅샷이면 아무것도 안 하고 false.
World.prototype.restore = function(s){
  // v3부터 고양이 좌표를 함께 저장한다. v4(25단계)는 스테이지를 더 저장한다. v1·v2도 계속 읽는다.
  if (!s || typeof s !== 'object' || (s.v !== 1 && s.v !== 2 && s.v !== 3 && s.v !== 4)) return false;
  // v4 인데 스테이지가 아는 번호(정수)가 아니면 여기서 거절한다 — reset 을 부르기 전이라
  // 망가진 저장이 지금 판을 건드리지 않는다. v1~v3 는 스테이지가 생기기 전이라 스테이지 1.
  if (s.v === 4 && (typeof s.stage !== 'number' || STAGE_IDS.indexOf(s.stage) < 0)) return false;
  var stageId = s.v === 4 ? s.stage : 1;
  if (s.v >= 3 && (!Array.isArray(s.playerPos) || s.playerPos.length !== 2 ||
      typeof s.playerPos[0] !== 'number' || !isFinite(s.playerPos[0]) ||
      typeof s.playerPos[1] !== 'number' || !isFinite(s.playerPos[1]))) return false;
  if (typeof s.elapsed !== 'number' || !isFinite(s.elapsed) || s.elapsed < 0) return false;
  if (typeof s.level !== 'number' || !isFinite(s.level) || s.level < 1) return false;
  if (!Array.isArray(s.weaponOrder) || !s.weaponOrder.length ||
      !s.weapons || typeof s.weapons !== 'object' ||
      !s.passives || typeof s.passives !== 'object') return false;
  if (typeof s.hp !== 'number' || !isFinite(s.hp) || s.hp <= 0) return false;
  if (typeof s.maxHp !== 'number' || !isFinite(s.maxHp) || s.maxHp <= 0) return false;

  // 풀·타이머를 전부 비우고 시작한다. 스테이지를 같이 넘긴다 — 보스를 아래에서 다시 켤 때
  // 스테이지 배율(보스 체력 ×1.5)이 이미 걸려 있어야 저장된 체력을 올바른 최대치로 자른다.
  this.reset(undefined, stageId);
  if (s.v >= 3){ this.player.x = s.playerPos[0]; this.player.y = s.playerPos[1]; }
  this.elapsed = s.elapsed;
  // 두목쥐는 따로 저장하지 않는다. 이어한 시각보다 앞선 것은 "이미 지나간 것" 으로 친다.
  var elites = this.stageCfg && this.stageCfg.elites;
  if (elites){
    for (var ei = 0; ei < elites.length; ei++){
      if (elites[ei].atMin * 60 < this.elapsed) this.eliteIndex = ei + 1;
    }
  }
  this.level   = Math.floor(s.level);
  // 손댄 저장 데이터가 숫자 아닌 값을 밀어 넣어도 판이 조용히 망가지지 않게 한다.
  // 예: xp 가 문자열이면 이후 xp += 가 문자열 이어붙이기가 되어 레벨이 영영 안 오른다.
  this.xp      = safeNum(s.xp);
  this.kills   = safeInt(s.kills, 0, Number.MAX_SAFE_INTEGER || 9007199254740991, 0);
  this.coins   = safeNum(s.coins);
  this.bossIndex = safeInt(s.bossIndex, 0, this.config.bosses.length, 0);
  this.nukesTaken = safeInt(s.nukesTaken, 0, 100, 0);
  this.pendingChoices = safeInt(s.pendingChoices, 0, this.level, 0);
  // 다시 뽑기: 이 기능이 없던 시절의 저장에는 필드 자체가 없다. 그때는 만석으로 준다.
  // 숫자로 들어 있으면 0 도 그대로 존중해야 한다 — 안 그러면 무한 리롤이 된다.
  // 상한은 지금 가지·장비가 주는 몫까지(26단계, 없으면 rerollPerRun 그대로).
  var rrMax = this.config.level.rerollPerRun + this.metaMult.rerollAdd;
  var rr = s.rerollLeft;
  if (typeof rr !== 'number' || !isFinite(rr) || rr < 0) rr = rrMax;
  if (rr > rrMax) rr = rrMax;
  this.rerollLeft = Math.floor(rr);
  // 아홉 목숨(26단계): 칸이 없으면(옛 저장) "아직 안 썼다", 있으면 0 ~ 지금 가진 부활 수로 자른다.
  var rv = s.revivesLeft;
  if (typeof rv !== 'number' || !isFinite(rv)) rv = this.metaMult.revives;
  rv = Math.floor(rv);
  if (rv < 0) rv = 0;
  if (rv > this.metaMult.revives) rv = this.metaMult.revives;
  this.revivesLeft = rv;

  var id, i;
  for (id in this.passives) this.passives[id] = 0;
  for (id in s.passives){
    var passiveCfg = this.config.passives[id];
    if (passiveCfg)
      this.passives[id] = safeInt(s.passives[id], 0, passiveCfg.maxLevel, 0);
  }

  this.weapons = {};
  this.weaponOrder.length = 0;
  var restoredWeapons = Object.create(null);
  for (i = 0; i < s.weaponOrder.length &&
              this.weaponOrder.length < this.config.level.slotsWeapon; i++){
    id = s.weaponOrder[i];
    var weaponCfg = this.config.weapons[id];
    if (!weaponCfg || restoredWeapons[id]) continue;   // 없어진 무기·중복 항목은 건너뛴다
    restoredWeapons[id] = true;
    this.weapons[id] = {
      level: safeInt(s.weapons[id], 1, weaponCfg.maxLevel, 1),
      cdLeft: 0
    };
    this.weaponOrder.push(id);
  }
  if (!this.weaponOrder.length){                 // 무기가 하나도 안 남으면 시작 무기라도
    this.weapons[this.starter] = { level: 1, cdLeft: 0 };
    this.weaponOrder.push(this.starter);
  }

  // 최대 체력은 저장값을 그대로 믿는다. 참치캔·영구강화가 이미 반영된 값이라
  // 여기서 다시 더하면 이중으로 붙는다.
  this.player.maxHp = s.maxHp;
  this.player.hp    = s.hp > s.maxHp ? s.maxHp : s.hp;

  var savedBossCfg = s.boss && this.config.enemies[s.boss.typeId];
  if (savedBossCfg && savedBossCfg.boss &&
      typeof s.boss.hp === 'number' && isFinite(s.boss.hp) && s.boss.hp > 0){
    var ring = this.spawnRing();
    var b = this.spawnEnemy(s.boss.typeId, this.player.x + ring, this.player.y);
    if (b){ b.hp = s.boss.hp > b.maxHp ? b.maxHp : s.boss.hp; this.boss = b; }
  }

  // 딜량: 배열이 없거나(예전 저장) 길이가 안 맞거나 숫자가 아니면 그 판은
  // 전부 0으로 두고 계속한다 (reset() 이 이미 dmgBy 를 0으로 채워 뒀다).
  if (Array.isArray(s.dmg) && s.dmg.length === DAMAGE_IDS.length){
    var dmgOk = true;
    for (var di = 0; di < s.dmg.length; di++){
      if (typeof s.dmg[di] !== 'number' || !isFinite(s.dmg[di]) || s.dmg[di] < 0){
        dmgOk = false;
        break;
      }
    }
    if (dmgOk){
      for (di = 0; di < DAMAGE_IDS.length; di++) this.dmgBy[DAMAGE_IDS[di]] = s.dmg[di];
    }
  }

  // 레벨업 3택: 검증을 통과해야만 복원한다. 배열이 아니거나, 정확히 3장이 아니거나
  // (rollChoices 는 항상 정확히 3장을 돌려준다 — dmg 배열의 정확 길이 검증과 같은 패턴),
  // 항목 하나라도 지금 CONFIG·상태와 안 맞으면(무기가 없어졌다 등) 전부 버린다 —
  // reset() 이 이미 rolledChoices 를 null 로 둬서, showLevelUp 이 새로 추첨하는
  // 지금까지의 동작으로 폴백한다.
  if (this.pendingChoices > 0 && Array.isArray(s.choices) && s.choices.length === 3){
    var restoredChoices = [];
    var choicesOk = true;
    for (var ci = 0; ci < s.choices.length; ci++){
      var pair = s.choices[ci];
      if (!Array.isArray(pair) || pair.length !== 2 ||
          typeof pair[0] !== 'string' || typeof pair[1] !== 'string'){
        choicesOk = false;
        break;
      }
      var built = this.choiceFromKindId(pair[0], pair[1]);
      if (!built){ choicesOk = false; break; }
      restoredChoices.push(built);
    }
    if (choicesOk) this.rolledChoices = restoredChoices;
  }

  /* v1 저장(19단계 이전)에는 이 셋이 없다. 없으면 "진화 없음" 으로 읽는다 —
     지금 사람들이 갖고 있는 저장이라 버리면 안 된다. */
  this.evolved = {};
  if (Array.isArray(s.evolved)){
    for (i = 0; i < s.evolved.length; i++){
      var evid = s.evolved[i];
      // 저장은 사람이 고칠 수 있는 곳이다. CONFIG 에 있는 이름만 받는다.
      if (typeof evid === 'string' && this.config.evolutions[evid]) this.evolved[evid] = true;
    }
  }
  this.boxes.releaseAll();
  if (Array.isArray(s.boxes)){
    for (i = 0; i < s.boxes.length; i++){
      var bp = s.boxes[i];
      if (!Array.isArray(bp) || bp.length !== 2) continue;
      if (typeof bp[0] !== 'number' || typeof bp[1] !== 'number' ||
          !isFinite(bp[0]) || !isFinite(bp[1])) continue;
      var nb = this.boxes.spawn();
      if (!nb) break;
      if (s.v >= 3){ nb.x = bp[0]; nb.y = bp[1]; }
      else {
        // 옛 저장에는 고양이 위치가 없다. 미수집 상자만 근처로 옮기고 자동 지급하지 않는다.
        nb.x = this.player.x + (this.boxes.activeCount % 2 ? 80 : -80);
        nb.y = this.player.y;
      }
    }
  }
  this.pendingEvolve = (s.pendingEvolve === 1 && this.evolveCandidates().length > 0) ? 1 : 0;

  return true;
};

// 이 적을 잡았을 때 들어오는 코인. 네잎클로버 패시브가 곱해진다.
World.prototype.coinGain = function(typeId){
  var t = this.config.enemies[typeId];
  if (!t) return 0;
  var base = t.coin || 0;          // coin 을 빠뜨린 적이 저장을 망가뜨리지 않게
  var cl = this.config.passives.clover;
  // 스테이지 코인 배율은 벌 때마다 곱한다(스테이지 1은 1) — 판 도중 화면 숫자가 결과 화면과 같아야 한다.
  // 행운의 동전(26단계)도 벌 때마다 곱한다 — 없으면 ×1.
  return base * (1 + this.passives.clover * cl.coinPct / 100) * this.stageMult('coinMult') * this.metaMult.coin;
};

// 적에게 피해를 준다. 죽으면 풀로 돌려보내고 true 를 반환한다.
// source 는 무기 id (또는 'nuke') — 딜량 측정에 쓴다. 모르는 이름·빈 값은 ? 로 간다.
World.prototype.damageEnemy = function(e, amount, source){
  // 보스 사냥꾼(26단계) — 보스에게만 곱한다. 두목쥐(elite)는 보스가 아니다.
  // 가지가 없으면(×1) 적 표를 찾아보는 일도 안 한다.
  if (this.metaMult.bossDamage !== 1){
    var et = this.config.enemies[e.typeId];
    if (et && et.boss) amount *= this.metaMult.bossDamage;
  }
  // 쥐떼 피해(31단계) — 보스가 아닌 쥐(두목쥐 포함)에게만 곱한다. 무기·핵폭탄·폭탄쥐 폭발이 다 여기를 지난다.
  // 가지·장비가 없으면(×1) 적 표를 찾아보는 일도 안 한다(보스 사냥꾼과 같은 가드).
  if (this.metaMult.mobDamage !== 1){
    var mt = this.config.enemies[e.typeId];
    if (!(mt && mt.boss)) amount *= this.metaMult.mobDamage;
  }
  // 남은 체력보다 크게 때려도 실제로 깎인 만큼만 센다 — 넘친 분까지 세면
  // 캣닢·핵폭탄처럼 한 번에 크게 때리는 무기가 실제보다 세 보인다.
  var real = amount < e.hp ? amount : e.hp;
  // 💣 폭탄쥐 폭발('bomb', 29단계)은 무기가 아니라 안 센다 — 딜량 칸·결과 화면 기여도·
  // 도전과제(solo70)·서버 기록이 그대로다. 'bomb' 이 안 오는 스테이지 1·2는 식이 같다.
  if (real > 0 && source !== 'bomb') this.dmgBy[DAMAGE_INDEX[source] ? source : '?'] += real;
  e.hp -= amount;
  e.hitFlash = 0.12;                  // 렌더가 흰색으로 번쩍이는 데 쓴다(초)
  if (e.hp > 0) return false;
  this.kills++;
