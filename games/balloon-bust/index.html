<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>풍선빵 Balloon Bust — 데일리 풍선 챌린지</title>
<meta name="description" content="매일 전 세계가 같은 풍선 5개 — 터지기 전에 놓아라. 30초 데일리 배짱 게임">
<meta property="og:title" content="풍선빵 Balloon Bust">
<meta property="og:description" content="매일 전 세계가 같은 풍선 5개 — 터지기 전에 놓아라. 30초 데일리 배짱 게임">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nyejun.com/games/balloon-bust/">
<style>
  :root{
    --bg:#151022;
    --bg-hot:#2b0f1e;
    --ink:#f4eefc;
    --dim:#9d92b5;
    --balloon:#ff5a6e;
    --gold:#ffd166;
    --card:#221a38;
    --line:#3a2f57;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;
    transition:background .3s;
  }
  /* 상단: 날짜 + 라운드 도트 */
  header{
    padding:20px 16px 0;text-align:center;z-index:2;
  }
  header h1{font-size:15px;font-weight:700;letter-spacing:.5px}
  header .date{font-size:12px;color:var(--dim);margin-top:2px}
  #langBtn, #backBtn{
    position:absolute;top:14px;z-index:3;
    background:var(--card);border:1px solid var(--line);color:var(--dim);
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;
    cursor:pointer;font-family:inherit;
  }
  #langBtn{right:14px;z-index:11} /* 결과/런종료 오버레이(z10) 위에서도 눌리게 */
  #backBtn{left:14px;display:none}
  #runInfo{display:none;font-size:12px;font-weight:800;color:var(--gold);margin-top:12px;letter-spacing:.3px}
  #runBtn{
    margin-top:16px;background:none;border:1px solid var(--line);color:var(--dim);
    font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px;
    cursor:pointer;font-family:inherit;
  }
  .card .ghost{background:#2f2650;color:var(--ink);margin-top:8px}
  #roAgain{background:var(--gold);color:#231b00}
  #dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .dot{
    min-width:34px;height:22px;border-radius:11px;
    background:var(--card);border:1px solid var(--line);
    font-size:11px;font-weight:700;color:var(--dim);
    display:flex;align-items:center;justify-content:center;padding:0 6px;
  }
  .dot.now{border-color:var(--gold);color:var(--gold)}
  .dot.ok{background:#1d3529;border-color:#2e5c43;color:#7fe0a8}
  .dot.pop{background:#3a1622;border-color:#6b2438;color:#ff8296}

  /* 중앙: 배율 + 풍선 */
  #mult{
    margin-top:4vh;
    font-size:64px;font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--gold);
    text-shadow:0 0 24px rgba(255,209,102,.25);
    z-index:2;
  }
  #balloonWrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    width:100%;position:relative;
  }
  #balloon{
    width:110px;height:130px;
    background:radial-gradient(circle at 35% 28%, #ff9aa8 0%, var(--balloon) 45%, #d63a52 100%);
    border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    position:relative;
    will-change:transform;
    filter:drop-shadow(0 8px 24px rgba(255,90,110,.35));
  }
  #balloon::after{ /* 매듭 */
    content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
    border:6px solid transparent;border-top:10px solid #c23349;
  }
  #balloon.popped{visibility:hidden}
  .shard{ /* 터짐 파편 */
    position:absolute;width:14px;height:14px;border-radius:40% 60% 55% 45%;
    background:var(--balloon);pointer-events:none;
  }
  #flash{
    position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;
  }

  /* 하단 안내 */
  #hint{
    padding-bottom:6vh;text-align:center;z-index:2;
  }
  #hint .big{font-size:16px;font-weight:700}
  #hint .sub{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}

  /* 라운드 결과 토스트 */
  #toast{
    position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.8);
    font-size:34px;font-weight:900;opacity:0;pointer-events:none;z-index:6;
    transition:all .35s cubic-bezier(.2,1.4,.4,1);
    text-shadow:0 2px 20px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toastSub{
    position:fixed;top:calc(38% + 34px);left:50%;transform:translate(-50%,0) scale(.9);
    font-size:14px;font-weight:700;color:var(--dim);opacity:0;pointer-events:none;z-index:6;
    transition:all .35s cubic-bezier(.2,1.4,.4,1);
    text-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  #toastSub.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .card .rth{font-size:10px;font-weight:700;opacity:.55;margin-top:2px}
  .ymini{font-size:11px;color:var(--dim);margin-top:12px;letter-spacing:.2px}

  /* 결과 화면 */
  #result{
    position:fixed;inset:0;background:rgba(13,9,24,.92);
    display:none;align-items:center;justify-content:center;z-index:10;
    padding:20px;backdrop-filter:blur(6px);
  }
  #result.show{display:flex}
  #runOver{
    position:fixed;inset:0;background:rgba(13,9,24,.92);
    display:none;align-items:center;justify-content:center;z-index:10;
    padding:20px;backdrop-filter:blur(6px);
  }
  #runOver.show{display:flex}
  .card{
    width:100%;max-width:340px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;
    padding:28px 22px;text-align:center;
  }
  .card .label{font-size:12px;color:var(--dim);letter-spacing:1px}
  .card .total{font-size:52px;font-weight:900;color:var(--gold);margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .card .totalUnit{font-size:13px;color:var(--dim)}
  .card .pct{font-size:14px;font-weight:800;color:var(--gold);margin-top:6px;min-height:18px}
  .card .rounds{
    display:flex;gap:6px;justify-content:center;margin:18px 0;flex-wrap:wrap;
  }
  .card .r{
    min-width:56px;padding:8px 4px;border-radius:10px;font-weight:800;font-size:14px;
    background:#1d3529;color:#7fe0a8;font-variant-numeric:tabular-nums;
  }
  .card .r.pop{background:#3a1622;color:#ff8296}
  .card .best{font-size:12px;color:var(--dim);margin-bottom:16px}
  .card button{
    width:100%;padding:14px;border:none;border-radius:12px;
    font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  #shareBtn{background:var(--gold);color:#231b00}
  #shareBtn:active{transform:scale(.97)}
  .card .tmr{font-size:12px;color:var(--dim);margin-top:14px}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div id="stage">
  <button id="langBtn"></button>
  <header>
    <h1 id="gameTitle"></h1>
    <div class="date" id="dateLabel"></div>
    <div id="dots"></div>
    <div id="runInfo"></div>
  </header>
  <button id="backBtn"></button>
  <div id="mult">1.00×</div>
  <div id="balloonWrap"><div id="balloon"></div></div>
  <div id="hint">
    <div class="big" id="hintBig"></div>
    <div class="sub" id="hintSub"></div>
    <button id="runBtn"></button>
    <div class="ymini" id="yLine"></div>
  </div>
</div>
<div id="toast"></div>
<div id="toastSub"></div>
<div id="flash"></div>

<div id="result">
  <div class="card">
    <div class="label" id="resLabel"></div>
    <div class="total" id="totalNum">0.0</div>
    <div class="totalUnit" id="resUnit"></div>
    <div class="pct" id="pctLine"></div>
    <div class="rounds" id="roundList"></div>
    <div class="best" id="bestLine"></div>
    <button id="shareBtn"></button>
    <button id="toRunBtn" class="ghost"></button>
    <div class="ymini" id="yLineCard"></div>
    <div class="tmr" id="tmr"></div>
  </div>
</div>

<div id="runOver">
  <div class="card">
    <div class="label" id="roTitle"></div>
    <div class="total" id="roSum">0.0</div>
    <div class="totalUnit" id="roMeta"></div>
    <div class="best" id="roBest"></div>
    <button id="roAgain"></button>
    <button id="roCopy" class="ghost"></button>
    <button id="roExit" class="ghost"></button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- 데일리 시드 (KST 기준, 전원 동일) ---------- */
  function kstDateStr(){
    const now = new Date(Date.now() + 9*3600*1000);
    return now.toISOString().slice(0,10); // YYYY-MM-DD
  }
  function hashStr(s){
    let h = 1779033703;
    for(let i=0;i<s.length;i++){
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h<<13)|(h>>>19);
    }
    return h>>>0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5)|0;
      let t = Math.imul(a ^ (a>>>15), 1|a);
      t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
      return ((t ^ (t>>>14))>>>0)/4294967296;
    };
  }
  const today = kstDateStr();
  const rng = mulberry32(hashStr('balloon-'+today));

  /* ---------- 오늘의 풍선 5개 생성 ---------- */
  const ROUNDS = 5;
  const thresholds = []; // 터지는 배율 (비공개)
  const stutters = [];   // 페이크 멈칫 지점
  for(let i=0;i<ROUNDS;i++){
    // 최소 1.5x 보장, 평균 ~4.4x, 중앙값 ~3.7x, 최대 10x(약 5.7% 도달)
    const r = rng();
    let th = 1.5 + (-Math.log(1 - r*0.985)) * 3.2;
    th = Math.min(th, 10);
    thresholds.push(th);
    // 멈칫 페이크 0~2개, 터짐 지점보다 앞에
    const n = rng() < 0.55 ? (rng() < 0.4 ? 2 : 1) : 0;
    const arr = [];
    for(let j=0;j<n;j++){
      arr.push(1.4 + rng() * (th - 1.5));
    }
    stutters.push(arr.sort((a,b)=>a-b));
  }

  /* ---------- 안전한 저장 (미리보기 환경에서도 동작) ---------- */
  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  /* ---------- 한/영 문자열 ---------- */
  const LANGS = {
    ko: {
      title:'🎈 풍선빵',
      sub:'매일 자정 리셋',
      hintBig:'꾹 누르면 부풀어요',
      hintSub:'손 떼면 배율 확정 · 터지면 0점<br>오늘은 전 세계 모두 같은 풍선이에요',
      gained:m=>m+'× 획득!',
      popped:'💥 터졌다!',
      resLabel:'오늘의 합계',
      resUnit:'배율 합산 (5라운드)',
      bestNew:'🏆 최고 기록 갱신!',
      bestPrev:v=>'최고 기록: '+v+'×',
      shareBtn:'결과 복사하기',
      copied:'복사 완료!',
      timer:t=>'다음 풍선까지 '+t,
      shareTitle:'풍선빵',
      shareTotal:v=>'합계 '+v+'×',
      limitWas:v=>'한계 '+v+'×였어요',
      nearMiss:'😱 아슬아슬 탈출!',
      chicken:v=>'겁먹었네요 😏 한계는 '+v+'×',
      topPct:p=>'오늘 상위 '+p+'%',
      streakTag:n=>'🔥'+n+'일째',
      runBtn:'∞ 터질 때까지 — 무한 모드',
      backDaily:'← 오늘의 풍선',
      runCounter:(n,s)=>'풍선 #'+n+' · 합계 '+s+'×',
      thinWarn:'⚠️ 풍선이 얇아지기 시작합니다',
      runOverTitle:'런 종료!',
      balloonsN:n=>'풍선 '+n+'개',
      bestSingleLbl:v=>'최고 한 방 '+v+'×',
      oneMore:'한 판 더',
      toDaily:'데일리로',
      runShareTitle:'터질 때까지',
      runBestNew:'🏆 무한 모드 최고 기록!',
      runBestPrev:v=>'무한 최고: '+v+'×',
      yLimits:t=>'어제의 풍선 한계 — '+t
    },
    en: {
      title:'🎈 Balloon Bust',
      sub:'resets daily 00:00 KST',
      hintBig:'Hold to inflate',
      hintSub:'Release to bank · pop = 0<br>Everyone worldwide gets the same balloons today',
      gained:m=>'Banked '+m+'×!',
      popped:'💥 Popped!',
      resLabel:"Today's total",
      resUnit:'sum of 5 rounds',
      bestNew:'🏆 New best!',
      bestPrev:v=>'Best: '+v+'×',
      shareBtn:'Copy result',
      copied:'Copied!',
      timer:t=>'Next balloons in '+t,
      shareTitle:'Balloon Bust',
      shareTotal:v=>'Total '+v+'×',
      limitWas:v=>'Limit was '+v+'×',
      nearMiss:'😱 Close call!',
      chicken:v=>'Chickened out 😏 limit was '+v+'×',
      topPct:p=>'Top '+p+'% today',
      streakTag:n=>'🔥Day '+n,
      runBtn:'∞ Till It Pops — endless',
      backDaily:'← Daily balloons',
      runCounter:(n,s)=>'Balloon #'+n+' · total '+s+'×',
      thinWarn:'⚠️ Balloons are getting thinner',
      runOverTitle:'Run over!',
      balloonsN:n=>n+' balloons',
      bestSingleLbl:v=>'Best single '+v+'×',
      oneMore:'One more',
      toDaily:'Daily',
      runShareTitle:'Till It Pops',
      runBestNew:'🏆 New endless best!',
      runBestPrev:v=>'Endless best: '+v+'×',
      yLimits:t=>"Yesterday's limits — "+t
    }
  };
  const SHARE_URL = 'nyejun.com/games/balloon-bust'; // 공유 텍스트 마지막 줄
  let lang = store.get('balloon-lang') || ((navigator.language||'').toLowerCase().startsWith('ko') ? 'ko' : 'en');
  if(!LANGS[lang]) lang = 'en';
  function T(k, ...a){ const v = LANGS[lang][k]; return typeof v === 'function' ? v(...a) : v; }
  function setLang(l){ lang = l; store.set('balloon-lang', l); applyStaticTexts(); }

  /* ---------- 상태 ---------- */
  let round = 0;
  const results = []; // {mult, popped}
  let holding = false;
  let mult = 1.0;
  let lastT = 0;
  let rafId = null;
  let stutterUntil = 0;
  let usedStutters = [];
  let done = false;
  let transitioning = false; // 라운드 전환 대기(950ms) 동안 입력 차단용
  let lastBest = null; // 결과 화면 최고기록 줄 재렌더용(언어 전환 대응)
  let stutterActive = false;
  let lastStutterEnd = -1e9; // 멈칫이 끝난 시각(겁쟁이 판정용)
  let lastPct = null;   // 오늘 상위 % (표시·공유·재렌더용)
  let savedPct = null;  // 복원된 저장값의 pct
  let lastStreak = null; // 연속 출석 일수

  /* ---------- 무한 런 상태 ---------- */
  let mode = 'daily';        // 'daily' | 'run'
  let runN = 0;              // 현재 몇 번째 풍선
  let runSum = 0;            // 이번 런 합계
  let runBestSingle = 0;     // 이번 런 최고 단일 배율
  let runTh = 0;             // 현재 런 풍선의 한계
  let runStutters = [];      // 현재 런 풍선의 멈칫 지점
  let runOverShown = false;
  let lastRun = null; // 런 종료 카드 재렌더용(언어 전환 대응)
  function curTh(){ return mode === 'run' ? runTh : thresholds[round]; }
  function curStutters(){ return mode === 'run' ? runStutters : stutters[round]; }

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const balloon = $('balloon'), multEl = $('mult'), stage = $('stage'),
        toast = $('toast'), toastSub = $('toastSub'), flash = $('flash'),
        dots = $('dots'), wrap = $('balloonWrap');

  function renderBestLine(){
    if(lastPct != null){
      $('pctLine').textContent = T('topPct', lastPct) + (lastStreak >= 2 ? ' · ' + T('streakTag', lastStreak) : '');
    }
    if(!lastBest) return;
    $('bestLine').textContent = lastBest.isNew ? T('bestNew') : T('bestPrev', lastBest.prev);
  }
  function renderDateLine(){
    $('dateLabel').textContent = today.replace(/-/g,'.') + ' · ' + T('sub')
      + (lastStreak >= 2 ? ' · ' + T('streakTag', lastStreak) : '');
  }
  /* ---------- 어제의 풍선 한계 공개 (어제 시드에서 재계산 — 데일리 생성과 같은 rng 소비 순서 유지 필수) ---------- */
  function yesterdayLimits(){
    const y = new Date(Date.now() + 9*3600*1000); y.setUTCDate(y.getUTCDate() - 1);
    const r = mulberry32(hashStr('balloon-' + y.toISOString().slice(0,10)));
    const ths = [];
    for(let i=0;i<ROUNDS;i++){
      const u = r();
      ths.push(Math.min(1.5 + (-Math.log(1 - u*0.985)) * 3.2, 10));
      const n = r() < 0.55 ? (r() < 0.4 ? 2 : 1) : 0; // 멈칫 생성이 소비하는 rng까지 그대로 재현
      for(let j=0;j<n;j++) r();
    }
    return ths;
  }
  function renderYesterday(){
    const s = T('yLimits', yesterdayLimits().map(v=>v.toFixed(1)+'×').join(' · '));
    $('yLine').textContent = s;
    $('yLineCard').textContent = s;
  }
  function applyStaticTexts(){
    $('gameTitle').textContent = T('title');
    renderDateLine();
    $('hintBig').textContent = T('hintBig');
    $('hintSub').innerHTML = T('hintSub');
    $('resLabel').textContent = T('resLabel');
    $('resUnit').textContent = T('resUnit');
    $('shareBtn').textContent = T('shareBtn');
    $('langBtn').textContent = lang === 'ko' ? 'EN' : '한';
    $('runBtn').textContent = T('runBtn');
    $('toRunBtn').textContent = T('runBtn');
    $('backBtn').textContent = T('backDaily');
    if(mode === 'run') renderRunInfo();
    if(runOverShown) renderRunOverCard();
    renderBestLine();
    renderYesterday();
  }
  applyStaticTexts();
  $('langBtn').addEventListener('click', ()=>setLang(lang === 'ko' ? 'en' : 'ko'));

  function renderDots(){
    dots.innerHTML = '';
    for(let i=0;i<ROUNDS;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      if(i < results.length){
        if(results[i].popped){ d.classList.add('pop'); d.textContent = '💥'; }
        else { d.classList.add('ok'); d.textContent = results[i].mult.toFixed(1)+'×'; }
      } else if(i === round){
        d.classList.add('now'); d.textContent = (i+1);
      } else {
        d.textContent = (i+1);
      }
      dots.appendChild(d);
    }
  }
  renderDots();

  /* ---------- 사운드 (WebAudio, 첫 터치에 초기화) ---------- */
  let ac = null;
  function audio(){
    if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} } // iOS 백그라운드 복귀 대응
    return ac;
  }
  function thump(intensity){
    const c = audio(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type='sine'; o.frequency.value = 190 + intensity*70;
    g.gain.setValueAtTime(0.12 + intensity*0.1, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.12);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.13);

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
  let popBuffer = null; // 디코딩된 AudioBuffer ('loading'을 잠깐 거침)
  function loadPopBuffer(){
    const c = audio(); if(!c || popBuffer) return;
    popBuffer = 'loading';
    try{
      const bin = atob(POP_MP3_BASE64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      c.decodeAudioData(bytes.buffer, buf=>{ popBuffer = buf; }, ()=>{ popBuffer = null; });
    }catch(e){ popBuffer = null; }
  }
  function popSoundSynth(){ // 디코딩 실패/아직 전이면 쓰는 대체 합성음
    const c = audio(); if(!c) return;
    const t0 = c.currentTime;
    const len = Math.floor(c.sampleRate * 0.09);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 5);
    const src = c.createBufferSource(); src.buffer = buf;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 800;
    const g = c.createGain(); g.gain.value = 0.7;
    src.connect(hp); hp.connect(g); g.connect(c.destination);
    src.start(t0);
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t0);
    o.frequency.exponentialRampToValueAtTime(50, t0 + 0.1);
    og.gain.setValueAtTime(0.5, t0);
    og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
    o.connect(og); og.connect(c.destination);
    o.start(t0); o.stop(t0 + 0.14);
  }
  function popSound(){
    const c = audio();
    if(c && popBuffer && popBuffer !== 'loading'){
      const src = c.createBufferSource();
      src.buffer = popBuffer;
      src.connect(c.destination);
      src.start(0);
    } else {
      popSoundSynth();
    }
  }
  let lastThump = 0;

  /* ---------- 게임 루프 ---------- */
  function loop(t){
    if(!holding) return;
    const dt = Math.min((t - lastT)/1000, 0.05);
    lastT = t;

    if(t < stutterUntil){
      // 멈칫 중: 성장 정지, 강한 떨림만
      draw(t, true);
      rafId = requestAnimationFrame(loop);
      return;
    }
    if(stutterActive && t >= stutterUntil){ lastStutterEnd = t; stutterActive = false; }

    // 성장 속도: 초반은 빠르고, 배율이 오를수록 느려짐 (긴장 구간 연장)
    const rate = Math.max(0.9 / (1 + (mult - 1) * 0.5), 0.25);
    mult += rate * dt;

    // 페이크 멈칫 체크
    const st = curStutters();
    for(const s of st){
      if(!usedStutters.includes(s) && mult >= s){
        usedStutters.push(s);
        stutterUntil = t + 170;
        stutterActive = true;
        break;
      }
    }

    // 터짐 체크
    if(mult >= curTh()){
      pop();
      return;
    }

    // 심장박동: 배율 높을수록 빠르게
    const interval = Math.max(180, 700 - (mult-1)*160);
    if(t - lastThump > interval){
      lastThump = t;
      thump(Math.min((mult-1)/6, 1));
    }

    draw(t, false);
    rafId = requestAnimationFrame(loop);
  }

  function draw(t, stuttering){
    multEl.textContent = mult.toFixed(2) + '×';
    // 크기: 1x=1.0 → 10x=2.6배
    const scale = 1 + (mult - 1) * 0.18;
    // 떨림: 배율 비례 (임계값 힌트는 안 줌 — 절대값 기반 긴장감)
    const baseShake = Math.pow(Math.max(mult-1.8,0), 1.3) * 0.9;
    const shakeAmt = stuttering ? Math.max(5, baseShake + 2) : baseShake; // 멈칫이 항상 평소보다 강하게
    const sx = (Math.random()-0.5) * shakeAmt;
    const sy = (Math.random()-0.5) * shakeAmt;
    balloon.style.transform = `scale(${scale}) translate(${sx}px,${sy}px)`;
    // 배경 가열
    const heat = Math.min((mult - 1) / 6, 1);
    stage.style.background = `linear-gradient(180deg, var(--bg) ${100-heat*60}%, var(--bg-hot))`;
    // 색 변화: 빨강 → 흰빛
    let bf = `drop-shadow(0 8px 24px rgba(255,90,110,${0.35+heat*0.4})) brightness(${1+heat*0.35})`;
    if(mode === 'run') bf += ` saturate(${Math.max(1 - (runN-1)*0.025, 0.45)})`;
    balloon.style.filter = bf;
    multEl.style.textShadow = `0 0 ${24+heat*40}px rgba(255,209,102,${0.25+heat*0.5})`;
  }

  /* ---------- 라운드 종료 ---------- */
  function bankToast(th){
    const margin = th - mult;
    if(margin <= 0.3){
      showToast(T('nearMiss'), '#ffd166', T('limitWas', th.toFixed(1)));
      if(navigator.vibrate) navigator.vibrate(30);
    } else if(performance.now() - lastStutterEnd <= 500 && margin >= 2.0){
      showToast(T('gained', mult.toFixed(2)), '#7fe0a8', T('chicken', th.toFixed(1)));
    } else {
      showToast(T('gained', mult.toFixed(2)), '#7fe0a8', T('limitWas', th.toFixed(1)));
    }
  }
  function bank(){
    if(!holding) return;
    holding = false;
    cancelAnimationFrame(rafId);
    if(mode === 'run'){ bankRun(); return; }
    const th = thresholds[round];
    results.push({mult: mult, popped: false, th: th});
    // 데일리는 한계·니어미스·겁쟁이 비공개 (전 세계 같은 풍선 → 당일 공개는 스포일러가 됨. 다음날 '어제의 풍선'으로 공개)
    showToast(T('gained', mult.toFixed(2)), '#7fe0a8');
    nextRound();
  }
  function bankRun(){
    runSum += mult;
    if(mult > runBestSingle) runBestSingle = mult;
    bankToast(runTh);
    renderRunInfo();
    transitioning = true;
    setTimeout(()=>{
      transitioning = false;
      if(mode !== 'run') return; // 전환 중에 데일리로 나갔으면 무시
      resetBalloonVisual();
      newRunBalloon();
    }, 950);
  }
  function popFx(){
    popSound();
    if(navigator.vibrate) navigator.vibrate(80);
    // 파편
    balloon.classList.add('popped');
    const rect = balloon.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    for(let i=0;i<10;i++){
      const s = document.createElement('div');
      s.className = 'shard';
      s.style.left = cx+'px'; s.style.top = cy+'px';
      document.body.appendChild(s);
      const ang = Math.random()*Math.PI*2, dist = 60+Math.random()*120;
      s.animate([
        {transform:'translate(0,0) rotate(0)', opacity:1},
        {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+60}px) rotate(${Math.random()*360}deg)`, opacity:0}
      ], {duration:600, easing:'cubic-bezier(.2,.8,.4,1)'});
      setTimeout(()=>s.remove(), 620);
    }
    flash.animate([{opacity:0.7},{opacity:0}], {duration:250});
  }
  function pop(){
    holding = false;
    cancelAnimationFrame(rafId);
    if(mode === 'run'){ popRun(); return; }
    results.push({mult: 0, popped: true, th: thresholds[round]});
    popFx();
    showToast(T('popped'), '#ff8296'); // 데일리는 한계 숫자 미표기(스포 방지)
    nextRound();
  }
  function popRun(){
    popFx();
    showToast(T('popped'), '#ff8296', T('limitWas', runTh.toFixed(1)));
    let best = null;
    try{ best = JSON.parse(store.get('balloon-run-best') || 'null'); }catch(e){}
    const isNew = !best || runSum > best.sum;
    if(isNew && runSum > 0) store.set('balloon-run-best', JSON.stringify({sum: +runSum.toFixed(2), cnt: runN}));
    setTimeout(()=>{
      if(mode !== 'run') return;
      lastRun = {
        sum: runSum, n: runN, bestSingle: runBestSingle,
        isNew: isNew && runSum > 0,
        prevBest: best ? best.sum.toFixed(1) : '0.0'
      };
      renderRunOverCard();
      $('runOver').classList.add('show');
      runOverShown = true;
    }, 950);
  }
  function renderRunOverCard(){
    if(!lastRun) return;
    $('roTitle').textContent = T('runOverTitle');
    $('roSum').textContent = lastRun.sum.toFixed(1) + '×';
    $('roMeta').textContent = T('balloonsN', lastRun.n) + ' · ' + T('bestSingleLbl', lastRun.bestSingle.toFixed(2));
    $('roBest').textContent = lastRun.isNew ? T('runBestNew') : T('runBestPrev', lastRun.prevBest);
    $('roAgain').textContent = T('oneMore');
    $('roCopy').textContent = T('shareBtn');
    $('roExit').textContent = T('toDaily');
  }
  function showToast(text, color, sub){
    toast.textContent = text;
    toast.style.color = color;
    toast.classList.add('show');
    if(sub){ toastSub.textContent = sub; toastSub.classList.add('show'); }
    setTimeout(()=>{ toast.classList.remove('show'); toastSub.classList.remove('show'); }, 900);
  }
  function resetBalloonVisual(){
    mult = 1.0;
    usedStutters = [];
    balloon.classList.remove('popped');
    balloon.style.transform = 'scale(1)';
    balloon.style.filter = '';
    balloon.style.opacity = '';
    stage.style.background = '';
    multEl.textContent = '1.00×';
    multEl.style.textShadow = '';
  }
  function nextRound(){
    round++;
    renderDots();
    transitioning = true;
    setTimeout(()=>{
      transitioning = false;
      if(round >= ROUNDS){ finish(); return; }
      resetBalloonVisual();
    }, 950);
  }

  /* ---------- 무한 런 ("터질 때까지") ---------- */
  // 하한이 0.7까지 계속 내려가는 게 핵심: 26번째부터는 시작 배율(1.0) 아래 한계도 나와
  // "잡자마자 펑"이 가능해짐 → 초저배율 스팸으로도 영생 불가, 죽음이 보장됨
  function runFloor(n){ return Math.max(1.5 - 0.02*(n-1), 0.7); }
  function runThreshold(n){ // n = 1부터. 갈수록 하한·스케일이 내려가 언젠가는 반드시 터짐
    const fl = runFloor(n);
    const sc = Math.max(3.2 * Math.pow(0.93, n-1), 0.6);
    return Math.min(fl + (-Math.log(1 - Math.random()*0.985)) * sc, 10);
  }
  function newRunBalloon(){
    runN++;
    runTh = runThreshold(runN);
    const fl = runFloor(runN);
    const cnt = Math.random() < 0.55 ? (Math.random() < 0.4 ? 2 : 1) : 0;
    runStutters = [];
    for(let j=0;j<cnt;j++) runStutters.push((fl - 0.1) + Math.random() * (runTh - fl));
    runStutters.sort((a,b)=>a-b);
    usedStutters = [];
    balloon.style.opacity = Math.max(1 - (runN-1)*0.02, 0.55); // 갈수록 얇아지는 풍선
    if(runN === 6) showToast(T('thinWarn'), '#ffd166');
    renderRunInfo();
  }
  function renderRunInfo(){
    $('runInfo').textContent = T('runCounter', runN, runSum.toFixed(1));
  }
  function enterRun(){
    mode = 'run';
    runN = 0; runSum = 0; runBestSingle = 0;
    runOverShown = false;
    $('result').classList.remove('show');
    $('runOver').classList.remove('show');
    dots.style.display = 'none';
    $('runInfo').style.display = 'block';
    $('backBtn').style.display = 'block';
    $('runBtn').style.display = 'none';
    resetBalloonVisual();
    newRunBalloon();
  }
  function exitRun(){
    mode = 'daily';
    runOverShown = false;
    $('runOver').classList.remove('show');
    dots.style.display = 'flex';
    $('runInfo').style.display = 'none';
    $('backBtn').style.display = 'none';
    $('runBtn').style.display = '';
    resetBalloonVisual();
    if(done || round >= ROUNDS) $('result').classList.add('show');
  }

  /* ---------- 오늘 상위 % (가상 플레이어 5만 명, 시드 고정 → 누가 계산해도 동일) ---------- */
  function computePercentile(myTotal){
    const rr = mulberry32(hashStr('balloon-rank-'+today));
    const N = 50000; let below = 0;
    for(let i=0;i<N;i++){
      const base = 1.5 + (-Math.log(1 - rr()*0.92)) * 0.85; // 가상 플레이어 목표 배율(중앙값 ≈2.0)
      let sum = 0;
      for(let r0=0;r0<ROUNDS;r0++){
        const t = base * (0.85 + rr()*0.3);
        if(t < thresholds[r0]) sum += t;
      }
      if(sum < myTotal) below++;
    }
    return Math.min(99, Math.max(1, Math.round(100 - below/N*100)));
  }

  /* ---------- 연속 출석 스트릭 ---------- */
  function updateStreak(){
    let s; try{ s = JSON.parse(store.get('balloon-streak') || '{}') || {}; }catch(e){ s = {}; }
    if(s.last === today) return s.n || 1; // 오늘 이미 반영(재방문 포함) — 중복 증가 방지
    const y = new Date(Date.now() + 9*3600*1000); y.setUTCDate(y.getUTCDate() - 1);
    const n = (s.last === y.toISOString().slice(0,10)) ? (s.n || 0) + 1 : 1;
    store.set('balloon-streak', JSON.stringify({last: today, n: n}));
    return n;
  }

  /* ---------- 결과 ---------- */
  function finish(){
    done = true;
    const total = results.reduce((a,r)=>a+r.mult, 0);
    $('totalNum').textContent = total.toFixed(1) + '×';
    lastPct = savedPct != null ? savedPct : computePercentile(total);
    lastStreak = updateStreak();
    renderDateLine();
    const rl = $('roundList');
    rl.innerHTML = '';
    results.forEach(r=>{
      const d = document.createElement('div');
      d.className = 'r' + (r.popped ? ' pop' : '');
      d.textContent = r.popped ? '💥' : r.mult.toFixed(1)+'×';
      // 한계 병기는 당일 스포일러라 제거 — 다음날 '어제의 풍선' 줄에서 공개
      rl.appendChild(d);
    });
    // 최고 기록
    const prevBest = parseFloat(store.get('balloon-best') || '0');
    if(total > prevBest){
      store.set('balloon-best', total.toFixed(1));
      lastBest = {isNew: true};
    } else {
      lastBest = {isNew: false, prev: prevBest.toFixed(1)};
    }
    renderBestLine();
    store.set('balloon-'+today, JSON.stringify({
      v: 2,
      r: results.map(x=>({m: x.popped ? 0 : +x.mult.toFixed(2), th: x.th != null ? +x.th.toFixed(2) : null})),
      pct: lastPct
    }));
    $('result').classList.add('show');
    tickTimer();
    setInterval(tickTimer, 1000);
  }
  function tickTimer(){
    const now = new Date(Date.now() + 9*3600*1000);
    const mid = new Date(now); mid.setUTCHours(24,0,0,0);
    const s = Math.max(0, Math.floor((mid - now)/1000));
    if(s === 0){ location.reload(); return; } // 자정 → 새 풍선으로
    const h = String(Math.floor(s/3600)).padStart(2,'0');
    const m = String(Math.floor(s%3600/60)).padStart(2,'0');
    const sec = String(s%60).padStart(2,'0');
    $('tmr').textContent = T('timer', `${h}:${m}:${sec}`);
  }
  $('shareBtn').addEventListener('click', ()=>{
    const total = results.reduce((a,r)=>a+r.mult, 0);
    const line = results.map(r=>r.popped ? '💥' : r.mult.toFixed(1)+'×').join(' ');
    const text = `🎈 ${T('shareTitle')} ${today.replace(/-/g,'.')}${lastStreak >= 2 ? ' ' + T('streakTag', lastStreak) : ''}\n${line}\n${T('shareTotal', total.toFixed(1))}${lastPct != null ? ' · ' + T('topPct', lastPct) : ''}\n${SHARE_URL}`;
    const ok = ()=>{ $('shareBtn').textContent = T('copied'); setTimeout(()=>$('shareBtn').textContent = T('shareBtn'), 1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text, ok));
    } else fallbackCopy(text, ok);
  });
  function fallbackCopy(text, ok){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){}
    ta.remove();
  }
  function copyText(text, btn){
    const ok = ()=>{ btn.textContent = T('copied'); setTimeout(()=>{ btn.textContent = T('shareBtn'); }, 1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text, ok));
    } else fallbackCopy(text, ok);
  }
  $('runBtn').addEventListener('click', enterRun);
  $('toRunBtn').addEventListener('click', enterRun);
  $('roAgain').addEventListener('click', enterRun);
  $('roExit').addEventListener('click', exitRun);
  $('backBtn').addEventListener('click', ()=>{ if(mode === 'run' && !holding) exitRun(); });
  $('roCopy').addEventListener('click', ()=>{
    if(!lastRun) return;
    const text = `🎈 ${T('shareTitle')} · ${T('runShareTitle')} — ${T('balloonsN', lastRun.n)} · ${T('shareTotal', lastRun.sum.toFixed(1))}\n${SHARE_URL}`;
    copyText(text, $('roCopy'));
  });

  /* ---------- 테스트용: 주소 끝에 ?dev 붙이면 매번 새로 시작 + 검증 훅(개발자 전용, 일반 링크엔 영향 없음) ---------- */
  // ?dev 또는 localStorage balloon-dev=1 (쿼리스트링을 못 쓰는 환경용) — 일반 유저에겐 둘 다 없음
  const DEV = new URLSearchParams(location.search).has('dev') || store.get('balloon-dev') === '1';
  if(DEV){
    try{ localStorage.removeItem('balloon-'+today); }catch(e){}
    window.__bb = {
      get thresholds(){ return thresholds.slice(); },
      forceTh(i, v){ thresholds[i] = v; },
      forceRunTh(v){ runTh = v; },
      endRun(){ if(mode === 'run'){ holding = false; popRun(); } }, // rAF 정지 환경에서 pop 경로 검증용
      poke(){ lastStutterEnd = performance.now(); }, // 겁쟁이 판정 테스트용
      get state(){ return {mode: mode, round: round, mult: mult, holding: holding, runN: runN, runSum: runSum, runTh: runTh, results: results.map(r=>({m: r.mult, th: r.th, p: r.popped}))}; }
    };
  }

  /* ---------- 이미 플레이했으면 결과 바로 표시 ---------- */
  const played = store.get('balloon-'+today);
  if(played){
    try{
      const data = JSON.parse(played);
      if(Array.isArray(data)){ // v1 호환(한계값 없던 시절 저장)
        data.forEach(v=>results.push({mult: v, popped: v===0, th: null}));
      } else if(data && data.v === 2){
        data.r.forEach(x=>results.push({mult: x.m, popped: x.m===0, th: x.th}));
        savedPct = data.pct != null ? data.pct : null;
      }
      if(results.length){
        round = ROUNDS;
        renderDots();
        finish();
      }
    }catch(e){}
  }

  /* ---------- 입력 ---------- */
  function down(e){
    if(holding || transitioning) return;
    if(mode === 'daily' && (done || round >= ROUNDS)) return;
    if(mode === 'run' && runOverShown) return;
    e.preventDefault();
    audio(); // 사운드 초기화
    loadPopBuffer(); // 터짐음 미리 디코딩(재생 늦어지는 것 방지)
    holding = true;
    lastT = performance.now();
    lastThump = 0;
    rafId = requestAnimationFrame(loop);
  }
  function up(e){
    if(holding) bank();
  }
  wrap.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  window.addEventListener('blur', up);
})();
</script>
</body>
</html>
