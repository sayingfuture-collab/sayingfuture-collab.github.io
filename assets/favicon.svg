<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NYEJUN 심볼: N 모노그램 + 궤도 라인 (미니멀 SF 톤, 고양이 요소 없음) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#16264d"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf7ff"/>
      <stop offset="100%" stop-color="#6fd6ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <ellipse cx="32" cy="35" rx="23" ry="9" fill="none" stroke="#4fd1ff" stroke-opacity="0.4" stroke-width="1.6" transform="rotate(-18 32 35)"/>
  <circle cx="52.5" cy="28.5" r="2.3" fill="#4fd1ff"/>
  <text x="32" y="35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="url(#letter)" text-anchor="middle" dominant-baseline="central">N</text>
</svg>
